<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IL Life &amp; Health Exam Prep</title>
<style>
:root{--bg:#f5f7fa;--card:#fff;--ink:#1d2733;--mut:#5b6876;--pri:#1f5fbf;--ok:#1e8e3e;--bad:#c5221f}
*{box-sizing:border-box}body{margin:0;font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--pri);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:18px;margin:0}header a{color:#fff;cursor:pointer;text-decoration:underline;font-size:14px}
main{max-width:760px;margin:0 auto;padding:16px}.card{background:var(--card);border-radius:10px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
button{font:inherit;border:0;border-radius:8px;padding:10px 14px;background:var(--pri);color:#fff;cursor:pointer;margin:4px 4px 4px 0}
button.sec{background:#e6ecf5;color:var(--ink)}button:disabled{opacity:.5}
.opt{display:block;width:100%;text-align:left;background:#eef2f7;color:var(--ink);padding:12px;margin:8px 0}
.opt.sel{outline:2px solid var(--pri)}.opt.ok{background:#dff3e4;outline:2px solid var(--ok)}.opt.bad{background:#fbe1e0;outline:2px solid var(--bad)}
.mut{color:var(--mut);font-size:14px}.tag{display:inline-block;background:#e6ecf5;border-radius:12px;padding:2px 8px;font-size:12px;margin-right:6px}
.exp{border-left:4px solid var(--pri);padding:8px 12px;background:#f0f5fd;margin-top:10px}
table{width:100%;border-collapse:collapse}td,th{padding:6px;border-bottom:1px solid #e3e7ec;text-align:left;font-size:14px}
.bar{height:8px;background:#e3e7ec;border-radius:4px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--pri)}
.row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}.timer{font-weight:700;font-variant-numeric:tabular-nums}
select{font:inherit;padding:8px;border-radius:8px}
.nav{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}.nav span{width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;border-radius:6px;background:#eef2f7;font-size:12px;cursor:pointer}
.nav span.a{background:#c9d8f0}.nav span.c{outline:2px solid var(--pri)}.nav span.f{background:#ffe8a3}
</style></head><body>
<header><h1>IL Life &amp; Health Prep</h1><a onclick="home()">Home</a></header>
<main id="app"></main>
<script>
const DATA={"lg": {"name": "Life - General", "exam": {"n": 55, "scored": 50, "min": 75}, "topics": [{"name": "Types of Policies", "w": 15}, {"name": "Provisions and Riders", "w": 15}, {"name": "Application and Underwriting", "w": 12}, {"name": "Retirement and Other Concepts", "w": 8}], "qs": [{"id": "lg0", "t": "Types of Policies", "q": "Which type of life insurance provides level premiums, a level death benefit, and cash value, with premiums payable to the policy's maturity age (100 or 121)?", "o": ["Ordinary (straight) whole life", "Annually renewable term", "Universal life", "Decreasing term"], "e": "Ordinary whole life has level premiums payable for life, a level face amount, and guaranteed cash value that equals the face at maturity."}, {"id": "lg1", "t": "Types of Policies", "q": "A 20-pay whole life policy differs from ordinary whole life in that it", "o": ["Builds cash value faster because premiums are compressed into 20 years", "Expires after 20 years", "Provides coverage for only 20 years unless converted", "Has a lower annual premium"], "e": "Limited-pay policies compress premium payments into a shorter period, so premiums are higher and cash value builds faster, but coverage lasts for the whole of life."}, {"id": "lg2", "t": "Types of Policies", "q": "Which policy is purchased with one lump-sum premium and immediately creates significant cash value?", "o": ["Single-premium whole life", "Annually renewable term", "Flexible premium universal life", "Modified whole life"], "e": "Single-premium whole life is paid up with one premium and creates cash value immediately. Such policies are generally Modified Endowment Contracts."}, {"id": "lg3", "t": "Types of Policies", "q": "Which feature is MOST characteristic of universal life insurance?", "o": ["Flexible premiums and an adjustable death benefit", "A guaranteed fixed premium that can never change", "No cash value", "Premiums invested in separate accounts chosen by the owner"], "e": "Universal life unbundles mortality, expense, and cash value elements and lets the owner vary premiums and adjust the face amount within limits."}, {"id": "lg4", "t": "Types of Policies", "q": "Under universal life Option B (Option 2), the death benefit equals", "o": ["The specified face amount plus the cash value", "The specified face amount only", "The cash value only", "The total premiums paid"], "e": "Option B (increasing death benefit) pays the face plus accumulated cash value. Option A pays a level death benefit that includes the cash value."}, {"id": "lg5", "t": "Types of Policies", "q": "A producer selling variable life insurance must hold a life insurance license with variable authority and", "o": ["A FINRA securities registration", "A real estate license", "A Certified Financial Planner designation", "Nothing further"], "e": "Variable products are securities, so the seller needs both a life/variable insurance license and FINRA registration (e.g., Series 6 or 7, usually with Series 63)."}, {"id": "lg6", "t": "Types of Policies", "q": "In a variable life policy, who bears the investment risk of the separate account?", "o": ["The policyowner", "The insurer", "The state guaranty association", "The producer"], "e": "Cash values of variable products are held in separate accounts, and the policyowner bears the investment risk. Cash value is not guaranteed."}, {"id": "lg7", "t": "Types of Policies", "q": "Variable universal life combines", "o": ["Universal life premium flexibility with variable life investment choices", "Term insurance with a fixed annuity", "Whole life guarantees with an indexed annuity", "Group life with individual conversion"], "e": "VUL offers flexible premiums and an adjustable death benefit along with owner-directed separate account investments."}, {"id": "lg8", "t": "Types of Policies", "q": "An indexed universal life policy credits interest to cash value based on", "o": ["The performance of an external market index, usually subject to a cap and a floor", "A fixed rate guaranteed for life", "Separate account investments selected by the owner", "The insurer's dividend scale"], "e": "Indexed life credits interest tied to an index such as the S&P 500, typically with a cap or participation rate and a minimum floor (often 0%)."}, {"id": "lg9", "t": "Types of Policies", "q": "Interest-sensitive (current assumption) whole life differs from traditional whole life because", "o": ["Premiums or cash values may change based on current interest and mortality assumptions", "It has no cash value", "Its death benefit decreases annually", "It cannot be surrendered"], "e": "Current assumption whole life reflects current interest and mortality experience; favorable results can lower premiums or increase cash values, within guarantees."}, {"id": "lg10", "t": "Types of Policies", "q": "Which term policy has a face amount that declines over the policy period while the premium stays level?", "o": ["Decreasing term", "Level term", "Annually renewable term", "Return of premium term"], "e": "Decreasing term reduces the death benefit over time (often matched to a mortgage) while premiums usually remain level."}, {"id": "lg11", "t": "Types of Policies", "q": "Annually renewable term (ART) has which premium pattern?", "o": ["Premiums increase at each renewal because of the insured's increased age", "Premiums stay level for the life of the policy", "Premiums decrease each year", "Premiums are paid only once"], "e": "ART renews each year without evidence of insurability, but the premium rises each year based on attained age."}, {"id": "lg12", "t": "Types of Policies", "q": "A return of premium term policy", "o": ["Refunds some or all premiums if the insured outlives the term", "Builds cash value that can be borrowed at any time", "Costs less than standard level term", "Pays double the face amount at death"], "e": "ROP term costs more than level term but refunds premiums paid if the insured survives the level term period (subject to policy conditions)."}, {"id": "lg13", "t": "Types of Policies", "q": "The renewable feature in a term policy allows the insured to", "o": ["Renew coverage for another term without evidence of insurability", "Change the policy to whole life without evidence of insurability", "Receive a refund of premium", "Increase the face amount without evidence of insurability"], "e": "Renewability lets the insured continue coverage for another term without proving insurability, at an attained-age premium."}, {"id": "lg14", "t": "Types of Policies", "q": "The convertible feature in a term policy allows the insured to", "o": ["Exchange the term policy for permanent insurance without evidence of insurability", "Renew the policy at the same premium", "Convert the policy to an annuity", "Borrow against the policy"], "e": "Convertibility permits exchanging term for a permanent policy without evidence of insurability, usually within a specified period."}, {"id": "lg15", "t": "Types of Policies", "q": "When a term policy is converted using the attained-age method, the new permanent premium is based on", "o": ["The insured's age at the time of conversion", "The insured's age when the term policy was issued", "The average of the two ages", "The insured's age at retirement"], "e": "Attained-age conversion uses the current age. Original-age conversion uses the issue age but requires paying the premium difference."}, {"id": "lg16", "t": "Types of Policies", "q": "Which statement about term life insurance is TRUE?", "o": ["It provides pure protection for a specified period and generally has no cash value", "It always builds cash value", "It is more expensive than whole life at the same age and face amount", "It always endows at age 100"], "e": "Term is temporary, pure protection with no (or minimal) cash value, which is why its initial premiums are lowest."}, {"id": "lg17", "t": "Types of Policies", "q": "During the accumulation period of a deferred annuity, the", "o": ["Owner pays premiums and the contract earns tax-deferred growth", "Annuitant receives income payments", "Insurer pays a death benefit only", "Contract is fully taxable each year"], "e": "The accumulation (pay-in) period is when premiums are paid and values grow tax-deferred. The annuity (payout) period begins at annuitization."}, {"id": "lg18", "t": "Types of Policies", "q": "An immediate annuity generally begins income payments", "o": ["Within one year of purchase", "After at least 10 years", "Only at age 70 1/2", "Only after the death of the owner"], "e": "Immediate annuities are bought with a single premium and begin payments within one year (often one month)."}, {"id": "lg19", "t": "Types of Policies", "q": "Which annuity is purchased with one premium and begins payments at a later date?", "o": ["Single premium deferred annuity", "Single premium immediate annuity", "Flexible premium immediate annuity", "Periodic payment immediate annuity"], "e": "A SPDA takes one lump-sum premium and defers payout to a future date, allowing tax-deferred accumulation."}, {"id": "lg20", "t": "Types of Policies", "q": "A fixed annuity guarantees", "o": ["A minimum interest rate and fixed benefit payments", "Returns that track a stock portfolio", "Protection under the securities laws", "Payments that increase with inflation"], "e": "Fixed annuities provide a guaranteed minimum interest rate and fixed payouts; the insurer bears the investment risk."}, {"id": "lg21", "t": "Types of Policies", "q": "During the payout period of a variable annuity, income payments are based on", "o": ["Annuity units whose value fluctuates with the separate account", "A guaranteed fixed dollar amount", "Accumulation units that never change in value", "The Consumer Price Index"], "e": "At annuitization accumulation units convert to annuity units; the number of units is fixed but their value varies with investment performance."}, {"id": "lg22", "t": "Types of Policies", "q": "A fixed indexed annuity typically", "o": ["Credits interest linked to a market index while protecting principal from index losses", "Invests premiums directly in individual stocks", "Requires a securities license to sell in all cases", "Has no surrender charges"], "e": "Fixed indexed annuities credit interest tied to an index with caps or participation rates and protect principal from index losses; they are generally regulated as insurance."}, {"id": "lg23", "t": "Types of Policies", "q": "Which annuity payout option provides the HIGHEST monthly income for a given amount but pays nothing after the annuitant's death?", "o": ["Life only (straight life)", "Life with 10-year period certain", "Installment refund", "Joint and 100% survivor"], "e": "Life only pays the most per month because there is no guarantee to beneficiaries; payments stop at death."}, {"id": "lg24", "t": "Types of Policies", "q": "Under a life with 10-year period certain annuity, if the annuitant dies after 4 years,", "o": ["Payments continue to a beneficiary for the remaining 6 years", "Payments stop immediately", "The beneficiary receives a refund of all premiums", "The beneficiary receives payments for 10 more years"], "e": "Period certain guarantees payments for the stated period; a beneficiary receives the balance of that period if the annuitant dies early."}, {"id": "lg25", "t": "Types of Policies", "q": "A cash refund annuity, upon the annuitant's early death, pays the beneficiary", "o": ["A lump sum equal to the purchase price minus benefits already paid", "Continued payments for life", "Nothing", "Double the remaining premium"], "e": "Cash refund returns any excess of the purchase price over payments received in a lump sum. Installment refund pays the same difference in installments."}, {"id": "lg26", "t": "Types of Policies", "q": "Which payout option continues payments as long as either of two annuitants is alive?", "o": ["Joint and survivor", "Joint life", "Life only", "Period certain"], "e": "Joint and survivor continues payments (at 100% or a reduced percentage) until the second death. Joint life stops at the first death."}, {"id": "lg27", "t": "Types of Policies", "q": "A joint life (first-to-die) policy pays the death benefit", "o": ["At the death of the first insured", "At the death of the last surviving insured", "At each insured's death", "Only if both insureds die simultaneously"], "e": "First-to-die pays when the first insured dies, then terminates; often used for business partners or two-income couples."}, {"id": "lg28", "t": "Types of Policies", "q": "Survivorship (second-to-die) life insurance is MOST commonly used to", "o": ["Provide funds for estate taxes at the second death of a married couple", "Replace income at the first death", "Cover dependent children only", "Fund a buy-sell agreement among many partners"], "e": "Second-to-die pays after both insureds die, matching estate taxes typically due after the surviving spouse's death; premiums are lower than for two separate policies."}, {"id": "lg29", "t": "Types of Policies", "q": "A family income policy combines", "o": ["Whole life with decreasing term", "Whole life with level term on children", "Universal life with an annuity", "Two whole life policies"], "e": "Family income policies add decreasing term to whole life so that monthly income is paid from the date of death to the end of a specified period."}, {"id": "lg30", "t": "Types of Policies", "q": "A family policy (family protection plan) typically covers", "o": ["The primary insured with whole life and the spouse and children with term", "Only the children with whole life", "Each family member under separate policies", "Only the spouse with term"], "e": "Family policies combine permanent coverage on the primary insured with term on the spouse and children, with new children usually covered automatically."}, {"id": "lg31", "t": "Types of Policies", "q": "Modified whole life is characterized by", "o": ["Lower premiums for the first few years, then higher level premiums thereafter", "A face amount that decreases", "Premiums payable for only 10 years", "No cash value"], "e": "Modified whole life charges lower premiums initially (e.g., 3-5 years) and a higher level premium afterward, with permanent coverage."}, {"id": "lg32", "t": "Types of Policies", "q": "Graded premium whole life differs from modified whole life in that", "o": ["Premiums increase gradually each year during the initial period before leveling off", "Premiums decrease each year", "The death benefit increases each year", "No premiums are due after year 5"], "e": "Graded premium starts low and increases annually for several years before leveling, rather than a single step-up."}, {"id": "lg33", "t": "Types of Policies", "q": "An endowment policy pays the face amount", "o": ["At death or at the maturity date, whichever occurs first", "Only at death after age 100", "Only if the insured becomes disabled", "Only if the insured is alive at the end of the policy"], "e": "Endowments mature when cash value equals face on a stated date; they pay at death before maturity, or to the owner at maturity."}, {"id": "lg34", "t": "Types of Policies", "q": "Credit life insurance is usually written as", "o": ["Decreasing term with the creditor as beneficiary", "Whole life with the borrower's family as beneficiary", "An annuity paid to the borrower", "Level term with no beneficiary"], "e": "Credit life typically decreases as the debt is repaid and cannot exceed the outstanding debt; the creditor is beneficiary."}, {"id": "lg35", "t": "Types of Policies", "q": "At the maturity age of a traditional whole life policy, the cash value", "o": ["Equals the face amount", "Equals one-half of the face amount", "Equals total premiums paid", "Is zero"], "e": "At maturity the cash value equals the face and the policy endows."}, {"id": "lg36", "t": "Types of Policies", "q": "An adjustable life policy allows the owner to", "o": ["Change the face amount, premium, and coverage period within limits", "Invest in separate accounts", "Avoid underwriting on all future increases", "Receive guaranteed dividends"], "e": "Adjustable life lets the owner adjust premium, face, or period; face increases usually require evidence of insurability."}, {"id": "lg37", "t": "Types of Policies", "q": "Which annuity premium arrangement lets the owner pay varying amounts at varying times?", "o": ["Flexible premium", "Single premium", "Level premium", "Fixed periodic premium"], "e": "Flexible premium annuities accept contributions of varying amounts and timing, subject to company minimums."}, {"id": "lg38", "t": "Types of Policies", "q": "Life insurance protects against dying too soon, while an annuity primarily protects against", "o": ["Living too long and outliving one's money", "Disability", "Medical expenses", "Property loss"], "e": "Annuities liquidate a sum over a lifetime, insuring against longevity risk."}, {"id": "lg39", "t": "Types of Policies", "q": "Whose life determines the duration of payments under a life income annuity option?", "o": ["The annuitant", "The owner, if different from the annuitant", "The beneficiary", "The producer"], "e": "The annuitant is the measuring life for life-contingent payouts."}, {"id": "lg40", "t": "Types of Policies", "q": "Which product BEST meets a need for the maximum death benefit at the lowest initial premium for a temporary need?", "o": ["Term life", "Single-premium whole life", "Limited-pay whole life", "Endowment"], "e": "Term provides the largest death benefit per premium dollar for a temporary need."}, {"id": "lg41", "t": "Types of Policies", "q": "An annuity surrender charge is BEST described as", "o": ["An insurer charge on withdrawals above the free amount during the early contract years", "A federal tax penalty", "A charge that applies only after annuitization", "A state-imposed fee"], "e": "Surrender charges are contractual and usually decline over several years. They are separate from the IRS 10% penalty on withdrawals before age 59 1/2."}, {"id": "lg42", "t": "Types of Policies", "q": "Which statement about indexed life insurance is TRUE?", "o": ["The owner does not directly participate in the stock market", "It always requires a securities license", "Its cash value is credited with the full index return without limits", "Index declines reduce credited interest below the floor"], "e": "Indexed products only reference the index; floors protect against index losses and caps limit gains."}, {"id": "lg43", "t": "Types of Policies", "q": "In a variable annuity, during the accumulation period the owner's contributions purchase", "o": ["Accumulation units", "Annuity units", "Paid-up additions", "Term insurance"], "e": "Contributions buy accumulation units in the separate account; at annuitization they convert to annuity units."}, {"id": "lg44", "t": "Provisions and Riders", "q": "Which provision states that the policy and the attached copy of the application make up the whole agreement?", "o": ["Entire contract", "Insuring clause", "Consideration clause", "Incontestable clause"], "e": "The entire contract provision means outside documents (such as company bylaws) are not part of the contract; only the policy and attached application count."}, {"id": "lg45", "t": "Provisions and Riders", "q": "The insuring clause in a life policy", "o": ["States the insurer's basic promise to pay the death benefit", "Lists the exclusions", "Describes the owner's rights", "Defines the grace period"], "e": "The insuring clause (insuring agreement) contains the basic promise to pay and identifies the parties."}, {"id": "lg46", "t": "Provisions and Riders", "q": "The consideration clause identifies the applicant's consideration as", "o": ["The premium and the statements in the application", "The insurer's financial rating", "The beneficiary designation", "The settlement option chosen"], "e": "The applicant gives the premium and application statements; the insurer gives its promise to pay."}, {"id": "lg47", "t": "Provisions and Riders", "q": "A policyowner's rights typically include all of the following EXCEPT", "o": ["Changing the insurer's mortality table", "Naming and changing a revocable beneficiary", "Assigning the policy", "Borrowing against cash value"], "e": "Ownership rights include naming beneficiaries, assignment, loans, surrender, and selecting options; the owner cannot change the insurer's actuarial basis."}, {"id": "lg48", "t": "Provisions and Riders", "q": "A beneficiary who receives proceeds only if the primary beneficiary has died before the insured is a", "o": ["Contingent beneficiary", "Irrevocable beneficiary", "Tertiary owner", "Collateral assignee"], "e": "The contingent (secondary) beneficiary takes only if no primary beneficiary survives the insured."}, {"id": "lg49", "t": "Provisions and Riders", "q": "If an irrevocable beneficiary has been named, the policyowner", "o": ["Needs the beneficiary's consent to change the beneficiary or take a policy loan", "May change the beneficiary at any time without notice", "May surrender the policy without consent", "Loses all ownership rights"], "e": "An irrevocable beneficiary has a vested interest; the owner needs consent for beneficiary changes, assignments, loans, or surrender."}, {"id": "lg50", "t": "Provisions and Riders", "q": "If no beneficiary survives the insured and none is otherwise named, the proceeds are usually paid to", "o": ["The insured's estate", "The state", "The insurer's general account", "The producer of record"], "e": "Without a surviving beneficiary, proceeds generally go to the insured's estate, where they may be subject to probate and creditors."}, {"id": "lg51", "t": "Provisions and Riders", "q": "Under the Uniform Simultaneous Death Act, when the insured and primary beneficiary die together and the order of death cannot be determined,", "o": ["Proceeds are paid as if the primary beneficiary died first", "Proceeds are paid as if the insured died first", "Proceeds are split between both estates", "The insurer pays nothing"], "e": "The insured is presumed to have survived the beneficiary, so proceeds go to the contingent beneficiary or the insured's estate."}, {"id": "lg52", "t": "Provisions and Riders", "q": "A common disaster provision typically requires that the primary beneficiary", "o": ["Survive the insured by a specified period, such as 14 or 30 days", "Be a family member", "Be at least age 18", "Sign the application"], "e": "If the primary beneficiary does not survive for the stated period, proceeds go to the contingent beneficiary."}, {"id": "lg53", "t": "Provisions and Riders", "q": "Naming a minor child as a direct beneficiary can cause problems because", "o": ["Insurers generally will not pay large sums directly to a minor, so a guardian or trustee may be needed", "Minors can never be named as beneficiaries", "Insurers must pay minors double", "The proceeds become taxable to the minor"], "e": "A guardian, trust, or UTMA custodian is usually needed for a minor to receive large proceeds."}, {"id": "lg54", "t": "Provisions and Riders", "q": "A beneficiary designation reading \"all my children\" is a", "o": ["Class designation", "Collateral assignment", "Revocable assignment", "Contingent ownership"], "e": "Class designations name a group rather than individuals, so later-born or adopted children may be included."}, {"id": "lg55", "t": "Provisions and Riders", "q": "Under a per stirpes designation, if one of three named children dies before the insured,", "o": ["That child's share passes to his or her descendants", "That child's share is divided between the surviving children", "The insurer keeps that share", "That share goes to the insured's estate"], "e": "Per stirpes (by the branch) passes a deceased beneficiary's share to his or her heirs. Per capita divides only among living named beneficiaries."}, {"id": "lg56", "t": "Provisions and Riders", "q": "The grace period provision allows", "o": ["Coverage to continue for a period after a missed premium due date", "The owner to return the policy for a refund after delivery", "The insurer to contest the policy", "Reinstatement at any time"], "e": "During the grace period (30 days or one month for life policies) the policy stays in force; if death occurs, the overdue premium is deducted from the proceeds."}, {"id": "lg57", "t": "Provisions and Riders", "q": "If an insured dies during the grace period without having paid the overdue premium, the insurer will", "o": ["Pay the death benefit minus the overdue premium", "Deny the claim", "Pay the death benefit plus a premium refund", "Pay only the cash value"], "e": "The policy is still in force during grace, so the claim is paid less the premium due."}, {"id": "lg58", "t": "Provisions and Riders", "q": "The automatic premium loan provision", "o": ["Uses cash value to pay a premium still unpaid at the end of the grace period", "Pays premiums from the insurer's surplus", "Applies only to term policies", "Waives premiums upon disability"], "e": "APL borrows from cash value to pay an overdue premium and prevent lapse; it requires sufficient cash value."}, {"id": "lg59", "t": "Provisions and Riders", "q": "Which premium mode results in the LOWEST total annual cost?", "o": ["Annual", "Semiannual", "Quarterly", "Monthly"], "e": "More frequent modes add administrative and interest charges; annual payment costs the least overall."}, {"id": "lg60", "t": "Provisions and Riders", "q": "To reinstate a lapsed life policy, the owner generally must", "o": ["Provide evidence of insurability and pay overdue premiums with interest", "Simply request reinstatement at any time", "Pay a flat reinstatement fee only", "Apply for a brand-new policy"], "e": "Reinstatement requires an application, proof of insurability, and payment of back premiums plus interest (and any loans), within the reinstatement period (3 years in Illinois)."}, {"id": "lg61", "t": "Provisions and Riders", "q": "A policy loan outstanding at the insured's death will", "o": ["Be deducted from the death benefit", "Be forgiven by the insurer", "Be billed to the beneficiary separately", "Void the policy"], "e": "Unpaid loans and accrued interest reduce the death benefit."}, {"id": "lg62", "t": "Provisions and Riders", "q": "Which nonforfeiture option provides the same face amount for a limited period of time?", "o": ["Extended term", "Reduced paid-up", "Cash surrender", "Automatic premium loan"], "e": "Extended term uses the net cash value as a single premium for term insurance equal to the face for as long as the value lasts; it is often the automatic option."}, {"id": "lg63", "t": "Provisions and Riders", "q": "Which nonforfeiture option provides a lower face amount of permanent coverage with no further premiums?", "o": ["Reduced paid-up", "Extended term", "Cash surrender", "Paid-up additions"], "e": "Reduced paid-up uses the cash value to buy a smaller, fully paid permanent policy."}, {"id": "lg64", "t": "Provisions and Riders", "q": "Nonforfeiture options exist primarily to", "o": ["Protect the policyowner from losing the cash value if the policy lapses", "Protect the insurer from adverse selection", "Allow the insurer to cancel", "Guarantee dividends"], "e": "Standard nonforfeiture laws require that owners of cash value policies receive their equity (cash, reduced paid-up, or extended term)."}, {"id": "lg65", "t": "Provisions and Riders", "q": "For tax purposes, policy dividends on a participating policy are generally treated as", "o": ["A return of excess premium that is not taxable", "Taxable earned income", "Capital gains", "Fully taxable interest"], "e": "Dividends are a return of overcharged premium and are not taxable until they exceed premiums paid. Interest earned on dividends left on deposit is taxable."}, {"id": "lg66", "t": "Provisions and Riders", "q": "Which dividend option uses dividends to buy small amounts of fully paid permanent insurance?", "o": ["Paid-up additions", "Accumulation at interest", "Reduction of premium", "Cash"], "e": "Paid-up additions buy single-premium whole life at net rates without evidence of insurability, increasing death benefit and cash value."}, {"id": "lg67", "t": "Provisions and Riders", "q": "The one-year term dividend option buys", "o": ["One-year term insurance, often limited to the policy's cash value", "Paid-up permanent coverage", "An immediate annuity", "A larger premium refund"], "e": "The fifth dividend option buys one-year term, usually up to the cash value, with any remainder applied under another option."}, {"id": "lg68", "t": "Provisions and Riders", "q": "A participating policy is one that", "o": ["May pay policy dividends to policyowners", "Guarantees a dividend each year", "Is issued only by stock companies", "Pays dividends only to stockholders"], "e": "Participating policies (usually from mutual insurers) may pay non-guaranteed dividends to owners."}, {"id": "lg69", "t": "Provisions and Riders", "q": "The incontestable clause prevents an insurer from voiding a policy for material misstatements in the application after", "o": ["The policy has been in force for a specified time, no longer than 2 years", "The policy has been in force 30 days", "The first premium is paid", "The insured reaches age 65"], "e": "After the contestable period the insurer cannot void the policy for misstatements, except for nonpayment of premium (and certain excepted benefits)."}, {"id": "lg70", "t": "Provisions and Riders", "q": "An absolute assignment of a life policy", "o": ["Transfers all ownership rights to the assignee", "Temporarily transfers part of the death benefit", "Is used only as loan collateral", "Takes effect only at the insured's death"], "e": "Absolute assignment is a permanent, complete transfer of ownership. Collateral assignment is temporary and partial."}, {"id": "lg71", "t": "Provisions and Riders", "q": "A collateral assignment to a lender gives the lender", "o": ["The right to be repaid from the death proceeds to the extent of the outstanding debt", "Full ownership of the policy forever", "The right to change the beneficiary", "The right to surrender the policy at any time"], "e": "Collateral assignees recover only the amount owed; the remainder goes to the beneficiary."}, {"id": "lg72", "t": "Provisions and Riders", "q": "If the insured commits suicide during the suicide exclusion period (commonly 2 years), the insurer typically", "o": ["Refunds the premiums paid", "Pays the full death benefit", "Pays double the death benefit", "Pays nothing at all"], "e": "During the suicide exclusion period the insurer's liability is limited to a return of premium; afterward suicide is covered."}, {"id": "lg73", "t": "Provisions and Riders", "q": "An insured stated an age of 40 on the application but was actually 43 at issue. At death, the insurer will", "o": ["Adjust the death benefit to what the premium paid would have purchased at the correct age", "Deny the claim", "Pay the full face amount", "Refund premiums only"], "e": "The misstatement of age provision adjusts benefits to what the premium would have bought at the true age, regardless of the incontestable clause."}, {"id": "lg74", "t": "Provisions and Riders", "q": "Which settlement option pays proceeds over a specified number of years, with payment size determined by the period chosen?", "o": ["Fixed period", "Fixed amount", "Interest only", "Life income"], "e": "Fixed period sets the duration and payment size follows. Fixed amount sets the payment and the duration varies."}, {"id": "lg75", "t": "Provisions and Riders", "q": "Under the interest only settlement option,", "o": ["The insurer holds the proceeds and pays only the interest to the beneficiary", "The principal is paid in equal installments", "The beneficiary receives a lifetime income", "The proceeds are paid in a lump sum"], "e": "The principal is retained (often for later distribution) and the interest paid is taxable."}, {"id": "lg76", "t": "Provisions and Riders", "q": "An accelerated death benefit provision allows", "o": ["Payment of part of the death benefit before death if the insured is terminally ill", "A loan from a third party", "A refund of all premiums", "Double indemnity"], "e": "Accelerated benefits pay a portion of the face while the insured is living with a qualifying (e.g., terminal) condition; the death benefit is reduced accordingly."}, {"id": "lg77", "t": "Provisions and Riders", "q": "The waiver of premium rider", "o": ["Waives premiums if the insured becomes totally disabled, usually after a waiting period", "Waives premiums if the insured loses a job", "Refunds premiums at the end of the term", "Pays monthly disability income"], "e": "Waiver of premium keeps the policy in force without premium during total disability, usually after a 6-month waiting period, often retroactively."}, {"id": "lg78", "t": "Provisions and Riders", "q": "On a universal life policy, the rider comparable to waiver of premium is", "o": ["Waiver of monthly deduction", "Guaranteed insurability", "Cost of living", "Payor benefit"], "e": "Because UL premiums are flexible, the rider waives the monthly cost of insurance and expense deductions during disability."}, {"id": "lg79", "t": "Provisions and Riders", "q": "The guaranteed insurability rider allows the insured to", "o": ["Buy additional coverage at specified dates or events without evidence of insurability", "Convert term to whole life", "Have premiums waived on disability", "Receive double indemnity"], "e": "GIR permits additional purchases at option ages or events such as marriage or birth of a child, without proving insurability."}, {"id": "lg80", "t": "Provisions and Riders", "q": "An accidental death rider that pays an additional amount equal to the face for accidental death is often called", "o": ["Double indemnity", "Payor benefit", "Return of premium", "Survivorship"], "e": "AD riders pay an extra amount if death results from a covered accident, typically within 90 days of the accident."}, {"id": "lg81", "t": "Provisions and Riders", "q": "Under an AD&D rider, the principal sum is paid for", "o": ["Accidental death or loss of two limbs or sight in both eyes", "Any death", "Loss of one finger", "Any illness"], "e": "AD&D pays the principal sum for accidental death or double dismemberment and a capital sum (a percentage) for single losses."}, {"id": "lg82", "t": "Provisions and Riders", "q": "A cost of living rider", "o": ["Increases the face amount periodically based on an index such as the CPI", "Lowers premiums each year", "Pays the insured's living expenses", "Applies only to annuities"], "e": "COLA riders increase coverage to keep pace with inflation, usually without evidence of insurability."}, {"id": "lg83", "t": "Provisions and Riders", "q": "A term rider on a whole life policy covering the insured's spouse is an example of", "o": ["An other-insured rider", "A payor benefit rider", "A guaranteed insurability rider", "A cost of living rider"], "e": "Other-insured (spouse/children) riders add term coverage on family members under the base policy."}, {"id": "lg84", "t": "Provisions and Riders", "q": "A juvenile policy rider that waives premiums if the adult premium payer dies or becomes disabled is the", "o": ["Payor benefit rider", "Guaranteed insurability rider", "Accidental death rider", "Cost of living rider"], "e": "The payor benefit rider waives premiums on a child's policy if the payor dies or is disabled, usually until the child reaches a stated age."}, {"id": "lg85", "t": "Provisions and Riders", "q": "A long-term care rider on a life policy generally", "o": ["Allows part of the death benefit to be used for qualified long-term care expenses", "Pays all hospital bills", "Doubles the death benefit", "Waives the suicide clause"], "e": "LTC riders accelerate the death benefit when the insured cannot perform activities of daily living or is cognitively impaired."}, {"id": "lg86", "t": "Provisions and Riders", "q": "Which exclusion would eliminate coverage for death while flying as a private pilot but not as a fare-paying commercial airline passenger?", "o": ["Aviation exclusion", "War exclusion", "Suicide exclusion", "Dangerous occupation exclusion"], "e": "Aviation exclusions commonly exclude non-commercial or private flying while covering fare-paying passengers on scheduled airlines."}, {"id": "lg87", "t": "Provisions and Riders", "q": "A war exclusion that excludes death from any cause while the insured is in military service is a", "o": ["Status clause", "Results clause", "Common disaster clause", "Spendthrift clause"], "e": "Under a status clause, death while in service is excluded regardless of cause. Under a results clause, only death resulting from war is excluded."}, {"id": "lg88", "t": "Provisions and Riders", "q": "An applicant who is a commercial deep-sea diver will most likely receive", "o": ["A rated policy or a dangerous occupation exclusion", "A preferred rating", "An automatic decline required by law", "Standard rates"], "e": "Hazardous occupations are handled with extra premium (rating) or an exclusion rider."}, {"id": "lg89", "t": "Provisions and Riders", "q": "A spendthrift clause protects", "o": ["Proceeds held for a beneficiary from the beneficiary's creditors before payment", "The insurer from fraudulent claims", "The owner from paying premiums", "The policy from lapsing"], "e": "A spendthrift clause prevents the beneficiary from assigning future installments and shields them from creditors until paid."}, {"id": "lg90", "t": "Provisions and Riders", "q": "A partial withdrawal from a universal life policy generally", "o": ["Reduces the cash value and may reduce the death benefit, and need not be repaid", "Must be repaid with interest", "Has no effect on the death benefit", "Is always fully taxable"], "e": "UL withdrawals are not loans; for non-MECs they are generally taxed FIFO (basis first)."}, {"id": "lg91", "t": "Provisions and Riders", "q": "A return of premium rider is usually structured as", "o": ["Increasing term insurance equal to premiums paid", "Decreasing term", "Paid-up additions", "A deferred annuity"], "e": "The ROP rider adds increasing term so that the beneficiary receives the face plus premiums paid if death occurs within a set period."}, {"id": "lg92", "t": "Provisions and Riders", "q": "A disability income rider on a life policy", "o": ["Pays a monthly income if the insured becomes totally disabled", "Only waives premiums", "Pays double the death benefit", "Increases the face amount"], "e": "Some life policies offer a disability income rider paying a monthly amount (often a percentage of face) during total disability."}, {"id": "lg93", "t": "Provisions and Riders", "q": "Which provision lets an owner use a policy's cash value as the sole security for a loan from the insurer?", "o": ["Policy loan provision", "Assignment provision", "Reinstatement provision", "Entire contract provision"], "e": "Cash value policies must offer loans (in Illinois, once the policy has been in force 3 full years) secured by the cash value."}, {"id": "lg94", "t": "Application and Underwriting", "q": "Who must sign a life insurance application?", "o": ["The proposed insured, the policyowner (if different), and the producer", "Only the beneficiary", "Only the producer", "The insurer's underwriter"], "e": "The applicant/owner and the insured (if different) sign, and the producer signs as soliciting agent. A minor's application may require a parent's signature."}, {"id": "lg95", "t": "Application and Underwriting", "q": "If an applicant answers a question incorrectly on the application, the producer should", "o": ["Correct it and have the applicant initial the change, or complete a new application", "Use correction fluid and resubmit", "Correct it without telling the applicant", "Ignore it if minor"], "e": "Changes must be initialed by the applicant; erasures or correction fluid are not acceptable."}, {"id": "lg96", "t": "Application and Underwriting", "q": "If an application is submitted with unanswered questions and the insurer issues the policy anyway,", "o": ["The insurer is considered to have waived its right to the missing information", "The policy is automatically void", "The producer is personally liable for claims", "The insurer may cancel at any time"], "e": "By issuing the policy despite an incomplete application, the insurer waives the unanswered items."}, {"id": "lg97", "t": "Application and Underwriting", "q": "Statements made by an applicant that are true to the best of the applicant's knowledge are", "o": ["Representations", "Warranties", "Concealments", "Estoppels"], "e": "Applicant statements are representations; only material misrepresentations can void a policy. Warranties are guaranteed true and strictly enforced."}, {"id": "lg98", "t": "Application and Underwriting", "q": "A statement guaranteed to be literally true that, if false, can void the contract is a", "o": ["Warranty", "Representation", "Waiver", "Consideration"], "e": "Warranties are absolute statements that become part of the contract; in life and health insurance applicant statements are generally representations."}, {"id": "lg99", "t": "Application and Underwriting", "q": "Intentionally withholding a material fact from the insurer is", "o": ["Concealment", "Waiver", "Estoppel", "Adhesion"], "e": "Concealment can make a contract voidable during the contestable period."}, {"id": "lg100", "t": "Application and Underwriting", "q": "When a producer collects the initial premium with the application, the producer should", "o": ["Give the applicant a premium receipt", "Hold the check until the policy is issued", "Deposit it in a personal account", "Return it if the applicant is healthy"], "e": "Collecting the premium with the application and issuing a receipt can give interim coverage and is best practice."}, {"id": "lg101", "t": "Application and Underwriting", "q": "Under a conditional receipt, coverage is effective as of the application (or exam) date provided that", "o": ["The applicant is found insurable as applied for", "The applicant pays the full annual premium", "The policy is delivered", "The beneficiary signs the receipt"], "e": "Conditional receipt coverage applies only if the applicant meets the insurer's underwriting standards."}, {"id": "lg102", "t": "Application and Underwriting", "q": "A binding receipt", "o": ["Provides temporary coverage from the application date until the insurer acts, even if the applicant is later declined", "Never provides coverage", "Applies only to health insurance", "Takes effect only at policy delivery"], "e": "Binding receipts provide immediate temporary coverage, usually for a limited time or until the insurer acts."}, {"id": "lg103", "t": "Application and Underwriting", "q": "If no premium is collected with the application, coverage generally begins when", "o": ["The policy is delivered, the premium is paid, and a statement of good health is signed", "The application is signed", "The medical exam is completed", "The insurer receives the application"], "e": "Without an initial premium, the producer collects it at delivery, often with a statement of continued good health."}, {"id": "lg104", "t": "Application and Underwriting", "q": "Under the Fair Credit Reporting Act, an applicant must be notified that an investigative consumer report may be requested", "o": ["No later than 3 days after the report is requested", "After the policy is issued", "Only if coverage is denied", "At least 30 days before applying"], "e": "FCRA requires written notice within 3 days of requesting an investigative consumer report."}, {"id": "lg105", "t": "Application and Underwriting", "q": "If an insurer takes adverse action based on a consumer report, it must", "o": ["Inform the applicant and provide the reporting agency's name and address", "Keep the reason confidential", "Refund premium with 10% interest", "Notify the state insurance department"], "e": "FCRA requires disclosure of the agency so the consumer can obtain and dispute the report."}, {"id": "lg106", "t": "Application and Underwriting", "q": "The Medical Information Bureau (MIB) is", "o": ["A nonprofit organization through which member insurers share coded medical information", "A government agency that issues medical records", "An insurer that sells medical coverage", "A consumer credit agency"], "e": "MIB helps detect omissions or fraud; insurers cannot decline solely on MIB data and must notify applicants of its use."}, {"id": "lg107", "t": "Application and Underwriting", "q": "The tendency of higher-risk people to seek insurance more often than average risks is called", "o": ["Adverse selection", "Moral hazard", "Pure risk", "Indemnity"], "e": "Underwriting and risk classification counteract adverse selection."}, {"id": "lg108", "t": "Application and Underwriting", "q": "An applicant with a moderate heart condition who is charged an extra premium is classified as", "o": ["Substandard (rated)", "Preferred", "Standard", "Declined"], "e": "Substandard risks are accepted with higher premiums, ratings, or exclusions."}, {"id": "lg109", "t": "Application and Underwriting", "q": "Which classification is given to an applicant with better-than-average health and habits?", "o": ["Preferred", "Standard", "Substandard", "Uninsurable"], "e": "Preferred risks (e.g., nonsmokers in excellent health) receive lower than standard rates."}, {"id": "lg110", "t": "Application and Underwriting", "q": "For a life policy to be valid, insurable interest must exist", "o": ["At the time of application", "At the time of the insured's death", "At both application and death", "Only for group policies"], "e": "In life insurance, insurable interest is required at inception; it need not exist at death."}, {"id": "lg111", "t": "Application and Underwriting", "q": "Which relationship would NOT generally provide insurable interest in another person's life?", "o": ["A neighbor", "A spouse", "A business partner", "A creditor, to the extent of the debt"], "e": "Insurable interest arises from family love and affection, financial dependence, or business relationships."}, {"id": "lg112", "t": "Application and Underwriting", "q": "An arrangement in which investors induce seniors to buy large policies to be transferred to the investors is called", "o": ["Stranger-originated life insurance (STOLI)", "Key person insurance", "Credit life", "Group conversion"], "e": "STOLI/IOLI arrangements are initiated for investors lacking insurable interest and are prohibited or restricted."}, {"id": "lg113", "t": "Application and Underwriting", "q": "Under HIPAA, an applicant's protected health information", "o": ["May be used and disclosed only as permitted, with authorization where required", "May be freely shared with marketers", "Can never be used in underwriting", "Is public record"], "e": "HIPAA privacy rules restrict the use and disclosure of PHI."}, {"id": "lg114", "t": "Application and Underwriting", "q": "Before an insurer tests an applicant for HIV, the applicant must generally", "o": ["Give informed written consent", "Be at least age 21", "Be examined by two doctors", "Pay a separate fee"], "e": "HIV testing for underwriting requires written informed consent and confidential handling of results."}, {"id": "lg115", "t": "Application and Underwriting", "q": "The USA PATRIOT Act requires insurers offering covered products to", "o": ["Maintain anti-money laundering programs and report suspicious activity", "Insure all applicants regardless of risk", "Accept cash premiums of any size", "Avoid verifying identity"], "e": "Insurers issuing covered products (e.g., cash value life and annuities) must have AML programs, train producers, and file SARs."}, {"id": "lg116", "t": "Application and Underwriting", "q": "A red flag of possible money laundering is an applicant who", "o": ["Wants to pay a large premium in cash and shows little interest in the policy's costs or benefits", "Asks about the grace period", "Chooses annual premiums", "Names a spouse as beneficiary"], "e": "Unusual cash payments, early surrenders regardless of penalty, and indifference to cost are AML red flags."}, {"id": "lg117", "t": "Application and Underwriting", "q": "The Gramm-Leach-Bliley Act requires insurers to", "o": ["Provide privacy notices and let consumers opt out of certain sharing with nonaffiliated third parties", "Disclose all customer information publicly", "Use only paper records", "Stop sharing information with affiliates"], "e": "GLBA requires privacy notices and an opt-out for certain sharing of nonpublic personal information with nonaffiliated parties."}, {"id": "lg118", "t": "Application and Underwriting", "q": "An attending physician's statement (APS) is", "o": ["A report from the applicant's own doctor about medical history", "A paramedical exam", "An inspection report from a credit agency", "An application signed by a physician"], "e": "APS reports give underwriters details from the applicant's treating physician."}, {"id": "lg119", "t": "Application and Underwriting", "q": "When delivering a policy issued with a rating, the producer should", "o": ["Explain the rating and obtain the applicant's signed acceptance and any additional premium", "Deliver it without comment", "Return it to the insurer", "Reduce the premium personally"], "e": "A rated policy is a counteroffer; the producer explains the change and obtains acceptance."}, {"id": "lg120", "t": "Application and Underwriting", "q": "A policy issued at a different rate class than applied for is legally", "o": ["A counteroffer that the applicant may accept or reject", "A binding offer by the applicant", "Void", "An endorsement only"], "e": "When the insurer changes terms it makes a counteroffer; acceptance occurs when the applicant accepts and pays."}, {"id": "lg121", "t": "Application and Underwriting", "q": "Constructive delivery occurs when", "o": ["The insurer mails the policy to the producer for unconditional delivery", "The applicant signs the application", "The medical exam is completed", "The applicant requests a quote"], "e": "Constructive delivery occurs when the insurer gives up control of the policy, even if the owner has not physically received it."}, {"id": "lg122", "t": "Application and Underwriting", "q": "At policy delivery the producer should", "o": ["Explain the provisions, riders, exclusions, and any ratings", "Ask the client to sign a new application", "Change the beneficiary", "Collect a delivery fee"], "e": "Explaining the policy at delivery helps the client understand coverage and helps prevent lapses."}, {"id": "lg123", "t": "Application and Underwriting", "q": "Which element of a contract is satisfied when the insurer issues a policy exactly as applied for?", "o": ["Acceptance", "Consideration", "Legal purpose", "Competent parties"], "e": "The application with premium is the offer; issuing the policy as applied for is acceptance."}, {"id": "lg124", "t": "Application and Underwriting", "q": "The insurer's consideration in an insurance contract is", "o": ["Its promise to pay benefits", "The application", "The premium", "The producer's commission"], "e": "The applicant gives premium and statements; the insurer gives the promise to pay."}, {"id": "lg125", "t": "Application and Underwriting", "q": "A contract with a person declared mentally incompetent lacks which element?", "o": ["Competent parties", "Consideration", "Offer", "Legal purpose"], "e": "Parties must have legal capacity."}, {"id": "lg126", "t": "Application and Underwriting", "q": "Because the insurer drafts the policy and the applicant must accept it as written, an insurance policy is a contract of", "o": ["Adhesion", "Indemnity", "Utmost good faith", "Aleatory nature"], "e": "Ambiguities in contracts of adhesion are interpreted in favor of the insured."}, {"id": "lg127", "t": "Application and Underwriting", "q": "An insurance contract is aleatory because", "o": ["It involves an exchange of unequal amounts that depends on an uncertain event", "Only one party makes an enforceable promise", "One party drafts it", "It must be in writing"], "e": "A small premium may buy a large benefit, depending on chance."}, {"id": "lg128", "t": "Application and Underwriting", "q": "An insurance contract is unilateral because", "o": ["Only the insurer makes a legally enforceable promise", "Both parties make enforceable promises", "The insured can change it alone", "It must be approved by the state"], "e": "The insured cannot be compelled to pay premiums; only the insurer is bound."}, {"id": "lg129", "t": "Application and Underwriting", "q": "An insurance contract is conditional because", "o": ["The insurer pays only if conditions such as premium payment and proof of loss are met", "It can be canceled at any time", "It requires the insured to profit", "It needs court approval"], "e": "Claims are payable only when the contract's conditions are satisfied."}, {"id": "lg130", "t": "Application and Underwriting", "q": "Replacing an existing life policy may harm the client because", "o": ["A new contestable and suicide period begins and new acquisition costs may apply", "Premiums always decrease", "Cash values always increase", "The original insurer must refund all premiums"], "e": "Replacements may restart contestable and suicide periods and involve surrender charges and higher attained-age premiums."}, {"id": "lg131", "t": "Application and Underwriting", "q": "Suitability in a life insurance or annuity sale refers to", "o": ["Recommending products appropriate to the client's needs, objectives, and financial situation", "Selling the highest commission product", "Using only term products", "Selling only to safe occupations"], "e": "Suitability and best-interest standards require gathering client information and recommending products that fit."}, {"id": "lg132", "t": "Application and Underwriting", "q": "When a parent buys a policy on a 10-year-old child, who typically signs as applicant?", "o": ["The parent as applicant and owner", "The child only", "The child's teacher", "No one"], "e": "Minors lack contractual capacity; a parent or guardian signs as applicant and owner."}, {"id": "lg133", "t": "Retirement and Other Concepts", "q": "A policy in which the owner is someone other than the insured is an example of", "o": ["Third-party ownership", "Survivorship life", "A joint annuity", "Credit life"], "e": "Examples include a business owning a key person policy or a spouse owning a policy on the other spouse."}, {"id": "lg134", "t": "Retirement and Other Concepts", "q": "A life settlement involves", "o": ["The sale of an existing policy to a third party for more than its cash value but less than the death benefit", "A loan from the insurer", "The payment of a death claim", "Surrendering the policy to the insurer"], "e": "Life settlements let owners sell policies; viatical settlements generally involve terminally or chronically ill insureds."}, {"id": "lg135", "t": "Retirement and Other Concepts", "q": "The group life conversion privilege generally allows a terminated employee to convert to an individual permanent policy", "o": ["Within 31 days, without evidence of insurability", "Within 1 year with a medical exam", "Only if the employer agrees", "Only at retirement"], "e": "Conversion is available within 31 days of termination at attained-age rates without evidence of insurability; group coverage continues during that period."}, {"id": "lg136", "t": "Retirement and Other Concepts", "q": "In a noncontributory group life plan,", "o": ["The employer pays the entire premium and 100% of eligible employees must be covered", "Employees pay the entire premium", "Only 75% participation is required", "Employees choose whether to enroll"], "e": "Noncontributory plans require all eligible employees to participate to avoid adverse selection."}, {"id": "lg137", "t": "Retirement and Other Concepts", "q": "In a contributory group plan,", "o": ["Employees share the premium and a minimum percentage (often 75%) of eligible employees must participate", "The employer pays everything", "Participation must be 100%", "No eligibility rules apply"], "e": "Contributory plans typically require at least 75% participation of eligible employees."}, {"id": "lg138", "t": "Retirement and Other Concepts", "q": "Group life insurance is most commonly issued as", "o": ["Annually renewable group term", "Single-premium whole life", "Variable universal life", "Endowment"], "e": "A master policy is issued to the employer and certificates to members, usually on a yearly renewable term basis."}, {"id": "lg139", "t": "Retirement and Other Concepts", "q": "Employer-paid group term life coverage is tax-free to the employee up to", "o": ["$50,000 of coverage", "$100,000 of coverage", "$25,000 of coverage", "$10,000 of coverage"], "e": "Under IRC Section 79, the cost of employer-paid coverage over $50,000 is imputed income to the employee."}, {"id": "lg140", "t": "Retirement and Other Concepts", "q": "A qualified retirement plan must", "o": ["Meet IRS requirements, including not discriminating in favor of highly compensated employees", "Cover only executives", "Be funded only with after-tax dollars", "Avoid vesting schedules"], "e": "Qualified plans receive tax advantages and must meet ERISA/IRS rules such as nondiscrimination and vesting."}, {"id": "lg141", "t": "Retirement and Other Concepts", "q": "A nonqualified deferred compensation plan", "o": ["May favor selected executives, and the employer deducts benefits when paid", "Must cover all employees", "Provides an immediate employer deduction for amounts set aside", "Is regulated exactly like a qualified plan"], "e": "Nonqualified plans may discriminate and are often informally funded with life insurance."}, {"id": "lg142", "t": "Retirement and Other Concepts", "q": "Contributions to a traditional IRA are generally", "o": ["Deductible (subject to limits for workplace-plan participants), with taxable withdrawals", "After-tax with tax-free withdrawals", "Never deductible", "Taxed twice"], "e": "Traditional IRA distributions are ordinary income; Roth contributions are after-tax."}, {"id": "lg143", "t": "Retirement and Other Concepts", "q": "Qualified distributions from a Roth IRA are", "o": ["Income tax-free", "Fully taxable", "Taxed as capital gains", "Always subject to a 10% penalty"], "e": "Qualified Roth distributions (5-year rule plus age 59 1/2 or another qualifying event) are tax-free."}, {"id": "lg144", "t": "Retirement and Other Concepts", "q": "A withdrawal from a traditional IRA or deferred annuity before age 59 1/2, without an exception, is generally subject to", "o": ["Ordinary income tax plus a 10% additional tax on the taxable portion", "No tax", "Capital gains tax only", "A 50% penalty"], "e": "Exceptions include death and disability."}, {"id": "lg145", "t": "Retirement and Other Concepts", "q": "Which plan is designed for employees of public schools and certain tax-exempt organizations?", "o": ["403(b) tax-sheltered annuity", "SEP", "Keogh (HR-10)", "Section 79 plan"], "e": "403(b) plans serve employees of 501(c)(3) organizations and public schools."}, {"id": "lg146", "t": "Retirement and Other Concepts", "q": "A qualified plan for self-employed individuals and their employees is a", "o": ["Keogh (HR-10) plan", "403(b) plan", "457 plan", "Section 79 plan"], "e": "Keogh plans let self-employed persons and partners establish qualified plans."}, {"id": "lg147", "t": "Retirement and Other Concepts", "q": "The human life value approach to life insurance needs is based on", "o": ["The present value of the insured's future earnings available to the family", "The family's existing assets only", "The mortgage balance only", "A fixed multiple of age"], "e": "The needs approach instead totals specific family needs and subtracts existing resources."}, {"id": "lg148", "t": "Retirement and Other Concepts", "q": "In key person insurance, the business is the", "o": ["Owner, premium payer, and beneficiary", "Beneficiary only", "Insured", "Producer"], "e": "Premiums are not deductible, and proceeds are generally received income tax-free by the business."}, {"id": "lg149", "t": "Retirement and Other Concepts", "q": "In a cross-purchase buy-sell agreement among three partners,", "o": ["Each partner owns a policy on each of the other partners", "The business owns one policy on each partner", "Only the senior partner is insured", "No insurance is used"], "e": "Cross-purchase needs n x (n-1) policies; an entity plan has the business own one policy per owner."}, {"id": "lg150", "t": "Retirement and Other Concepts", "q": "In an entity (stock redemption) buy-sell plan, the business", "o": ["Owns policies on each owner and buys the deceased owner's interest with the proceeds", "Has no involvement", "Is the insured", "Pays premiums only for employees"], "e": "The business is owner, payer, and beneficiary."}, {"id": "lg151", "t": "Retirement and Other Concepts", "q": "Social Security pays a surviving spouse benefits while caring for the deceased worker's child under age", "o": ["16", "21", "25", "10"], "e": "Benefits stop when the youngest child turns 16 (unless disabled); the gap until the spouse's survivor benefit at age 60 is the blackout period."}, {"id": "lg152", "t": "Retirement and Other Concepts", "q": "To be fully insured under Social Security, a worker generally needs", "o": ["40 credits (quarters) of coverage", "20 credits in the last 5 years", "6 credits in the last 13 quarters", "10 credits total"], "e": "40 credits equals about 10 years of work. Currently insured status requires 6 of the last 13 quarters."}, {"id": "lg153", "t": "Retirement and Other Concepts", "q": "Premiums an individual pays for a personal life insurance policy are generally", "o": ["Not tax-deductible", "Fully deductible", "Deductible above $50,000 of coverage", "Deductible only for business owners"], "e": "Personal life premiums are a personal expense."}, {"id": "lg154", "t": "Retirement and Other Concepts", "q": "Death proceeds paid in a lump sum to a named beneficiary are generally", "o": ["Free of federal income tax", "Taxed as ordinary income", "Taxed as capital gains", "Subject to a 10% penalty"], "e": "IRC Section 101 excludes death benefits from income; interest on proceeds held by the insurer is taxable."}, {"id": "lg155", "t": "Retirement and Other Concepts", "q": "If a beneficiary chooses installment payments, the portion of each payment representing interest is", "o": ["Taxable as ordinary income", "Tax-free", "Taxed as capital gains", "Subject only to estate tax"], "e": "Principal is tax-free; interest earnings are taxable."}, {"id": "lg156", "t": "Retirement and Other Concepts", "q": "The cash value of a life policy grows", "o": ["Tax-deferred", "Fully taxable each year", "Taxed annually as capital gains", "Tax-deductible"], "e": "Gains are taxed only on surrender to the extent cash value exceeds cost basis (premiums paid minus dividends received)."}, {"id": "lg157", "t": "Retirement and Other Concepts", "q": "An owner surrenders a whole life policy with $40,000 cash value after paying $30,000 in premiums and receiving no dividends. How much is taxable?", "o": ["$10,000", "$40,000", "$0", "$30,000"], "e": "The gain over basis ($40,000 - $30,000) is ordinary income."}, {"id": "lg158", "t": "Retirement and Other Concepts", "q": "A life policy that fails the IRS seven-pay test becomes a", "o": ["Modified Endowment Contract (MEC)", "Qualified plan", "Viatical settlement", "Section 1035 exchange"], "e": "A MEC keeps a tax-free death benefit but loses favorable tax treatment for lifetime distributions."}, {"id": "lg159", "t": "Retirement and Other Concepts", "q": "Loans and withdrawals from a MEC are taxed", "o": ["Gain first (LIFO), with a 10% penalty if taken before age 59 1/2", "Basis first with no penalty", "Not at all", "Only at death"], "e": "MEC distributions are taxed like annuity withdrawals."}, {"id": "lg160", "t": "Retirement and Other Concepts", "q": "Exchanging one life insurance policy for another without recognizing gain is permitted under IRC Section", "o": ["1035", "79", "101", "403(b)"], "e": "Section 1035 allows life-to-life, life-to-annuity, and annuity-to-annuity exchanges (not annuity-to-life)."}, {"id": "lg161", "t": "Retirement and Other Concepts", "q": "The tax-free portion of each nonqualified annuity payment is determined by the", "o": ["Exclusion ratio", "Seven-pay test", "Accumulation ratio", "Settlement ratio"], "e": "The exclusion ratio (investment in the contract divided by expected return) applies until basis is recovered."}, {"id": "lg162", "t": "Retirement and Other Concepts", "q": "Withdrawals from a nonqualified deferred annuity before annuitization are taxed", "o": ["Earnings first, as ordinary income", "Principal first, tax-free until basis is recovered", "As capital gains", "Not at all"], "e": "For contracts issued after 1982, withdrawals are treated as coming from earnings first."}, {"id": "lg163", "t": "Retirement and Other Concepts", "q": "Under current federal law (SECURE 2.0), required minimum distributions from a traditional IRA generally begin at age", "o": ["73", "59 1/2", "65", "70 1/2"], "e": "The RMD age is 73 for those who reached 72 after 2022, rising to 75 in 2033."}, {"id": "lg164", "t": "Retirement and Other Concepts", "q": "Social Security disability benefits require a disability expected to last at least", "o": ["12 months or result in death", "30 days", "6 months", "90 days"], "e": "SSDI uses a strict definition and has a 5-month waiting period."}, {"id": "lg165", "t": "Retirement and Other Concepts", "q": "A Simplified Employee Pension (SEP) is funded by", "o": ["Employer contributions to employees' IRAs", "Employee salary deferrals only", "Life insurance premiums", "Social Security taxes"], "e": "SEPs let small employers and the self-employed contribute to IRAs."}, {"id": "lg166", "t": "Retirement and Other Concepts", "q": "A split-dollar plan", "o": ["Shares premiums and benefits of a policy between employer and employee", "Is a type of annuity", "Splits a policy between two insurers", "Provides group health coverage"], "e": "Split-dollar arrangements divide premiums, cash value, and death benefits under a written agreement."}, {"id": "lg167", "t": "Retirement and Other Concepts", "q": "After a policy is sold in a life settlement,", "o": ["The buyer becomes owner and beneficiary and pays future premiums", "The original beneficiary still receives the death benefit", "The insurer must repurchase the policy", "The seller keeps paying premiums"], "e": "Settlements can also affect the seller's taxes and eligibility for public benefits."}]}, "hg": {"name": "Health (Accident & Health) - General", "exam": {"n": 55, "scored": 50, "min": 75}, "topics": [{"name": "Types of Policies", "w": 16}, {"name": "Policy Provisions", "w": 15}, {"name": "Social Insurance", "w": 6}, {"name": "Other Insurance Concepts", "w": 5}, {"name": "Field Underwriting", "w": 8}], "qs": [{"id": "hg0", "t": "Types of Policies", "q": "Disability income insurance is designed to replace", "o": ["A portion of the insured's earned income lost due to disability", "All medical expenses from an injury", "The insured's investment losses", "The full income of the insured"], "e": "Insurers limit benefits to a portion (commonly 60-70%) of earnings to preserve the incentive to return to work."}, {"id": "hg1", "t": "Types of Policies", "q": "A business overhead expense policy pays", "o": ["Ongoing business expenses such as rent, utilities, and staff salaries while the owner is disabled", "The disabled owner's personal income", "The purchase price of the disabled owner's interest", "Medical bills of employees"], "e": "BOE covers fixed business overhead (not the owner's salary or profits); premiums are deductible and benefits taxable to the business."}, {"id": "hg2", "t": "Types of Policies", "q": "A disability buy-sell (buyout) policy is designed to", "o": ["Fund the purchase of a disabled owner's business interest", "Pay the disabled owner's salary for life", "Cover rent and utilities", "Pay group health premiums"], "e": "Disability buyout policies typically have long elimination periods (often 12-24 months) and may pay in a lump sum."}, {"id": "hg3", "t": "Types of Policies", "q": "A key employee disability policy pays benefits to", "o": ["The business, to offset losses when a key employee is disabled", "The employee's family", "The key employee directly", "The state"], "e": "The business is owner and beneficiary; premiums are not deductible and benefits are received tax-free."}, {"id": "hg4", "t": "Types of Policies", "q": "Group long-term disability benefits are commonly coordinated with", "o": ["Social Security disability and workers compensation benefits", "Life insurance cash values", "Homeowners insurance", "Annuity payments only"], "e": "Group LTD plans typically offset benefits by Social Security and workers compensation amounts to prevent overinsurance."}, {"id": "hg5", "t": "Types of Policies", "q": "Under an AD&D policy, the capital sum is", "o": ["A percentage of the principal sum paid for the loss of one limb or the sight of one eye", "The amount paid for accidental death", "The amount paid for illness", "The premium refund"], "e": "The principal sum is paid for death or double dismemberment; the capital sum is a portion paid for single losses."}, {"id": "hg6", "t": "Types of Policies", "q": "Basic hospital expense coverage typically pays", "o": ["Room and board and miscellaneous hospital charges up to stated limits, usually with no deductible", "All charges with no limits", "Physician office visits only", "Long-term custodial care"], "e": "Basic hospital plans provide first-dollar coverage for limited amounts and durations."}, {"id": "hg7", "t": "Types of Policies", "q": "Basic surgical expense coverage often pays surgeons' fees based on", "o": ["A surgical schedule or relative value scale", "The surgeon's full billed charge always", "A percentage of hospital room charges", "The insured's income"], "e": "Basic surgical plans use a schedule or relative value points times a conversion factor."}, {"id": "hg8", "t": "Types of Policies", "q": "Major medical insurance is characterized by", "o": ["High benefit limits, a deductible, and coinsurance", "First-dollar coverage with low limits", "Coverage only for accidents", "Fixed daily cash benefits"], "e": "Major medical covers a broad range of expenses with cost-sharing; ACA-compliant plans have no lifetime or annual dollar limits on essential health benefits."}, {"id": "hg9", "t": "Types of Policies", "q": "A supplementary major medical plan", "o": ["Covers expenses beyond those paid by a basic plan, often after a corridor deductible", "Replaces all basic coverage", "Pays only dental expenses", "Requires no cost-sharing"], "e": "Supplementary major medical sits on top of basic hospital, surgical, and medical coverage, with a corridor deductible between them."}, {"id": "hg10", "t": "Types of Policies", "q": "A comprehensive major medical plan", "o": ["Combines basic and major medical coverage into a single plan", "Covers only hospital stays", "Has no deductible", "Only covers prescription drugs"], "e": "Comprehensive major medical integrates basic and major medical in one contract with a single deductible."}, {"id": "hg11", "t": "Types of Policies", "q": "Which managed care plan requires members to choose a primary care physician who acts as a gatekeeper?", "o": ["Health Maintenance Organization (HMO)", "Preferred Provider Organization (PPO)", "Indemnity plan", "Medical savings account"], "e": "HMO members typically select a PCP who coordinates care and provides referrals to specialists."}, {"id": "hg12", "t": "Types of Policies", "q": "HMOs emphasize which approach to health care?", "o": ["Preventive care to reduce costly illness", "Unlimited choice of any provider", "Reimbursement of billed charges", "Fee-for-service only"], "e": "HMOs provide prepaid care and emphasize preventive services, with providers often paid by capitation."}, {"id": "hg13", "t": "Types of Policies", "q": "An HMO that contracts with independent physicians practicing in their own offices is a(n)", "o": ["Individual Practice Association (IPA) model", "Staff model", "Group model", "PPO"], "e": "IPA HMOs contract with independent physicians; staff model HMOs employ physicians directly."}, {"id": "hg14", "t": "Types of Policies", "q": "Under capitation, an HMO provider is paid", "o": ["A fixed amount per member per month regardless of services used", "A fee for each service", "Only when the member is hospitalized", "A percentage of billed charges"], "e": "Capitation shifts some risk to providers and encourages efficient care."}, {"id": "hg15", "t": "Types of Policies", "q": "A PPO differs from an HMO in that PPO members", "o": ["May use out-of-network providers at a higher cost and generally do not need referrals", "Must always have a gatekeeper", "Receive no benefits out of network", "Pay providers by capitation"], "e": "PPOs contract with providers at discounted fees and allow out-of-network care with higher cost-sharing."}, {"id": "hg16", "t": "Types of Policies", "q": "A Point-of-Service (POS) plan", "o": ["Combines HMO and PPO features, letting members choose at the time of service whether to stay in network", "Pays only for emergency services", "Has no primary care physician", "Is a type of disability plan"], "e": "POS members typically have a PCP gatekeeper but may go out of network for higher out-of-pocket costs."}, {"id": "hg17", "t": "Types of Policies", "q": "Funds in a health Flexible Spending Account (FSA)", "o": ["Are generally use-it-or-lose-it, subject to a limited carryover or grace period if the plan allows", "Always roll over without limit", "Belong to the employee if they change jobs", "May be invested in stocks"], "e": "FSAs are funded by pre-tax salary reduction; unused funds are generally forfeited except for plan-permitted carryover or grace periods."}, {"id": "hg18", "t": "Types of Policies", "q": "To contribute to a Health Savings Account (HSA), an individual must be covered by", "o": ["A qualified High Deductible Health Plan and have no other disqualifying coverage", "Any HMO", "Medicare Part A", "A health FSA that covers all medical costs"], "e": "HSA eligibility requires HDHP coverage, no disqualifying other coverage (such as Medicare), and not being claimed as a dependent."}, {"id": "hg19", "t": "Types of Policies", "q": "Which statement about HSAs is TRUE?", "o": ["The account is owned by the individual and is portable", "Funds are forfeited at year end", "Only employers can contribute", "Withdrawals for any purpose are always tax-free"], "e": "HSAs are individually owned, roll over, and offer tax-deductible contributions, tax-free growth, and tax-free qualified medical withdrawals."}, {"id": "hg20", "t": "Types of Policies", "q": "A nonmedical HSA withdrawal before age 65 is", "o": ["Taxable as income and subject to an additional 20% penalty", "Tax-free", "Subject only to a 10% penalty with no income tax", "Prohibited"], "e": "After age 65 (or disability), nonmedical withdrawals are taxed as income without the penalty."}, {"id": "hg21", "t": "Types of Policies", "q": "A Health Reimbursement Arrangement (HRA) is", "o": ["Funded solely by the employer to reimburse employees' qualified medical expenses", "Funded by employee salary deferrals", "Owned by the employee and fully portable", "Required to be paired with an HDHP"], "e": "HRAs are employer-funded; reimbursements are tax-free to employees, and unused amounts may carry over at the employer's discretion."}, {"id": "hg22", "t": "Types of Policies", "q": "Medicare supplement (Medigap) policies are designed to", "o": ["Fill gaps in Original Medicare, such as deductibles and coinsurance", "Replace Medicare Part A", "Provide long-term custodial care", "Cover only prescription drugs"], "e": "Med
