igap plans pay some or all of Medicare's cost-sharing; they are standardized by letter."}, {"id": "hg23", "t": "Types of Policies", "q": "Medigap Plan A, the core plan, includes coverage of", "o": ["Medicare Part A coinsurance and hospital costs for an additional 365 days after Medicare benefits are used up", "Foreign travel emergencies", "The Part B excess charge", "The Part A deductible"], "e": "All Medigap plans include the basic benefits: Part A coinsurance plus 365 extra days, Part B coinsurance, the first 3 pints of blood, and Part A hospice coinsurance."}, {"id": "hg24", "t": "Types of Policies", "q": "The Medigap open enrollment period begins", "o": ["The first month a person is 65 or older and enrolled in Medicare Part B, and lasts 6 months", "At age 62", "When the person retires", "Every January 1st"], "e": "During this 6-month period, insurers cannot deny or price based on health."}, {"id": "hg25", "t": "Types of Policies", "q": "Which Medigap plans are no longer available for purchase by people newly eligible for Medicare on or after January 1, 2020?", "o": ["Plans that cover the Part B deductible, such as C and F", "Plans A and B", "Plans K and L", "Plan G"], "e": "MACRA prohibits selling plans covering the Part B deductible (C, F, and high-deductible F) to people newly eligible on or after 1/1/2020."}, {"id": "hg26", "t": "Types of Policies", "q": "A key difference between group and individual health insurance is that group coverage", "o": ["Uses a master contract issued to the sponsor, with certificates of coverage for members", "Requires individual medical underwriting for every member", "Cannot be offered by employers", "Is always more expensive"], "e": "In group insurance the employer or sponsor is the policyowner; members receive certificates."}, {"id": "hg27", "t": "Types of Policies", "q": "Group insurance underwriting focuses on", "o": ["The characteristics of the group as a whole", "Each member's individual health history", "The producer's experience", "The members' credit scores"], "e": "Groups must be formed for reasons other than buying insurance, which controls adverse selection."}, {"id": "hg28", "t": "Types of Policies", "q": "COBRA applies to employers with at least", "o": ["20 employees", "10 employees", "50 employees", "100 employees"], "e": "Federal COBRA covers group health plans of employers with 20 or more employees; many states (including Illinois) have continuation laws for smaller groups."}, {"id": "hg29", "t": "Types of Policies", "q": "Following termination of employment (other than for gross misconduct), COBRA continuation generally lasts up to", "o": ["18 months", "36 months", "6 months", "12 months"], "e": "Qualifying events such as termination or reduced hours allow 18 months; extensions apply for disability."}, {"id": "hg30", "t": "Types of Policies", "q": "A spouse who loses group coverage because of divorce from the covered employee may continue coverage under COBRA for up to", "o": ["36 months", "18 months", "29 months", "12 months"], "e": "Divorce, death of the employee, Medicare entitlement of the employee, and loss of dependent child status allow 36 months."}, {"id": "hg31", "t": "Types of Policies", "q": "Under COBRA, the maximum premium a former employee can be charged is generally", "o": ["102% of the group rate", "100% of the group rate", "150% of the group rate", "The individual market rate"], "e": "The employer may charge up to 102% (2% admin fee), or 150% during a disability extension."}, {"id": "hg32", "t": "Types of Policies", "q": "Long-term care policies typically trigger benefits when the insured", "o": ["Cannot perform a specified number of activities of daily living (often 2 of 6) or has cognitive impairment", "Is hospitalized for any reason", "Reaches age 65", "Has a doctor's visit"], "e": "Tax-qualified LTC policies use ADL and cognitive impairment triggers."}, {"id": "hg33", "t": "Types of Policies", "q": "Which is an activity of daily living (ADL) used in long-term care policies?", "o": ["Bathing", "Driving", "Cooking", "Managing finances"], "e": "Common ADLs are bathing, dressing, eating, toileting, transferring, and continence."}, {"id": "hg34", "t": "Types of Policies", "q": "The level of long-term care that requires 24-hour care ordered by a physician and provided by licensed nurses is", "o": ["Skilled nursing care", "Custodial care", "Intermediate care", "Respite care"], "e": "Skilled care is the highest level; intermediate care is intermittent; custodial care assists with ADLs."}, {"id": "hg35", "t": "Types of Policies", "q": "Care that helps with ADLs and can be provided by persons without medical training is", "o": ["Custodial care", "Skilled care", "Intermediate care", "Acute care"], "e": "Custodial care is the most common LTC need and is generally not covered by Medicare."}, {"id": "hg36", "t": "Types of Policies", "q": "Respite care in a long-term care policy is designed to", "o": ["Give relief to an unpaid family caregiver", "Treat acute illness", "Provide hospital surgery", "Rehabilitate after an accident only"], "e": "Respite care temporarily relieves family caregivers."}, {"id": "hg37", "t": "Types of Policies", "q": "Dental insurance plans commonly classify services as", "o": ["Diagnostic/preventive, basic, and major, with different coinsurance levels", "Inpatient and outpatient only", "Medical and surgical only", "Accident and sickness only"], "e": "Preventive services are often covered at or near 100%, basic around 80%, and major around 50%."}, {"id": "hg38", "t": "Types of Policies", "q": "Vision insurance typically covers", "o": ["Routine eye exams and allowances for lenses or frames", "Cataract surgery only", "Hospital room charges", "Dental cleanings"], "e": "Vision plans cover routine eye care; eye diseases are usually covered under medical plans."}, {"id": "hg39", "t": "Types of Policies", "q": "A cancer policy is an example of a", "o": ["Specified (dread) disease policy", "Comprehensive major medical policy", "Disability buyout policy", "Medicare supplement policy"], "e": "Specified disease policies pay benefits only for the named disease and are supplemental to other coverage."}, {"id": "hg40", "t": "Types of Policies", "q": "A critical illness policy typically pays", "o": ["A lump sum upon diagnosis of a covered condition, such as heart attack, stroke, or cancer", "Only hospital room charges", "Only lost wages", "Monthly income for life"], "e": "Benefits can be used for any purpose."}, {"id": "hg41", "t": "Types of Policies", "q": "Hospital indemnity insurance pays", "o": ["A fixed amount per day of hospital confinement regardless of actual expenses", "Actual hospital charges", "Only surgical fees", "Long-term custodial care"], "e": "Hospital indemnity benefits are paid directly to the insured and supplement other coverage."}, {"id": "hg42", "t": "Types of Policies", "q": "Short-term medical insurance is designed to", "o": ["Provide temporary coverage during gaps, such as between jobs", "Replace Medicare", "Provide lifetime coverage", "Cover only dental expenses"], "e": "Short-term plans are generally medically underwritten and not required to cover ACA essential health benefits; federal and state law limit their duration."}, {"id": "hg43", "t": "Types of Policies", "q": "A limited accident-only policy", "o": ["Pays benefits for losses caused by accidents but not sickness", "Covers sickness only", "Covers all medical expenses", "Replaces major medical"], "e": "Accident-only policies exclude illness."}, {"id": "hg44", "t": "Types of Policies", "q": "Voluntary worksite insurance is typically", "o": ["Offered through the employer with employees paying the premiums, often through payroll deduction", "Paid entirely by the employer", "Available only to executives", "A form of workers compensation"], "e": "Worksite (voluntary) benefits are employee-paid and portable in many cases."}, {"id": "hg45", "t": "Types of Policies", "q": "Individual disability income policies purchased with after-tax dollars generally provide benefits that are", "o": ["Tax-free", "Fully taxable", "Taxed as capital gains", "Taxable only above $50,000"], "e": "When the individual pays premiums with after-tax money, benefits are received tax-free."}, {"id": "hg46", "t": "Types of Policies", "q": "Which disability policy is MOST appropriate for a small business owner worried about paying office rent if disabled?", "o": ["Business overhead expense", "Key employee life", "Disability buyout", "Group term life"], "e": "BOE reimburses covered business expenses during the owner's disability."}, {"id": "hg47", "t": "Types of Policies", "q": "Under the ACA, insurers may not impose which of the following on essential health benefits?", "o": ["Lifetime or annual dollar limits", "Deductibles", "Coinsurance", "Copayments"], "e": "ACA-compliant plans can use cost-sharing but cannot impose lifetime or annual dollar limits on essential health benefits."}, {"id": "hg48", "t": "Policy Provisions", "q": "Under the uniform entire contract provision for health policies, a change to the policy is valid only if", "o": ["Approved by an executive officer of the insurer and endorsed on or attached to the policy", "Approved by the producer", "Made orally by the insured", "Approved by the beneficiary"], "e": "Producers have no authority to change the policy or waive its provisions."}, {"id": "hg49", "t": "Policy Provisions", "q": "The time limit on certain defenses (incontestable) provision in a health policy means that after the specified period,", "o": ["The insurer cannot void the policy or deny a claim based on misstatements in the application, except fraudulent ones", "The insurer can contest the policy for any reason", "The insured cannot file claims", "Premiums can no longer change"], "e": "Uniform provisions allow a contest only for fraudulent misstatements after the period (the model uses 3 years; some states use 2), and preexisting conditions not excluded by name cannot be used to deny claims after that period."}, {"id": "hg50", "t": "Policy Provisions", "q": "Under the uniform grace period provision, a health policy with monthly premiums must have a grace period of at least", "o": ["10 days", "7 days", "31 days", "30 days"], "e": "Grace periods are at least 7 days for weekly premiums, 10 days for monthly, and 31 days for all others."}, {"id": "hg51", "t": "Policy Provisions", "q": "Under the uniform grace period provision, a health policy with annual or quarterly premiums must have a grace period of at least", "o": ["31 days", "10 days", "7 days", "60 days"], "e": "The 31-day grace period applies to modes other than weekly or monthly."}, {"id": "hg52", "t": "Policy Provisions", "q": "Under the reinstatement provision, if the insurer does not respond to a reinstatement application within a certain time, the policy is automatically reinstated after", "o": ["45 days", "10 days", "30 days", "90 days"], "e": "If the insurer issues a conditional receipt and does not act within 45 days, the policy is reinstated automatically."}, {"id": "hg53", "t": "Policy Provisions", "q": "After a health policy is reinstated, sickness is covered only if it begins at least", "o": ["10 days after reinstatement", "Immediately after reinstatement", "30 days after reinstatement", "45 days after reinstatement"], "e": "Accidents are covered immediately upon reinstatement; sicknesses only if they begin more than 10 days later."}, {"id": "hg54", "t": "Policy Provisions", "q": "Under the notice of claim provision, the insured should give written notice of a claim within", "o": ["20 days after the loss or as soon as reasonably possible", "60 days", "90 days", "1 year"], "e": "The 20-day notice period is the uniform standard."}, {"id": "hg55", "t": "Policy Provisions", "q": "After receiving notice of claim, the insurer must furnish claim forms within", "o": ["15 days", "20 days", "30 days", "60 days"], "e": "If forms are not furnished within 15 days, the claimant may submit proof of loss in any written form."}, {"id": "hg56", "t": "Policy Provisions", "q": "Under the proof of loss provision, proof generally must be submitted within", "o": ["90 days after the loss, and no later than 1 year unless the claimant lacks legal capacity", "20 days after the loss", "15 days after the loss", "3 years after the loss"], "e": "Late proof is accepted if it was not reasonably possible to file on time, but no later than 1 year absent legal incapacity."}, {"id": "hg57", "t": "Policy Provisions", "q": "Under the time of payment of claims provision, benefits other than periodic payments must be paid", "o": ["Immediately upon receipt of due written proof of loss", "Within 6 months", "Only after a lawsuit", "Within 1 year"], "e": "Periodic payments such as disability income must be paid at least monthly."}, {"id": "hg58", "t": "Policy Provisions", "q": "Under the payment of claims provision, death benefits are paid to", "o": ["The named beneficiary, or the insured's estate if no beneficiary is named", "The insured's employer", "The producer", "The state"], "e": "All other benefits are paid to the insured."}, {"id": "hg59", "t": "Policy Provisions", "q": "The physical examination and autopsy provision allows the insurer to", "o": ["Examine the insured at its own expense while a claim is pending and perform an autopsy where not prohibited by law", "Require the insured to pay for exams", "Examine the insured only before the policy is issued", "Deny claims without examination"], "e": "Exams and autopsies are at the insurer's expense."}, {"id": "hg60", "t": "Policy Provisions", "q": "Under the legal actions provision, an insured may not sue the insurer until", "o": ["60 days after proof of loss has been furnished", "10 days after the loss", "1 year after the loss", "The policy expires"], "e": "Suits are also barred after 3 years (in the model provision) from the time proof of loss is required."}, {"id": "hg61", "t": "Policy Provisions", "q": "Under the change of beneficiary provision, unless the beneficiary designation is irrevocable,", "o": ["The policyowner may change the beneficiary without the beneficiary's consent", "The beneficiary must consent to any change", "Only the insurer may change the beneficiary", "No changes are allowed"], "e": "A revocable beneficiary may be changed by the owner at any time."}, {"id": "hg62", "t": "Policy Provisions", "q": "An insured misstated her age as younger than her true age. Under the misstatement of age provision, the insurer will", "o": ["Adjust benefits to what the premium paid would have purchased at the correct age", "Cancel the policy", "Pay full benefits", "Refund all premiums"], "e": "This adjustment applies regardless of the time limit on certain defenses."}, {"id": "hg63", "t": "Policy Provisions", "q": "Under the change of occupation provision, if an insured changes to a more hazardous occupation and does not tell the insurer,", "o": ["Benefits are reduced to what the premium would have purchased at the more hazardous classification", "The policy is void", "Benefits are doubled", "There is no effect on benefits"], "e": "If the insured moves to a less hazardous job, the insurer refunds excess premium upon notice."}, {"id": "hg64", "t": "Policy Provisions", "q": "The illegal occupation provision allows the insurer to deny a claim when", "o": ["The loss results from the insured committing or attempting a felony or engaging in an illegal occupation", "The insured works two jobs", "The insured is self-employed", "The insured changes jobs"], "e": "Losses that are a consequence of illegal activities are not covered."}, {"id": "hg65", "t": "Policy Provisions", "q": "The relation of earnings to insurance provision in a disability policy allows the insurer to", "o": ["Reduce benefits if total disability benefits from all valid coverage exceed the insured's earnings at disability", "Increase benefits with inflation", "Cancel the policy if earnings fall", "Require proof of earnings each year"], "e": "This optional provision limits overinsurance; affected premiums are refunded."}, {"id": "hg66", "t": "Policy Provisions", "q": "A free look provision in a health policy allows the insured to", "o": ["Return the policy within a specified period after delivery for a full refund of premium", "Skip a premium payment", "Change insurers without penalty at any time", "Contest a denied claim"], "e": "Free look periods (commonly 10 days for individual health policies) begin at delivery."}, {"id": "hg67", "t": "Policy Provisions", "q": "A probationary period in a health policy is", "o": ["A period after the policy's effective date during which sickness is not covered", "The waiting period before disability benefits begin for each claim", "The grace period", "The contestable period"], "e": "Probationary periods apply once at policy issue and typically exclude illness (not accidents)."}, {"id": "hg68", "t": "Policy Provisions", "q": "The elimination period in a disability income policy is", "o": ["The number of days of disability that must pass before benefits begin", "The period during which the policy can be returned", "The maximum benefit period", "The time limit for filing a claim"], "e": "A longer elimination period lowers the premium; it acts like a time deductible."}, {"id": "hg69", "t": "Policy Provisions", "q": "Waiver of premium in a disability income policy usually", "o": ["Waives premiums after the insured has been totally disabled for a specified period, such as 90 days", "Waives premiums as soon as disability begins", "Refunds all premiums at retirement", "Applies only to accidental injuries"], "e": "Waiver of premium typically applies after 90 days (or the elimination period) of total disability, often retroactively."}, {"id": "hg70", "t": "Policy Provisions", "q": "Which exclusion is common in individual health and disability policies?", "o": ["Intentionally self-inflicted injuries", "Accidental injuries at home", "Treatment by a licensed physician", "Emergency room care"], "e": "Common exclusions include self-inflicted injuries, war, military service, and certain elective procedures."}, {"id": "hg71", "t": "Policy Provisions", "q": "Under the ACA, individual and group major medical plans", "o": ["May not exclude or charge more for preexisting conditions", "May impose a 12-month preexisting condition exclusion", "May deny coverage based on health status", "Must exclude mental health care"], "e": "Preexisting condition exclusions are prohibited for ACA-compliant plans; some supplemental and excepted benefits policies may still use them."}, {"id": "hg72", "t": "Policy Provisions", "q": "A plan pays 80% of covered expenses after the deductible and the insured pays 20%. The 20% is the insured's", "o": ["Coinsurance", "Copayment", "Deductible", "Premium"], "e": "Coinsurance is percentage cost-sharing, usually up to an out-of-pocket maximum."}, {"id": "hg73", "t": "Policy Provisions", "q": "An insured has a $1,000 deductible and 80/20 coinsurance. For a covered $6,000 claim (out-of-pocket maximum not reached), how much does the insurer pay?", "o": ["$4,000", "$4,800", "$5,000", "$5,200"], "e": "After the $1,000 deductible, the insurer pays 80% of $5,000 = $4,000; the insured pays $1,000 + $1,000 = $2,000."}, {"id": "hg74", "t": "Policy Provisions", "q": "A deductible is", "o": ["The amount the insured must pay before the insurer begins paying benefits", "A percentage of each claim shared with the insurer", "A flat fee for each office visit", "The maximum the insurer pays"], "e": "Deductibles may be per person, per family, per cause, or per calendar year."}, {"id": "hg75", "t": "Policy Provisions", "q": "A corridor deductible applies", "o": ["Between the basic plan's benefits and the start of supplementary major medical benefits", "Only to prescription drugs", "To each office visit", "Only to dental care"], "e": "The corridor deductible sits between the basic coverage and the major medical layer."}, {"id": "hg76", "t": "Policy Provisions", "q": "Eligible expenses under a health policy are", "o": ["Medically necessary services that the policy covers", "Any expense the insured incurs", "Only hospital room charges", "Expenses approved by the producer"], "e": "Charges not covered or not medically necessary are ineligible."}, {"id": "hg77", "t": "Policy Provisions", "q": "A copayment is", "o": ["A flat dollar amount the insured pays for a specific service, such as an office visit", "A percentage of each bill", "An annual deductible", "The premium contribution"], "e": "Copays are common in HMOs and PPOs."}, {"id": "hg78", "t": "Policy Provisions", "q": "A requirement that the insurer approve certain nonemergency procedures in advance is called", "o": ["Preauthorization (prior approval)", "Second surgical opinion", "Concurrent review", "Subrogation"], "e": "Preauthorization (precertification) is a cost-containment tool; failure to obtain it may reduce benefits."}, {"id": "hg79", "t": "Policy Provisions", "q": "Usual, reasonable, and customary (URC) charges are", "o": ["The amounts typically charged for a service by providers in a geographic area", "The maximum the provider may legally bill", "The insured's deductible", "A flat fee schedule set by Medicare only"], "e": "Charges above URC may be the insured's responsibility for out-of-network care."}, {"id": "hg80", "t": "Policy Provisions", "q": "An impairment (exclusion) rider", "o": ["Excludes coverage for a specific condition the applicant has", "Adds coverage for a specific illness", "Increases benefits annually", "Waives premiums"], "e": "Impairment riders allow a policy to be issued while excluding a known condition (in policies where permitted)."}, {"id": "hg81", "t": "Policy Provisions", "q": "The guaranteed insurability rider on a disability income policy allows the insured to", "o": ["Buy additional disability coverage at specified times without proving medical insurability", "Convert to life insurance", "Receive a lump sum at retirement", "Have benefits increased automatically for inflation"], "e": "The insured must usually show financial need (increased income), but not medical insurability."}, {"id": "hg82", "t": "Policy Provisions", "q": "A future increase option on a disability policy allows the insured to", "o": ["Increase the monthly benefit as income grows, without evidence of medical insurability", "Lengthen the elimination period", "Decrease premiums", "Add a spouse"], "e": "Increases require financial justification but no medical underwriting."}, {"id": "hg83", "t": "Policy Provisions", "q": "A noncancelable health policy means the insurer", "o": ["Cannot cancel the policy or increase premiums above those stated, as long as premiums are paid, to a specified age", "Can increase premiums by class", "Can cancel at any renewal", "Can cancel at any time with notice"], "e": "Noncancelable is the strongest renewability provision and the most expensive."}, {"id": "hg84", "t": "Policy Provisions", "q": "A guaranteed renewable health policy", "o": ["Must be renewed to a specified age, but premiums may be increased for an entire class", "Can never have premium increases", "May be canceled at renewal", "May be canceled at any time"], "e": "Insurers cannot single out an individual for rate increases on a guaranteed renewable policy."}, {"id": "hg85", "t": "Policy Provisions", "q": "A cancelable health policy allows the insurer to", "o": ["Cancel the policy at any time with proper written notice and refund unearned premium", "Never cancel the policy", "Cancel only at age 65", "Cancel only for fraud"], "e": "Cancellation does not affect claims for losses that occurred before the cancellation date."}, {"id": "hg86", "t": "Policy Provisions", "q": "An optionally renewable health policy", "o": ["May be renewed or not at the insurer's option on the anniversary date", "Must be renewed for life", "Is renewable only at the insured's option", "Is noncancelable"], "e": "The insurer may decline to renew on the policy anniversary or premium due date."}, {"id": "hg87", "t": "Policy Provisions", "q": "Which renewability provision is generally the MOST expensive for the insured?", "o": ["Noncancelable", "Guaranteed renewable", "Conditionally renewable", "Optionally renewable"], "e": "Because both coverage and premiums are guaranteed, noncancelable coverage costs the most."}, {"id": "hg88", "t": "Policy Provisions", "q": "A health insurance policy's consideration clause specifies", "o": ["That the premium and the application are the insured's consideration", "The benefits the insurer will pay", "The beneficiary", "The waiting period"], "e": "The insurer's consideration is its promise to pay covered losses."}, {"id": "hg89", "t": "Policy Provisions", "q": "The insuring clause in a health policy", "o": ["States the insurer's promise to pay benefits for covered losses", "Lists all exclusions", "Describes premium modes", "States who may change beneficiaries"], "e": "The insuring clause identifies the parties and the scope of coverage."}, {"id": "hg90", "t": "Policy Provisions", "q": "A lifetime maximum benefit limit on non-essential benefits is", "o": ["The most a policy will pay over the insured's lifetime for that coverage", "The insured's out-of-pocket maximum", "The annual deductible", "The amount of the first claim"], "e": "Under the ACA, lifetime and annual dollar limits are prohibited only for essential health benefits; other coverages may still have limits."}, {"id": "hg91", "t": "Policy Provisions", "q": "A per cause maximum limits", "o": ["The amount paid for each separate illness or injury", "The total premiums that may be charged", "Payments per family member per year", "Coinsurance amounts"], "e": "Per cause limits apply separately to each illness or injury."}, {"id": "hg92", "t": "Policy Provisions", "q": "Which uniform provision is OPTIONAL rather than mandatory?", "o": ["Change of occupation", "Notice of claim", "Grace period", "Entire contract"], "e": "Mandatory provisions include entire contract, time limit on certain defenses, grace period, reinstatement, notice of claim, claim forms, proof of loss, time of payment, payment of claims, physical exam and autopsy, legal actions, and change of beneficiary."}, {"id": "hg93", "t": "Policy Provisions", "q": "A cancelable policy is canceled by the insurer. Claims for losses that occurred before cancellation are", "o": ["Still covered", "Denied", "Paid at 50%", "Refunded as premium"], "e": "Cancellation is prospective only."}, {"id": "hg94", "t": "Social Insurance", "q": "Medicare Part A primarily covers", "o": ["Inpatient hospital care, skilled nursing facility care after a hospital stay, hospice, and some home health care", "Physician office visits", "Outpatient prescription drugs", "Routine dental care"], "e": "Part A is hospital insurance; most people pay no premium because they or a spouse paid Medicare taxes for at least 40 quarters."}, {"id": "hg95", "t": "Social Insurance", "q": "Medicare Part B primarily covers", "o": ["Physician services, outpatient care, and durable medical equipment", "Inpatient hospital stays", "Long-term custodial care", "Outpatient prescription drugs only"], "e": "Part B is voluntary medical insurance with a monthly premium, an annual deductible, and generally 20% coinsurance."}, {"id": "hg96", "t": "Social Insurance", "q": "Medicare Part C refers to", "o": ["Medicare Advantage plans offered by private insurers", "Prescription drug coverage only", "Medicaid", "Medigap Plan C"], "e": "Medicare Advantage plans (HMOs, PPOs, and others) replace Original Medicare Parts A and B and often include Part D drug coverage."}, {"id": "hg97", "t": "Social Insurance", "q": "Medicare Part D provides", "o": ["Prescription drug coverage through private plans", "Hospital coverage", "Physician coverage", "Long-term care"], "e": "Part D is offered by private insurers approved by Medicare, as stand-alone plans or within Medicare Advantage."}, {"id": "hg98", "t": "Social Insurance", "q": "Medicare is generally available to people who are", "o": ["Age 65 or older, disabled and receiving Social Security disability benefits for 24 months, or have end-stage renal disease or ALS", "Of any age with low income", "Under 65 with any chronic condition", "Only retired federal employees"], "e": "Medicaid, not Medicare, is based on financial need."}, {"id": "hg99", "t": "Social Insurance", "q": "Medicare covers skilled nursing facility care only if", "o": ["It follows a qualifying inpatient hospital stay of at least 3 days and is skilled care", "The insured needs custodial care", "The insured is under 65", "It lasts more than one year"], "e": "Medicare covers up to 100 days per benefit period (days 21-100 with a daily copay) and does not cover custodial care."}, {"id": "hg100", "t": "Social Insurance", "q": "Which expense is NOT covered by Original Medicare?", "o": ["Long-term custodial care", "Inpatient hospital care", "Physician services", "Hospice care"], "e": "Medicare excludes custodial care, routine dental and vision care, and most care outside the U.S."}, {"id": "hg101", "t": "Social Insurance", "q": "Medicaid is", "o": ["A joint federal and state program providing health coverage to people with limited income and resources", "A federal program for everyone 65 and older", "A private insurance plan", "A Social Security retirement benefit"], "e": "Medicaid eligibility is need-based; in Illinois it is administered by the Department of Healthcare and Family Services."}, {"id": "hg102", "t": "Social Insurance", "q": "Medicaid is an important source of payment for", "o": ["Long-term nursing home care for people who meet financial eligibility rules", "Routine care for high-income retirees", "Care outside the United States", "Cosmetic surgery"], "e": "Many people spend down assets to qualify for Medicaid nursing home coverage."}, {"id": "hg103", "t": "Social Insurance", "q": "Social Security disability benefits begin after a waiting period of", "o": ["5 full months of disability", "30 days", "90 days", "12 months"], "e": "The disability must also be expected to last at least 12 months or result in death."}, {"id": "hg104", "t": "Social Insurance", "q": "Social Security defines disability as the inability to", "o": ["Engage in any substantial gainful activity because of a medically determinable impairment", "Perform one's own occupation", "Work full time in one's own occupation for 30 days", "Perform 2 activities of daily living"], "e": "This \"any occupation\" definition is stricter than most private policy definitions."}, {"id": "hg105", "t": "Social Insurance", "q": "Original Medicare Part B generally pays what percentage of approved charges after the deductible?", "o": ["80%", "50%", "100%", "70%"], "e": "The beneficiary pays 20% coinsurance, which Medigap may cover."}, {"id": "hg106", "t": "Social Insurance", "q": "A person who receives Social Security disability benefits becomes eligible for Medicare after", "o": ["24 months of disability benefits", "5 months", "12 months", "36 months"], "e": "Medicare eligibility begins after 24 months of SSDI entitlement (immediately for ALS)."}, {"id": "hg107", "t": "Social Insurance", "q": "Medicare Part A hospital benefits are measured by", "o": ["Benefit periods, which begin at admission and end after 60 consecutive days out of the hospital or SNF", "Calendar years only", "Policy years", "Lifetime only"], "e": "A new Part A deductible applies to each benefit period."}, {"id": "hg108", "t": "Social Insurance", "q": "Which entity administers the Medicare program?", "o": ["The Centers for Medicare & Medicaid Services (CMS)", "The Social Security Administration alone", "State insurance departments", "Private insurers only"], "e": "CMS administers Medicare; SSA handles enrollment for many beneficiaries."}, {"id": "hg109", "t": "Social Insurance", "q": "A person may be enrolled in both Medicare and Medicaid. Such a person is called", "o": ["Dual eligible", "Fully insured", "Currently insured", "Retired eligible"], "e": "For dual eligibles, Medicaid may pay Medicare premiums and cost-sharing."}, {"id": "hg110", "t": "Social Insurance", "q": "Social Security disability benefits are funded by", "o": ["Payroll taxes (FICA) paid by employees and employers", "General state revenues", "Private insurer premiums", "Medicaid funds"], "e": "OASDI benefits are funded by FICA and self-employment taxes."}, {"id": "hg111", "t": "Social Insurance", "q": "Which Social Security benefit category provides monthly benefits to the family of a deceased worker?", "o": ["Survivor benefits", "Retirement benefits", "Supplemental Security Income", "Medicare Part A"], "e": "Survivor benefits may go to a widow(er), children, and dependent parents."}, {"id": "hg112", "t": "Other Insurance Concepts", "q": "Total disability under an \"own occupation\" definition means the insured", "o": ["Cannot perform the main duties of his or her own occupation", "Cannot work in any occupation", "Is hospitalized", "Can work only part-time"], "e": "Own-occupation is the most liberal definition; \"any occupation\" is the strictest."}, {"id": "hg113", "t": "Other Insurance Concepts", "q": "Residual disability benefits pay", "o": ["A proportionate benefit based on loss of income when the insured returns to work at reduced earnings", "The full benefit only when totally disabled", "A lump sum for dismemberment", "Medical expenses during disability"], "e": "Residual benefits are based on percentage of income lost."}, {"id": "hg114", "t": "Other Insurance Concepts", "q": "Partial disability benefits are typically paid", "o": ["When the insured cannot perform some of his or her duties, often at 50% of the total disability benefit for a limited time", "Only for life", "Only for total disability", "As a lump sum"], "e": "Partial disability usually must follow a period of total disability."}, {"id": "hg115", "t": "Other Insurance Concepts", "q": "A recurrent disability provision treats a recurrence of the same disability within a specified time (often 6 months) as", "o": ["A continuation of the prior disability, so no new elimination period applies", "A new claim requiring a new elimination period", "An excluded loss", "A partial disability"], "e": "This protects the insured from having to satisfy a second elimination period."}, {"id": "hg116", "t": "Other Insurance Concepts", "q": "Presumptive disability provisions typically provide total disability benefits for", "o": ["Loss of sight, hearing, speech, or the use of two limbs, regardless of the ability to work", "Any illness lasting 30 days", "Back strain", "Any hospital stay"], "e": "Presumptive disability is automatic for specified severe losses."}, {"id": "hg117", "t": "Other Insurance Concepts", "q": "Most individual and group health plans must allow dependent children to stay on a parent's plan until age", "o": ["26", "19", "21", "23"], "e": "The ACA requires coverage of dependent children up to age 26, regardless of student or marital status."}, {"id": "hg118", "t": "Other Insurance Concepts", "q": "Newborn children are generally covered under a parent's health policy", "o": ["From the moment of birth, with notice and any required premium within a set period", "After 90 days", "Only if born healthy", "Only after a new application is approved"], "e": "Newborn coverage begins at birth; the insurer may require notice (commonly within 31 days) to continue coverage."}, {"id": "hg119", "t": "Other Insurance Concepts", "q": "A coordination of benefits provision is designed to", "o": ["Prevent an insured from receiving more than 100% of covered expenses when covered by more than one group plan", "Increase benefits when two plans exist", "Eliminate deductibles", "Allow duplicate payment"], "e": "COB determines which plan is primary and which is secondary."}, {"id": "hg120", "t": "Other Insurance Concepts", "q": "Under typical coordination of benefits rules, when a person is covered as an employee under one group plan and as a dependent under a spouse's plan,", "o": ["The plan covering the person as an employee is primary", "The spouse's plan is primary", "Both plans pay 100%", "The newest plan is primary"], "e": "For dependent children of married parents, the birthday rule usually applies."}, {"id": "hg121", "t": "Other Insurance Concepts", "q": "Under the birthday rule, a child's primary plan is", "o": ["The plan of the parent whose birthday falls earlier in the calendar year", "The plan of the older parent", "The father's plan", "The plan with lower premiums"], "e": "Only month and day matter, not the year of birth."}, {"id": "hg122", "t": "Other Insurance Concepts", "q": "An occupational policy covers", "o": ["Losses whether they occur on or off the job", "Only off-the-job injuries", "Only injuries covered by workers compensation", "Only illnesses"], "e": "Nonoccupational policies cover only off-the-job losses because workers compensation covers on-the-job injuries."}, {"id": "hg123", "t": "Other Insurance Concepts", "q": "Workers compensation provides", "o": ["Benefits for job-related injuries and illnesses, including medical care and lost wages, regardless of fault", "Coverage for off-the-job injuries", "Group life insurance", "Retirement income"], "e": "Workers compensation is a no-fault system mandated by state law."}, {"id": "hg124", "t": "Other Insurance Concepts", "q": "Subrogation allows an insurer that has paid a claim to", "o": ["Recover from a negligent third party who caused the loss", "Cancel the policy", "Raise the insured's premiums", "Deny future claims"], "e": "The insured transfers the right of recovery to the insurer to the extent of the claim paid, preventing double recovery."}, {"id": "hg125", "t": "Other Insurance Concepts", "q": "Premiums paid by an individual for personal disability income insurance are", "o": ["Not deductible, and benefits are received tax-free", "Deductible, and benefits are taxable", "Deductible, and benefits are tax-free", "Not deductible, and benefits are taxable"], "e": "Tax treatment follows who pays the premium and how."}, {"id": "hg126", "t": "Other Insurance Concepts", "q": "When an employer pays the full premium for group disability income coverage and deducts it as a business expense, benefits received by employees are", "o": ["Taxable income to the employee", "Tax-free to the employee", "Taxed as capital gains", "Taxable only to the employer"], "e": "Employer-paid, deductible premiums make benefits taxable; the portion attributable to employee after-tax contributions is tax-free."}, {"id": "hg127", "t": "Other Insurance Concepts", "q": "Medical expense benefits received from an individual health insurance policy are generally", "o": ["Not taxable to the insured", "Taxable as income", "Taxed as capital gains", "Taxable above $50,000"], "e": "Reimbursements for medical expenses are excluded from income."}, {"id": "hg128", "t": "Other Insurance Concepts", "q": "Employer contributions to employee group medical insurance are generally", "o": ["Deductible to the employer and not taxable to the employee", "Taxable to the employee", "Not deductible to the employer", "Taxed as dividends"], "e": "Employer-provided health coverage is a tax-favored fringe benefit."}, {"id": "hg129", "t": "Other Insurance Concepts", "q": "Business overhead expense premiums are", "o": ["Deductible to the business, and benefits are taxable", "Not deductible, and benefits are tax-free", "Deductible, and benefits are tax-free", "Not deductible, and benefits are taxable"], "e": "BOE is treated like other business expenses."}, {"id": "hg130", "t": "Other Insurance Concepts", "q": "Which is a cost containment technique used by health insurers?", "o": ["Second surgical opinions and utilization review", "Increasing lifetime maximums", "Eliminating deductibles", "Paying all billed charges"], "e": "Others include precertification, case management, outpatient surgery incentives, and concurrent review."}, {"id": "hg131", "t": "Other Insurance Concepts", "q": "Managed care plans control costs primarily by", "o": ["Using provider networks, utilization management, and preventive care", "Paying any provider's full charges", "Eliminating cost-sharing", "Covering all elective procedures"], "e": "Managed care integrates financing and delivery of care."}, {"id": "hg132", "t": "Other Insurance Concepts", "q": "Case management in health insurance involves", "o": ["Coordinating care for a patient with a catastrophic or high-cost condition", "Selling multiple policies to one client", "Auditing producer files", "Underwriting a group"], "e": "Case managers seek the most effective and economical treatment options."}, {"id": "hg133", "t": "Other Insurance Concepts", "q": "The owner of an individual health policy has the right to", "o": ["Name and change beneficiaries, and receive policy benefits as provided", "Change the policy's provisions unilaterally", "Set premium rates", "Waive the insurer's exclusions"], "e": "Owner's rights in health policies mirror those in life policies."}, {"id": "hg134", "t": "Field Underwriting", "q": "The producer's role in field underwriting includes", "o": ["Completing the application accurately and reporting any information relevant to the risk", "Approving the application", "Setting the premium", "Issuing the policy"], "e": "The producer is the insurer's first underwriter."}, {"id": "hg135", "t": "Field Underwriting", "q": "If the producer collects the initial premium with a health application, the producer should", "o": ["Issue a conditional receipt to the applicant", "Hold the payment until the policy is issued", "Deposit it into a personal account", "Waive the medical questions"], "e": "The receipt explains when coverage may begin."}, {"id": "hg136", "t": "Field Underwriting", "q": "Health insurance applicants must be informed of the use of the Medical Information Bureau because", "o": ["Federal law and MIB rules require notice of information sharing and access rights", "MIB is a public database", "It replaces underwriting", "It guarantees coverage"], "e": "Applicants can request their MIB report and dispute errors."}, {"id": "hg137", "t": "Field Underwriting", "q": "Under the Fair Credit Reporting Act, consumer reporting agencies generally may not report most adverse information older than", "o": ["7 years (10 years for bankruptcies)", "1 year", "3 years", "20 years"], "e": "Exceptions exist for certain large transactions."}, {"id": "hg138", "t": "Field Underwriting", "q": "Under HIPAA, group health plans", "o": ["Cannot discriminate in eligibility or premiums based on health status factors", "Can deny coverage for preexisting conditions without limit", "May sell members' data freely", "Need not provide privacy notices"], "e": "HIPAA also provides portability protections and privacy rules."}, {"id": "hg139", "t": "Field Underwriting", "q": "After the producer submits the application and premium, the policy is delivered. The producer should then", "o": ["Explain the policy, including riders, exclusions, and any ratings, and obtain any required delivery receipts", "Leave the policy in the mailbox", "Change the benefits as needed", "Collect a delivery fee"], "e": "Explaining the policy at delivery reduces misunderstandings."}, {"id": "hg140", "t": "Field Underwriting", "q": "If a policy is issued with an exclusion rider, the policy is considered", "o": ["A counteroffer that must be accepted by the applicant", "An acceptance of the applicant's offer", "Void", "Binding without signature"], "e": "The applicant may accept or reject the modified policy."}, {"id": "hg141", "t": "Field Underwriting", "q": "Which is NOT a source of insurability information used in health underwriting?", "o": ["The applicant's political affiliation", "The application", "The Medical Information Bureau", "An attending physician's statement"], "e": "Common sources include the application, medical exams, APS, MIB, inspection reports, and prescription histories."}, {"id": "hg142", "t": "Field Underwriting", "q": "An inspection report used in underwriting typically includes", "o": ["Information about the applicant's finances, character, habits, and lifestyle", "Only the applicant's medical records", "Only the producer's opinion", "Political views"], "e": "Inspection reports are consumer reports subject to the FCRA."}, {"id": "hg143", "t": "Field Underwriting", "q": "When replacing an existing health policy, a producer should", "o": ["Make sure the new coverage is approved before advising the client to cancel the old policy", "Cancel the old policy immediately", "Tell the client preexisting conditions are always covered", "Avoid discussing differences between policies"], "e": "Replacement can create gaps, new waiting periods, or new exclusions; the client must not be left uncovered."}, {"id": "hg144", "t": "Field Underwriting", "q": "An applicant answers \"no\" to a health question but the producer knows the answer is \"yes.\" The producer should", "o": ["Ensure the correct information is recorded and disclosed to the insurer", "Leave the answer as stated", "Change the answer later without telling the applicant", "Advise the applicant to omit it"], "e": "Knowingly submitting false information is fraud."}, {"id": "hg145", "t": "Field Underwriting", "q": "Which element of a valid contract requires that the purpose of the agreement not be against public policy?", "o": ["Legal purpose", "Consideration", "Offer and acceptance", "Competent parties"], "e": "A contract to insure an illegal activity is void."}, {"id": "hg146", "t": "Field Underwriting", "q": "For insurable interest in health insurance, a valid example is", "o": ["An employer insuring a key employee's disability", "A stranger insuring another person's health", "A neighbor buying a policy on another neighbor", "An investor insuring a celebrity"], "e": "Insurable interest must exist at the time of application."}, {"id": "hg147", "t": "Field Underwriting", "q": "A health insurance contract is aleatory, which means", "o": ["There is an exchange of unequal values depending on uncertain events", "Both parties exchange equal value", "Only the insured drafts the contract", "The contract can be altered by the producer"], "e": "A small premium may produce a large claim, or no claim at all."}, {"id": "hg148", "t": "Field Underwriting", "q": "Under a contract of adhesion, ambiguities in the policy are resolved", "o": ["In favor of the insured", "In favor of the insurer", "By the producer", "By splitting the difference"], "e": "The insurer wrote the contract, so ambiguities are construed against it."}, {"id": "hg149", "t": "Field Underwriting", "q": "Statements on a health insurance application are generally considered", "o": ["Representations, which must be true to the best of the applicant's knowledge", "Warranties, which must be literally true", "Irrelevant to the contract", "Conditions precedent only"], "e": "Only material misrepresentations allow rescission (within the contestable limits)."}, {"id": "hg150", "t": "Field Underwriting", "q": "If a producer fails to have the applicant sign a health application, the insurer will", "o": ["Return the application for signature before issuing the policy", "Issue the policy anyway", "Sign on the applicant's behalf", "Treat the producer as the insured"], "e": "The applicant must sign and date the application, and the producer must not sign for the applicant."}, {"id": "hg151", "t": "Field Underwriting", "q": "A producer submits an application without the initial premium. The policy is later approved. At delivery, the producer should", "o": ["Collect the premium and obtain a statement of good health", "Deliver the policy and collect later", "Date the policy back", "Waive the premium"], "e": "Coverage begins on payment, typically with a statement of continued good health."}, {"id": "hg152", "t": "Field Underwriting", "q": "An insurer's privacy notice under GLBA must describe", "o": ["The categories of nonpublic personal information collected and with whom it may be shared", "The insurer's investment portfolio", "Producer commission rates", "Underwriting guidelines in full"], "e": "GLBA requires notices and opt-out rights for certain sharing."}, {"id": "hg153", "t": "Field Underwriting", "q": "A buyer's guide and outline of coverage for Medicare supplement policies must be given to an applicant", "o": ["At the time of application", "Only after the policy is issued", "Only upon request", "One year after purchase"], "e": "Medigap rules require delivery of the outline of coverage and the Guide to Health Insurance for People with Medicare at application."}, {"id": "hg154", "t": "Field Underwriting", "q": "Which of the following is a common underwriting consideration for disability income coverage?", "o": ["The applicant's occupation and earned income", "The applicant's favorite sports team", "The applicant's credit card brand", "The applicant's car color"], "e": "Occupation class and income determine eligibility and benefit amounts."}, {"id": "hg155", "t": "Field Underwriting", "q": "The primary purpose of underwriting is to", "o": ["Select risks and classify them so premiums match the risk", "Maximize commissions", "Deny as many applicants as possible", "Comply with Medicare rules"], "e": "Underwriting protects against adverse selection."}, {"id": "hg156", "t": "Field Underwriting", "q": "A producer delivers a health policy and the client asks how the deductible and coinsurance work. The producer should", "o": ["Explain the cost-sharing provisions clearly and accurately", "Tell the client to read the policy later", "Say everything is covered", "Promise to pay any amounts not covered"], "e": "Accurate explanation at delivery is part of the producer's duty."}]}, "ls": {"name": "Life - Illinois State", "exam": {"n": 36, "scored": 31, "min": 50}, "topics": [{"name": "Insurance Director", "w": 1.5}, {"name": "License and Registration", "w": 9.5}, {"name": "Continuing Education", "w": 2}, {"name": "Fiduciary Responsibilities", "w": 2}, {"name": "Commissions and Compensation", "w": 0.5}, {"name": "Disclosure", "w": 0.5}, {"name": "Marketing Practices", "w": 4}, {"name": "Unfair Claims Practices", "w": 2}, {"name": "Replacement", "w": 1.5}, {"name": "Life Solicitation", "w": 1.5}, {"name": "Policy Provisions", "w": 1}, {"name": "Illustrations", "w": 1.5}, {"name": "Accelerated Benefits", "w": 0.5}, {"name": "Viatical Settlements", "w": 0.5}, {"name": "Guaranty Association", "w": 0.5}, {"name": "Advertising and Sales", "w": 2}], "qs": [{"id": "ls0", "t": "Insurance Director", "q": "The chief insurance regulator in Illinois is the", "o": ["Director of Insurance", "Insurance Commissioner elected by voters", "Attorney General", "Secretary of State"], "e": "Illinois uses the title Director, heading the Department of Insurance; the Director enforces the Insurance Code and may adopt reasonable rules (215 ILCS 5/401)."}, {"id": "ls1", "t": "Insurance Director", "q": "Under the Illinois Insurance Code, the Director may examine", "o": ["Any applicant for or holder of a producer license, and any business entity", "Only insurance companies", "Only nonresident producers", "Only producers who request it"], "e": "215 ILCS 5/500-110(a) allows examination of applicants, producers, limited line and temporary producers, and business entities."}, {"id": "ls2", "t": "Insurance Director", "q": "A producer who is examined by the Director and receives a report alleging violations may request a hearing within", "o": ["14 calendar days after receiving the report", "30 days", "60 days", "10 working days"], "e": "Under 5/500-110(e), the request must be in writing with a statement of objections, within 14 calendar days."}, {"id": "ls3", "t": "Insurance Director", "q": "After a regulatory examination report on a producer is filed (and no hearing is held), the Director must issue a written order within", "o": ["90 days", "30 days", "14 days", "1 year"], "e": "5/500-110(e): within 90 days after the report is filed, or within 90 days after the hearing if one is held."}, {"id": "ls4", "t": "Insurance Director", "q": "A person who violates a written order issued after a producer examination may be subject to a civil penalty of up to", "o": ["$20,000", "$1,000", "$5,000", "$100,000"], "e": "5/500-110(g) also allows suspension or revocation under 5/500-70."}, {"id": "ls5", "t": "Insurance Director", "q": "During a regulatory examination, a producer must give the Director's examiners", "o": ["Convenient and free access to books and records at reasonable hours", "Access only with a court order", "Copies only by mail after 60 days", "Only financial statements prepared by a CPA"], "e": "5/500-110(b) requires convenient and free access to all books, records, and papers relating to the insurance business."}, {"id": "ls6", "t": "License and Registration", "q": "To be issued a resident Illinois producer license, an individual must be at least", "o": ["18 years old", "21 years old", "16 years old", "19 years old"], "e": "5/500-30(a)(1)."}, {"id": "ls7", "t": "License and Registration", "q": "The minimum Illinois pre-licensing education requirement for the Life line of authority is", "o": ["20 hours, with 7.5 hours in a classroom or webinar setting", "40 hours of self-study", "12.5 hours", "24 hours, all online"], "e": "5/500-30(b) sets 20 hours each for Life and A&H, with 7.5 hours of each course classroom or webinar."}, {"id": "ls8", "t": "License and Registration", "q": "An Illinois resident producer license is issued for a term of", "o": ["2 years", "1 year", "3 years", "4 years"], "e": "5/500-35(a) issues a 2-year license, renewable as long as the fee is paid and CE is met."}, {"id": "ls9", "t": "License and Registration", "q": "The Illinois license fee for a resident individual producer is", "o": ["$215 every 2 years", "$380 every 2 years", "$150 every year", "$50 every year"], "e": "5/500-135(a)(1): $215 for residents and $380 for nonresidents, payable once every 2 years."}, {"id": "ls10", "t": "License and Registration", "q": "The Illinois license fee for a nonresident individual producer is", "o": ["$380 every 2 years", "$215 every 2 years", "$150 every 2 years", "$50 per year"], "e": "5/500-135(a)(1)."}, {"id": "ls11", "t": "License and Registration", "q": "The Illinois fee for a business entity producer license is", "o": ["$150 every 2 years", "$215 every 2 years", "$380 every 2 years", "$50 annually"], "e": "5/500-135(a)(3)."}, {"id": "ls12", "t": "License and Registration", "q": "The statutory Illinois application fee for processing a request to take a producer licensing exam is", "o": ["$50", "$25", "$100", "$215"], "e": "5/500-135(a)(5) sets a $50 application fee (Pearson VUE's own exam fee is separate)."}, {"id": "ls13", "t": "License and Registration", "q": "A business entity applying for an Illinois producer license must", "o": ["Designate a licensed producer responsible for the entity's compliance", "Have at least 10 licensed employees", "Post a $50,000 bond", "Be incorporated in Illinois"], "e": "5/500-30(c) requires the Uniform Business Entity Application, fees, and a designated responsible licensed producer."}, {"id": "ls14", "t": "License and Registration", "q": "A nonresident producer will receive an Illinois nonresident license if, among other requirements, the producer", "o": ["Is currently licensed and in good standing in the home state, and the home state grants nonresident licenses to Illinois residents on the same basis", "Passes the Illinois state exam", "Moves to Illinois within one year", "Completes 20 hours of Illinois pre-licensing"], "e": "5/500-40(a): good standing at home, proper request and fees, application, and reciprocity."}, {"id": "ls15", "t": "License and Registration", "q": "A resident Illinois producer who moves to another state must file a change of address and provide certification from the new resident state within", "o": ["30 days", "10 days", "60 days", "90 days"], "e": "5/500-40(c); no fee or license application is required."}, {"id": "ls16", "t": "License and Registration", "q": "An Illinois licensee must notify the Director of a change of address within", "o": ["30 days after the change", "10 days", "60 days", "At the next renewal"], "e": "5/500-35(g)."}, {"id": "ls17", "t": "License and Registration", "q": "The Director may issue a temporary producer license for up to", "o": ["180 days, renewable once for another 180 days", "90 days only", "1 year, renewable indefinitely", "30 days"], "e": "5/500-60(a)."}, {"id": "ls18", "t": "License and Registration", "q": "A temporary producer license may be issued to", "o": ["The surviving spouse or court-appointed representative of a deceased or disabled producer", "Anyone who failed the licensing exam", "A student studying for the exam", "Any unlicensed person who wants to sell for 180 days"], "e": "5/500-60 also covers a business entity's employee upon death or disability of the designee, and the designee of a producer entering active military service."}, {"id": "ls19", "t": "License and Registration", "q": "The fee for issuance of an Illinois temporary producer license is", "o": ["$50", "$215", "$150", "No fee"], "e": "5/500-135(a)(2); the fee is paid on issuance but not on renewal of the temporary license."}, {"id": "ls20", "t": "License and Registration", "q": "Which person is NOT required to hold an Illinois producer license?", "o": ["An insurer employee performing only clerical duties who receives no commission", "A person who solicits life insurance for commissions", "A person who negotiates annuity sales", "A person who sells health policies over the phone for commissions"], "e": "5/500-20 exempts officers and employees doing executive, administrative, managerial, or clerical work only indirectly related to sales, with no commission."}, {"id": "ls21", "t": "License and Registration", "q": "A salaried employee who advises his employer on its insurance needs, without selling or receiving commissions, is", "o": ["Exempt from licensing", "Required to hold a producer license", "Required to hold a temporary license", "Required to hold a limited lines license"], "e": "5/500-20(b)(7)."}, {"id": "ls22", "t": "License and Registration", "q": "An individual producer who lets a license lapse may have it reissued without retaking the exam if the producer acts within", "o": ["12 months after the renewal due date, paying a penalty of double the unpaid renewal fee", "30 days, with no penalty", "3 years, with a $50 penalty", "6 months, after retaking pre-licensing"], "e": "5/500-35(d)."}, {"id": "ls23", "t": "License and Registration", "q": "A person whose Illinois producer license is revoked is ineligible to apply for any license for", "o": ["3 years", "1 year", "5 years", "Life"], "e": "5/500-70(g)."}, {"id": "ls24", "t": "License and Registration", "q": "Which is a ground for the Director to suspend or revoke a producer license?", "o": ["Forging a name on an application", "Selling for more than one insurer", "Living near the Illinois border", "Earning more than $100,000"], "e": "5/500-70(a)(10); other grounds include misrepresentation, misappropriation, felony conviction, and fraud."}, {"id": "ls25", "t": "License and Registration", "q": "A producer who fails to comply with a court order imposing a child support obligation", "o": ["May have his or her license suspended or refused", "Is exempt from discipline", "Must pay a $5 fine only", "Is automatically licensed"], "e": "5/500-70(a)(13)."}, {"id": "ls26", "t": "License and Registration", "q": "After notice of a license denial, suspension, or revocation, the applicant or licensee may demand a hearing in writing within", "o": ["30 days after the date of mailing", "10 days", "60 days", "1 year"], "e": "5/500-70(b); the hearing is held not fewer than 20 nor more than 30 days after notice of hearing is mailed."}, {"id": "ls27", "t": "License and Registration", "q": "In addition to or instead of license denial, suspension, or revocation, the Director may impose a civil penalty after hearing of up to", "o": ["$10,000 per cause, not to exceed $100,000 total", "$1,000 per cause, not to exceed $10,000", "$50,000 per cause", "$500 per violation"], "e": "5/500-70(d)."}, {"id": "ls28", "t": "License and Registration", "q": "A licensed producer convicted of a felony must report the conviction to the Director within", "o": ["30 days after the entry date of the judgment", "10 days", "60 days", "At the next renewal"], "e": "5/500-95 also requires a copy of the judgment and related orders."}, {"id": "ls29", "t": "License and Registration", "q": "Using notes or other reference material improperly to complete an Illinois insurance licensing exam is", "o": ["A ground for license denial, suspension, or revocation", "Permitted if the proctor agrees", "Permitted on the state portion only", "Not regulated"], "e": "5/500-70(a)(11)."}, {"id": "ls30", "t": "License and Registration", "q": "Knowingly accepting insurance business from an unlicensed individual is", "o": ["A ground for disciplinary action against the producer", "Permitted if a commission is not shared", "Permitted for life insurance only", "Required by law"], "e": "5/500-70(a)(12)."}, {"id": "ls31", "t": "License and Registration", "q": "Controlled business in Illinois means insurance on", "o": ["The producer's own life, property, or risks, those of the producer's spouse, or the producer's employer or own business", "Policies sold to the producer's clients", "Group plans for any employer", "Policies issued by the producer's appointed insurer"], "e": "5/500-125(b)."}, {"id": "ls32", "t": "License and Registration", "q": "A license may not be granted or extended if the Director believes that during either of the 2 preceding calendar years the producer's controlled business premiums", "o": ["Exceeded the premiums on all other insurance business of the licensee", "Exceeded 10% of total premiums", "Exceeded $50,000", "Exceeded 25% of total premiums"], "e": "5/500-125(a): controlled business may not exceed all other business."}, {"id": "ls33", "t": "Continuing Education", "q": "Before each Illinois license renewal, a resident producer must complete at least", "o": ["24 hours of continuing education, including 3 hours of ethics", "12 hours with no ethics requirement", "30 hours including 5 hours of ethics", "20 hours of pre-licensing"], "e": "5/500-35(b)(1)."}, {"id": "ls34", "t": "Continuing Education", "q": "The 3 hours of ethics required for Illinois CE must be completed through", "o": ["Classroom or webinar instruction", "Self-study only", "An association meeting", "Any method"], "e": "5/500-35(b)(1)."}, {"id": "ls35", "t": "Continuing Education", "q": "Active participation in a professional insurance association may earn an Illinois producer up to", "o": ["4 hours of CE credit per biennial period, but not ethics credit", "24 hours of CE credit", "3 hours of ethics credit", "No credit"], "e": "5/500-35(b)(3): hour-for-hour, up to 4 hours, not usable for ethics."}, {"id": "ls36", "t": "Continuing Education", "q": "If a producer fails to complete the required CE by the renewal date, the license", "o": ["Automatically terminates", "Is extended for 6 months", "Remains active with a fine", "Converts to a temporary license"], "e": "5/500-35(b)(2); courses should be completed early enough for the provider to report credit."}, {"id": "ls37", "t": "Continuing Education", "q": "A combination course is treated as classroom credit in Illinois when classroom, seminar, or webinar hours make up at least", "o": ["Two-thirds of the total certified hours", "One-half of the total hours", "One-quarter of the total hours", "100% of the hours"], "e": "5/500-35(b)(1); otherwise it is self-study."}, {"id": "ls38", "t": "Continuing Education", "q": "Self-study CE credit in Illinois generally requires", "o": ["Successful completion of an examination that is not self-evaluated, unless a computerized interactive format validates completion", "Only reading the material", "A signed attestation by the producer", "Attendance at a classroom"], "e": "5/500-35(b)(1)."}, {"id": "ls39", "t": "Continuing Education", "q": "A producer who cannot comply with renewal procedures due to military service may", "o": ["Request a waiver of those procedures", "Never renew again", "Renew only by retaking the exam", "Transfer the license to a spouse"], "e": "5/500-35(e)."}, {"id": "ls40", "t": "Fiduciary Responsibilities", "q": "Under Illinois law, premiums a producer receives on behalf of an insurer are held", "o": ["In a fiduciary capacity and may not be misappropriated, converted, or improperly withheld", "As the producer's personal income", "By the Director in escrow", "As a loan to the insured"], "e": "5/500-115(a)."}, {"id": "ls41", "t": "Fiduciary Responsibilities", "q": "A producer who knowingly misappropriates fiduciary funds of $150 or less commits, for a first offense,", "o": ["A Class A misdemeanor", "A Class 3 felony", "A petty offense", "No crime if repaid"], "e": "5/500-115(d): subsequent offenses are a Class 4 felony; amounts over $150 are a Class 3 felony."}, {"id": "ls42", "t": "Fiduciary Responsibilities", "q": "A producer who knowingly converts premiums in excess of $150 to personal use is guilty of", "o": ["A Class 3 felony", "A Class A misdemeanor", "A business offense only", "A Class C misdemeanor"], "e": "5/500-115(d)."}, {"id": "ls43", "t": "Fiduciary Responsibilities", "q": "If an insured pays the premium to the producer who requested the coverage, the insurer is", "o": ["Deemed to have received the premium", "Not obligated until it receives the funds", "Allowed to cancel the policy", "Required to bill the insured again"], "e": "5/500-115(b); the insurer is responsible to the insured for any return premium."}, {"id": "ls44", "t": "Fiduciary Responsibilities", "q": "An insurer delivering a policy through a producer authorizes the producer to collect premiums due at issuance or delivery and those that come due within", "o": ["90 days thereafter", "30 days", "1 year", "10 days"], "e": "5/500-115(a)."}, {"id": "ls45", "t": "Commissions and Compensation", "q": "An insurer may pay a commission for selling insurance in Illinois only to a person who", "o": ["Was properly licensed at the time of the sale, solicitation, or negotiation", "Is licensed at the time the commission is paid", "Has an insurance degree", "Is a relative of a licensed producer"], "e": "5/500-80(a)-(c); renewal commissions may be paid to someone licensed at the time of the sale."}, {"id": "ls46", "t": "Commissions and Compensation", "q": "When a producer charges a fee in addition to commission, the producer must", "o": ["Give the consumer a written disclosure of the fee before delivery of the policy and keep a copy for 7 years", "Get the Director's prior approval", "Charge no more than $25", "Disclose the fee only if asked"], "e": "5/500-80(e)(1)."}, {"id": "ls47", "t": "Commissions and Compensation", "q": "If a producer's combined fee or compensation exceeds 10% of the directly attributable premium, the disclosure must also", "o": ["Include the consumer's signature acknowledging the fee", "Be filed with the Director", "Be notarized", "Be sent to the insurer for approval"], "e": "5/500-80(e)(2)."}, {"id": "ls48", "t": "Commissions and Compensation", "q": "If a policy on which a producer charged a separate fee is cancelled within 90 days of inception, the producer must", "o": ["Refund a prorated portion of the fee within 30 days after receiving documentation of cancellation", "Keep the entire fee", "Charge a cancellation fee", "Refund the fee only if the insurer requires it"], "e": "5/500-80(e)(3); producers may never charge a cancellation fee."}, {"id": "ls49", "t": "Disclosure", "q": "Under Illinois law, an individual life or accident and health application must bear", "o": ["The name and signature of the licensee who solicited and wrote it", "Only the insurer's seal", "The Director's approval stamp", "The beneficiary's signature"], "e": "5/500-155."}, {"id": "ls50", "t": "Marketing Practices", "q": "A producer offers to give a client part of the first-year commission if she buys a life policy. This is", "o": ["Rebating, which is prohibited", "Legal if disclosed in writing", "Twisting", "Sliding"], "e": "215 ILCS 5/151 prohibits rebates or other inducements not specified in the policy; applicants are also prohibited from accepting them."}, {"id": "ls51", "t": "Marketing Practices", "q": "Under Illinois's rebating statute, who is prohibited from accepting a rebate?", "o": ["The applicant or insured", "Only the producer", "Only the insurer", "No one"], "e": "5/151(2) prohibits insured persons and applicants from receiving or accepting rebates."}, {"id": "ls52", "t": "Marketing Practices", "q": "Making false or misleading statements about the terms or benefits of a policy to induce a sale is", "o": ["Misrepresentation", "Defamation", "Rebating", "Boycott"], "e": "5/149 prohibits misrepresentation of policy terms, benefits, or dividends."}, {"id": "ls53", "t": "Marketing Practices", "q": "Misrepresenting the terms of a policy to induce a policyowner to lapse or replace an existing policy is called", "o": ["Twisting", "Rebating", "Sliding", "Coercion"], "e": "Twisting is a form of misrepresentation prohibited under 5/149."}, {"id": "ls54", "t": "Marketing Practices", "q": "Making false or maliciously critical statements about another insurer's financial condition is", "o": ["Defamation", "Rebating", "Twisting", "Controlled business"], "e": "5/149 prohibits statements maliciously critical of or derogatory to the financial condition of an insurer."}, {"id": "ls55", "t": "Marketing Practices", "q": "Under 215 ILCS 5/236, a life insurer may NOT", "o": ["Discriminate between individuals of the same class and equal life expectancy in rates or terms", "Charge different rates for different ages", "Use risk classification", "Charge smokers more than nonsmokers"], "e": "Unfair discrimination means different treatment of people with the same risk."}, {"id": "ls56", "t": "Marketing Practices", "q": "Under Illinois law, a life insurer may not refuse to insure or charge a higher rate solely because the applicant", "o": ["Is blind or partially blind", "Has a heart condition", "Is older", "Smokes"], "e": "5/236(c)."}, {"id": "ls57", "t": "Marketing Practices", "q": "Under Illinois law, a life insurer may not refuse to insure an individual solely because the individual", "o": ["Is a member of the U.S. Armed Forces, National Guard, or Reserves", "Engages in hazardous hobbies", "Has a serious illness", "Has a criminal record of fraud"], "e": "5/236(d)."}, {"id": "ls58", "t": "Marketing Practices", "q": "Agreeing with other insurers to refuse to do business with a person is", "o": ["Boycott, coercion, or intimidation, an unfair practice", "Rebating", "Defamation", "Permissible competition"], "e": "Section 424 lists unfair methods of competition, including boycotts."}, {"id": "ls59", "t": "Unfair Claims Practices", "q": "Under Illinois rules, an insurer must acknowledge pertinent communications about a claim with \"reasonable promptness,\" defined as a maximum of", "o": ["15 working days", "30 calendar days", "5 working days", "45 days"], "e": "50 Ill. Adm. Code 919.40."}, {"id": "ls60", "t": "Unfair Claims Practices", "q": "Failing to provide claim forms within how many working days of a request is an improper claims practice in Illinois?", "o": ["15", "10", "30", "45"], "e": "215 ILCS 5/154.6(o)."}, {"id": "ls61", "t": "Unfair Claims Practices", "q": "Once an Illinois insurer affirms liability on a claim whose amount is determined and not in dispute, it must offer payment within", "o": ["30 days", "60 days", "15 days", "90 days"], "e": "50 Ill. Adm. Code 919.50(a)."}, {"id": "ls62", "t": "Unfair Claims Practices", "q": "When an Illinois insurer denies a first-party claim, its written explanation must be accompanied by", "o": ["A Notice of Availability of the Department of Insurance", "A copy of the insurer's annual statement", "A refund of all premiums", "The producer's license number"], "e": "919.50(a)(1)."}, {"id": "ls63", "t": "Unfair Claims Practices", "q": "Under Illinois rules, \"prompt investigation\" requires a bona fide effort to communicate with insureds and claimants within", "o": ["21 working days after notification of loss", "7 days", "60 days", "90 days"], "e": "50 Ill. Adm. Code 919.40."}, {"id": "ls64", "t": "Unfair Claims Practices", "q": "Which is an improper claims practice under 215 ILCS 5/154.6?", "o": ["Refusing to pay claims without conducting a reasonable investigation", "Requesting proof of death", "Paying a claim within 30 days", "Explaining the basis of a denial"], "e": "Others include misrepresenting policy provisions and compelling insureds to sue by lowball offers."}, {"id": "ls65", "t": "Unfair Claims Practices", "q": "An insurer that compels policyholders to sue by offering substantially less than amounts ultimately recovered is engaging in", "o": ["An improper claims practice", "Subrogation", "Rebating", "Controlled business"], "e": "5/154.6(e)."}, {"id": "ls66", "t": "Unfair Claims Practices", "q": "Under Illinois rules, an insurer may deny a claim based on a phone conversation only if", "o": ["The conversation is documented in the claim file", "The producer agrees", "The insured is notified 90 days in advance", "The Director approves it"], "e": "919.50(b)."}, {"id": "ls67", "t": "Replacement", "q": "Under Illinois Regulation 917, which transaction is considered a replacement?", "o": ["Buying a new policy while the existing policy will be converted to reduced paid-up insurance", "Buying a first policy with no existing coverage", "Adding a rider to an existing policy at the same insurer with no reduction in benefits", "Increasing the face amount of an existing policy"], "e": "50 Ill. Adm. Code 917.30 includes lapse, surrender, use of nonforfeiture values, reduction of benefits, reissue with less cash value, and certain borrowing."}, {"id": "ls68", "t": "Replacement", "q": "Under Illinois replacement rules, borrowing against an existing policy is considered replacement when total borrowing exceeds", "o": ["25% of the policy's loan value", "10% of the face amount", "50% of the cash value", "$5,000"], "e": "917.30(e)."}, {"id": "ls69", "t": "Replacement", "q": "Which transaction is EXEMPT from Illinois replacement regulation 917?", "o": ["Group life insurance", "Individual whole life replacing individual term that has 10 years left", "An individual annuity replacing a whole life policy", "Individual universal life replacing individual whole life"], "e": "917.50 exempts credit life, group life and group annuities, certain pension plan policies, and other listed transactions."}, {"id": "ls70", "t": "Replacement", "q": "Illinois Regulation 917 does not apply when the existing coverage is non-convertible, nonrenewable term life that will expire in", "o": ["5 years or less", "10 years or less", "1 year or less", "20 years or less"], "e": "917.50(e)."}, {"id": "ls71", "t": "Replacement", "q": "Illinois replacement rules do not apply when the total cash surrender value of existing policies is less than $500 and their combined face amount is less than", "o": ["$5,000", "$10,000", "$25,000", "$1,000"], "e": "917.50(g)."}, {"id": "ls72", "t": "Replacement", "q": "In a replacement, the producer must present the Notice Regarding Replacement to the applicant", "o": ["No later than at the time of taking the application", "Within 30 days after the policy is issued", "At policy delivery", "Only if the applicant asks"], "e": "917.60(b)(1); the producer signs the notice and lists the policies being replaced."}, {"id": "ls73", "t": "Replacement", "q": "With each life or annuity application, the producer must submit to the replacing insurer", "o": ["A statement signed by the applicant as to whether the coverage will replace existing insurance and the producer's signed statement as to whether replacement may be involved", "The applicant's tax return", "A copy of the existing policy's illustration only", "Nothing additional"], "e": "917.60(a)."}, {"id": "ls74", "t": "Replacement", "q": "The replacing insurer must send the Notice Regarding Proposed Replacement to the existing insurer within", "o": ["3 working days after receipt of the application", "10 days", "20 days", "30 days"], "e": "917.70(c)."}, {"id": "ls75", "t": "Replacement", "q": "The replacing insurer must keep copies of replacement notices at its home office for at least", "o": ["3 years", "1 year", "5 years", "7 years"], "e": "917.70(d)."}, {"id": "ls76", "t": "Replacement", "q": "Under 215 ILCS 5/224(2), in a replacement the replacing insurer must either delay issuing its policy for at least 20 days after sending a policy summary to the existing insurer, or", "o": ["Give the insured a 20-day unconditional right to a full premium refund after delivery", "Give the insured a 10-day free look", "Obtain the Director's approval", "Refund the existing insurer's commission"], "e": "Under option 2 the replacing insurer also sends a policy summary to the existing insurer within 3 working days after issue."}, {"id": "ls77", "t": "Replacement", "q": "In Illinois, a replacement life policy that uses the refund option must give the policyowner the right to an unconditional refund of all premiums for", "o": ["20 days from delivery", "10 days", "30 days", "60 days"], "e": "215 ILCS 5/224(2)."}, {"id": "ls78", "t": "Replacement", "q": "In a replacement, the replacing insurer must furnish the applicant with", "o": ["A Buyer's Guide", "A copy of the producer's license", "The existing insurer's annual report", "A Medicare supplement outline"], "e": "917.70(c) references 50 Ill. Adm. Code 930.50."}, {"id": "ls79", "t": "Life Solicitation", "q": "Under Illinois Regulation 930, an insurer must give an applicant a Buyer's Guide (other than for direct response products)", "o": ["Before accepting the applicant's initial premium or premium deposit", "Within 30 days after the policy is issued", "Only on request", "At the first policy anniversary"], "e": "50 Ill. Adm. Code 930.50(a)."}, {"id": "ls80", "t": "Life Solicitation", "q": "Under Illinois Regulation 930, a Policy Summary must be delivered", "o": ["With or before delivery of the policy", "Before taking the application", "Within 1 year after issue", "Only upon request after issue"], "e": "930.50(a); a Buyer's Guide and Policy Summary must also be provided before application upon request."}, {"id": "ls81", "t": "Life Solicitation", "q": "The Policy Summary required by Illinois Regulation 930 must carry the title", "o": ["Statement of Policy Cost and Benefit Information", "Notice Regarding Replacement", "Outline of Coverage", "Illustration of Values"], "e": "930.40(i)(1)(A)."}, {"id": "ls82", "t": "Life Solicitation", "q": "Life insurance cost indexes in the Policy Summary are shown for", "o": ["10 and 20 years", "1 and 5 years", "5 and 10 years", "To age 100 only"], "e": "930.40(i)(1)(G): Surrender Cost and Net Payment Cost indexes for 10 and 20 years."}, {"id": "ls83", "t": "Life Solicitation", "q": "The Life Insurance Net Payment Cost Index is useful for comparing policies when", "o": ["The main concern is the cost of death benefits, assuming the policy will not be surrendered", "The policy will be surrendered", "The policy is an annuity", "Comparing group policies"], "e": "It is calculated like the Surrender Cost Index but with cash value set to zero (930.40(g)(2))."}, {"id": "ls84", "t": "Life Solicitation", "q": "Illinois cost index calculations use an interest rate of", "o": ["5% compounded annually", "3% simple interest", "6% compounded monthly", "10% compounded annually"], "e": "930.40 uses 5% interest."}, {"id": "ls85", "t": "Life Solicitation", "q": "A Policy Summary that shows divi
