rement and Other Concepts", "q": "A qualified retirement plan must", "o": ["Meet IRS rules, including nondiscrimination in favor of highly paid employees", "Cover only executives and other highly compensated employees chosen by the employer", "Be funded with after-tax employee contributions that are not deductible", "Provide immediate full vesting for all participants regardless of service"], "e": "Qualified plans receive tax advantages and must meet ERISA/IRS rules such as nondiscrimination and vesting.", "m": "Qualified = plays by IRS rules and can't favor the highly paid."}, {"id": "lg141", "t": "Retirement and Other Concepts", "q": "A nonqualified deferred compensation plan", "o": ["May favor selected executives, and the employer deducts benefits when paid", "Must cover all eligible employees, and the employer deducts contributions when made", "Is funded with deductible contributions that grow tax-deferred in a trust", "Is subject to the same IRS nondiscrimination rules as a qualified plan"], "e": "Nonqualified plans may discriminate and are often informally funded with life insurance.", "m": "NONqualified = \"pick your favorites\": can favor executives; the employer deducts when paid."}, {"id": "lg142", "t": "Retirement and Other Concepts", "q": "Contributions to a traditional IRA are generally", "o": ["Deductible (within limits if in a workplace plan), with taxable withdrawals", "Made with after-tax dollars, with qualified withdrawals received tax-free", "Not deductible, with withdrawals taxed as capital gains", "Deductible in full, with withdrawals received tax-free"], "e": "Traditional IRA distributions are ordinary income; Roth contributions are after-tax.", "m": "Traditional IRA = tax break now, tax at withdrawal."}, {"id": "lg143", "t": "Retirement and Other Concepts", "q": "Qualified distributions from a Roth IRA are", "o": ["Income tax-free", "Taxable as ordinary income", "Taxed as capital gains", "Taxable on the earnings only"], "e": "Qualified Roth distributions (5-year rule plus age 59 1/2 or another qualifying event) are tax-free.", "m": "Roth = tax now, tax-free later."}, {"id": "lg144", "t": "Retirement and Other Concepts", "q": "A withdrawal from a traditional IRA or deferred annuity before age 59 1/2, without an exception, is generally subject to", "o": ["Ordinary income tax plus a 10% additional tax on the taxable part", "Capital gains tax on the earnings, with no additional penalty", "Ordinary income tax plus a 20% additional tax on the full amount", "A 10% additional tax only, with no ordinary income tax"], "e": "Exceptions include death and disability.", "m": "Before 59 1/2: income tax + 10% additional tax.", "c": ["lg_tax"]}, {"id": "lg145", "t": "Retirement and Other Concepts", "q": "Which plan is designed for employees of public schools and certain tax-exempt organizations?", "o": ["403(b) tax-sheltered annuity", "SEP IRA", "Keogh (HR-10) plan", "SIMPLE IRA"], "e": "403(b) plans serve employees of 501(c)(3) organizations and public schools.", "m": "403(b) = schools and nonprofits."}, {"id": "lg146", "t": "Retirement and Other Concepts", "q": "A qualified plan for self-employed individuals and their employees is a", "o": ["Keogh (HR-10) plan", "403(b) plan", "457 plan", "Section 79 plan"], "e": "Keogh plans let self-employed persons and partners establish qualified plans.", "m": "Keogh = self-employed."}, {"id": "lg147", "t": "Retirement and Other Concepts", "q": "The human life value approach to life insurance needs is based on", "o": ["The present value of the insured's future earnings for the family", "The total of the family's specific needs minus existing resources", "The insured's current net worth plus outstanding debts", "A fixed multiple of the insured's current annual salary"], "e": "The needs approach instead totals specific family needs and subtracts existing resources.", "m": "Human life value = the present value of future earnings."}, {"id": "lg148", "t": "Retirement and Other Concepts", "q": "In key person insurance, the business is the", "o": ["Owner, premium payer, and beneficiary", "Owner and payer, with the employee's family as beneficiary", "Beneficiary only, with the employee as owner", "Premium payer only, with the employee as owner"], "e": "Premiums are not deductible, and proceeds are generally received income tax-free by the business.", "m": "Key person: the BUSINESS owns, pays and collects."}, {"id": "lg149", "t": "Retirement and Other Concepts", "q": "In a cross-purchase buy-sell agreement among three partners,", "o": ["Each partner owns a policy on each of the other partners", "The partnership owns one policy on each of the partners", "Each partner owns a policy on his or her own life", "The senior partner owns policies on the other two partners"], "e": "Cross-purchase needs n x (n-1) policies; an entity plan has the business own one policy per owner.", "m": "Cross-purchase = each partner owns policies on the others: n x (n - 1).", "c": ["lg_buysell"]}, {"id": "lg150", "t": "Retirement and Other Concepts", "q": "In an entity (stock redemption) buy-sell plan, the business", "o": ["Owns a policy on each owner and buys the deceased owner's interest", "Requires each owner to buy a policy on every other owner", "Has each owner buy a policy on his or her own life payable to the estate", "Buys one policy on the senior owner and names the other owners beneficiaries"], "e": "The business is owner, payer, and beneficiary.", "m": "Entity = the BUSINESS owns one policy per owner.", "c": ["lg_buysell"]}, {"id": "lg151", "t": "Retirement and Other Concepts", "q": "Social Security pays a surviving spouse benefits while caring for the deceased worker's child under age", "o": ["16", "21", "25", "10"], "e": "Benefits stop when the youngest child turns 16 (unless disabled); the gap until the spouse's survivor benefit at age 60 is the blackout period.", "m": "Surviving parent benefits stop at child age 16; then the blackout runs until 60.", "c": ["lg_ss"]}, {"id": "lg152", "t": "Retirement and Other Concepts", "q": "To be fully insured under Social Security, a worker generally needs", "o": ["40 credits (quarters) of coverage", "20 credits in the last 5 years", "6 credits in the last 13 quarters", "10 credits total"], "e": "40 credits equals about 10 years of work. Currently insured status requires 6 of the last 13 quarters.", "m": "Fully insured = 40 credits (about 10 years).", "c": ["lg_ss"]}, {"id": "lg153", "t": "Retirement and Other Concepts", "q": "Premiums an individual pays for a personal life insurance policy are generally", "o": ["Not tax-deductible", "Fully tax-deductible", "Deductible above $50,000 of coverage", "Deductible after a 7.5% floor"], "e": "Personal life premiums are a personal expense.", "m": "Personal life premiums are not deductible."}, {"id": "lg154", "t": "Retirement and Other Concepts", "q": "Death proceeds paid in a lump sum to a named beneficiary are generally", "o": ["Free of federal income tax", "Taxed as ordinary income", "Taxed as capital gains", "Taxable above the premiums paid"], "e": "IRC Section 101 excludes death benefits from income; interest on proceeds held by the insurer is taxable.", "m": "Lump-sum death benefit is income-tax-free."}, {"id": "lg155", "t": "Retirement and Other Concepts", "q": "If a beneficiary chooses installment payments, the portion of each payment representing interest is", "o": ["Taxable as ordinary income", "Tax-free", "Taxed as capital gains", "Subject to estate tax but not income tax"], "e": "Principal is tax-free; interest earnings are taxable.", "m": "Installments: principal is tax-free, interest is taxable."}, {"id": "lg156", "t": "Retirement and Other Concepts", "q": "The cash value of a life policy grows", "o": ["Tax-deferred", "Fully taxable each year", "Taxed annually as capital gains", "Tax-deductible"], "e": "Gains are taxed only on surrender to the extent cash value exceeds cost basis (premiums paid minus dividends received).", "m": "Cash value grows tax-deferred."}, {"id": "lg157", "t": "Retirement and Other Concepts", "q": "An owner surrenders a whole life policy with $40,000 cash value after paying $30,000 in premiums and receiving no dividends. How much is taxable?", "o": ["$10,000", "$40,000", "$0", "$30,000"], "e": "The gain over basis ($40,000 - $30,000) is ordinary income.", "m": "Gain = cash value minus premiums paid: $40K - $30K = $10K taxable."}, {"id": "lg158", "t": "Retirement and Other Concepts", "q": "A life policy that fails the IRS seven-pay test becomes a", "o": ["Modified Endowment Contract (MEC)", "Qualified retirement plan", "Viatical settlement", "Section 1035 exchange"], "e": "A MEC keeps a tax-free death benefit but loses favorable tax treatment for lifetime distributions.", "m": "Fail the 7-pay test = MEC.", "c": ["lg_tax"]}, {"id": "lg159", "t": "Retirement and Other Concepts", "q": "Loans and withdrawals from a MEC are taxed", "o": ["Gain first (LIFO), with a 10% penalty if taken before age 59 1/2", "Basis first (FIFO), with no penalty if taken before age 59 1/2", "Gain first (LIFO), with no penalty at any age", "Basis first (FIFO), with a 10% penalty if taken before age 59 1/2"], "e": "MEC distributions are taxed like annuity withdrawals.", "m": "MEC = taxed like an annuity: gain first, plus 10% before 59 1/2.", "c": ["lg_tax"]}, {"id": "lg160", "t": "Retirement and Other Concepts", "q": "Exchanging one life insurance policy for another without recognizing gain is permitted under IRC Section", "o": ["1035", "79", "101", "403(b)"], "e": "Section 1035 allows life-to-life, life-to-annuity, and annuity-to-annuity exchanges (not annuity-to-life).", "m": "1035 = swap policies without tax."}, {"id": "lg161", "t": "Retirement and Other Concepts", "q": "The tax-free portion of each nonqualified annuity payment is determined by the", "o": ["Exclusion ratio", "Seven-pay test", "Accumulation ratio", "Settlement ratio"], "e": "The exclusion ratio (investment in the contract divided by expected return) applies until basis is recovered.", "m": "Exclusion ratio = the tax-free part of each annuity payment."}, {"id": "lg162", "t": "Retirement and Other Concepts", "q": "Withdrawals from a nonqualified deferred annuity before annuitization are taxed", "o": ["Earnings first, as ordinary income", "Principal first, tax-free until basis is recovered", "As capital gains on the earnings portion", "Pro rata, using the exclusion ratio"], "e": "For contracts issued after 1982, withdrawals are treated as coming from earnings first.", "m": "Deferred annuity withdrawals = earnings first.", "c": ["lg_tax"]}, {"id": "lg163", "t": "Retirement and Other Concepts", "q": "Under current federal law (SECURE 2.0), required minimum distributions from a traditional IRA generally begin at age", "o": ["73", "59 1/2", "65", "70 1/2"], "e": "The RMD age is 73 under SECURE 2.0 for traditional IRAs and most qualified plans (IRS RMD FAQs).", "m": "RMDs at 73.", "c": ["lg_tax"]}, {"id": "lg164", "t": "Retirement and Other Concepts", "q": "Social Security disability benefits require a disability expected to last at least", "o": ["12 months or result in death", "6 months or result in death", "90 days", "24 months"], "e": "SSDI uses a strict definition and has a 5-month waiting period.", "m": "SSDI = 12 months or death.", "c": ["lg_ss"]}, {"id": "lg165", "t": "Retirement and Other Concepts", "q": "A Simplified Employee Pension (SEP) is funded by", "o": ["Employer contributions to employees' IRAs", "Employee salary deferrals to a trust", "Employer-paid life insurance premiums", "Employee after-tax Roth contributions"], "e": "SEPs let small employers and the self-employed contribute to IRAs.", "m": "SEP = employer contributions into employees' IRAs."}, {"id": "lg166", "t": "Retirement and Other Concepts", "q": "A split-dollar plan", "o": ["Shares a policy's premiums and benefits between employer and employee", "Divides one policy's coverage between two separate insurers", "Splits an annuity's payments between two annuitants", "Divides group health premiums between employer and employee"], "e": "Split-dollar arrangements divide premiums, cash value, and death benefits under a written agreement.", "m": "Split-dollar = split the premium and the benefits."}, {"id": "lg167", "t": "Retirement and Other Concepts", "q": "After a policy is sold in a life settlement,", "o": ["The buyer becomes owner and beneficiary and pays the premiums", "The original beneficiary still receives the death benefit", "The insurer must repurchase the policy within 2 years", "The seller keeps paying premiums until the insured's death"], "e": "Settlements can also affect the seller's taxes and eligibility for public benefits.", "m": "After a life settlement, the buyer is owner and beneficiary and pays the premiums."}], "sheet": [{"id": "lg_clocks", "title": "Life policy time periods", "rows": [["Grace period: typically 30 days or one month (Illinois: 30 days or one month)", "Missed premium after the first; coverage continues; unpaid premium is deducted from any death claim."], ["Free look: a set number of days after DELIVERY (Illinois: 10; 20 for replacements)", "Right to return the policy for a full refund."], ["Contestable period: no longer than 2 years (Illinois)", "Limits insurer's right to void for misstatements; misstatement of age is still adjusted."], ["Reinstatement: within a stated period (Illinois: 3 years)", "Restores a lapsed policy with insurability evidence plus back premiums."]], "src": "215 ILCS 5/224 (Illinois life standard provisions)", "rel": ["lg56", "lg57", "lg58", "lg60", "lg69", "lg72", "lg130"]}, {"id": "lg_31days", "title": "31-day rules", "rows": [["Group life conversion: within 31 days of termination, no evidence of insurability", "Protects a departing employee."], ["Illinois individual life grace: 30 days or one month (not 31)", "Missed premium (215 ILCS 5/224(1)(b))."]], "src": "215 ILCS 5/231.1(H) (group life conversion); 215 ILCS 5/224(1)(b)", "rel": ["lg135", "lg56"]}, {"id": "lg_receipts", "title": "Conditional vs binding receipt vs no premium", "rows": [["Conditional receipt", "Coverage from application/exam date ONLY IF the applicant is found insurable as applied for."], ["Binding receipt", "Temporary coverage from application date even if later declined, until the insurer acts."], ["No premium with application", "Coverage starts at delivery, when premium is paid and a statement of good health is signed."]], "src": "Policy concepts from the Pearson VUE outline", "rel": ["lg100", "lg101", "lg102", "lg103"]}, {"id": "lg_nonforf", "title": "Nonforfeiture vs dividend options", "rows": [["Extended term", "SAME face amount, for a LIMITED time."], ["Reduced paid-up", "LOWER face amount, permanent, no more premiums."], ["Paid-up additions (dividend option)", "Dividends buy small amounts of permanent insurance; policy still in force."], ["One-year term (dividend option)", "Dividends buy one-year term, often up to the cash value."]], "src": "Policy concepts from the Pearson VUE outline", "rel": ["lg62", "lg63", "lg64", "lg66", "lg67"]}, {"id": "lg_statements", "title": "Representation vs warranty vs concealment", "rows": [["Representation", "True to the best of the applicant's knowledge; only MATERIAL misstatements can void."], ["Warranty", "Guaranteed literally true; a breach can void regardless of materiality."], ["Concealment", "INTENTIONALLY withholding a material fact."]], "src": "Policy concepts from the Pearson VUE outline", "rel": ["lg97", "lg98", "lg99"]}, {"id": "lg_assign", "title": "Absolute vs collateral assignment", "rows": [["Absolute assignment", "Permanent transfer of ALL ownership rights."], ["Collateral assignment", "Temporary, partial; lender is repaid only the debt and the beneficiary gets the rest."]], "src": "Policy concepts from the Pearson VUE outline", "rel": ["lg70", "lg71"]}, {"id": "lg_payout", "title": "Annuity payout options", "rows": [["Life only", "Highest income; nothing after death."], ["Life with period certain", "Life income; beneficiary gets the rest of the guaranteed period."], ["Cash refund / installment refund", "Beneficiary gets purchase price minus payments, as a lump sum or in installments."], ["Joint and survivor vs joint life", "J&S pays until the SECOND death; joint life stops at the FIRST death."]], "src": "Policy concepts from the Pearson VUE outline", "rel": ["lg23", "lg24", "lg25", "lg26"]}, {"id": "lg_group", "title": "Group participation and tax limits", "rows": [["Noncontributory plan: all eligible employees insured (unless they reject in writing)", "Employer pays all (215 ILCS 5/230.1(A)(2))."], ["Contributory plan: employees pay part of the premium", "The insure-all-eligible rule binds only plans with no employee contribution (215 ILCS 5/230.1(A)(2))."], ["Employer-paid group term: first $50,000 tax-free to employee", "IRC Section 79; excess is imputed income."]], "src": "215 ILCS 5/230.1(A)(2); IRS Pub. 15-B (group-term life, $50,000)", "rel": ["lg136", "lg137", "lg139"]}, {"id": "lg_ss", "title": "Social Security numbers", "rows": [["Fully insured: 40 credits", "About 10 years of work."], ["Currently insured: 6 of the last 13 quarters", "Lower bar; qualifies some survivor benefits."], ["Surviving parent benefit: while caring for a child under 16", "Blackout period follows until age 60."], ["SSDI: disability expected to last 12 months or end in death; 5-month waiting period", "Strict 'any substantial gainful activity' test."]], "src": "SSA (ssa.gov credits page, Blue Book); 42 U.S.C. 414", "rel": ["lg151", "lg152", "lg164"]}, {"id": "lg_tax", "title": "Retirement/tax ages and penalties", "rows": [["Early withdrawal penalty (IRA, annuity, MEC): 10% before age 59 1/2", "On the taxable portion, unless an exception applies."], ["RMD age: 73 (SECURE 2.0)", "Traditional IRAs and qualified plans."], ["MEC: fails the 7-pay test", "Distributions taxed gain-first (LIFO) plus the 10% penalty; death benefit still tax-free."], ["Non-MEC life withdrawals: basis first (FIFO)", "Annuity withdrawals: earnings first."]], "src": "IRS Topic 557 (10%, 59 1/2); IRS RMD FAQs (73); 26 U.S.C. 7702A (7-pay); IRS Pub. 575", "rel": ["lg144", "lg158", "lg159", "lg162", "lg163"]}, {"id": "lg_buysell", "title": "Cross-purchase vs entity buy-sell", "rows": [["Cross-purchase", "Each owner buys a policy on EACH other owner: n x (n-1) policies."], ["Entity (stock redemption)", "The BUSINESS owns one policy per owner and buys the deceased owner's share."]], "src": "Business-insurance concepts from the Pearson VUE outline", "rel": ["lg149", "lg150"]}]}, "hg": {"name": "Health (Accident & Health) - General", "exam": {"n": 55, "scored": 50, "min": 75}, "topics": [{"name": "Types of Policies", "w": 16}, {"name": "Policy Provisions", "w": 15}, {"name": "Social Insurance", "w": 6}, {"name": "Other Insurance Concepts", "w": 5}, {"name": "Field Underwriting", "w": 8}], "qs": [{"id": "hg0", "t": "Types of Policies", "q": "Disability income insurance is designed to replace", "o": ["A portion of earned income lost to disability", "All medical expenses resulting from a disabling injury", "The insured's full gross income for the benefit period", "Retirement contributions the insured can no longer make"], "e": "Insurers limit benefits to a portion (commonly 60-70%) of earnings to preserve the incentive to return to work.", "m": "Disability income = \"paycheck protection\": it replaces PART of earned income, not all of it."}, {"id": "hg1", "t": "Types of Policies", "q": "A business overhead expense policy pays", "o": ["Fixed business costs, like rent and staff wages, during the owner's disability", "The disabled owner's personal salary and share of profits during disability", "The purchase price of the disabled owner's interest in the business", "Medical bills of employees injured while working at the business"], "e": "BOE covers fixed business overhead (not the owner's salary or profits); premiums are deductible and benefits taxable to the business.", "m": "BOE = \"Bills Of the Enterprise\": rent, utilities, staff wages, so the doors stay open."}, {"id": "hg2", "t": "Types of Policies", "q": "A disability buy-sell (buyout) policy is designed to", "o": ["Fund the purchase of a disabled owner's business interest", "Pay the disabled owner's salary for the rest of his or her life", "Cover the business's rent, utilities, and staff salaries", "Replace the income of employees who become disabled"], "e": "Disability buyout policies typically have long elimination periods (often 12-24 months) and may pay in a lump sum.", "m": "Buy-sell = \"buy out the disabled partner\": funds the purchase of their share."}, {"id": "hg3", "t": "Types of Policies", "q": "A key employee disability policy pays benefits to", "o": ["The business, to offset losses when a key employee is disabled", "The key employee's family, to replace the employee's lost income", "The key employee directly, as a supplement to group disability", "The business's creditors, to repay loans during the disability"], "e": "The business is owner and beneficiary; premiums are not deductible and benefits are received tax-free.", "m": "Key employee DI: the BUSINESS is hurt, so the business collects."}, {"id": "hg4", "t": "Types of Policies", "q": "Group long-term disability benefits are commonly coordinated with", "o": ["Social Security disability and workers compensation", "Life insurance cash values and annuity payments", "Individual disability policies owned by the employee", "Homeowners and auto medical payments coverage"], "e": "Group LTD plans typically offset benefits by Social Security and workers compensation amounts to prevent overinsurance.", "m": "Group LTD \"offsets\": benefits are reduced by Social Security disability and workers comp so nobody profits from disability."}, {"id": "hg5", "t": "Types of Policies", "q": "Under an AD&D policy, the capital sum is", "o": ["Part of the principal sum, paid for loss of one limb or one eye", "The full amount paid for accidental death or loss of two limbs", "A benefit paid for disability resulting from an illness", "A refund of premium paid when no accidental loss occurs"], "e": "The principal sum is paid for death or double dismemberment; the capital sum is a portion paid for single losses.", "m": "CAPITAL sum = a PART (one limb or one eye); PRINCIPAL sum = the full amount."}, {"id": "hg6", "t": "Types of Policies", "q": "Basic hospital expense coverage typically pays", "o": ["Room, board, and hospital extras up to set limits, with little or no deductible", "All hospital charges without limits after a high annual deductible", "Physician office visits and outpatient diagnostic tests only", "Long-term custodial care following a hospital stay"], "e": "Basic hospital plans provide first-dollar coverage for limited amounts and durations.", "m": "Basic hospital = \"first-dollar, low limits\": room, board and extras up to set caps."}, {"id": "hg7", "t": "Types of Policies", "q": "Basic surgical expense coverage often pays surgeons' fees based on", "o": ["A surgical schedule or relative value scale", "The surgeon's full billed charge", "A percentage of the hospital's room charges", "The insured's prior-year income"], "e": "Basic surgical plans use a schedule or relative value points times a conversion factor.", "m": "Surgical schedule = a price list (or relative value points) per procedure."}, {"id": "hg8", "t": "Types of Policies", "q": "Major medical insurance is characterized by", "o": ["High limits, a deductible, and coinsurance", "First-dollar coverage with low per-service limits", "Benefits for accidental injuries but not sickness", "Fixed daily cash benefits during hospital stays"], "e": "Major medical covers a broad range of expenses with cost-sharing; ACA-compliant plans have no lifetime or annual dollar limits on essential health benefits.", "m": "Major medical = \"big limits, you share\": a deductible plus coinsurance."}, {"id": "hg9", "t": "Types of Policies", "q": "A supplementary major medical plan", "o": ["Covers costs beyond a basic plan, often after a corridor deductible", "Replaces the basic hospital plan with a single comprehensive deductible", "Pays only expenses that the basic plan excludes, with no cost-sharing", "Pays a fixed daily amount after the basic plan's benefits run out"], "e": "Supplementary major medical sits on top of basic hospital, surgical, and medical coverage, with a corridor deductible between them.", "m": "SUPPLEMENTARY = sits on top of a basic plan, with a corridor deductible in between."}, {"id": "hg10", "t": "Types of Policies", "q": "A comprehensive major medical plan", "o": ["Combines basic and major medical into one plan", "Covers hospital stays but not physician or surgical services", "Pays first-dollar benefits with no deductible or coinsurance", "Supplements a separate basic plan after a corridor deductible"], "e": "Comprehensive major medical integrates basic and major medical in one contract with a single deductible.", "m": "COMPREHENSIVE = basic + major medical combined into one."}, {"id": "hg11", "t": "Types of Policies", "q": "Which managed care plan requires members to choose a primary care physician who acts as a gatekeeper?", "o": ["Health Maintenance Organization (HMO)", "Preferred Provider Organization (PPO)", "Indemnity plan", "Medical savings account"], "e": "HMO members typically select a PCP who coordinates care and provides referrals to specialists.", "m": "HMO = \"Have My Own doctor\": a PCP gatekeeper approves referrals."}, {"id": "hg12", "t": "Types of Policies", "q": "HMOs emphasize which approach to health care?", "o": ["Preventive care to reduce costly illness", "Unlimited choice of any licensed provider", "Reimbursement of providers' billed charges", "Indemnity payments directly to members"], "e": "HMOs provide prepaid care and emphasize preventive services, with providers often paid by capitation.", "m": "HMO = \"Health Maintenance\": maintain health through preventive care."}, {"id": "hg13", "t": "Types of Policies", "q": "An HMO that contracts with independent physicians practicing in their own offices is a(n)", "o": ["Individual Practice Association (IPA) model", "Staff model", "Group model", "Network model with salaried physicians"], "e": "IPA HMOs contract with independent physicians; staff model HMOs employ physicians directly.", "m": "IPA = \"Independent Practices Associated\": doctors stay in their own offices."}, {"id": "hg14", "t": "Types of Policies", "q": "Under capitation, an HMO provider is paid", "o": ["A fixed amount per member per month", "A fee for each service provided", "A per diem for each hospitalized member", "A percentage of the provider's billed charges"], "e": "Capitation shifts some risk to providers and encourages efficient care.", "m": "Capitation = per CAPITA (per head): a fixed amount per member per month."}, {"id": "hg15", "t": "Types of Policies", "q": "A PPO differs from an HMO in that PPO members", "o": ["May go out of network at higher cost, usually without referrals", "Must choose a primary care physician who controls all referrals", "Receive no benefits for services from out-of-network providers", "Pay their providers on a capitation basis each month"], "e": "PPOs contract with providers at discounted fees and allow out-of-network care with higher cost-sharing.", "m": "PPO = \"Pay more to go Outside\": out-of-network allowed at higher cost, usually no referral."}, {"id": "hg16", "t": "Types of Policies", "q": "A Point-of-Service (POS) plan", "o": ["Combines HMO and PPO features; members choose in or out of network per visit", "Pays only for emergency services received outside the HMO's network service area", "Has no primary care physician and pays the same benefits in and out of network", "Is a type of disability plan that pays at the point the disability begins"], "e": "POS members typically have a PCP gatekeeper but may go out of network for higher out-of-pocket costs.", "m": "POS = \"Point Of Service\": choose in or out of network at each visit."}, {"id": "hg17", "t": "Types of Policies", "q": "Funds in a health Flexible Spending Account (FSA)", "o": ["Use-it-or-lose-it, apart from any carryover or grace period", "Roll over from year to year without limit, like a health savings account", "Belong to the employee and move with the employee to a new job", "May be invested in stocks and mutual funds chosen by the employee"], "e": "FSAs are funded by pre-tax salary reduction; unused funds are generally forfeited except for plan-permitted carryover or grace periods.", "m": "FSA = \"Forfeit Some Amount\": use it or lose it (apart from plan carryover or grace).", "c": ["hg_accounts"]}, {"id": "hg18", "t": "Types of Policies", "q": "To contribute to a Health Savings Account (HSA), an individual must be covered by", "o": ["A qualified High Deductible Health Plan, with no other disqualifying coverage", "Any HMO or PPO plan, as long as the deductible exceeds the out-of-pocket maximum", "Medicare Part A or Part B, along with a Medicare supplement policy", "A general-purpose health FSA that reimburses all medical expenses"], "e": "HSA eligibility requires HDHP coverage, no disqualifying other coverage (such as Medicare), and not being claimed as a dependent.", "m": "No HDHP, no HSA: a qualified high-deductible plan is the ticket in.", "c": ["hg_accounts"]}, {"id": "hg19", "t": "Types of Policies", "q": "Which statement about HSAs is TRUE?", "o": ["The account is owned by the individual and is portable", "Unused funds are forfeited at the end of each plan year", "Contributions may be made by the employer but not by the individual", "Withdrawals for any purpose are tax-free after a 5-year holding period"], "e": "HSAs are individually owned, roll over, and offer tax-deductible contributions, tax-free growth, and tax-free qualified medical withdrawals.", "m": "HSA = \"Healthy Savings, All mine\": individually owned and portable.", "c": ["hg_accounts"]}, {"id": "hg20", "t": "Types of Policies", "q": "A nonmedical HSA withdrawal before age 65 is", "o": ["Taxable as income and subject to a 20% penalty", "Tax-free if the account has been open for 5 years", "Subject to a 10% penalty but not to income tax", "Taxable as income, with no additional penalty"], "e": "After age 65 (or disability), nonmedical withdrawals are taxed as income without the penalty.", "m": "HSA misuse before 65 = income tax + 20%. (\"20 before 65.\")", "c": ["hg_accounts"]}, {"id": "hg21", "t": "Types of Policies", "q": "A Health Reimbursement Arrangement (HRA) is", "o": ["An employer-funded account reimbursing employees' medical costs", "An account funded by employee pre-tax salary deferrals each pay period", "An individually owned account that moves with the employee to a new job", "An account that must be paired with a high deductible health plan"], "e": "HRAs are employer-funded; reimbursements are tax-free to employees, and unused amounts may carry over at the employer's discretion.", "m": "HRA = \"Handed over by the employer\": employer money only.", "c": ["hg_accounts"]}, {"id": "hg22", "t": "Types of Policies", "q": "Medicare supplement (Medigap) policies are designed to", "o": ["Fill gaps in Original Medicare, like deductibles", "Replace Medicare Part A hospital coverage for people over 65", "Provide long-term custodial care that Medicare does not cover", "Provide prescription drug coverage in place of Medicare Part D"], "e": "Medigap plans pay some or all of Medicare's cost-sharing; they are standardized by letter.", "m": "Medigap fills the GAPS: deductibles and coinsurance Original Medicare leaves.", "c": ["hg_medicare"]}, {"id": "hg23", "t": "Types of Policies", "q": "Medigap Plan A, the core plan, includes coverage of", "o": ["Part A coinsurance plus 365 extra hospital days", "Foreign travel emergency care up to plan limits", "The Part B excess charge above Medicare's approved amount", "The Part A deductible for each benefit period"], "e": "All Medigap plans include the basic benefits: Part A coinsurance plus 365 extra days, Part B coinsurance, the first 3 pints of blood, and Part A hospice coinsurance.", "m": "Plan A core: Part A coinsurance + 365 extra hospital days.", "c": ["hg_medicare"]}, {"id": "hg24", "t": "Types of Policies", "q": "The Medigap open enrollment period begins", "o": ["The first month a person is 65 or older and enrolled in Part B, and lasts 6 months", "The first month a person is 62 or older and enrolled in Part A, and lasts 3 months", "The month a person retires from employment, and lasts 12 months", "October 15 each year, and lasts until December 7"], "e": "During this 6-month period, insurers cannot deny or price based on health.", "m": "Medigap OE = \"65 + Part B, then 6 months\": a one-time window.", "c": ["hg_medicare"]}, {"id": "hg25", "t": "Types of Policies", "q": "Which Medigap plans are no longer available for purchase by people newly eligible for Medicare on or after January 1, 2020?", "o": ["Plans that cover the Part B deductible, such as C and F", "Plans that cover Part A coinsurance, such as A and B", "Plans with cost-sharing limits, such as K and L", "Plans that cover the Part B excess charge, such as G"], "e": "MACRA prohibits selling plans covering the Part B deductible (C, F, and high-deductible F) to people newly eligible on or after 1/1/2020.", "m": "New to Medicare in 2020 or later? No plans that pay the Part B deductible (C and F).", "c": ["hg_medicare"]}, {"id": "hg26", "t": "Types of Policies", "q": "A key difference between group and individual health insurance is that group coverage", "o": ["A master contract goes to the sponsor; members get certificates", "Each member must submit individual evidence of insurability to enroll", "Each member owns a separate policy issued directly by the insurer", "Members may change the group contract terms by majority vote"], "e": "In group insurance the employer or sponsor is the policyowner; members receive certificates.", "m": "Group = ONE master contract for the sponsor; members get certificates."}, {"id": "hg27", "t": "Types of Policies", "q": "Group insurance underwriting focuses on", "o": ["The characteristics of the group as a whole", "Each member's individual health history", "The producer's experience with similar groups", "Each member's credit report and income"], "e": "Groups must be formed for reasons other than buying insurance, which controls adverse selection.", "m": "Group underwriting looks at the GROUP, not individuals."}, {"id": "hg28", "t": "Types of Policies", "q": "COBRA applies to employers with at least", "o": ["20 employees", "10 employees", "50 employees", "100 employees"], "e": "Federal COBRA covers group health plans of employers with 20 or more employees.", "m": "COBRA = 20+ employees. (\"Twenty to trigger.\")", "c": ["hg_cobra"]}, {"id": "hg29", "t": "Types of Policies", "q": "Following termination of employment (other than for gross misconduct), COBRA continuation generally lasts up to", "o": ["18 months", "36 months", "6 months", "12 months"], "e": "Qualifying events such as termination or reduced hours allow 18 months; extensions apply for disability.", "m": "COBRA \"18 for the job\": termination or reduced hours = 18 months.", "c": ["hg_cobra"]}, {"id": "hg30", "t": "Types of Policies", "q": "A spouse who loses group coverage because of divorce from the covered employee may continue coverage under COBRA for up to", "o": ["36 months", "18 months", "29 months", "12 months"], "e": "Divorce, death of the employee, Medicare entitlement of the employee, and loss of dependent child status allow 36 months.", "m": "COBRA \"36 for the family\": divorce, death, Medicare entitlement or dependent loss = 36 months.", "c": ["hg_cobra"]}, {"id": "hg31", "t": "Types of Policies", "q": "Under COBRA, the maximum premium a former employee can be charged is generally", "o": ["102% of the group rate", "100% of the group rate", "150% of the group rate", "The individual market rate"], "e": "The employer may charge up to 102% (2% admin fee), or 150% during a disability extension.", "m": "COBRA max = 102%: the group rate plus a 2% admin charge.", "c": ["hg_cobra"]}, {"id": "hg32", "t": "Types of Policies", "q": "Long-term care policies typically trigger benefits when the insured", "o": ["Inability to do a set number of ADLs (often 2 of 6), or cognitive impairment", "Any hospital admission lasting at least 3 days, regardless of the cause", "Reaching age 65 while the policy has been in force for at least 5 years", "A physician's diagnosis of any chronic illness, regardless of daily functioning"], "e": "Tax-qualified LTC policies use ADL and cognitive impairment triggers.", "m": "LTC trigger = can't do the stated number of ADLs (often 2 of 6) OR cognitive impairment."}, {"id": "hg33", "t": "Types of Policies", "q": "Which is an activity of daily living (ADL) used in long-term care policies?", "o": ["Bathing", "Driving", "Cooking", "Managing finances"], "e": "Common ADLs are bathing, dressing, eating, toileting, transferring, and continence.", "m": "ADLs are basic self-care, like Bathing (along with dressing, eating, toileting, transferring, continence)."}, {"id": "hg34", "t": "Types of Policies", "q": "The level of long-term care that requires 24-hour care ordered by a physician and provided by licensed nurses is", "o": ["Skilled nursing care", "Custodial care", "Intermediate care", "Home health aide care"], "e": "Skilled care is the highest level; intermediate care is intermittent; custodial care assists with ADLs.", "m": "SKILLED = licensed nurses, 24-hour care, ordered by a doctor."}, {"id": "hg35", "t": "Types of Policies", "q": "Care that helps with ADLs and can be provided by persons without medical training is", "o": ["Custodial care", "Skilled care", "Intermediate care", "Acute care"], "e": "Custodial care is the most common LTC need and is generally not covered by Medicare.", "m": "CUSTODIAL = help with ADLs; no medical training needed."}, {"id": "hg36", "t": "Types of Policies", "q": "Respite care in a long-term care policy is designed to", "o": ["Give relief to an unpaid family caregiver", "Treat an acute illness in a hospital setting", "Provide rehabilitation following surgery", "Pay for adult day care for the insured's spouse"], "e": "Respite care temporarily relieves family caregivers.", "m": "RESPITE = a \"rest\" for the family caregiver."}, {"id": "hg37", "t": "Types of Policies", "q": "Dental insurance plans commonly classify services as", "o": ["Preventive, basic, and major, at different coinsurance", "Inpatient and outpatient, with the same deductible", "Medical and surgical, with a corridor deductible", "Accident and sickness, with separate maximums"], "e": "Preventive services are often covered at or near 100%, basic around 80%, and major around 50%.", "m": "Dental \"PBM\": Preventive, Basic, Major, each with its own coinsurance."}, {"id": "hg38", "t": "Types of Policies", "q": "Vision insurance typically covers", "o": ["Routine eye exams and allowances for lenses or frames", "Cataract surgery and treatment of eye diseases", "Hospital room charges for eye surgery", "Laser vision correction with no allowance limits"], "e": "Vision plans cover routine eye care; eye diseases are usually covered under medical plans.", "m": "Vision = routine exams + allowances for glasses."}, {"id": "hg39", "t": "Types of Policies", "q": "A cancer policy is an example of a", "o": ["Specified (dread) disease policy", "Comprehensive major medical policy", "Disability buyout policy", "Medicare supplement policy"], "e": "Specified disease policies pay benefits only for the named disease and are supplemental to other coverage.", "m": "Cancer policy = one named DREAD disease (a specified disease policy)."}, {"id": "hg40", "t": "Types of Policies", "q": "A critical illness policy typically pays", "o": ["A lump sum on diagnosis of a covered condition, such as stroke", "Hospital room charges for a covered condition, after a deductible", "A monthly income for life after diagnosis of a covered condition", "Lost wages for the period the insured is unable to work"], "e": "Benefits can be used for any purpose.", "m": "Critical illness = a lump sum on DIAGNOSIS."}, {"id": "hg41", "t": "Types of Policies", "q": "Hospital indemnity insurance pays", "o": ["A fixed daily amount while hospitalized, regardless of actual charges", "The actual hospital charges incurred, after a deductible and coinsurance", "The surgeon's fees for any procedure performed during a hospital stay", "Long-term custodial care costs following discharge from the hospital"], "e": "Hospital indemnity benefits are paid directly to the insured and supplement other coverage.", "m": "Hospital indemnity = a fixed daily cash amount, whatever the bill."}, {"id": "hg42", "t": "Types of Policies", "q": "Short-term medical insurance is designed to", "o": ["Provide temporary coverage during gaps, such as between jobs", "Provide lifetime coverage for people with preexisting conditions", "Replace Medicare for people who delay enrolling in Part B", "Cover dental and vision expenses not covered by a major medical plan"], "e": "Short-term plans are generally medically underwritten and not required to cover ACA essential health benefits; federal and state law limit their duration.", "m": "Short-term medical = a stopgap between coverages."}, {"id": "hg43", "t": "Types of Policies", "q": "A limited accident-only policy", "o": ["Pays benefits for accidents but not sickness", "Pays benefits for sickness but not accidents", "Pays all medical expenses after a deductible", "Replaces a major medical plan for an employer"], "e": "Accident-only policies exclude illness.", "m": "Accident-only = accidents yes, sickness no."}, {"id": "hg44", "t": "Types of Policies", "q": "Voluntary worksite insurance is typically", "o": ["Employer-offered but employee-paid, often by payroll deduction", "Paid entirely by the employer as a tax-free benefit for all employees", "Offered by the employer to executives only, on a nonqualified basis", "Required by state law for employers that do not offer workers compensation"], "e": "Worksite (voluntary) benefits are employee-paid and portable in many cases.", "m": "Voluntary worksite = \"employer offers, employee pays\" (payroll deduction)."}, {"id": "hg45", "t": "Types of Policies", "q": "Individual disability income policies purchased with after-tax dollars generally provide benefits that are", "o": ["Tax-free", "Fully taxable", "Taxed as capital gains", "Taxable above the premiums paid"], "e": "When the individual pays premiums with after-tax money, benefits are received tax-free.", "m": "Pay DI with after-tax dollars = tax-free benefits. (\"Tax now, free later.\")", "c": ["hg_tax"]}, {"id": "hg46", "t": "Types of Policies", "q": "Which disability policy is MOST appropriate for a small business owner worried about paying office rent if disabled?", "o": ["Business overhead expense", "Key employee disability", "Disability buyout", "Group long-term disability"], "e": "BOE reimburses covered business expenses during the owner's disability.", "m": "Rent worry for an owner = Business Overhead Expense."}, {"id": "hg47", "t": "Types of Policies", "q": "Under the ACA, insurers may not impose which of the following on essential health benefits?", "o": ["Lifetime or annual dollar limits", "Deductibles and coinsurance", "Copayments for office visits", "Out-of-pocket maximums"], "e": "ACA-compliant plans can use cost-sharing but cannot impose lifetime or annual dollar limits on essential health benefits.", "m": "ACA = no lifetime or annual dollar caps on essential health benefits."}, {"id": "hg48", "t": "Policy Provisions", "q": "Under the uniform entire contract provision for health policies, a change to the policy is valid only if", "o": ["Approved by an insurer officer and endorsed on or attached to the policy", "Approved by the producer and confirmed in writing to the insured within 30 days", "Requested by the insured in writing and recorded in the insurer's files", "Approved by the beneficiary and signed by the producer on the application"], "e": "Producers have no authority to change the policy or waive its provisions.", "m": "Changes need an OFFICER and paper: officer approval plus an endorsement or attachment."}, {"id": "hg49", "t": "Policy Provisions", "q": "The time limit on certain defenses (incontestable) provision in a health policy means that after the specified period,", "o": ["The insurer can't void it for application misstatements, unless fraudulent", "The insurer may contest the policy only for misstatements made by the producer", "The insured may no longer file claims for conditions that existed before issue", "The insurer may no longer change premiums for the insured's rating class"], "e": "Uniform provisions allow a contest only for fraudulent misstatements after the period (2 years from the date of issue in Illinois, 215 ILCS 5/357.3), and preexisting conditions not excluded by name cannot be used to deny claims after that period.", "m": "After the period, only fraud lets the insurer void it (Illinois: 2 years from issue)."}, {"id": "hg50", "t": "Policy Provisions", "q": "Under the uniform grace period provision, a health policy with monthly premiums must have a grace period of at least", "o": ["10 days", "7 days", "31 days", "30 days"], "e": "Grace periods are at least 7 days for weekly premiums, 10 days for monthly, and 31 days for all others.", "m": "Health grace \"7-10-31\": weekly 7, MONTHLY 10, everything else 31.", "c": ["hg_grace"]}, {"id": "hg51", "t": "Policy Provisions", "q": "Under the uniform grace period provision, a health policy with annual or quarterly premiums must have a grace period of at least", "o": ["31 days", "10 days", "7 days", "60 days"], "e": "The 31-day grace period applies to modes other than weekly or monthly.", "m": "\"7-10-31\": annual or quarterly falls in the \"everything else\" bucket = 31 days.", "c": ["hg_grace"]}, {"id": "hg52", "t": "Policy Provisions", "q": "Under the reinstatement provision, if the insurer does not respond to a reinstatement application within a certain time, the policy is automatically reinstated after", "o": ["45 days", "10 days", "30 days", "90 days"], "e": "If the insurer issues a conditional receipt and does not act within 45 days, the policy is reinstated automatically.", "m": "Reinstatement \"45 / 10\": automatic after 45 days of insurer silence; sickness waits 10 days.", "c": ["hg_reinstate"]}, {"id": "hg53", "t": "Policy Provisions", "q": "After a health policy is reinstated, sickness is covered only if it begins at least", "o": ["10 days after reinstatement", "Immediately after reinstatement", "30 days after reinstatement", "45 days after reinstatement"], "e": "Accidents are covered immediately upon reinstatement; sicknesses only if they begin more than 10 days later.", "m": "\"45 / 10\": sickness is covered only if it starts 10+ days after reinstatement (accidents right away).", "c": ["hg_reinstate"]}, {"id": "hg54", "t": "Policy Provisions", "q": "Under the notice of claim provision, the insured should give written notice of a claim within", "o": ["20 days after the loss, or as soon as reasonably possible", "60 days after the loss, or as soon as reasonably possible", "90 days after the loss, with no extension", "1 year after the loss, unless the insured lacks capacity"], "e": "The 20-day notice period is the uniform standard.", "m": "Claims ladder \"20-15-90-60\": notice 20, forms 15, proof 90, sue after 60.", "c": ["hg_claims"]}, {"id": "hg55", "t": "Policy Provisions", "q": "After receiving notice of claim, the insurer must furnish claim forms within", "o": ["15 days", "20 days", "30 days", "60 days"], "e": "If forms are not furnished within 15 days, the claimant may submit proof of loss in any written form.", "m": "\"20-15-90-60\": the insurer has 15 days to send claim forms.", "c": ["hg_claims"]}, {"id": "hg56", "t": "Policy Provisions", "q": "Under the proof of loss provision, proof generally must be submitted within", "o": ["90 days after the loss, but no later than 1 year absent incapacity", "20 days after the loss, but no later than 90 days absent incapacity", "15 days after the claim forms are received, with no extension", "3 years after the loss, unless the claimant lacks legal capacity"], "e": "Late proof is accepted if it was not reasonably possible to file on time, but no later than 1 year absent legal incapacity.", "m": "\"20-15-90-60\": proof of loss in 90 days (1 year max unless legally incapacitated).", "c": ["hg_claims"]}, {"id": "hg57", "t": "Policy Provisions", "q": "Under the time of payment of claims provision, benefits other than periodic payments must be paid", "o": ["Immediately upon receipt of due written proof of loss", "Within 60 days after receipt of written proof of loss", "Within 6 months after the notice of claim is filed", "After the 60-day waiting period for legal actions ends"], "e": "Periodic payments such as disability income must be paid at least monthly.", "m": "Lump-sum benefits: paid IMMEDIATELY on proof. (Periodic ones at least monthly.)", "c": ["hg_claims"]}, {"id": "hg58", "t": "Policy Provisions", "q": "Under the payment of claims provision, death benefits are paid to", "o": ["The named beneficiary, or the estate if none is named", "The insured's employer, who distributes them to the family", "The insured's estate, even if a beneficiary is named", "The policyowner, who then distributes them to the beneficiary"], "e": "All other benefits are paid to the insured.", "m": "Death benefit = named beneficiary first, estate as the fallback."}, {"id": "hg59", "t": "Policy Provisions", "q": "The physical examination and autopsy provision allows the insurer to", "o": ["Examine the insured at its own expense during a claim, and autopsy where legal", "Require the insured to pay for any exams requested while a claim is pending", "Examine the insured once before issue, but not while a claim is pending", "Perform an autopsy only if the beneficiary pays for it in advance"], "e": "Exams and autopsies are at the insurer's expense.", "m": "Insurer's dime, insurer's doctor: exams at its expense, autopsy where legal."}, {"id": "hg60", "t": "Policy Provisions", "q": "Under the legal actions provision, an insured may not sue the insurer until", "o": ["60 days after proof of loss has been furnished", "10 days after written notice of claim is given", "1 year after the date of the loss", "90 days after the claim forms are furnished"], "e": "Suits are also barred after 3 years (215 ILCS 5/357.12) from the time proof of loss is required.", "m": "\"20-15-90-60\": wait 60 days after proof to sue (and no later than 3 years).", "c": ["hg_claims"]}, {"id": "hg61", "t": "Policy Provisions", "q": "Under the change of beneficiary provision, unless the beneficiary designation is irrevocable,", "o": ["The owner may change it without the beneficiary's consent", "The owner may change it only with the beneficiary's written consent", "The insurer may change it at its discretion if the owner cannot be found", "The beneficiary may name a new beneficiary without the owner's consent"], "e": "A revocable beneficiary may be changed by the owner at any time.", "m": "Revocable = the owner can change it freely."}, {"id": "hg62", "t": "Policy Provisions", "q": "An insured misstated her age as younger than her true age. Under the misstatement of age provision, the insurer will", "o": ["Adjust benefits to what the premium would have bought at the correct age", "Cancel the policy and refund the premiums paid since the policy was issued", "Pay full benefits because the time limit on certain defenses has expired", "Pay full benefits and bill the insured for the premium difference"], "e": "This adjustment applies regardless of the time limit on certain defenses.", "m": "Lie about age = adjust benefits to what the premium buys at the true age."}, {"id": "hg63", "t": "Policy Provisions", "q": "Under the change of occupation provision, if an insured changes to a more hazardous occupation and does not tell the insurer,", "o": ["Benefits drop to what the premium buys at the riskier class", "The policy is void from the date of the change in occupation", "Benefits are paid in full, but the premium is increased at the next renewal", "Benefits are suspended until the insured returns to the original occupation"], "e": "If the insured moves to a less hazardous job, the insurer refunds excess premium upon notice.", "m": "Riskier job, not reported = the same premium buys less, so benefits drop."}, {"id": "hg64", "t": "Policy Provisions", "q": "The illegal occupation provision allows the insurer to deny a claim when", "o": ["The loss results from a felony or an illegal occupation", "The insured works two jobs in different occupational classes", "The insured is self-employed and cannot document lost income", "The insured changes to a more hazardous occupation without notice"], "e": "Losses that are a consequence of illegal activities are not covered.", "m": "Felony or illegal job = no claim."}, {"id": "hg65", "t": "Policy Provisions", "q": "The relation of earnings to insurance provision in a disability policy allows the insurer to", "o": ["Cut benefits if all coverage pays more than earnings at disability", "Increase benefits each year to keep pace with the insured's rising earnings", "Cancel the policy if the insured's earnings fall below a stated amount", "Require proof of the insured's earnings before each premium due date"], "e": "This optional provision limits overinsurance; affected premiums are refunded.", "m": "Relation of earnings = \"can't earn more disabled than working.\""}, {"id": "hg66", "t": "Policy Provisions", "q": "A free look provision in a health policy allows the insured to", "o": ["Return it within a set time after delivery for a full refund", "Skip a premium payment within a set period after the due date", "Cancel it at any time and receive a full refund of all premiums paid", "Have a denied claim reviewed within a set period after the denial"], "e": "Free look periods (commonly 10 days for individual health policies) begin at delivery.", "m": "Free look = \"look, then return for a full refund.\""}, {"id": "hg67", "t": "Policy Provisions", "q": "A probationary period in a health policy is", "o": ["A period after the effective date during which sickness is not covered", "The waiting period that must pass before benefits begin on each disability claim", "The period after a missed premium during which the policy remains in force", "The period after issue during which the insurer may contest misstatements"], "e": "Probationary periods apply once at policy issue and typically exclude illness (not accidents).", "m": "PROBATIONARY = a one-time sickness waiting period after the policy starts.", "c": ["hg_waits"]}, {"id": "hg68", "t": "Policy Provisions", "q": "The elimination period in a disability income policy is", "o": ["The days of disability that must pass before benefits begin", "The days after delivery during which the policy may be returned", "The maximum length of time benefits will be paid for a disability", "The days after issue during which illnesses are not covered"], "e": "A longer elimination period lowers the premium; it acts like a time deductible.", "m": "ELIMINATION = a \"time deductible\" at the start of each disability.", "c": ["hg_waits"]}, {"id": "hg69", "t": "Policy Provisions", "q": "Waiver of premium in a disability income policy usually", "o": ["Waives premiums after total disability lasts a set time, like 90 days", "Waives premiums from the first day of any total or partial disability", "Refunds all premiums paid if the insured never becomes disabled", "Waives premiums for accidental disabilities, but not for sickness"], "e": "Waiver of premium typically applies after 90 days (or the elimination period) of total disability, often retroactively.", "m": "Waiver of premium = disabled long enough (the stated waiting period), then premiums stop.", "c": ["hg_waits"]}, {"id": "hg70", "t": "Policy Provisions", "q": "Which exclusion is common in individual health and disability policies?", "o": ["Intentionally self-inflicted injuries", "Accidental injuries at home", "Treatment by a licensed physician", "Injuries while traveling abroad"], "e": "Common exclusions include self-inflicted injuries, war, military service, and certain elective procedures.", "m": "Self-inflicted on purpose = excluded."}, {"id": "hg71", "t": "Policy Provisions", "q": "Under the ACA, individual and group major medical plans", "o": ["May not exclude or charge more for preexisting conditions", "May impose a 12-month exclusion for preexisting conditions", "May decline applicants based on their health status", "May exclude mental health and substance use services"], "e": "Preexisting condition exclusions are prohibited for ACA-compliant plans; some supplemental and excepted benefits policies may still use them.", "m": "ACA: no preexisting-condition exclusions or surcharges."}, {"id": "hg72", "t": "Policy Provisions", "q": "A plan pays 80% of covered expenses after the deductible and the insured pays 20%. The 20% is the insured's", "o": ["Coinsurance", "Copayment", "Deductible", "Out-of-pocket maximum"], "e": "Coinsurance is percentage cost-sharing, usually up to an out-of-pocket maximum.", "m": "COinsurance = the percentage you CO-pay after the deductible.", "c": ["hg_costshare"]}, {"id": "hg73", "t": "Policy Provisions", "q": "An insured has a $1,000 deductible and 80/20 coinsurance. For a covered $6,000 claim (out-of-pocket maximum not reached), how much does the insurer pay?", "o": ["$4,000", "$4,800", "$5,000", "$5,200"], "e": "After the $1,000 deductible, the insurer pays 80% of $5,000 = $4,000; the insured pays $1,000 + $1,000 = $2,000.", "m": "$6,000 - $1,000 = $5,000; 80% of $5,000 = $4,000 paid by the plan.", "c": ["hg_costshare"]}, {"id": "hg74", "t": "Policy Provisions", "q": "A deductible is", "o": ["The amount the insured pays before the insurer pays benefits", "A percentage of each claim the insured shares with the insurer", "A flat amount the insured pays for each office visit", "The most the insured must pay out of pocket each year"], "e": "Deductibles may be per person, per family, per cause, or per calendar year.", "m": "Deductible = you pay first.", "c": ["hg_costshare"]}, {"id": "hg75", "t": "Policy Provisions", "q": "A corridor deductible applies", "o": ["Between basic plan benefits and the start of major medical", "Before any benefits are paid under the basic hospital plan", "Separately to each prescription filled under the plan", "After the out-of-pocket maximum has been reached"], "e": "The corridor deductible sits between the basic coverage and the major medical layer.", "m": "Corridor = the \"hallway\" between basic and major medical.", "c": ["hg_costshare"]}, {"id": "hg76", "t": "Policy Provisions", "q": "Eligible expenses under a health policy are", "o": ["Medically necessary services the policy covers", "Any expenses the insured incurs during the year", "Expenses submitted within 90 days of treatment", "Services the producer approved at application"], "e": "Charges not covered or not medically necessary are ineligible.", "m": "Eligible = covered AND medically necessary."}, {"id": "hg77", "t": "Policy Provisions", "q": "A copayment is", "o": ["A flat dollar amount for a service, like an office visit", "A percentage of each covered bill paid after the deductible", "The amount paid each year before the insurer begins paying", "The share of the premium the employee pays each pay period"], "e": "Copays are common in HMOs and PPOs.", "m": "COPAY = a flat dollar amount per visit.", "c": ["hg_costshare"]}, {"id": "hg78", "t": "Policy Provisions", "q": "A requirement that the insurer approve certain nonemergency procedures in advance is called", "o": ["Preauthorization (prior approval)", "Second surgical opinion", "Concurrent review", "Retrospective review"], "e": "Preauthorization (precertification) is a cost-containment tool; failure to obtain it may reduce benefits.", "m": "Preauthorization = \"ask before you operate.\""}, {"id": "hg79", "t": "Policy Provisions", "q": "Usual, reasonable, and customary (URC) charges are", "o": ["What providers in the area typically charge for a service", "The most a provider may legally bill for any service", "A national fee schedule set each year by Medicare", "The discounted rate a network provider has agreed to accept"], "e": "Charges above URC may be the insured's responsibility for out-of-network care.", "m": "URC = what \"most providers around here\" charge."}, {"id": "hg80", "t": "Policy Provisions", "q": "An impairment (exclusion) rider", "o": ["Excludes a specific condition the applicant has", "Adds coverage for a specified disease the insured names", "Increases the benefit each year by a set percentage", "Waives premiums during a covered hospitalization"], "e": "Impairment riders allow a policy to be issued while excluding a known condition (in policies where permitted).", "m": "Impairment rider = \"everything except THAT condition.\""}, {"id": "hg81", "t": "Policy Provisions", "q": "The guaranteed insurability rider on a disability income policy allows the insured to", "o": ["Buy more disability coverage at set times without medical underwriting", "Convert the disability policy to permanent life insurance at retirement", "Receive a lump-sum return of premium at a specified retirement age", "Have the monthly benefit increased automatically each year for inflation"], "e": "The insured must usually show financial need (increased income), but not medical insurability.", "m": "GIR = \"Guaranteed to buy more\" at set times, no medical questions. (Same idea as on life policies.)"}, {"id": "hg82", "t": "Policy Provisions", "q": "A future increase option on a disability policy allows the insured to", "o": ["Raise the benefit as income grows, without medical underwriting", "Lengthen the elimination period in exchange for a lower premium", "Lower the premium each year as the insured's income increases", "Add a spouse to the policy without evidence of insurability"], "e": "Increases require financial justification but no medical underwriting.", "m": "FIO = \"Future Income Option\": the benefit grows with your paycheck, no medical underwriting."}, {"id": "hg83", "t": "Policy Provisions", "q": "A noncancelable health policy means the insurer", "o": ["Can't cancel or raise premiums above those stated, to a set age", "Cannot cancel it to a specified age, but may raise premiums for a class", "Cannot cancel it during the policy year, but may decline to renew", "May cancel it at any time with written notice and a refund of premium"], "e": "Noncancelable is the strongest renewability provision and the most expensive.", "m": "NONCAN = \"No cancel, no change\": can't cancel and can't raise the stated premium, to a set age.", "c": ["hg_renew"]}, {"id": "hg84", "t": "Policy Provisions", "q": "A guaranteed renewable health policy", "o": ["Must renew to a set age, but rates may rise for a whole class", "Must be renewed to a specified age at premiums guaranteed at issue", "May be nonrenewed for an individual whose claims experience is poor", "May be canceled at any time with written notice to the insured"], "e": "Insurers cannot single out an individual for rate increases on a guaranteed renewable policy.", "m": "GUARANTEED renewable = renewal guaranteed, but class-wide rate hikes are allowed.", "c": ["hg_renew"]}, {"id": "hg85", "t": "Policy Provisions", "q": "A cancelable health policy allows the insurer to", "o": ["Cancel at any time with written notice and a refund of unearned premium", "Cancel only on the policy anniversary, for reasons stated in the policy", "Cancel only when the insured reaches age 65 or becomes eligible for Medicare", "Cancel only for nonpayment of premium or fraud in the application"], "e": "Cancellation does not affect claims for losses that occurred before the cancellation date.", "m": "Cancelable = the insurer can leave any time, with notice and a refund of unearned premium.", "c": ["hg_renew"]}, {"id": "hg86", "t": "Policy Provisions", "q": "An optionally renewable health policy", "o": ["May be renewed or not at the insurer's option on the anniversary date", "Must be renewed to age 65 unless the insured fails to pay the premium", "May be renewed at the insured's option, with rates guaranteed at issue", "May be canceled at any time during the term with written notice"], "e": "The insurer may decline to renew on the policy anniversary or premium due date.", "m": "OPTIONALLY renewable = the insurer's option at each anniversary.", "c": ["hg_renew"]}, {"id": "hg87", "t": "Policy Provisions", "q": "Which renewability provision is generally the MOST expensive for the insured?", "o": ["Noncancelable", "Guaranteed renewable", "Conditionally renewable", "Optionally renewable"], "e": "Because both coverage and premiums are guaranteed, noncancelable coverage costs the most.", "m": "Most protection = most cost: noncancelable is the priciest.", "c": ["hg_renew"]}, {"id": "hg88", "t": "Policy Provisions", "q": "A health insurance policy's consideration clause specifies", "o": ["The premium and the application are the insured's consideration", "The benefits the insurer will pay for each covered loss", "The beneficiary who will receive any death benefit", "The waiting period that applies before coverage begins"], "e": "The insurer's consideration is its promise to pay covered losses.", "m": "Your consideration = premium + application: \"pay and say.\""}, {"id": "hg89", "t": "Policy Provisions", "q": "The insuring clause in a health policy", "o": ["States the insurer's promise to pay for covered losses", "Lists all exclusions and limitations that apply to the policy", "Describes the premium modes and grace period available", "States who may change the beneficiary designation"], "e": "The insuring clause identifies the parties and the scope of coverage.", "m": "Insuring clause = the PROMISE to pay."}, {"id": "hg90", "t": "Policy Provisions", "q": "A lifetime maximum benefit limit on non-essential benefits is", "o": ["The most the policy pays over the insured's lifetime for that coverage", "The most the insured must pay out of pocket over the policy's lifetime", "The amount the insured must pay each year before benefits begin", "The most the policy pays for any single claim during a year"], "e": "Under the ACA, lifetime and annual dollar limits are prohibited only for essential health benefits; other coverages may still have limits.", "m": "Lifetime max = the ceiling over the insured's whole lifetime."}, {"id": "hg91", "t": "Policy Provisions", "q": "A per cause maximum limits", "o": ["The amount paid for each separate illness or injury", "The total premiums the insurer may charge for a policy", "The total benefits paid for each family member per year", "The coinsurance percentage for each covered service"], "e": "Per cause limits apply separately to each illness or injury.", "m": "Per cause = a separate cap for each illness or injury."}, {"id": "hg92", "t": "Policy Provisions", "q": "Which uniform provision is OPTIONAL rather than mandatory?", "o": ["Change of occupation", "Notice of claim", "Grace period", "Time limit on certain defenses"], "e": "Mandatory provisions include entire contract, time limit on certain defenses, grace period, reinstatement, notice of claim, claim forms, proof of loss, time of payment, payment of claims, physical exam and autopsy, legal actions, and change of beneficiary.", "m": "Change of occupation is optional; the core claim and premium clocks are mandatory."}, {"id": "hg93", "t": "Policy Provisions", "q": "A cancelable policy is canceled by the insurer. Claims for losses that occurred before cancellation are", "o": ["Still covered", "Denied", "Paid at 50%", "Refunded as premium"], "e": "Cancellation is prospective only.", "m": "Cancel doesn't erase the past: losses before cancellation are still paid.", "c": ["hg_renew"]}, {"id": "hg94", "t": "Social Insurance", "q": "Medicare Part A primarily covers", "o": ["Inpatient hospital, post-hospital SNF, hospice, some home health", "Physician services, outpatient care, and durable medical equipment", "Outpatient prescription drugs through private plans", "Long-term custodial care in a nursing home"], "e": "Part A is hospital insurance; most people pay no premium because they or a spouse paid Medicare taxes for at least 40 quarters.", "m": "Part A = \"A for Admitted\": inpatient hospital, post-hospital SNF, hospice.", "c": ["hg_medicare"]}, {"id": "hg95", "t": "Social Insurance", "q": "Medicare Part B primarily covers", "o": ["Physician services, outpatient care, and medical equipment", "Inpatient hospital stays and skilled nursing facility care", "Long-term custodial care in a nursing home", "Outpatient prescription drugs through private plans"], "e": "Part B is voluntary medical insurance with a monthly premium, an annual deductible, and generally 20% coinsurance.", "m": "Part B = \"B for Doctors' Bills\": physicians, outpatient, equipment.", "c": ["hg_medicare"]}, {"id": "hg96", "t": "Social Insurance", "q": "Medicare Part C refers to", "o": ["Medicare Advantage plans offered by private insurers", "Prescription drug plans offered by private insurers", "Medicare supplement Plan C sold by private insurers", "The joint federal-state Medicaid program"], "e": "Medicare Advantage plans (HMOs, PPOs, and others) replace Original Medicare Parts A and B and often include Part D drug coverage.", "m": "Part C = \"C for Choice\": Medicare Advantage through private insurers.", "c": ["hg_medicare"]}, {"id": "hg97", "t": "Social Insurance", "q": "Medicare Part D provides", "o": ["Prescription drug coverage through private plans", "Inpatient hospital coverage through the federal government", "Physician coverage through Medicare Advantage plans", "Long-term care coverage for low-income beneficiaries"], "e": "Part D is offered by private insurers approved by Medicare, as stand-alone plans or within Medicare Advantage.", "m": "Part D = \"D for Drugs.\"", "c": ["hg_medicare"]}, {"id": "hg98", "t": "Social Insurance", "q": "Medicare is generally available to people who are", "o": ["65 or older, on SSDI for 24 months, or with ESRD or ALS", "Any age with limited income and resources, as set by each state", "Under 65 with any chronic condition diagnosed by a physician", "Age 62 or older and eligible for Social Security retirement"], "e": "Medicaid, not Medicare, is based on financial need.", "m": "Medicare doors: 65, 24 months of SSDI, or ESRD/ALS.", "c": ["hg_medicare"]}, {"id": "hg99", "t": "Social Insurance", "q": "Medicare covers skilled nursing facility care only if", "o": ["It follows a 3-day hospital stay and is skilled care", "It follows a hospital stay of any length and is custodial care", "The beneficiary is under 65 and receives disability benefits", "It is provided for more than one year in a certified facility"], "e": "Medicare covers up to 100 days per benefit period (days 21-100 with a daily copay) and does not cover custodial care.", "m": "SNF = a 3-day inpatient stay first, and it must be skilled care.", "c": ["hg_medicare"]}, {"id": "hg100", "t": "Social Insurance", "q": "Which expense is NOT covered by Original Medicare?", "o": ["Long-term custodial care", "Inpatient hospital care", "Physician services", "Hospice care"], "e": "Medicare excludes custodial care, routine dental and vision care, and most care outside the U.S.", "m": "Medicare doesn't pay for long-term CUSTODIAL care.", "c": ["hg_medicare"]}, {"id": "hg101", "t": "Social Insurance", "q": "Medicaid is", "o": ["A joint federal-state program for people with limited income and resources", "A federal program that covers everyone 65 and older who paid payroll taxes", "A private insurance plan that supplements Original Medicare benefits", "A Social Security benefit for disabled workers under age 65"], "e": "Medicaid eligibility is need-based; in Illinois it is administered by the Department of Healthcare and Family Services.", "m": "Medicaid = \"aid\" for limited income, federal + state."}, {"id": "hg102", "t": "Social Insurance", "q": "Medicaid is an important source of payment for", "o": ["Nursing home care for those who meet financial eligibility rules", "Routine physician care for retirees with high incomes", "Emergency care received outside the United States", "Elective cosmetic procedures for low-income adults"], "e": "Many people spend down assets to qualify for Medicaid nursing home coverage.", "m": "Nursing home bills for people who qualify financially = Medicaid."}, {"id": "hg103", "t": "Social Insurance", "q": "Social Security disability benefits begin after a waiting period of", "o": ["5 full months of disability", "6 full months of disability", "90 days of disability", "12 months of disability"], "e": "The disability must also be expected to last at least 12 months or result in death.", "m": "SSDI cash: wait 5 full months. (\"5 to get paid, 24 to get Medicare.\")", "c": ["hg_medicare"]}, {"id": "hg104", "t": "Social Insurance", "q": "Social Security defines disability as the inability to", "o": ["Do any substantial gainful activity due to an impairment", "Perform the material duties of one's own occupation", "Work full time in one's own occupation for 30 days", "Perform at least 2 of the 6 activities of daily living"], "e": "This \"any occupation\" definition is stricter than most private policy definitions.", "m": "Social Security = \"ANY gainful work\": the strictest definition.", "c": ["hg_disab"]}, {"id": "hg105", "t": "Social Insurance", "q": "Original Medicare Part B generally pays what percentage of approved charges after the deductible?", "o": ["80%", "50%", "100%", "70%"], "e": "The beneficiary pays 20% coinsurance, which Medigap may cover.", "m": "Part B: Medicare pays 80%, you pay 20%.", "c": ["hg_medicare"]}, {"id": "hg106", "t": "Social Insurance", "q": "A person who receives Social Security disability benefits becomes eligible for Medicare after", "o": ["24 months of disability benefits", "5 months of disability benefits", "12 months of disability benefits", "36 months of disability benefits"], "e": "Medicare eligibility begins after 24 months of SSDI entitlement (immediately for ALS).", "m": "\"5 to get paid, 24 to get Medicare\": Medicare after 24 months of SSDI.", "c": ["hg_medicare"]}, {"id": "hg107", "t": "Social Insurance", "q": "Medicare Part A hospital benefits are measured by", "o": ["Benefit periods ending after 60 days in a row out of a hospital or SNF", "Calendar years that begin each January 1 with a new deductible", "Policy years that begin on the date of first enrollment in Part A", "A single lifetime period with a fixed number of covered days"], "e": "A new Part A deductible applies to each benefit period.", "m": "Benefit period resets after 60 days in a row out of a hospital or SNF.", "c": ["hg_medicare"]}, {"id": "hg108", "t": "Social Insurance", "q": "Which entity administers the Medicare program?", "o": ["The Centers for Medicare & Medicaid Services (CMS)", "The Social Security Administration acting alone", "Each state's department of insurance", "The Department of Labor's Benefits Security Administration"], "e": "CMS administers Medicare; SSA handles enrollment for many beneficiaries.", "m": "CMS runs Medicare (and Medicaid)."}, {"id": "hg109", "t": "Social Insurance", "q": "A person may be enrolled in both Medicare and Medicaid. Such a person is called", "o": ["Dual eligible", "Fully insured", "Currently insured", "Retired eligible"], "e": "For dual eligibles, Medicaid may pay Medicare premiums and cost-sharing.", "m": "Both programs = DUAL eligible."}, {"id": "hg110", "t": "Social Insurance", "q": "Social Security disability benefits are funded by", "o": ["Payroll taxes (FICA) paid by employees and employers", "General revenues of the states where workers reside", "Premiums paid by workers to private disability insurers", "Medicaid funds shared by the federal and state governments"], "e": "OASDI benefits are funded by FICA and self-employment taxes.", "m": "SSDI is funded by FICA payroll taxes."}, {"id": "hg111", "t": "Social Insurance", "q": "Which Social Security benefit category provides monthly benefits to the family of a deceased worker?", "o": ["Survivor benefits", "Retirement benefits", "Supplemental Security Income", "Medicare Part A"], "e": "Survivor benefits may go to a widow(er), children, and dependent parents.", "m": "Deceased worker's family = SURVIVOR benefits."}, {"id": "hg112", "t": "Other Insurance Concepts", "q": "Total disability under an \"own occupation\" definition means the insured", "o": ["Cannot perform the main duties of his or her own occupation", "Cannot work in any occupation suited to education and experience", "Is confined to a hospital or under a physician's care at home", "Can work part-time in his or her own occupation at reduced pay"], "e": "Own-occupation is the most liberal definition; \"any occupation\" is the strictest.", "m": "OWN occupation = \"MY job\": can't do my main duties.", "c": ["hg_disab"]}, {"id": "hg113", "t": "Other Insurance Concepts", "q": "Residual disability benefits pay", "o": ["A proportionate benefit for lost income after returning to work at reduced earnings", "The full benefit, but only while the insured remains totally disabled and unable to work", "A lump-sum benefit for dismemberment that results from a covered accident", "Medical expenses incurred during the elimination period of a disability"], "e": "Residual benefits are based on percentage of income lost.", "m": "RESIDUAL = pays for the income lost after returning at reduced earnings.", "c": ["hg_disab"]}, {"id": "hg114", "t": "Other Insurance Concepts", "q": "Partial disability benefits are typically paid", "o": ["When some duties can't be done, at a reduced benefit for a limited time", "For life, at 100% of the total disability benefit, once the insured returns to work", "Only after the insured has been totally disabled for at least 2 years", "As a lump sum equal to 12 months of the total disability benefit"], "e": "Partial disability usually must follow a period of total disability.", "m": "PARTIAL = can't do SOME duties, so a reduced benefit for a while.", "c": ["hg_disab"]}, {"id": "hg115", "t": "Other Insurance Concepts", "q": "A recurrent disability provision treats a recurrence of the same disability within a specified time as", "o": ["A continuation of the prior claim, with no new elimination period", "A new claim that requires a new elimination period to be met", "An excluded loss because the condition was preexisting", "A partial disability paid at 50% of the total benefit"], "e": "This protects the insured from having to satisfy a second elimination period.", "m": "Recurrent = same disability back within the window = same claim, no new elimination period.", "c": ["hg_waits"]}, {"id": "hg116", "t": "Other Insurance Concepts", "q": "Presumptive disability provisions typically provide total disability benefits for", "o": ["Loss of sight, hearing, speech, or two limbs, even if able to work", "Any illness that lasts at least 30 days and prevents full-time work", "Any back injury that requires physical therapy for 90 days or more", "Any hospital stay that lasts longer than the elimination period"], "e": "Presumptive disability is automatic for specified severe losses.", "m": "PRESUMPTIVE = presumed total for loss of sight, hearing, speech or two limbs.", "c": ["hg_disab"]}, {"id": "hg117", "t": "Other Insurance Concepts", "q": "Most individual and group health plans must allow dependent children to stay on a parent's plan until age", "o": ["26", "19", "21", "23"], "e": "The ACA requires coverage of dependent children up to age 26, regardless of studen
