<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IL Life &amp; Health Exam Prep</title>
<style>
:root{--bg:#f5f7fa;--card:#fff;--ink:#1d2733;--mut:#5b6876;--pri:#1f5fbf;--ok:#1e8e3e;--bad:#c5221f}
*{box-sizing:border-box}body{margin:0;font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--pri);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:18px;margin:0}header a{color:#fff;cursor:pointer;text-decoration:underline;font-size:14px}
main{max-width:760px;margin:0 auto;padding:16px}.card{background:var(--card);border-radius:10px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
button{font:inherit;border:0;border-radius:8px;padding:10px 14px;background:var(--pri);color:#fff;cursor:pointer;margin:4px 4px 4px 0}
button.sec{background:#e6ecf5;color:var(--ink)}button:disabled{opacity:.5}
.opt{display:block;width:100%;text-align:left;background:#eef2f7;color:var(--ink);padding:12px;margin:8px 0}
.opt.sel{outline:2px solid var(--pri)}.opt.ok{background:#dff3e4;outline:2px solid var(--ok)}.opt.bad{background:#fbe1e0;outline:2px solid var(--bad)}
.mut{color:var(--mut);font-size:14px}.tag{display:inline-block;background:#e6ecf5;border-radius:12px;padding:2px 8px;font-size:12px;margin-right:6px}
.exp{border-left:4px solid var(--pri);padding:8px 12px;background:#f0f5fd;margin-top:10px}
table{width:100%;border-collapse:collapse}td,th{padding:6px;border-bottom:1px solid #e3e7ec;text-align:left;font-size:14px}
.bar{height:8px;background:#e3e7ec;border-radius:4px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--pri)}
.row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}.timer{font-weight:700;font-variant-numeric:tabular-nums}
select{font:inherit;padding:8px;border-radius:8px}
.nav{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}.nav span{width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;border-radius:6px;background:#eef2f7;font-size:12px;cursor:pointer}
.nav span.a{background:#c9d8f0}.nav span.c{outline:2px solid var(--pri)}.nav span.f{background:#ffe8a3}
.mh{border-left:4px solid #2e7d32;background:#e8f5e9;padding:8px 12px;margin-top:10px;font-size:1.05em}.mh.sm{font-size:.9em;padding:4px 10px;opacity:.9}
button.weak{background:#b3261e}.tt label{display:block;margin:6px 0}.tt fieldset{border:1px solid #e3e7ec;border-radius:8px;margin:10px 0;padding:8px 12px}
.low{color:var(--bad);font-weight:700}
.cf{border-left:4px solid #e0a100;background:#fff8e1;padding:8px 12px;margin-top:10px}.cf table td{vertical-align:top}.cf h4{margin:6px 0}
</style></head><body>
<header><h1>IL Life &amp; Health Prep</h1><a onclick="home()">Home</a></header>
<main id="app"></main>
<script>
const DATA={"lg": {"name": "Life - General", "exam": {"n": 55, "scored": 50, "min": 75}, "topics": [{"name": "Types of Policies", "w": 15}, {"name": "Provisions and Riders", "w": 15}, {"name": "Application and Underwriting", "w": 12}, {"name": "Retirement and Other Concepts", "w": 8}], "qs": [{"id": "lg0", "t": "Types of Policies", "q": "Which type of life insurance provides level premiums, a level death benefit, and cash value, with premiums payable to the policy's maturity age (100 or 121)?", "o": ["Ordinary (straight) whole life", "Level term to age 65 with a return-of-premium feature", "Annually renewable term", "Decreasing term written to age 100"], "e": "Ordinary whole life has level premiums payable for life, a level face amount, and guaranteed cash value that equals the face at maturity.", "m": "\"Straight\" whole life = straight to the end: level premium, level benefit, paid for life."}, {"id": "lg1", "t": "Types of Policies", "q": "A 20-pay whole life policy differs from ordinary whole life in that it", "o": ["Builds cash value faster because premiums are compressed into 20 years", "Expires after 20 years unless the owner renews it for another term", "Provides coverage for 20 years and then converts to term automatically", "Has a lower annual premium because payments are spread out further"], "e": "Limited-pay policies compress premium payments into a shorter period, so premiums are higher and cash value builds faster, but coverage lasts for the whole of life.", "m": "Limited-pay squeezes the same lifetime coverage into fewer payments, so each payment is bigger and cash value grows faster."}, {"id": "lg2", "t": "Types of Policies", "q": "Which policy is purchased with one lump-sum premium and immediately creates significant cash value?", "o": ["Single-premium whole life", "Annually renewable term", "Flexible premium universal life", "Modified whole life"], "e": "Single-premium whole life is paid up with one premium and creates cash value immediately. Such policies are generally Modified Endowment Contracts.", "m": "ONE check, instant cash value: single premium = paid up on day one."}, {"id": "lg3", "t": "Types of Policies", "q": "Which feature is MOST characteristic of universal life insurance?", "o": ["Flexible premiums and an adjustable death benefit", "A fixed premium that is guaranteed for the life of the policy", "Premiums invested in separate accounts chosen by the owner", "A face amount that decreases on a set schedule"], "e": "Universal life unbundles mortality, expense, and cash value elements and lets the owner vary premiums and adjust the face amount within limits.", "m": "\"UL = U Like flexibility\": flexible premiums, adjustable death benefit."}, {"id": "lg4", "t": "Types of Policies", "q": "Under universal life Option B (Option 2), the death benefit equals", "o": ["The specified face amount plus the cash value", "The specified face amount, which includes the cash value", "The cash value plus the total of all premiums paid", "The specified face amount minus any outstanding loans and cash value"], "e": "Option B (increasing death benefit) pays the face plus accumulated cash value. Option A pays a level death benefit that includes the cash value.", "m": "Option B = \"Both\": face amount PLUS cash value. (Option A = Always level.)"}, {"id": "lg5", "t": "Types of Policies", "q": "A producer selling variable life insurance must hold a life insurance license with variable authority and", "o": ["A FINRA securities registration", "A real estate license", "A Certified Financial Planner designation", "Nothing further"], "e": "Variable products are securities, so the seller needs both a life/variable insurance license and FINRA registration (e.g., Series 6 or 7, usually with Series 63).", "m": "Variable = \"two licenses\": insurance license with variable authority PLUS FINRA registration."}, {"id": "lg6", "t": "Types of Policies", "q": "In a variable life policy, who bears the investment risk of the separate account?", "o": ["The policyowner", "The insurer", "The state guaranty association", "The producer"], "e": "Cash values of variable products are held in separate accounts, and the policyowner bears the investment risk. Cash value is not guaranteed.", "m": "Variable = \"you drive the investments, you take the risk.\" The owner bears it."}, {"id": "lg7", "t": "Types of Policies", "q": "Variable universal life combines", "o": ["Universal life premium flexibility with variable investment choices", "Level term coverage with a fixed annuity accumulation account", "Whole life premium guarantees with indexed annuity interest crediting", "Group term coverage with an individual conversion privilege"], "e": "VUL offers flexible premiums and an adjustable death benefit along with owner-directed separate account investments.", "m": "VUL = UL flexibility + Variable investing: the \"best of both\" combo."}, {"id": "lg8", "t": "Types of Policies", "q": "An indexed universal life policy credits interest to cash value based on", "o": ["An external market index, subject to a cap and a floor", "A fixed rate declared at issue and guaranteed for the life of the policy", "Separate account subaccounts selected and directed by the owner", "The insurer's annual dividend scale for participating policies"], "e": "Indexed life credits interest tied to an index such as the S&P 500, typically with a cap or participation rate and a minimum floor (often 0%).", "m": "Indexed = tied to an index, with a cap on top and a floor below; never invested directly."}, {"id": "lg9", "t": "Types of Policies", "q": "Interest-sensitive (current assumption) whole life differs from traditional whole life because", "o": ["Premiums or values may change with current interest and mortality", "It provides no cash value in exchange for a lower initial premium", "Its death benefit decreases annually to offset rising mortality costs", "Its cash value is invested in separate accounts chosen by the owner"], "e": "Current assumption whole life reflects current interest and mortality experience; favorable results can lower premiums or increase cash values, within guarantees.", "m": "\"Current assumption\" means current interest and mortality can move premiums or values."}, {"id": "lg10", "t": "Types of Policies", "q": "Which term policy has a face amount that declines over the policy period while the premium stays level?", "o": ["Decreasing term", "Level term", "Annually renewable term", "Return of premium term"], "e": "Decreasing term reduces the death benefit over time (often matched to a mortgage) while premiums usually remain level.", "m": "Decreasing term: the coverage shrinks like a mortgage balance while the premium stays put."}, {"id": "lg11", "t": "Types of Policies", "q": "Annually renewable term (ART) has which premium pattern?", "o": ["Premiums rise at each renewal with the insured's attained age", "Premiums stay level for the full period the policy is renewed", "Premiums decrease each year as the cash value grows", "Premiums are paid in one lump sum at issue"], "e": "ART renews each year without evidence of insurability, but the premium rises each year based on attained age.", "m": "ART: Annual Renewal = a Raise every year with attained age."}, {"id": "lg12", "t": "Types of Policies", "q": "A return of premium term policy", "o": ["Refunds some or all premiums if the insured outlives the term", "Builds a cash value the owner may borrow against during the term", "Costs less than standard level term for the same face amount", "Pays twice the face amount if death occurs during the term"], "e": "ROP term costs more than level term but refunds premiums paid if the insured survives the level term period (subject to policy conditions).", "m": "ROP term: \"outlive it, get it back\" (some or all of the premiums)."}, {"id": "lg13", "t": "Types of Policies", "q": "The renewable feature in a term policy allows the insured to", "o": ["Renew coverage for another term without evidence of insurability", "Change the policy to whole life without evidence of insurability", "Receive a refund of premium", "Increase the face amount without evidence of insurability"], "e": "Renewability lets the insured continue coverage for another term without proving insurability, at an attained-age premium.", "m": "RENEWABLE = same coverage, NEW TERM, no health questions."}, {"id": "lg14", "t": "Types of Policies", "q": "The convertible feature in a term policy allows the insured to", "o": ["Exchange it for permanent coverage without evidence of insurability", "Renew the policy for another term at the original issue-age premium", "Exchange the policy for an immediate annuity without a surrender charge", "Borrow against the policy's accumulated cash value at a fixed rate"], "e": "Convertibility permits exchanging term for a permanent policy without evidence of insurability, usually within a specified period.", "m": "CONVERTIBLE = term CHANGES into permanent, no health questions."}, {"id": "lg15", "t": "Types of Policies", "q": "When a term policy is converted using the attained-age method, the new permanent premium is based on", "o": ["The insured's age at the time of conversion", "The insured's age when the term policy was issued", "The average of the two ages", "The insured's age at retirement"], "e": "Attained-age conversion uses the current age. Original-age conversion uses the issue age but requires paying the premium difference.", "m": "Attained age = the age you've ATTAINED now, at conversion."}, {"id": "lg16", "t": "Types of Policies", "q": "Which statement about term life insurance is TRUE?", "o": ["It provides pure protection for a specified period and has no cash value", "It builds a cash value that the owner may borrow against during the term", "It costs more than whole life at the same age and face amount", "It endows at age 100 if the insured is still living at that time"], "e": "Term is temporary, pure protection with no (or minimal) cash value, which is why its initial premiums are lowest.", "m": "Term = \"pure protection, no piggy bank\": temporary and no cash value."}, {"id": "lg17", "t": "Types of Policies", "q": "During the accumulation period of a deferred annuity, the", "o": ["Owner pays premiums and the contract earns tax-deferred growth", "Annuitant receives income payments that are partly tax-free", "Insurer pays a death benefit equal to the face amount", "Contract's earnings are taxed to the owner each year as credited"], "e": "The accumulation (pay-in) period is when premiums are paid and values grow tax-deferred. The annuity (payout) period begins at annuitization.", "m": "Accumulation = \"pay in and grow\": premiums go in and growth is tax-deferred."}, {"id": "lg18", "t": "Types of Policies", "q": "An immediate annuity generally begins income payments", "o": ["Within one year of purchase", "After a deferral period of at least 10 years", "At the annuitant's required beginning date", "Following the death of the contract owner"], "e": "Immediate annuities are bought with a single premium and begin payments within one year (often one month).", "m": "Immediate = within a year. \"Immediate-ly within 12.\""}, {"id": "lg19", "t": "Types of Policies", "q": "Which annuity is purchased with one premium and begins payments at a later date?", "o": ["Single premium deferred annuity", "Single premium immediate annuity", "Flexible premium immediate annuity", "Periodic payment immediate annuity"], "e": "A SPDA takes one lump-sum premium and defers payout to a future date, allowing tax-deferred accumulation.", "m": "SPDA: Single Premium, Deferred payout. One check now, income later."}, {"id": "lg20", "t": "Types of Policies", "q": "A fixed annuity guarantees", "o": ["A minimum interest rate and fixed benefit payments", "Returns that track a selected stock portfolio", "Coverage of the contract under federal securities laws", "Benefit payments that rise with the Consumer Price Index"], "e": "Fixed annuities provide a guaranteed minimum interest rate and fixed payouts; the insurer bears the investment risk.", "m": "Fixed annuity = fixed promises: a minimum rate and fixed payments."}, {"id": "lg21", "t": "Types of Policies", "q": "During the payout period of a variable annuity, income payments are based on", "o": ["Annuity units whose value fluctuates with the separate account", "A fixed dollar amount guaranteed by the insurer's general account", "Accumulation units whose value is fixed at annuitization", "The change in the Consumer Price Index each year"], "e": "At annuitization accumulation units convert to annuity units; the number of units is fixed but their value varies with investment performance.", "m": "Payout uses Annuity units; Accumulation uses Accumulation units. \"A for Accumulation, A for Annuity: match the phase.\""}, {"id": "lg22", "t": "Types of Policies", "q": "A fixed indexed annuity typically", "o": ["Credits index-linked interest while protecting principal from losses", "Invests premiums directly in individual stocks chosen by the owner", "Requires the producer to hold a FINRA securities registration to sell it", "Guarantees the full return of the index each year with no cap"], "e": "Fixed indexed annuities credit interest tied to an index with caps or participation rates and protect principal from index losses; they are generally regulated as insurance.", "m": "Indexed annuity: upside linked to an index, downside protected."}, {"id": "lg23", "t": "Types of Policies", "q": "Which annuity payout option provides the HIGHEST monthly income for a given amount but pays nothing after the annuitant's death?", "o": ["Life only (straight life)", "Life with 10-year period certain", "Installment refund", "Joint and 100% survivor"], "e": "Life only pays the most per month because there is no guarantee to beneficiaries; payments stop at death.", "m": "Life only = highest check, zero leftovers. Maximum income, no beneficiary.", "c": ["lg_payout"]}, {"id": "lg24", "t": "Types of Policies", "q": "Under a life with 10-year period certain annuity, if the annuitant dies after 4 years,", "o": ["Payments continue to a beneficiary for the remaining 6 years", "Payments stop and the remaining value reverts to the insurer", "The beneficiary receives a lump-sum refund of all premiums paid", "The beneficiary receives payments for a new 10-year period"], "e": "Period certain guarantees payments for the stated period; a beneficiary receives the balance of that period if the annuitant dies early.", "m": "Period certain = guaranteed years: 10 promised, 4 used, so the beneficiary gets the other 6.", "c": ["lg_payout"]}, {"id": "lg25", "t": "Types of Policies", "q": "A cash refund annuity, upon the annuitant's early death, pays the beneficiary", "o": ["A lump sum equal to the purchase price minus benefits already paid", "Continued monthly payments for the rest of the beneficiary's life", "Installments of the remaining value over the original certain period", "The full purchase price plus interest, regardless of payments made"], "e": "Cash refund returns any excess of the purchase price over payments received in a lump sum. Installment refund pays the same difference in installments.", "m": "Cash refund = \"you get your money back\": purchase price minus what was paid, in one lump sum.", "c": ["lg_payout"]}, {"id": "lg26", "t": "Types of Policies", "q": "Which payout option continues payments as long as either of two annuitants is alive?", "o": ["Joint and survivor", "Joint life (first to die)", "Life with installment refund", "Life with period certain"], "e": "Joint and survivor continues payments (at 100% or a reduced percentage) until the second death. Joint life stops at the first death.", "m": "Joint and SURVIVOR: pays as long as a survivor is alive.", "c": ["lg_payout"]}, {"id": "lg27", "t": "Types of Policies", "q": "A joint life (first-to-die) policy pays the death benefit", "o": ["At the death of the first insured", "At the death of the last surviving insured", "At each insured's death, in equal amounts", "When the second insured dies within a set period after the first"], "e": "First-to-die pays when the first insured dies, then terminates; often used for business partners or two-income couples.", "m": "Joint life = \"first to die, first to pay.\""}, {"id": "lg28", "t": "Types of Policies", "q": "Survivorship (second-to-die) life insurance is MOST commonly used to", "o": ["Fund estate taxes at the second death of a married couple", "Replace a working spouse's income at the first death of the couple", "Provide lifetime income to the surviving spouse after the first death", "Fund a cross-purchase buy-sell agreement among several partners"], "e": "Second-to-die pays after both insureds die, matching estate taxes typically due after the surviving spouse's death; premiums are lower than for two separate policies.", "m": "Second-to-die = \"estate taxes come due when the second spouse dies.\""}, {"id": "lg29", "t": "Types of Policies", "q": "A family income policy combines", "o": ["Whole life with decreasing term", "Whole life with level term on children", "Universal life with an annuity", "Two whole life policies"], "e": "Family income policies add decreasing term to whole life so that monthly income is paid from the date of death to the end of a specified period.", "m": "Family INCOME = whole life + DECREASING term: income for the remaining years."}, {"id": "lg30", "t": "Types of Policies", "q": "A family policy (family protection plan) typically covers", "o": ["The primary insured with whole life and the spouse and children with term", "The children with whole life and the primary insured with decreasing term", "Each family member under a separate whole life policy with one premium", "The spouse with whole life and the primary insured and children with term"], "e": "Family policies combine permanent coverage on the primary insured with term on the spouse and children, with new children usually covered automatically.", "m": "Family plan: Dad or Mom get whole life (the main insured); the spouse and kids get term riders."}, {"id": "lg31", "t": "Types of Policies", "q": "Modified whole life is characterized by", "o": ["Lower premiums for the first few years, then a higher level premium", "A face amount that decreases on a schedule while the premium stays level", "Higher premiums for the first few years, then lower level premiums", "Premiums payable for 10 years, after which the policy is fully paid up"], "e": "Modified whole life charges lower premiums initially (e.g., 3-5 years) and a higher level premium afterward, with permanent coverage.", "m": "Modified = \"cheap now, higher later\": a low intro premium, then one higher level premium."}, {"id": "lg32", "t": "Types of Policies", "q": "Graded premium whole life differs from modified whole life in that", "o": ["Premiums increase gradually each year during the initial period before leveling off", "Premiums decrease gradually each year during the initial period before leveling off", "The death benefit increases each year while the premium stays level", "Premiums are payable for an initial period of 5 years only"], "e": "Graded premium starts low and increases annually for several years before leveling, rather than a single step-up.", "m": "Graded = \"step up the stairs\": gradual annual increases, then level."}, {"id": "lg33", "t": "Types of Policies", "q": "An endowment policy pays the face amount", "o": ["At death or at the maturity date, whichever occurs first", "At death after the maturity date has passed", "At the maturity date, if the insured is disabled at that time", "At the maturity date, but not at death before maturity"], "e": "Endowments mature when cash value equals face on a stated date; they pay at death before maturity, or to the owner at maturity.", "m": "Endowment = pays at death OR maturity, whichever comes first."}, {"id": "lg34", "t": "Types of Policies", "q": "Credit life insurance is usually written as", "o": ["Decreasing term with the creditor as beneficiary", "Whole life with the borrower's family as beneficiary", "An annuity paid to the borrower", "Level term with no beneficiary"], "e": "Credit life typically decreases as the debt is repaid and cannot exceed the outstanding debt; the creditor is beneficiary.", "m": "Credit life = decreasing term that shrinks with the loan, and the lender is the beneficiary."}, {"id": "lg35", "t": "Types of Policies", "q": "At the maturity age of a traditional whole life policy, the cash value", "o": ["Equals the face amount", "Equals one-half of the face amount", "Equals total premiums paid", "Is zero"], "e": "At maturity the cash value equals the face and the policy endows.", "m": "At maturity the cash value catches the face amount: they're equal."}, {"id": "lg36", "t": "Types of Policies", "q": "An adjustable life policy allows the owner to", "o": ["Change the face amount, premium, and coverage period within limits", "Direct the cash value into separate account subaccounts", "Increase the face amount at any time without evidence of insurability", "Receive guaranteed annual dividends based on the insurer's surplus"], "e": "Adjustable life lets the owner adjust premium, face, or period; face increases usually require evidence of insurability.", "m": "Adjustable life = \"adjust the dials\": face, premium and period, within limits."}, {"id": "lg37", "t": "Types of Policies", "q": "Which annuity premium arrangement lets the owner pay varying amounts at varying times?", "o": ["Flexible premium", "Single premium", "Level premium", "Fixed periodic premium"], "e": "Flexible premium annuities accept contributions of varying amounts and timing, subject to company minimums.", "m": "Flexible premium = \"pay what you want, when you want.\""}, {"id": "lg38", "t": "Types of Policies", "q": "Life insurance protects against dying too soon, while an annuity primarily protects against", "o": ["Living too long and outliving one's money", "Becoming disabled before retirement", "Medical expenses during retirement", "Dying before the accumulation period ends"], "e": "Annuities liquidate a sum over a lifetime, insuring against longevity risk.", "m": "Life insurance = dying too soon; annuity = living too long."}, {"id": "lg39", "t": "Types of Policies", "q": "Whose life determines the duration of payments under a life income annuity option?", "o": ["The annuitant", "The owner, if different from the annuitant", "The beneficiary", "The producer"], "e": "The annuitant is the measuring life for life-contingent payouts.", "m": "The ANNUITANT's lifespan drives annuity payments: \"Annuitant = the measuring life.\""}, {"id": "lg40", "t": "Types of Policies", "q": "Which product BEST meets a need for the maximum death benefit at the lowest initial premium for a temporary need?", "o": ["Term life", "Single-premium whole life", "Limited-pay whole life", "Endowment"], "e": "Term provides the largest death benefit per premium dollar for a temporary need.", "m": "Temporary need + biggest bang per buck = TERM."}, {"id": "lg41", "t": "Types of Policies", "q": "An annuity surrender charge is BEST described as", "o": ["An insurer charge on excess withdrawals in the early contract years", "A federal tax penalty on withdrawals made before age 59 1/2", "An insurer charge that applies to annuity payments after annuitization begins", "A state premium tax deducted from each contribution to the contract"], "e": "Surrender charges are contractual and usually decline over several years. They are separate from the IRS 10% penalty on withdrawals before age 59 1/2.", "m": "Surrender charge = \"early exit fee\" that fades over the first years."}, {"id": "lg42", "t": "Types of Policies", "q": "Which statement about indexed life insurance is TRUE?", "o": ["The owner does not directly participate in the stock market", "A securities registration is required to sell it in every state", "Cash value is credited with the full index return without a cap", "Index declines can reduce the cash value below the guaranteed floor"], "e": "Indexed products only reference the index; floors protect against index losses and caps limit gains.", "m": "Indexed = \"watching the market through the window, not in it.\""}, {"id": "lg43", "t": "Types of Policies", "q": "In a variable annuity, during the accumulation period the owner's contributions purchase", "o": ["Accumulation units", "Annuity units", "Paid-up additions", "Units of the general account"], "e": "Contributions buy accumulation units in the separate account; at annuitization they convert to annuity units.", "m": "Accumulation phase buys accumulation units: same word, same phase."}, {"id": "lg44", "t": "Provisions and Riders", "q": "Which provision states that the policy and the attached copy of the application make up the whole agreement?", "o": ["Entire contract", "Insuring clause", "Consideration clause", "Incontestable clause"], "e": "The entire contract provision means outside documents (such as company bylaws) are not part of the contract; only the policy and attached application count.", "m": "Entire contract = \"the policy + the application attached = the whole deal.\""}, {"id": "lg45", "t": "Provisions and Riders", "q": "The insuring clause in a life policy", "o": ["States the insurer's basic promise to pay the death benefit", "Lists the causes of death the policy excludes from coverage", "Describes the rights the policyowner may exercise", "Defines the length of the grace period for late premiums"], "e": "The insuring clause (insuring agreement) contains the basic promise to pay and identifies the parties.", "m": "Insuring clause = the PROMISE (\"we will pay\")."}, {"id": "lg46", "t": "Provisions and Riders", "q": "The consideration clause identifies the applicant's consideration as", "o": ["The premium and the application statements", "The insurer's promise to pay the death benefit", "The beneficiary designation on the application", "The producer's signature on the application"], "e": "The applicant gives the premium and application statements; the insurer gives its promise to pay.", "m": "Your consideration = premium + application statements: \"pay and say.\""}, {"id": "lg47", "t": "Provisions and Riders", "q": "A policyowner's rights typically include all of the following EXCEPT", "o": ["Changing the insurer's mortality table", "Naming and changing a revocable beneficiary", "Assigning the policy", "Borrowing against cash value"], "e": "Ownership rights include naming beneficiaries, assignment, loans, surrender, and selecting options; the owner cannot change the insurer's actuarial basis.", "m": "Owners control THEIR policy, not the insurer's actuarial tables."}, {"id": "lg48", "t": "Provisions and Riders", "q": "A beneficiary who receives proceeds only if the primary beneficiary has died before the insured is a", "o": ["Contingent beneficiary", "Irrevocable beneficiary", "Tertiary owner", "Collateral assignee"], "e": "The contingent (secondary) beneficiary takes only if no primary beneficiary survives the insured.", "m": "Contingent = \"in case\": the backup beneficiary."}, {"id": "lg49", "t": "Provisions and Riders", "q": "If an irrevocable beneficiary has been named, the policyowner", "o": ["Needs the beneficiary's consent to change beneficiaries or borrow", "May change the beneficiary without notifying the irrevocable beneficiary", "May surrender the policy for its cash value without the beneficiary's consent", "Loses the right to pay premiums or to receive policy dividends"], "e": "An irrevocable beneficiary has a vested interest; the owner needs consent for beneficiary changes, assignments, loans, or surrender.", "m": "Irrevocable = \"can't revoke without consent\": that beneficiary has a veto."}, {"id": "lg50", "t": "Provisions and Riders", "q": "If no beneficiary survives the insured and none is otherwise named, the proceeds are usually paid to", "o": ["The insured's estate", "The state", "The insurer's general account", "The producer of record"], "e": "Without a surviving beneficiary, proceeds generally go to the insured's estate, where they may be subject to probate and creditors.", "m": "No beneficiary left? The money goes to the insured's estate."}, {"id": "lg51", "t": "Provisions and Riders", "q": "Under the Uniform Simultaneous Death Act, when the insured and primary beneficiary die together and the order of death cannot be determined,", "o": ["Proceeds are paid as if the beneficiary died first", "Proceeds are paid as if the insured died first", "Proceeds are divided equally between the two estates", "Proceeds are paid to the primary beneficiary's estate"], "e": "The insured is presumed to have survived the beneficiary, so proceeds go to the contingent beneficiary or the insured's estate.", "m": "Simultaneous death: assume the BENEFICIARY died first, so the money stays in the insured's estate."}, {"id": "lg52", "t": "Provisions and Riders", "q": "A common disaster provision typically requires that the primary beneficiary", "o": ["Survive the insured by a stated period, such as 14 or 30 days", "Be related to the insured by blood, marriage, or adoption", "Be at least age 18 at the time of the insured's death", "Be named on the application before the policy is issued"], "e": "If the primary beneficiary does not survive for the stated period, proceeds go to the contingent beneficiary.", "m": "Common disaster = \"survive by X days\": a set survival period (e.g., 14 or 30 days)."}, {"id": "lg53", "t": "Provisions and Riders", "q": "Naming a minor child as a direct beneficiary can cause problems because", "o": ["Insurers won't pay large sums directly to a minor, so a guardian may be needed", "Insurance law prohibits naming anyone under age 18 as a beneficiary of a life policy", "Insurers must hold a minor's share until age 25 and pay double at that time", "The proceeds become taxable income to the minor at the parent's tax rate"], "e": "A guardian, trust, or UTMA custodian is usually needed for a minor to receive large proceeds.", "m": "Minors can't sign for big checks: a guardian may be needed."}, {"id": "lg54", "t": "Provisions and Riders", "q": "A beneficiary designation reading \"all my children\" is a", "o": ["Class designation", "Collateral assignment", "Revocable assignment", "Contingent ownership"], "e": "Class designations name a group rather than individuals, so later-born or adopted children may be included.", "m": "\"All my children\" = a CLASS of people."}, {"id": "lg55", "t": "Provisions and Riders", "q": "Under a per stirpes designation, if one of three named children dies before the insured,", "o": ["That child's share passes to his or her descendants", "That child's share is divided between the surviving children", "The insurer keeps that share", "That share goes to the insured's estate"], "e": "Per stirpes (by the branch) passes a deceased beneficiary's share to his or her heirs. Per capita divides only among living named beneficiaries.", "m": "Per stirpes = \"by the branch\": a deceased child's share flows down their own branch."}, {"id": "lg56", "t": "Provisions and Riders", "q": "The grace period provision allows", "o": ["Coverage to continue for a period after a missed premium due date", "The owner to return the policy for a refund within a period after delivery", "The insurer to contest the policy for a period after it is issued", "The owner to reinstate a lapsed policy within a set number of years"], "e": "During the grace period (30 days or one month for life policies) the policy stays in force; if death occurs, the overdue premium is deducted from the proceeds.", "m": "Grace = a cushion after a missed premium; coverage stays on. (Life in Illinois: 30 days or one month.)", "c": ["lg_clocks", "lg_31days"]}, {"id": "lg57", "t": "Provisions and Riders", "q": "If an insured dies during the grace period without having paid the overdue premium, the insurer will", "o": ["Pay the death benefit minus the overdue premium", "Deny the claim because the premium was unpaid", "Pay the death benefit plus a refund of the premium", "Pay the cash value instead of the death benefit"], "e": "The policy is still in force during grace, so the claim is paid less the premium due.", "m": "Die in grace: still covered, minus the premium owed.", "c": ["lg_clocks"]}, {"id": "lg58", "t": "Provisions and Riders", "q": "The automatic premium loan provision", "o": ["Uses cash value to pay a premium unpaid at the end of the grace period", "Uses the insurer's surplus to pay premiums the owner has missed", "Converts the policy to extended term when a premium goes unpaid", "Waives premiums while the insured is totally disabled"], "e": "APL borrows from cash value to pay an overdue premium and prevent lapse; it requires sufficient cash value.", "m": "APL = Auto-Pay from the Loan: cash value covers the missed premium.", "c": ["lg_clocks"]}, {"id": "lg59", "t": "Provisions and Riders", "q": "Which premium mode results in the LOWEST total annual cost?", "o": ["Annual", "Semiannual", "Quarterly", "Monthly"], "e": "More frequent modes add administrative and interest charges; annual payment costs the least overall.", "m": "Pay once a year, pay the least: annual mode has no installment charges."}, {"id": "lg60", "t": "Provisions and Riders", "q": "To reinstate a lapsed life policy, the owner generally must", "o": ["Prove insurability and pay overdue premiums with interest", "Submit a written request within 31 days, with no other conditions", "Pay a flat reinstatement fee set by the insurer at issue", "Apply for a new policy at the insured's current attained age"], "e": "Reinstatement requires an application, proof of insurability, and payment of back premiums plus interest (and any loans), within the reinstatement period (3 years in Illinois).", "m": "Reinstate = \"prove health + pay the back premiums with interest.\" (Illinois: within 3 years.)", "c": ["lg_clocks"]}, {"id": "lg61", "t": "Provisions and Riders", "q": "A policy loan outstanding at the insured's death will", "o": ["Be deducted from the death benefit", "Be forgiven by the insurer", "Be billed to the beneficiary separately", "Void the policy"], "e": "Unpaid loans and accrued interest reduce the death benefit.", "m": "Loans aren't forgiven at death: the balance comes off the top of the death benefit."}, {"id": "lg62", "t": "Provisions and Riders", "q": "Which nonforfeiture option provides the same face amount for a limited period of time?", "o": ["Extended term", "Reduced paid-up", "Cash surrender", "Automatic premium loan"], "e": "Extended term uses the net cash value as a single premium for term insurance equal to the face for as long as the value lasts; it is often the automatic option.", "m": "Extended term = SAME face, SHORTER time. \"Extend the time, keep the face.\"", "c": ["lg_nonforf"]}, {"id": "lg63", "t": "Provisions and Riders", "q": "Which nonforfeiture option provides a lower face amount of permanent coverage with no further premiums?", "o": ["Reduced paid-up", "Extended term", "Cash surrender", "Paid-up additions"], "e": "Reduced paid-up uses the cash value to buy a smaller, fully paid permanent policy.", "m": "Reduced paid-up = LOWER face, FOREVER, no more premiums.", "c": ["lg_nonforf"]}, {"id": "lg64", "t": "Provisions and Riders", "q": "Nonforfeiture options exist primarily to", "o": ["Keep the owner from losing the cash value if the policy lapses", "Protect the insurer from adverse selection when policies lapse", "Allow the insurer to cancel policies that have stopped paying premiums", "Guarantee that dividends will be paid on participating policies"], "e": "Standard nonforfeiture laws require that owners of cash value policies receive their equity (cash, reduced paid-up, or extended term).", "m": "Nonforfeiture = \"no forfeit\": you keep your cash value if the policy lapses.", "c": ["lg_nonforf"]}, {"id": "lg65", "t": "Provisions and Riders", "q": "For tax purposes, policy dividends on a participating policy are generally treated as", "o": ["A return of excess premium that is not taxable", "Taxable income in the year the dividend is paid", "A capital gain taxed when the dividend is paid", "Taxable interest earned on the policy's cash value"], "e": "Dividends are a return of overcharged premium and are not taxable until they exceed premiums paid. Interest earned on dividends left on deposit is taxable.", "m": "Dividends = a refund of overpaid premium, so not taxable."}, {"id": "lg66", "t": "Provisions and Riders", "q": "Which dividend option uses dividends to buy small amounts of fully paid permanent insurance?", "o": ["Paid-up additions", "Accumulation at interest", "Reduction of premium", "Cash"], "e": "Paid-up additions buy single-premium whole life at net rates without evidence of insurability, increasing death benefit and cash value.", "m": "Paid-up additions = mini permanent policies bought with dividends.", "c": ["lg_nonforf"]}, {"id": "lg67", "t": "Provisions and Riders", "q": "The one-year term dividend option buys", "o": ["One-year term, often limited to the cash value", "A small amount of paid-up permanent insurance", "An immediate annuity paying for one year", "Coverage that renews the base policy for one year"], "e": "The fifth dividend option buys one-year term, usually up to the cash value, with any remainder applied under another option.", "m": "One-year term option: dividends buy term, usually capped at the cash value.", "c": ["lg_nonforf"]}, {"id": "lg68", "t": "Provisions and Riders", "q": "A participating policy is one that", "o": ["May pay policy dividends to policyowners", "Guarantees a fixed dividend each policy year", "Is issued by a stock company to its stockholders", "Pays dividends to the stockholders of the insurer"], "e": "Participating policies (usually from mutual insurers) may pay non-guaranteed dividends to owners.", "m": "Participating = \"participates in dividends\": may pay them."}, {"id": "lg69", "t": "Provisions and Riders", "q": "The incontestable clause prevents an insurer from voiding a policy for material misstatements in the application after", "o": ["The policy has been in force a specified time, at most 2 years", "The policy has been in force for 30 days after delivery", "The first premium has been paid and the free look period has ended", "The insured has reached age 65 while the policy is in force"], "e": "After the contestable period the insurer cannot void the policy for misstatements, except for nonpayment of premium (and certain excepted benefits).", "m": "Incontestable: after at most 2 years, the application is settled.", "c": ["lg_clocks"]}, {"id": "lg70", "t": "Provisions and Riders", "q": "An absolute assignment of a life policy", "o": ["Transfers all ownership rights to the assignee", "Temporarily transfers part of the death benefit", "Is used only as loan collateral", "Takes effect only at the insured's death"], "e": "Absolute assignment is a permanent, complete transfer of ownership. Collateral assignment is temporary and partial.", "m": "ABSOLUTE = all rights, permanently. \"Absolute = all.\"", "c": ["lg_assign"]}, {"id": "lg71", "t": "Provisions and Riders", "q": "A collateral assignment to a lender gives the lender", "o": ["Repayment from the death proceeds of the outstanding debt", "Full and permanent ownership of the policy and all of its values", "The right to name itself as the primary beneficiary for the full face", "The right to surrender the policy for its cash value at its discretion"], "e": "Collateral assignees recover only the amount owed; the remainder goes to the beneficiary.", "m": "COLLATERAL = the lender only gets what's owed; the rest goes to the beneficiary.", "c": ["lg_assign"]}, {"id": "lg72", "t": "Provisions and Riders", "q": "If the insured commits suicide during the suicide exclusion period (commonly 2 years), the insurer typically", "o": ["Refunds the premiums paid", "Pays the full death benefit", "Pays the cash value plus dividends", "Pays one-half of the death benefit"], "e": "During the suicide exclusion period the insurer's liability is limited to a return of premium; afterward suicide is covered.", "m": "Suicide in the exclusion period = a premium refund, not the death benefit.", "c": ["lg_clocks"]}, {"id": "lg73", "t": "Provisions and Riders", "q": "An insured stated an age of 40 on the application but was actually 43 at issue. At death, the insurer will", "o": ["Adjust the benefit to what the premium would buy at the correct age", "Deny the claim because the misstatement was material to the insurer's acceptance", "Pay the full face amount because the incontestable period has expired", "Refund the premiums paid, plus interest, instead of paying the death benefit"], "e": "The misstatement of age provision adjusts benefits to what the premium would have bought at the true age, regardless of the incontestable clause.", "m": "Age lie = adjust the benefit, not cancel: what the premium buys at the true age."}, {"id": "lg74", "t": "Provisions and Riders", "q": "Which settlement option pays proceeds over a specified number of years, with payment size determined by the period chosen?", "o": ["Fixed period", "Fixed amount", "Interest only", "Life income with period certain"], "e": "Fixed period sets the duration and payment size follows. Fixed amount sets the payment and the duration varies.", "m": "Fixed PERIOD = fix the time, and the time sets the check size."}, {"id": "lg75", "t": "Provisions and Riders", "q": "Under the interest only settlement option,", "o": ["The insurer holds the proceeds and pays only the interest to the beneficiary", "The principal and interest are paid out in equal installments over a set period", "The beneficiary receives a lifetime income based on life expectancy", "The proceeds are paid in a lump sum and the interest is paid later"], "e": "The principal is retained (often for later distribution) and the interest paid is taxable.", "m": "Interest only = the insurer keeps the principal and sends just the interest."}, {"id": "lg76", "t": "Provisions and Riders", "q": "An accelerated death benefit provision allows", "o": ["Part of the death benefit paid early if the insured is terminally ill", "A loan from a third party, secured by the policy's death benefit", "A refund of all premiums paid if the insured becomes terminally ill", "An additional benefit equal to the face amount for accidental death"], "e": "Accelerated benefits pay a portion of the face while the insured is living with a qualifying (e.g., terminal) condition; the death benefit is reduced accordingly.", "m": "Accelerated = \"advance on the death benefit\" for terminal illness."}, {"id": "lg77", "t": "Provisions and Riders", "q": "The waiver of premium rider", "o": ["Waives premiums during total disability, after a waiting period", "Waives premiums if the insured becomes involuntarily unemployed", "Refunds the premiums paid if the insured survives to the end of the term", "Pays a monthly income to the insured during total disability"], "e": "Waiver of premium keeps the policy in force without premium during total disability, usually after a 6-month waiting period, often retroactively.", "m": "Waiver of premium = \"disabled, so stop billing\" (after a waiting period)."}, {"id": "lg78", "t": "Provisions and Riders", "q": "On a universal life policy, the rider comparable to waiver of premium is", "o": ["Waiver of monthly deduction", "Guaranteed insurability", "Cost of living adjustment", "Payor benefit"], "e": "Because UL premiums are flexible, the rider waives the monthly cost of insurance and expense deductions during disability.", "m": "UL version = waive the MONTHLY DEDUCTION (cost of insurance and expenses)."}, {"id": "lg79", "t": "Provisions and Riders", "q": "The guaranteed insurability rider allows the insured to", "o": ["Buy more coverage at set dates or events without proof of insurability", "Convert term coverage to permanent coverage without evidence of insurability", "Have premiums waived during a total disability after a waiting period", "Receive an additional benefit if death results from an accident"], "e": "GIR permits additional purchases at option ages or events such as marriage or birth of a child, without proving insurability.", "m": "GIR = \"Guaranteed to buy more\" at set dates or life events, no health questions."}, {"id": "lg80", "t": "Provisions and Riders", "q": "An accidental death rider that pays an additional amount equal to the face for accidental death is often called", "o": ["Double indemnity", "Payor benefit", "Return of premium", "Survivorship"], "e": "AD riders pay an extra amount if death results from a covered accident, typically within 90 days of the accident.", "m": "Double indemnity = double pay for accidental death."}, {"id": "lg81", "t": "Provisions and Riders", "q": "Under an AD&D rider, the principal sum is paid for", "o": ["Accidental death or loss of two limbs or sight in both eyes", "Death from any cause within 90 days of an accident", "Loss of one hand, one foot, or the sight of one eye", "Disability from an accident lasting longer than 90 days"], "e": "AD&D pays the principal sum for accidental death or double dismemberment and a capital sum (a percentage) for single losses.", "m": "AD&D principal sum = death, or a \"big two\" loss (two limbs or sight in both eyes)."}, {"id": "lg82", "t": "Provisions and Riders", "q": "A cost of living rider", "o": ["Increases the face amount periodically based on the CPI", "Lowers the premium periodically based on an index such as the CPI", "Pays the insured's living expenses during a terminal illness", "Increases the cash value periodically by a guaranteed interest rate"], "e": "COLA riders increase coverage to keep pace with inflation, usually without evidence of insurability.", "m": "COLA rider = face rises with the CPI."}, {"id": "lg83", "t": "Provisions and Riders", "q": "A term rider on a whole life policy covering the insured's spouse is an example of", "o": ["An other-insured rider", "A payor benefit rider", "A guaranteed insurability rider", "A cost of living rider"], "e": "Other-insured (spouse/children) riders add term coverage on family members under the base policy.", "m": "Other-insured rider = coverage for someone OTHER than the insured (e.g., a spouse)."}, {"id": "lg84", "t": "Provisions and Riders", "q": "A juvenile policy rider that waives premiums if the adult premium payer dies or becomes disabled is the", "o": ["Payor benefit rider", "Guaranteed insurability rider", "Accidental death rider", "Cost of living rider"], "e": "The payor benefit rider waives premiums on a child's policy if the payor dies or is disabled, usually until the child reaches a stated age.", "m": "Payor benefit = protects the kid's policy if the PAYOR (the adult) dies or is disabled."}, {"id": "lg85", "t": "Provisions and Riders", "q": "A long-term care rider on a life policy generally", "o": ["Use of part of the death benefit for qualified long-term care", "Pays hospital and surgical expenses when the insured is admitted for care", "Doubles the death benefit if the insured dies in a nursing facility", "Waives the suicide exclusion if the insured is in long-term care"], "e": "LTC riders accelerate the death benefit when the insured cannot perform activities of daily living or is cognitively impaired.", "m": "LTC rider = spend part of the death benefit on long-term care while alive."}, {"id": "lg86", "t": "Provisions and Riders", "q": "Which exclusion would eliminate coverage for death while flying as a private pilot but not as a fare-paying commercial airline passenger?", "o": ["Aviation exclusion", "War exclusion", "Suicide exclusion", "Dangerous occupation exclusion"], "e": "Aviation exclusions commonly exclude non-commercial or private flying while covering fare-paying passengers on scheduled airlines.", "m": "Aviation exclusion targets private piloting; fare-paying passengers are fine."}, {"id": "lg87", "t": "Provisions and Riders", "q": "A war exclusion that excludes death from any cause while the insured is in military service is a", "o": ["Status clause", "Results clause", "Common disaster clause", "Spendthrift clause"], "e": "Under a status clause, death while in service is excluded regardless of cause. Under a results clause, only death resulting from war is excluded.", "m": "STATUS clause = excluded because of your military STATUS, any cause of death."}, {"id": "lg88", "t": "Provisions and Riders", "q": "An applicant who is a commercial deep-sea diver will most likely receive", "o": ["A rated policy or a dangerous occupation exclusion", "A preferred rating with an aviation exclusion", "A decline, since hazardous occupations are uninsurable", "A standard rating with a waiver of premium rider"], "e": "Hazardous occupations are handled with extra premium (rating) or an exclusion rider.", "m": "Hazardous job = rated premium or an exclusion."}, {"id": "lg89", "t": "Provisions and Riders", "q": "A spendthrift clause protects", "o": ["A beneficiary's unpaid proceeds from the beneficiary's creditors", "The insurer from claims submitted with fraudulent or altered proof of death", "The owner from lapse by paying premiums from the cash value", "The insured's estate from creditors after the proceeds are paid to it"], "e": "A spendthrift clause prevents the beneficiary from assigning future installments and shields them from creditors until paid.", "m": "Spendthrift = shields unpaid proceeds from the beneficiary's creditors."}, {"id": "lg90", "t": "Provisions and Riders", "q": "A partial withdrawal from a universal life policy generally", "o": ["Reduces cash value, may reduce the death benefit, and isn't repaid", "Must be repaid with interest or it is deducted from the death benefit", "Has no effect on the cash value or the death benefit of the policy", "Is taxed as ordinary income in full, regardless of premiums paid"], "e": "UL withdrawals are not loans; for non-MECs they are generally taxed FIFO (basis first).", "m": "Withdrawals aren't loans: they reduce cash value, aren't repaid, and may cut the death benefit."}, {"id": "lg91", "t": "Provisions and Riders", "q": "A return of premium rider is usually structured as", "o": ["Increasing term insurance equal to premiums paid", "Decreasing term equal to the premiums still unpaid", "Paid-up additions purchased with each premium", "A deferred annuity credited with each premium"], "e": "The ROP rider adds increasing term so that the beneficiary receives the face plus premiums paid if death occurs within a set period.", "m": "ROP rider = increasing term that grows with the premiums paid."}, {"id": "lg92", "t": "Provisions and Riders", "q": "A disability income rider on a life policy", "o": ["Pays a monthly income if the insured is totally disabled", "Waives premiums during disability but pays no income benefit", "Pays double the death benefit if disability precedes death", "Increases the face amount each year the insured is disabled"], "e": "Some life policies offer a disability income rider paying a monthly amount (often a percentage of face) during total disability.", "m": "DI rider = a monthly check while totally disabled."}, {"id": "lg93", "t": "Provisions and Riders", "q": "Which provision lets an owner use a policy's cash value as the sole security for a loan from the insurer?", "o": ["Policy loan provision", "Assignment provision", "Reinstatement provision", "Entire contract provision"], "e": "Cash value policies must offer loans (in Illinois, once the policy has been in force 3 full years) secured by the cash value.", "m": "Policy loan = borrow against your own cash value."}, {"id": "lg94", "t": "Application and Underwriting", "q": "Who must sign a life insurance application?", "o": ["The proposed insured, the owner (if different), and the producer", "The policyowner and the primary beneficiary, but not the producer", "The producer and the insurer's underwriter, but not the insured", "The proposed insured and the beneficiary, if the owner is the same"], "e": "The applicant/owner and the insured (if different) sign, and the producer signs as soliciting agent. A minor's application may require a parent's signature.", "m": "Three signatures: insured, owner (if different) and producer."}, {"id": "lg95", "t": "Application and Underwriting", "q": "If an applicant answers a question incorrectly on the application, the producer should", "o": ["Correct it and have the applicant initial it, or use a new application", "Correct it and initial the change himself, then note it in the producer report", "Use correction fluid, write in the correct answer, and resubmit the form", "Leave the answer as written and explain the error in a separate letter"], "e": "Changes must be initialed by the applicant; erasures or correction fluid are not acceptable.", "m": "Mistake on the app? Fix it and have the applicant initial it, or start a new app."}, {"id": "lg96", "t": "Application and Underwriting", "q": "If an application is submitted with unanswered questions and the insurer issues the policy anyway,", "o": ["The insurer has waived its right to the missing information", "The policy is void from the date of issue for lack of required information", "The producer becomes personally liable for any claims related to the answers", "The insurer may rescind the policy at any time based on the missing answers"], "e": "By issuing the policy despite an incomplete application, the insurer waives the unanswered items.", "m": "Issued with blanks = waived. The insurer can't complain later."}, {"id": "lg97", "t": "Application and Underwriting", "q": "Statements made by an applicant that are true to the best of the applicant's knowledge are", "o": ["Representations", "Warranties", "Concealments", "Stipulations"], "e": "Applicant statements are representations; only material misrepresentations can void a policy. Warranties are guaranteed true and strictly enforced.", "m": "REPRESENTATION = \"true to my knowledge\" (best belief).", "c": ["lg_statements"]}, {"id": "lg98", "t": "Application and Underwriting", "q": "A statement guaranteed to be literally true that, if false, can void the contract is a", "o": ["Warranty", "Representation", "Waiver", "Consideration"], "e": "Warranties are absolute statements that become part of the contract; in life and health insurance applicant statements are generally representations.", "m": "WARRANTY = \"guaranteed literally true.\"", "c": ["lg_statements"]}, {"id": "lg99", "t": "Application and Underwriting", "q": "Intentionally withholding a material fact from the insurer is", "o": ["Concealment", "Waiver", "Estoppel", "Misrepresentation by the insurer"], "e": "Concealment can make a contract voidable during the contestable period.", "m": "CONCEALMENT = intentionally hiding a material fact.", "c": ["lg_statements"]}, {"id": "lg100", "t": "Application and Underwriting", "q": "When a producer collects the initial premium with the application, the producer should", "o": ["Give the applicant a premium receipt", "Hold the check until the policy is issued", "Deposit it in a personal account", "Return it if the applicant is healthy"], "e": "Collecting the premium with the application and issuing a receipt can give interim coverage and is best practice.", "m": "Money taken = receipt given.", "c": ["lg_receipts"]}, {"id": "lg101", "t": "Application and Underwriting", "q": "Under a conditional receipt, coverage is effective as of the application (or exam) date provided that", "o": ["The applicant is found insurable as applied for", "The applicant pays the full annual premium in advance", "The policy is delivered and signed for by the owner", "The beneficiary countersigns the receipt"], "e": "Conditional receipt coverage applies only if the applicant meets the insurer's underwriting standards.", "m": "Conditional receipt = coverage IF insurable as applied for.", "c": ["lg_receipts"]}, {"id": "lg102", "t": "Application and Underwriting", "q": "A binding receipt", "o": ["Provides coverage from the application date until the insurer acts, even if later declined", "Provides coverage from the application date only if the applicant is later approved as applied for", "Provides coverage from the date the policy is delivered and the first premium is paid", "Provides coverage from the medical exam date for applicants under age 50 only"], "e": "Binding receipts provide immediate temporary coverage, usually for a limited time or until the insurer acts.", "m": "Binding receipt = covered now, even if later declined, until the insurer acts.", "c": ["lg_receipts"]}, {"id": "lg103", "t": "Application and Underwriting", "q": "If no premium is collected with the application, coverage generally begins when", "o": ["The policy is delivered, premium paid, and good-health statement signed", "The application is signed and the producer submits it to the insurer", "The medical exam is completed and the results are sent to the insurer", "The insurer approves the application and mails the policy to the producer"], "e": "Without an initial premium, the producer collects it at delivery, often with a statement of continued good health.", "m": "No premium up front = no coverage until delivery: pay, sign the health statement, then covered.", "c": ["lg_receipts"]}, {"id": "lg104", "t": "Application and Underwriting", "q": "Under the Fair Credit Reporting Act, an applicant must be notified that an investigative consumer report may be requested", "o": ["No later than 3 days after the report is requested", "No later than 3 days after the policy is issued", "Only when the insurer declines or rates the applicant", "At least 30 days before the report is requested"], "e": "FCRA requires written notice within 3 days of requesting an investigative consumer report.", "m": "FCRA investigative report: tell them within 3 days of requesting it."}, {"id": "lg105", "t": "Application and Underwriting", "q": "If an insurer takes adverse action based on a consumer report, it must", "o": ["Tell the applicant and give the reporting agency's name and address", "Inform the applicant and provide a copy of the underwriter's notes", "Refund the premium with 10% interest and keep the reason confidential", "Notify the state insurance department of the adverse decision"], "e": "FCRA requires disclosure of the agency so the consumer can obtain and dispute the report.", "m": "Adverse action = tell them, and name the reporting agency."}, {"id": "lg106", "t": "Application and Underwriting", "q": "The Medical Information Bureau (MIB) is", "o": ["A nonprofit through which member insurers share coded medical data", "A federal agency that collects and issues applicants' complete medical records", "A reinsurer that shares the mortality risk on large policies issued by members", "A consumer reporting agency that compiles applicants' credit histories"], "e": "MIB helps detect omissions or fraud; insurers cannot decline solely on MIB data and must notify applicants of its use.", "m": "MIB = the insurers' medical \"information exchange\" (a nonprofit)."}, {"id": "lg107", "t": "Application and Underwriting", "q": "The tendency of higher-risk people to seek insurance more often than average risks is called", "o": ["Adverse selection", "Moral hazard", "Morale hazard", "Speculative risk"], "e": "Underwriting and risk classification counteract adverse selection.", "m": "Adverse selection = the riskiest people line up first."}, {"id": "lg108", "t": "Application and Underwriting", "q": "An applicant with a moderate heart condition who is charged an extra premium is classified as", "o": ["Substandard (rated)", "Preferred", "Standard", "Uninsurable"], "e": "Substandard risks are accepted with higher premiums, ratings, or exclusions.", "m": "Extra premium for a health issue = substandard (rated)."}, {"id": "lg109", "t": "Application and Underwriting", "q": "Which classification is given to an applicant with better-than-average health and habits?", "o": ["Preferred", "Standard", "Substandard", "Uninsurable"], "e": "Preferred risks (e.g., nonsmokers in excellent health) receive lower than standard rates.", "m": "Better than average = Preferred."}, {"id": "lg110", "t": "Application and Underwriting", "q": "For a life policy to be valid, insurable interest must exist", "o": ["At the time of application", "At the time of the insured's death", "At application and again at the insured's death", "At each premium due date"], "e": "In life insurance, insurable interest is required at inception; it need not exist at death.", "m": "Life insurable interest: at APPLICATION only."}, {"id": "lg111", "t": "Application and Underwriting", "q": "Which relationship would NOT generally provide insurable interest in another person's life?", "o": ["A neighbor", "A spouse", "A business partner", "A creditor, to the extent of the debt"], "e": "Insurable interest arises from family love and affection, financial dependence, or business relationships.", "m": "A neighbor has no financial stake in your life."}, {"id": "lg112", "t": "Application and Underwriting", "q": "An arrangement in which investors induce seniors to buy large policies to be transferred to the investors is called", "o": ["Stranger-originated life insurance (STOLI)", "A viatical settlement initiated by the insured", "Key person insurance", "A collateral assignment"], "e": "STOLI/IOLI arrangements are initiated for investors lacking insurable interest and are prohibited or restricted.", "m": "STOLI = a STRANGER-originated policy: strangers bankroll seniors' policies."}, {"id": "lg113", "t": "Application and Underwriting", "q": "Under HIPAA, an applicant's protected health information", "o": ["May be used or disclosed only as permitted, with authorization when required", "May be shared with marketers once the policy has been issued", "May be used for underwriting only if the producer requests it", "Becomes public record once submitted with an insurance application"], "e": "HIPAA privacy rules restrict the use and disclosure of PHI.", "m": "HIPAA = \"use only as permitted, with authorization when required.\""}, {"id": "lg114", "t": "Application and Underwriting", "q": "Before an insurer tests an applicant for HIV, the applicant must generally", "o": ["Give informed written consent", "Be at least age 21", "Be referred by a physician", "Pay a separate testing fee"], "e": "HIV testing for underwriting requires written informed consent and confidential handling of results.", "m": "HIV test = informed WRITTEN consent first."}, {"id": "lg115", "t": "Application and Underwriting", "q": "The USA PATRIOT Act requires insurers offering covered products to", "o": ["Maintain anti-money laundering programs and report suspicious activity", "Accept cash premiums of any size without reporting them", "Insure all applicants regardless of risk classification", "Verify the identity of applicants for group policies only"], "e": "Insurers issuing covered products (e.g., cash value life and annuities) must have AML programs, train producers, and file SARs.", "m": "PATRIOT Act = AML program plus suspicious activity reports."}, {"id": "lg116", "t": "Application and Underwriting", "q": "A red flag of possible money laundering is an applicant who", "o": ["Wants to pay a large premium in cash and ignores the policy's costs", "Asks how the grace period and automatic premium loan provisions work before applying", "Chooses to pay an annual premium by check from a personal bank account", "Names a spouse as primary beneficiary and the children as contingent beneficiaries"], "e": "Unusual cash payments, early surrenders regardless of penalty, and indifference to cost are AML red flags.", "m": "Big cash and indifferent to costs = money laundering red flag."}, {"id": "lg117", "t": "Application and Underwriting", "q": "The Gramm-Leach-Bliley Act requires insurers to", "o": ["Give privacy notices and allow opt-out of certain nonaffiliate sharing", "Provide privacy notices and let consumers opt out of all sharing, including with affiliates", "Obtain written consent before collecting any nonpublic personal information", "Disclose customer information to the state insurance department each year"], "e": "GLBA requires privacy notices and an opt-out for certain sharing of nonpublic personal information with nonaffiliated parties.", "m": "GLBA = privacy notice + opt-out of nonaffiliate sharing."}, {"id": "lg118", "t": "Application and Underwriting", "q": "An attending physician's statement (APS) is", "o": ["A report from the applicant's own doctor about medical history", "A report from a paramedical examiner hired by the insurer", "An inspection report about the applicant's habits and finances", "A summary of coded information from the Medical Information Bureau"], "e": "APS reports give underwriters details from the applicant's treating physician.", "m": "APS = the Attending Physician's Statement, from your own doctor."}, {"id": "lg119", "t": "Application and Underwriting", "q": "When delivering a policy issued with a rating, the producer should", "o": ["Explain the rating and get a signed acceptance and any extra premium", "Deliver it and explain that the premium will return to standard after the free look", "Return it to the insurer and request that it be reissued at standard rates", "Deliver it and personally pay the premium difference for the first year"], "e": "A rated policy is a counteroffer; the producer explains the change and obtains acceptance.", "m": "Rated policy at delivery: explain, get a signature, collect the extra premium."}, {"id": "lg120", "t": "Application and Underwriting", "q": "A policy issued at a different rate class than applied for is legally", "o": ["A counteroffer that the applicant may accept or reject", "An acceptance of the applicant's original offer", "Void until the Director approves the change", "A binding contract at the original rate class"], "e": "When the insurer changes terms it makes a counteroffer; acceptance occurs when the applicant accepts and pays.", "m": "Different rate class = a counteroffer the applicant can accept or reject."}, {"id": "lg121", "t": "Application and Underwriting", "q": "Constructive delivery occurs when", "o": ["The insurer mails the policy to the producer to deliver unconditionally", "The applicant signs the application and pays the first premium", "The producer submits the application to the insurer", "The underwriter approves the application"], "e": "Constructive delivery occurs when the insurer gives up control of the policy, even if the owner has not physically received it.", "m": "Constructive delivery = mailed to the producer to deliver unconditionally."}, {"id": "lg122", "t": "Application and Underwriting", "q": "At policy delivery the producer should", "o": ["Explain the provisions, riders, exclusions, and any ratings", "Have the client sign a new application to confirm the answers", "Change the beneficiary if the client requests it", "Collect the second premium in advance"], "e": "Explaining the policy at delivery helps the client understand coverage and helps prevent lapses.", "m": "Delivery = explain everything: provisions, riders, exclusions, ratings."}, {"id": "lg123", "t": "Application and Underwriting", "q": "Which element of a contract is satisfied when the insurer issues a policy exactly as applied for?", "o": ["Acceptance", "Consideration", "Legal purpose", "Competent parties"], "e": "The application with premium is the offer; issuing the policy as applied for is acceptance.", "m": "Issued exactly as applied for = ACCEPTANCE."}, {"id": "lg124", "t": "Application and Underwriting", "q": "The insurer's consideration in an insurance contract is", "o": ["Its promise to pay benefits", "The application", "The initial premium", "The policy's cash value"], "e": "The applicant gives premium and statements; the insurer gives the promise to pay.", "m": "Insurer's consideration = its promise to pay."}, {"id": "lg125", "t": "Application and Underwriting", "q": "A contract with a person declared mentally incompetent lacks which element?", "o": ["Competent parties", "Consideration", "Offer and acceptance", "Legal purpose"], "e": "Parties must have legal capacity.", "m": "Incompetent person = no COMPETENT PARTIES."}, {"id": "lg126", "t": "Application and Underwriting", "q": "Because the insurer drafts the policy and the applicant must accept it as written, an insurance policy is a contract of", "o": ["Adhesion", "Indemnity", "Utmost good faith", "Aleatory nature"], "e": "Ambiguities in contracts of adhesion are interpreted in favor of the insured.", "m": "ADHESION = take it or leave it, as written by the insurer."}, {"id": "lg127", "t": "Application and Underwriting", "q": "An insurance contract is aleatory because", "o": ["An exchange of unequal amounts depends on an uncertain event", "Only one party makes a legally enforceable promise to the other", "One party drafts it and the other must accept it as written", "The insurer pays only if the insured meets certain conditions"], "e": "A small premium may buy a large benefit, depending on chance.", "m": "ALEATORY = a gamble: an unequal exchange that depends on chance."}, {"id": "lg128", "t": "Application and Underwriting", "q": "An insurance contract is unilateral because", "o": ["Only the insurer makes a legally enforceable promise", "Both parties make legally enforceable promises", "The insured may change its terms at any time", "It is prepared by one party and accepted by the other"], "e": "The insured cannot be compelled to pay premiums; only the insurer is bound.", "m": "UNILATERAL = only one side (the insurer) promises."}, {"id": "lg129", "t": "Application and Underwriting", "q": "An insurance contract is conditional because", "o": ["Benefits are paid only if conditions like premium payment are met", "The insurer may cancel it once the conditions of the contestable period have ended", "The insured must show a profit from the loss before benefits are payable", "Its terms take effect only after a court has approved the contract"], "e": "Claims are payable only when the contract's conditions are satisfied.", "m": "CONDITIONAL = pays only if the conditions are met."}, {"id": "lg130", "t": "Application and Underwriting", "q": "Replacing an existing life policy may harm the client because", "o": ["New contestable and suicide periods begin and new costs may apply", "The original policy's contestable period is extended to the new policy", "The new insurer must refund the premiums paid to the original insurer", "The original policy's cash value is forfeited to the state"], "e": "Replacements may restart contestable and suicide periods and involve surrender charges and higher attained-age premiums.", "m": "Replacing = \"restart the clocks\": new contestable and suicide periods.", "c": ["lg_clocks"]}, {"id": "lg131", "t": "Application and Underwriting", "q": "Suitability in a life insurance or annuity sale refers to", "o": ["Recommending products that fit the client's needs and finances", "Recommending the product with the highest commission that the client can afford", "Recommending the product with the lowest premium regardless of the client's needs", "Recommending products based on the insurer's sales goals for the year"], "e": "Suitability and best-interest standards require gathering client information and recommending products that fit.", "m": "Suitable = \"fits the client.\""}, {"id": "lg132", "t": "Application and Underwriting", "q": "When a parent buys a policy on a 10-year-old child, who typically signs as applicant?", "o": ["The parent as applicant and owner", "The child as applicant and owner", "The child's guardian ad litem", "The insurer's underwriter"], "e": "Minors lack contractual capacity; a parent or guardian signs as applicant and owner.", "m": "Kid's policy: the parent applies and owns it."}, {"id": "lg133", "t": "Retirement and Other Concepts", "q": "A policy in which the owner is someone other than the insured is an example of", "o": ["Third-party ownership", "Survivorship life", "Joint life", "Credit life"], "e": "Examples include a business owning a key person policy or a spouse owning a policy on the other spouse.", "m": "Owner isn't the insured = third-party ownership."}, {"id": "lg134", "t": "Retirement and Other Concepts", "q": "A life settlement involves", "o": ["Selling a policy to a third party for more than cash value but less than face", "A loan from the insurer secured by the policy's cash value, repayable at the insured's death", "The payment of a death claim to the beneficiary in installments rather than a lump sum", "The surrender of a policy to the insurer for its cash value after the free look period"], "e": "Life settlements let owners sell policies; viatical settlements generally involve terminally or chronically ill insureds.", "m": "Life settlement: sold for MORE than cash value, LESS than face."}, {"id": "lg135", "t": "Retirement and Other Concepts", "q": "The group life conversion privilege generally allows a terminated employee to convert to an individual permanent policy", "o": ["Within 31 days, without evidence of insurability", "Within 31 days, with evidence of insurability", "Within 1 year, without evidence of insurability", "Within 90 days, with a medical exam"], "e": "Conversion is available within 31 days of termination at attained-age rates without evidence of insurability; group coverage continues during that period.", "m": "Group conversion = \"31 days, no health questions.\" (Life grace in Illinois is 30, not 31!)", "c": ["lg_31days"]}, {"id": "lg136", "t": "Retirement and Other Concepts", "q": "In a noncontributory group life plan,", "o": ["The employer pays the entire premium and 100% of eligible employees must be covered", "The employer pays the entire premium and most eligible employees must be covered", "Employees pay the entire premium and 100% of eligible employees must be covered", "Employees share the premium and most eligible employees must enroll"], "e": "Noncontributory plans require all eligible employees to participate to avoid adverse selection.", "m": "NONcontributory = employer pays ALL, so ALL eligible employees are covered.", "c": ["lg_group"]}, {"id": "lg137", "t": "Retirement and Other Concepts", "q": "In a contributory group plan,", "o": ["Employees pay part of the premium, so the insure-every-eligible-employee rule doesn't apply", "The employer pays the entire premium, so every eligible employee must be insured", "Employees pay the entire premium, and every eligible employee must be insured", "The employer pays the premium, and each employee is individually underwritten"], "e": "Illinois requires a group life plan with no employee contribution to insure all eligible employees except those who reject it in writing (215 ILCS 5/230.1(A)(2)); contributory plans are partly employee-funded and are not bound by that rule, though insurers set their own participation minimums.", "m": "CONTRIBUTORY = employees CONTRIBUTE, so not everyone has to join.", "c": ["lg_group"]}, {"id": "lg138", "t": "Retirement and Other Concepts", "q": "Group life insurance is most commonly issued as", "o": ["Annually renewable group term", "Group single-premium whole life", "Group variable universal life", "Group limited-pay whole life"], "e": "A master policy is issued to the employer and certificates to members, usually on a yearly renewable term basis.", "m": "Group life is usually annually renewable term."}, {"id": "lg139", "t": "Retirement and Other Concepts", "q": "Employer-paid group term life coverage is tax-free to the employee up to", "o": ["$50,000 of coverage", "$100,000 of coverage", "$25,000 of coverage", "$10,000 of coverage"], "e": "Under IRC Section 79, the cost of employer-paid coverage over $50,000 is imputed income to the employee.", "m": "Section 79: the first $50,000 of employer-paid group term is tax-free.", "c": ["lg_group"]}, {"id": "lg140", "t": "Reti
