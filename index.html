t or marital status.", "m": "ACA: kids stay on a parent's plan until 26.", "c": ["hg_cob", "hg_newborn"]}, {"id": "hg118", "t": "Other Insurance Concepts", "q": "Newborn children are generally covered under a parent's health policy", "o": ["From birth, with notice and premium within a set period", "After a 90-day waiting period, if the parent requests coverage", "Only if the newborn is born without any congenital conditions", "Only after the insurer approves a new application for the child"], "e": "Newborn coverage begins at birth; the insurer may require notice (commonly within 31 days) to continue coverage.", "m": "Newborns covered from birth (give notice and pay premium on time).", "c": ["hg_newborn"]}, {"id": "hg119", "t": "Other Insurance Concepts", "q": "A coordination of benefits provision is designed to", "o": ["Prevent payment above 100% of expenses under multiple group plans", "Increase the benefits paid when an insured is covered by more than one group plan", "Eliminate the deductible on the secondary plan when two group plans apply", "Allow each group plan to pay its full benefits regardless of the other plan"], "e": "COB determines which plan is primary and which is secondary.", "m": "COB = no profit from double coverage: never more than 100%.", "c": ["hg_cob"]}, {"id": "hg120", "t": "Other Insurance Concepts", "q": "Under typical coordination of benefits rules, when a person is covered as an employee under one group plan and as a dependent under a spouse's plan,", "o": ["The plan covering the person as an employee is primary", "The plan covering the person as a dependent is primary", "Each plan pays 50% of covered charges", "The plan with the earlier effective date is primary"], "e": "For dependent children of married parents, the birthday rule usually applies.", "m": "You as EMPLOYEE beats you as dependent: the employee plan is primary.", "c": ["hg_cob"]}, {"id": "hg121", "t": "Other Insurance Concepts", "q": "Under the birthday rule, a child's primary plan is", "o": ["The plan of the parent whose birthday is earlier in the year", "The plan of the parent who was born first, based on year of birth", "The plan of the parent who has been covered the longest", "The plan of the parent with the lower deductible"], "e": "Only month and day matter, not the year of birth.", "m": "Birthday rule = whose birthday comes first in the CALENDAR year (month and day, not age).", "c": ["hg_cob"]}, {"id": "hg122", "t": "Other Insurance Concepts", "q": "An occupational policy covers", "o": ["Losses whether they occur on or off the job", "Losses that occur off the job but not on the job", "Losses already covered under workers compensation", "Illnesses caused by the job but not injuries"], "e": "Nonoccupational policies cover only off-the-job losses because workers compensation covers on-the-job injuries.", "m": "OCCUPATIONAL = on AND off the job.", "c": ["hg_wc"]}, {"id": "hg123", "t": "Other Insurance Concepts", "q": "Workers compensation provides", "o": ["Medical care and lost wages for job-related injury or illness, without fault", "Medical care and lost wages for off-the-job injuries, if the employer was at fault", "Group life and disability benefits for employees, paid for by employee contributions", "Retirement income for workers who were injured on the job, after age 65"], "e": "Workers compensation is a no-fault system mandated by state law.", "m": "Workers comp = no-fault: medical care + lost wages for job injuries.", "c": ["hg_wc"]}, {"id": "hg124", "t": "Other Insurance Concepts", "q": "Subrogation allows an insurer that has paid a claim to", "o": ["Recover from a negligent third party who caused the loss", "Cancel the policy after paying a claim caused by another", "Raise the insured's premiums after paying the claim", "Deny future claims caused by the same third party"], "e": "The insured transfers the right of recovery to the insurer to the extent of the claim paid, preventing double recovery.", "m": "Subrogation = the insurer steps into your shoes to recover from whoever caused the loss."}, {"id": "hg125", "t": "Other Insurance Concepts", "q": "Premiums paid by an individual for personal disability income insurance are", "o": ["Not deductible, and benefits are tax-free", "Deductible, and benefits are taxable", "Deductible, and benefits are tax-free", "Not deductible, and benefits are taxable"], "e": "Tax treatment follows who pays the premium and how.", "m": "Individual pays DI premium = no deduction, tax-free benefits.", "c": ["hg_tax"]}, {"id": "hg126", "t": "Other Insurance Concepts", "q": "When an employer pays the full premium for group disability income coverage and deducts it as a business expense, benefits received by employees are", "o": ["Taxable income to the employee", "Tax-free to the employee", "Taxed as capital gains", "Taxable to the employer"], "e": "Employer-paid, deductible premiums make benefits taxable; the portion attributable to employee after-tax contributions is tax-free.", "m": "Employer pays and deducts = the employee is taxed on the benefits.", "c": ["hg_tax"]}, {"id": "hg127", "t": "Other Insurance Concepts", "q": "Medical expense benefits received from an individual health insurance policy are generally", "o": ["Not taxable to the insured", "Taxable as ordinary income", "Taxed as capital gains", "Taxable above premiums paid"], "e": "Reimbursements for medical expenses are excluded from income.", "m": "Medical reimbursements from your own policy = not taxable.", "c": ["hg_tax"]}, {"id": "hg128", "t": "Other Insurance Concepts", "q": "Employer contributions to employee group medical insurance are generally", "o": ["Deductible to the employer and not taxable to the employee", "Deductible to the employer and taxable to the employee", "Not deductible to the employer and not taxable to the employee", "Not deductible to the employer and taxable to the employee"], "e": "Employer-provided health coverage is a tax-favored fringe benefit.", "m": "Employer health contributions = deductible to the employer, tax-free to the employee.", "c": ["hg_tax"]}, {"id": "hg129", "t": "Other Insurance Concepts", "q": "Business overhead expense premiums are", "o": ["Deductible, and benefits are taxable", "Not deductible, and benefits are tax-free", "Deductible, and benefits are tax-free", "Not deductible, and benefits are taxable"], "e": "BOE is treated like other business expenses.", "m": "BOE = deduct the premium, report the benefits (\"it's a business expense both ways\").", "c": ["hg_tax"]}, {"id": "hg130", "t": "Other Insurance Concepts", "q": "Which is a cost containment technique used by health insurers?", "o": ["Second surgical opinions and utilization review", "Higher lifetime maximums and lower deductibles", "Paying providers' full billed charges", "Covering elective procedures without review"], "e": "Others include precertification, case management, outpatient surgery incentives, and concurrent review.", "m": "Second opinions + utilization review = cost containment.", "c": ["hg_review"]}, {"id": "hg131", "t": "Other Insurance Concepts", "q": "Managed care plans control costs primarily by", "o": ["Provider networks, utilization management, and preventive care", "Paying providers' full billed charges for all services", "Removing deductibles, copays, and coinsurance", "Covering all elective procedures without prior approval"], "e": "Managed care integrates financing and delivery of care.", "m": "Managed care saves money with networks, utilization management and prevention.", "c": ["hg_review"]}, {"id": "hg132", "t": "Other Insurance Concepts", "q": "Case management in health insurance involves", "o": ["Coordinating care for a patient with a high-cost condition", "Selling several types of policies to one client", "Reviewing producers' files for compliance issues", "Underwriting a group based on its claims history"], "e": "Case managers seek the most effective and economical treatment options.", "m": "Case management = a \"quarterback\" for a high-cost patient's care.", "c": ["hg_review"]}, {"id": "hg133", "t": "Other Insurance Concepts", "q": "The owner of an individual health policy has the right to", "o": ["Name and change beneficiaries and receive policy benefits", "Change the policy's provisions without the insurer's approval", "Set the premium rates charged for the coverage", "Waive the policy's exclusions for specific conditions"], "e": "Owner's rights in health policies mirror those in life policies.", "m": "The OWNER holds the rights: names beneficiaries, collects benefits."}, {"id": "hg134", "t": "Field Underwriting", "q": "The producer's role in field underwriting includes", "o": ["Completing the application accurately and reporting risk information", "Approving the application when the applicant meets the insurer's guidelines", "Setting the premium rate class based on the applicant's health history", "Issuing the policy and collecting premiums once the application is approved"], "e": "The producer is the insurer's first underwriter.", "m": "The producer is the first underwriter: accurate app, honest risk info."}, {"id": "hg135", "t": "Field Underwriting", "q": "If the producer collects the initial premium with a health application, the producer should", "o": ["Issue a conditional receipt to the applicant", "Hold the payment until the policy is issued", "Deposit it in the producer's business account", "Waive the health questions on the application"], "e": "The receipt explains when coverage may begin.", "m": "Premium collected = conditional receipt given."}, {"id": "hg136", "t": "Field Underwriting", "q": "Health insurance applicants must be informed of the use of the Medical Information Bureau because", "o": ["Law and MIB rules require notice of sharing and access rights", "MIB is a public database that anyone may search without consent", "An MIB report replaces the insurer's own underwriting review", "An MIB report guarantees coverage if no records are found"], "e": "Applicants can request their MIB report and dispute errors.", "m": "MIB use must be disclosed, with access rights explained."}, {"id": "hg137", "t": "Field Underwriting", "q": "Under the Fair Credit Reporting Act, consumer reporting agencies generally may not report most adverse information older than", "o": ["7 years (10 years for bankruptcies)", "3 years (7 years for bankruptcies)", "1 year (5 years for bankruptcies)", "10 years (20 years for bankruptcies)"], "e": "Exceptions exist for certain large transactions.", "m": "FCRA \"7 and 10\": most adverse items 7 years, bankruptcy 10."}, {"id": "hg138", "t": "Field Underwriting", "q": "Under HIPAA, group health plans", "o": ["Cannot discriminate in eligibility or premiums based on health status", "May deny coverage for preexisting conditions without any limitation", "May share members' health information with marketers without consent", "Are not required to give members a notice of privacy practices"], "e": "HIPAA also provides portability protections and privacy rules.", "m": "HIPAA groups: health status can't drive eligibility or premiums."}, {"id": "hg139", "t": "Field Underwriting", "q": "After the producer submits the application and premium, the policy is delivered. The producer should then", "o": ["Explain the policy, riders, exclusions, and ratings; get a delivery receipt", "Mail the policy to the client and let the client review it without explanation", "Change the benefits on the policy to match what the client expected", "Collect a delivery fee in addition to the first premium"], "e": "Explaining the policy at delivery reduces misunderstandings.", "m": "Delivery = explain everything + get a delivery receipt."}, {"id": "hg140", "t": "Field Underwriting", "q": "If a policy is issued with an exclusion rider, the policy is considered", "o": ["A counteroffer that the applicant must accept", "An acceptance of the applicant's original offer", "Void until the Director approves the rider", "Binding on the applicant without a signature"], "e": "The applicant may accept or reject the modified policy.", "m": "Exclusion rider = a counteroffer the applicant must accept."}, {"id": "hg141", "t": "Field Underwriting", "q": "Which is NOT a source of insurability information used in health underwriting?", "o": ["The applicant's political affiliation", "The application", "The Medical Information Bureau", "An attending physician's statement"], "e": "Common sources include the application, medical exams, APS, MIB, inspection reports, and prescription histories.", "m": "Politics has nothing to do with insurability."}, {"id": "hg142", "t": "Field Underwriting", "q": "An inspection report used in underwriting typically includes", "o": ["The applicant's finances, character, habits, and lifestyle", "The applicant's complete medical records from all physicians", "The producer's personal opinion of the applicant's health", "The results of the applicant's paramedical examination"], "e": "Inspection reports are consumer reports subject to the FCRA.", "m": "Inspection report = finances, character, habits, lifestyle."}, {"id": "hg143", "t": "Field Underwriting", "q": "When replacing an existing health policy, a producer should", "o": ["Make sure the new policy is approved before the old one is canceled", "Cancel the old policy first so the client avoids paying two premiums", "Tell the client preexisting conditions will be covered on the new policy", "Avoid comparing the policies so the client is not confused"], "e": "Replacement can create gaps, new waiting periods, or new exclusions; the client must not be left uncovered.", "m": "Never let the old policy go until the new one is approved."}, {"id": "hg144", "t": "Field Underwriting", "q": "An applicant answers \"no\" to a health question but the producer knows the answer is \"yes.\" The producer should", "o": ["Ensure the correct information is recorded and disclosed", "Leave the answer as stated by the applicant", "Correct the answer after the policy is issued", "Advise the applicant to omit the condition"], "e": "Knowingly submitting false information is fraud.", "m": "Know it's \"yes\"? Make sure the truth is recorded. No exceptions."}, {"id": "hg145", "t": "Field Underwriting", "q": "Which element of a valid contract requires that the purpose of the agreement not be against public policy?", "o": ["Legal purpose", "Consideration", "Offer and acceptance", "Competent parties"], "e": "A contract to insure an illegal activity is void.", "m": "LEGAL purpose = the deal can't be against the law or public policy."}, {"id": "hg146", "t": "Field Underwriting", "q": "For insurable interest in health insurance, a valid example is", "o": ["An employer insuring a key employee's disability", "A stranger insuring another person's health", "A neighbor insuring another neighbor's disability", "An investor insuring a celebrity's health"], "e": "Insurable interest must exist at the time of application.", "m": "Employer + key employee = a real financial stake (insurable interest)."}, {"id": "hg147", "t": "Field Underwriting", "q": "A health insurance contract is aleatory, which means", "o": ["There is an exchange of unequal values depending on uncertain events", "Both parties exchange equal values regardless of whether a loss occurs", "Only the insurer makes a legally enforceable promise in the contract", "One party prepares the contract and the other must accept it as written"], "e": "A small premium may produce a large claim, or no claim at all.", "m": "ALEATORY = unequal values, triggered by chance."}, {"id": "hg148", "t": "Field Underwriting", "q": "Under a contract of adhesion, ambiguities in the policy are resolved", "o": ["In favor of the insured", "In favor of the insurer", "By the producer", "By splitting the difference"], "e": "The insurer wrote the contract, so ambiguities are construed against it.", "m": "ADHESION ambiguities go against the drafter (the insurer), in favor of the insured."}, {"id": "hg149", "t": "Field Underwriting", "q": "Statements on a health insurance application are generally considered", "o": ["Representations, true to the best of the applicant's knowledge", "Warranties, which must be literally true in every respect", "Conditions that the insured must satisfy at each renewal", "Statements that cannot be used to contest the policy"], "e": "Only material misrepresentations allow rescission (within the contestable limits).", "m": "Health app answers = REPRESENTATIONS (best knowledge)."}, {"id": "hg150", "t": "Field Underwriting", "q": "If a producer fails to have the applicant sign a health application, the insurer will", "o": ["Return the application for signature before issuing the policy", "Issue the policy and obtain the signature at delivery", "Accept the producer's signature on the applicant's behalf", "Issue the policy as a binding receipt until it is signed"], "e": "The applicant must sign and date the application, and the producer must not sign for the applicant.", "m": "No signature = sent back for one before issue."}, {"id": "hg151", "t": "Field Underwriting", "q": "A producer submits an application without the initial premium. The policy is later approved. At delivery, the producer should", "o": ["Collect the premium and obtain a statement of good health", "Deliver the policy and bill the premium at the next due date", "Date the policy back to the application date to lower the rate", "Waive the first premium as a courtesy to the new client"], "e": "Coverage begins on payment, typically with a statement of continued good health.", "m": "No premium with the app? At delivery: collect it + a good-health statement."}, {"id": "hg152", "t": "Field Underwriting", "q": "An insurer's privacy notice under GLBA must describe", "o": ["The nonpublic information collected and with whom it is shared", "The insurer's investment portfolio and its financial strength ratings", "The commission rates paid to producers who sell the insurer's policies", "The insurer's complete underwriting guidelines and rating manuals"], "e": "GLBA requires notices and opt-out rights for certain sharing.", "m": "GLBA notice = what nonpublic info is collected + who it's shared with."}, {"id": "hg153", "t": "Field Underwriting", "q": "A buyer's guide and outline of coverage for Medicare supplement policies must be given to an applicant", "o": ["At the time of application", "At policy delivery", "Within 30 days of issue", "Only upon the applicant's request"], "e": "Medigap rules require delivery of the outline of coverage and the Guide to Health Insurance for People with Medicare at application.", "m": "Medigap paperwork comes AT application: buyer's guide + outline of coverage.", "c": ["hg_medicare"]}, {"id": "hg154", "t": "Field Underwriting", "q": "Which of the following is a common underwriting consideration for disability income coverage?", "o": ["The applicant's occupation and earned income", "The applicant's marital status and number of children", "The value of the applicant's home and vehicles", "The applicant's life insurance beneficiary designation"], "e": "Occupation class and income determine eligibility and benefit amounts.", "m": "DI underwriting = job + earned income (what you do, what you make)."}, {"id": "hg155", "t": "Field Underwriting", "q": "The primary purpose of underwriting is to", "o": ["Select and classify risks so premiums match the risk", "Maximize premium volume and producer commissions", "Decline applicants who have any health history", "Determine eligibility for Medicare and Medicaid"], "e": "Underwriting protects against adverse selection.", "m": "Underwriting = select and classify, so the price fits the risk."}, {"id": "hg156", "t": "Field Underwriting", "q": "A producer delivers a health policy and the client asks how the deductible and coinsurance work. The producer should", "o": ["Explain the cost-sharing provisions clearly and accurately", "Tell the client to read the policy and call the insurer", "Assure the client that all expenses will be covered", "Promise to pay any amounts the policy does not cover"], "e": "Accurate explanation at delivery is part of the producer's duty.", "m": "Asked how the deductible and coinsurance work? Explain the cost sharing clearly and accurately."}, {"id": "hg157", "t": "Social Insurance", "q": "Medicare's Initial Enrollment Period lasts", "o": ["7 months, from 3 months before the 65th-birthday month to 3 months after", "6 months, starting the first month the person is 65 and enrolled in Part B", "3 months, ending on the last day of the month the person turns 65", "12 months, starting on the first day of the month the person turns 65"], "e": "Medicare.gov: the Initial Enrollment Period is 7 months: the 3 months before the month you turn 65, that month, and the 3 months after. The 6-month window tied to Part B is the Medigap open enrollment period, a different clock.", "m": "3 + 1 + 3 = 7: three before, the birthday month, three after.", "c": ["hg_medenroll"]}, {"id": "hg158", "t": "Social Insurance", "q": "A person who missed Part B sign-up and has no Special Enrollment Period may enroll during the General Enrollment Period, which runs", "o": ["January 1 through March 31 each year", "October 15 through December 7 each year", "April 1 through June 30 each year", "November 1 through January 15 each year"], "e": "Medicare.gov: the General Enrollment Period is January 1 to March 31, with coverage starting the month after sign-up; a late enrollment penalty may apply. October 15 to December 7 is the annual Open Enrollment Period for changing Medicare Advantage and drug plans.", "m": "General = the GATE at the start of the year: Q1, January to March.", "c": ["hg_medenroll"]}, {"id": "hg159", "t": "Social Insurance", "q": "During Medicare's annual Open Enrollment Period (October 15 to December 7), a beneficiary may", "o": ["Switch between Original Medicare and Medicare Advantage or change Part D plans", "Buy any Medigap policy without medical underwriting, regardless of age or health", "Enroll in Part B for the first time without any late enrollment penalty", "Apply for Medicaid without meeting the state's income and resource limits"], "e": "Medicare.gov: from October 15 to December 7, people with Medicare can join, switch, or drop Medicare Advantage or Part D plans; changes take effect January 1. It is not a Medigap guaranteed-issue window and doesn't erase Part B penalties.", "m": "Fall shopping season: change your PLAN (MA or Part D) for January 1.", "c": ["hg_medenroll"]}, {"id": "hg160", "t": "Social Insurance", "q": "The Part B late enrollment penalty is generally", "o": ["10% of the standard premium per full 12 months not enrolled", "1% of the base premium for each month without drug coverage", "A one-time fee equal to 10% of the first year's Part B premium", "A 20% surcharge charged only during the first year of Part B coverage"], "e": "Medicare.gov: the Part B penalty adds 10% for each full 12-month period you could have had Part B but didn't, and it generally lasts as long as you have Part B. The 1%-per-month penalty belongs to Part D.", "m": "B = 10% for each late Year; D = 1% for each late month.", "c": ["hg_medenroll"]}, {"id": "hg161", "t": "Social Insurance", "q": "Most people pay no premium for Medicare Part A because", "o": ["They or a spouse paid Medicare taxes while working, generally for 10 years", "Part A is funded entirely by the premiums paid for Part B and Part D", "Hospitals bill Medicaid first for every Medicare beneficiary's inpatient stay", "The federal government waives Part A premiums for all citizens at age 65"], "e": "Medicare.gov: Part A is premium-free if you or your spouse paid Medicare taxes for a certain time, generally 10 years (40 quarters). Others can buy Part A.", "m": "Paid in for 10 years at work, so A is free at 65.", "c": ["hg_medicare"]}, {"id": "hg162", "t": "Social Insurance", "q": "After the first 90 days of inpatient hospital care in a benefit period, Original Medicare Part A can draw on", "o": ["60 lifetime reserve days, each usable only once", "30 extra days that renew with every benefit period", "365 additional days paid in full by Part B", "100 skilled nursing days that convert to hospital days"], "e": "Medicare.gov: days 1 to 60 cost $0 after the Part A deductible, days 61 to 90 have a daily coinsurance, and after day 90 you may use up to 60 lifetime reserve days (with a higher daily coinsurance), which don't renew. The 365 extra hospital days come from Medigap, not Part B.", "m": "60 / 90 / 60: 60 free-ish, up to 90 with coinsurance, then a one-time bank of 60 reserve days.", "c": ["hg_medicare"]}, {"id": "hg163", "t": "Social Insurance", "q": "Part A covers skilled nursing facility care for up to how many days per benefit period?", "o": ["100 days", "60 days", "150 days", "190 days"], "e": "Medicare.gov: after a qualifying 3-day inpatient stay, SNF days 1 to 20 cost $0, days 21 to 100 have a daily coinsurance, and after day 100 you pay all costs. 150 is the hospital limit with reserve days; 190 days is the lifetime limit in a freestanding psychiatric hospital.", "m": "SNF: 20 free, then coinsurance up to 100. Think '20 to 100'.", "c": ["hg_medicare"]}, {"id": "hg164", "t": "Social Insurance", "q": "A beneficiary in a Medicare Advantage plan elects hospice care. Hospice services for the terminal illness are paid by", "o": ["Original Medicare, while the person stays in the plan", "The Medicare Advantage plan, after a 3-day stay", "Medicaid, because hospice is a long-term care benefit", "The person's Medigap policy, as primary payer"], "e": "Medicare.gov: Medicare Advantage plans cover everything Original Medicare covers except hospice; if you're in an MA plan and choose hospice, Original Medicare pays for hospice care related to the terminal illness.", "m": "Hospice always goes HOME to Original Medicare, even from Medicare Advantage.", "c": ["hg_medicare"]}, {"id": "hg165", "t": "Social Insurance", "q": "It is illegal to sell a Medigap policy to someone who", "o": ["Is staying in a Medicare Advantage plan", "Has Parts A and B and just turned 65", "Is in the Medigap open enrollment period", "Already gets Social Security retirement"], "e": "Medicare.gov: it's illegal to sell you a Medigap policy if you have a Medicare Advantage plan, unless you're switching back to Original Medicare. Medigap only works with Original Medicare.", "m": "Medigap fills gaps in ORIGINAL Medicare; MA has no gaps for it to fill.", "c": ["hg_medicare"]}, {"id": "hg166", "t": "Social Insurance", "q": "Which item is generally NOT covered by Original Medicare?", "o": ["Hearing aids and exams for fitting them", "Inpatient hospital semi-private rooms", "Doctors' services during a hospital stay", "Hospice care for a terminal illness"], "e": "Medicare.gov lists items Original Medicare doesn't cover, including hearing aids and fitting exams, eye exams for glasses, most dental care, cosmetic surgery, and long-term custodial care.", "m": "Original Medicare skips the 'ears, eyes, teeth' extras.", "c": ["hg_medicare"]}, {"id": "hg167", "t": "Social Insurance", "q": "A 66-year-old works for an employer with 50 employees and has the employer's group health plan plus Medicare. Which pays first?", "o": ["The employer's group health plan", "Original Medicare Part A and B", "Whichever plan received the bill first", "Medicare, because the person is over 65"], "e": "CMS Medicare Secondary Payer rules: if you're 65 or older with group coverage based on your or your spouse's current employment and the employer has 20 or more employees, the group plan pays first and Medicare pays second.", "m": "20+ workers and still working: the job plan goes first.", "c": ["hg_medicare", "hg_cob"]}, {"id": "hg168", "t": "Social Insurance", "q": "For a person 65 or older who has coverage through a CURRENT employer with fewer than 20 employees, generally", "o": ["Medicare pays first and the group plan pays second", "The group plan pays first and Medicare pays second", "Neither plan pays until the person retires", "Medicare pays only after COBRA coverage is exhausted"], "e": "CMS Medicare Secondary Payer rules: with fewer than 20 employees, Medicare is primary. With 20 or more, the group plan is primary. COBRA and retiree coverage are secondary to Medicare.", "m": "Small shop (under 20): Medicare first. Same 20 as COBRA's employer threshold.", "c": ["hg_medicare", "hg_cob"]}, {"id": "hg169", "t": "Social Insurance", "q": "Social Security disability benefits generally begin", "o": ["In the sixth full month of disability", "After a 30-day waiting period", "After 24 months of Medicare entitlement", "As soon as the application is approved"], "e": "SSA: there is a 5-month waiting period, so benefits start with the sixth full month after the disability began. The wait doesn't apply to ALS (approved on or after July 23, 2020). Medicare starts after 24 months of disability benefits.", "m": "5 to get paid, 24 to get Medicare.", "c": ["hg_medicare"]}, {"id": "hg170", "t": "Social Insurance", "q": "The 5-month SSDI waiting period does NOT apply to a worker whose disability results from", "o": ["ALS (amyotrophic lateral sclerosis)", "A work-related injury covered by workers comp", "Any condition expected to last 12 months", "A disability that began before age 50"], "e": "SSA: no waiting period for people approved for ALS on or after July 23, 2020 (and ALS also brings Medicare without the 24-month wait).", "m": "ALS skips the line: no 5-month wait.", "c": ["hg_medicare"]}, {"id": "hg171", "t": "Social Insurance", "q": "A worker age 31 or older generally meets Social Security's recent work test for disability with", "o": ["20 credits earned in the 10 years before the disability", "6 credits earned in the 3 years just before the disability", "40 credits earned at any time during a working life", "12 credits earned in the 6 years before the disability"], "e": "SSA: at 31 or older you generally need 20 credits in the 10 years right before you became disabled. Before age 24, 6 credits in 3 years. 40 credits is the usual retirement requirement.", "m": "20 in 10 (half the decade's 40 possible).", "c": ["hg_ss"]}, {"id": "hg172", "t": "Social Insurance", "q": "A worker can earn at most how many Social Security credits per year?", "o": ["4", "2", "6", "12"], "e": "SSA: you can earn up to 4 credits a year. That's why 40 credits takes about 10 years of work.", "m": "4 a year x 10 years = 40 credits.", "c": ["hg_ss"]}, {"id": "hg173", "t": "Social Insurance", "q": "Social Security disability benefits may be paid to a disabled widow or widower of an insured worker beginning at age", "o": ["50", "40", "55", "62"], "e": "SSA Blue Book: benefits are payable to a disabled widow or widower between ages 50 and 60.", "m": "Disabled widow(er): the 50s (50 to 60).", "c": ["hg_ss"]}, {"id": "hg174", "t": "Social Insurance", "q": "Supplemental Security Income (SSI) differs from Social Security Disability Insurance (SSDI) because SSI", "o": ["Is based on limited income and resources, not work credits", "Pays only to workers who have earned 40 Social Security credits", "Requires a 24-month waiting period before cash benefits begin", "Is available only to people age 65 or older with ESRD"], "e": "SSA Blue Book: SSDI (Title II) pays people insured by their work credits; SSI (Title XVI) pays based on financial need (limited income and resources) and can cover children.", "m": "SSI = Sorely Short on Income (need-based); SSDI = Insured by work.", "c": ["hg_ss"]}, {"id": "hg175", "t": "Social Insurance", "q": "A claimant who disagrees with a Social Security disability determination generally has how long to request an appeal?", "o": ["60 days", "30 days", "90 days", "6 months"], "e": "SSA: you generally have 60 days after receiving the notice to request each level of appeal (reconsideration, then a hearing, the Appeals Council, and federal court).", "m": "Appeal: 60 days at every level (reconsideration, hearing, Appeals Council, court).", "c": ["hg_ss"]}, {"id": "hg176", "t": "Social Insurance", "q": "Medicaid is generally the 'payer of last resort,' which means", "o": ["Other coverage, like Medicare or private insurance, pays first", "Medicaid pays first, before any private or Medicare coverage", "Medicaid pays only after a person's death, from the estate", "Medicaid covers only costs that a Medigap policy has refused to pay"], "e": "Medicaid.gov: when a Medicaid enrollee has other coverage (insurers, group plans, Medicare, workers' comp), that other payer must pay its share before Medicaid pays.", "m": "Medicaid comes LAST in line: everyone else pays first.", "c": ["hg_medicare"]}, {"id": "hg177", "t": "Social Insurance", "q": "In most states, people who qualify for SSI disability payments also qualify for", "o": ["Medicaid", "Medigap", "COBRA coverage", "TRICARE"], "e": "SSA Blue Book: in most states, SSI beneficiaries also qualify for Medicaid. Medicaid is a joint federal-state program, so rules vary by state.", "m": "SSI and Medicaid: both need-based, so they travel together.", "c": ["hg_ss"]}, {"id": "hg178", "t": "Social Insurance", "q": "To join a Medicare Advantage (Part C) plan, a person must have", "o": ["Both Part A and Part B", "Part A or Part B, not both", "Part D and a Medigap plan", "Only Part A, plus Medicaid"], "e": "Medicare.gov: you need both Part A and Part B to join a Medicare Advantage plan. A stand-alone Part D drug plan needs only Part A or Part B.", "m": "C needs A AND B (A + B = C).", "c": ["hg_medicare"]}, {"id": "hg179", "t": "Social Insurance", "q": "To join a stand-alone Medicare drug plan (Part D), a person needs", "o": ["Part A or Part B", "Both Part A and Part B", "A Medicare Advantage plan", "A Medigap policy with drugs"], "e": "Medicare.gov: to join a separate Part D plan you must have Part A or Part B. Medicare Advantage requires both.", "m": "D needs A OR B; C needs A AND B.", "c": ["hg_medicare"]}, {"id": "hg180", "t": "Other Insurance Concepts", "q": "Under Illinois coordination of benefits rules, a dependent child's parents are divorced and no court decree assigns health expenses. Which plan pays first?", "o": ["The plan of the parent with custody", "The plan of the parent born earlier", "The plan of the non-custodial parent", "The plan with the lower deductible"], "e": "50 Ill. Adm. Code 2009.40: for a child of divorced or separated parents, absent a decree, the order is the custodial parent's plan, then the custodial parent's spouse's plan, then the non-custodial parent's plan. The birthday rule is for parents who are not separated.", "m": "Divorce order follows the child's bed: custodial parent, step-parent, then the other parent.", "c": ["hg_cob"]}, {"id": "hg181", "t": "Other Insurance Concepts", "q": "If a court decree makes one divorced parent responsible for a child's health care expenses and the plan knows of it,", "o": ["That parent's plan pays first", "The custodial parent's plan pays first", "The plan with the earlier birthday pays first", "Both plans split the claim equally"], "e": "50 Ill. Adm. Code 2009.40: when a court decree establishes financial responsibility for the child's health care and the plan has actual knowledge of it, that parent's plan is primary.", "m": "The judge beats the custody rule: decree first.", "c": ["hg_cob"]}, {"id": "hg182", "t": "Other Insurance Concepts", "q": "Under the birthday rule, if both parents have the same birthday, the primary plan is the one that", "o": ["Has covered its parent longer", "Has the lower annual deductible", "Belongs to the older parent", "Was issued in Illinois"], "e": "50 Ill. Adm. Code 2009.40: the plan of the parent whose birthday (month and day) falls earlier in the year is primary; if both parents have the same birthday, the plan that has covered a parent longer is primary. Birth year doesn't matter.", "m": "Same birthday? Seniority of the PLAN breaks the tie, not the age of the parent.", "c": ["hg_cob"]}, {"id": "hg183", "t": "Other Insurance Concepts", "q": "A person is covered as an active employee under one plan and as a retired employee under another. Under Illinois COB rules,", "o": ["The active-employee plan pays first", "The retiree plan pays first as primary", "Each plan pays half the claim", "The older plan always pays first"], "e": "50 Ill. Adm. Code 2009.40: the plan covering a person as an active employee (not laid off or retired) or that employee's dependent is primary to the plan covering the person as a laid-off or retired employee.", "m": "Working beats retired.", "c": ["hg_cob"]}, {"id": "hg184", "t": "Other Insurance Concepts", "q": "A person has COBRA continuation coverage and also new coverage as an employee under another group plan. Generally,", "o": ["The new employee plan pays first", "The COBRA continuation plan pays first", "Both plans pay as primary", "The costlier plan pays first"], "e": "50 Ill. Adm. Code 2009.40: a plan covering the person as an employee, member, or dependent is primary to continuation coverage under federal or state law.", "m": "Continuation coverage goes to the back of the line.", "c": ["hg_cobra", "hg_cob"]}, {"id": "hg185", "t": "Other Insurance Concepts", "q": "A Medicare beneficiary who is not working is also covered under a group plan as a retired employee. Under Illinois COB standards,", "o": ["Medicare pays before the retiree plan", "The retiree plan pays before Medicare", "Medicare and the retiree plan split costs", "Neither pays until Medigap pays"], "e": "50 Ill. Adm. Code 2009.40: Medicare is primary to a plan covering the person as a retired employee (and secondary to a plan covering the person as a dependent of an active employee). CMS rules agree: retiree coverage pays after Medicare.", "m": "Retiree coverage rides behind Medicare.", "c": ["hg_medicare", "hg_cob"]}, {"id": "hg186", "t": "Other Insurance Concepts", "q": "A nonduplication (excess) provision in a health plan means the plan", "o": ["Pays only what other coverage doesn't", "Pays double when two policies apply", "Pays first no matter what other plans do", "Pays a fixed amount per day hospitalized"], "e": "Under coordination of benefits, the primary plan pays as if no other plan existed, and the secondary or excess plan considers what was already paid so total benefits don't exceed the expense (50 Ill. Adm. Code 2009.40). An excess plan pays only above other coverage.", "m": "Excess = Extra on top: it pays only what's left over.", "c": ["hg_cob"]}, {"id": "hg187", "t": "Other Insurance Concepts", "q": "Under Illinois law (215 ILCS 5/356c), a family health policy must cover a newborn child", "o": ["From the moment of birth", "After a 31-day waiting period", "Only after the birth is reported", "Starting at the next renewal"], "e": "215 ILCS 5/356c: coverage for newborns applies from the moment of birth and includes injury and sickness, congenital defects, birth abnormalities, and complications of premature birth.", "m": "Born = covered, the same moment.", "c": ["hg_newborn"]}, {"id": "hg188", "t": "Other Insurance Concepts", "q": "If a separate premium is required for a newborn, Illinois law allows the policy to require notice of the birth within", "o": ["31 days to continue coverage past day 31", "10 days, or the child is never covered", "60 days, or the parent's policy lapses entirely", "90 days, but only for premature births"], "e": "215 ILCS 5/356c: if a specific premium is required, the policy may require notice of the birth within 31 days after birth to continue coverage beyond the 31 days; the newborn is still covered from birth.", "m": "Thirty-day club: newborn notice is 31 days.", "c": ["hg_newborn"]}, {"id": "hg189", "t": "Other Insurance Concepts", "q": "Under 215 ILCS 5/356b, an individual health policy's coverage of a child who reaches the limiting age continues if the child", "o": ["Is disabled, can't self-support, and depends on parents for care", "Is enrolled full-time in college and lives at home with parents", "Is married but is still claimed as a tax dependent by the parents", "Has not yet been offered coverage by his or her own employer"], "e": "215 ILCS 5/356b: coverage doesn't end at the limiting age for a child who is incapable of self-sustaining employment because of a disability (begun before that age) and chiefly dependent on the policyholder for support and maintenance.", "m": "Disabled + dependent = coverage doesn't age out.", "c": ["hg_newborn"]}, {"id": "hg190", "t": "Other Insurance Concepts", "q": "Under 215 ILCS 5/356b, the insurer may ask for proof of a dependent child's disability starting", "o": ["2 months before the child reaches the limiting age", "6 months after the child reaches the limiting age", "On the child's 18th birthday, with no other notice", "Only after the parent files a claim for the child"], "e": "215 ILCS 5/356b: the insurer may inquire 2 months before the limiting age and the policyholder must furnish proof within 60 days of the inquiry.", "m": "Ask 2 months before; answer within 60 days (2 months).", "c": ["hg_newborn"]}, {"id": "hg191", "t": "Other Insurance Concepts", "q": "The primary beneficiary of a health policy's accidental death benefit", "o": ["Receives the proceeds first, if living at the insured's death", "Receives proceeds only if the contingent beneficiary died first", "Shares the proceeds equally with the contingent beneficiary", "Is always the insured's estate unless an irrevocable choice is made"], "e": "The primary beneficiary is first in line for a death benefit (such as an AD&D or accidental death benefit). The contingent beneficiary takes only if no primary beneficiary survives the insured.", "m": "Primary = first in line; contingent = 'in case' the first is gone."}, {"id": "hg192", "t": "Other Insurance Concepts", "q": "A contingent beneficiary on an AD&D policy receives the benefit", "o": ["Only if the primary beneficiary dies before the insured", "Whenever the primary beneficiary delays filing the claim", "Before the primary beneficiary, if named more recently", "Only if the insured dies outside the United States"], "e": "A contingent (secondary) beneficiary is paid only if the primary beneficiary isn't living when the insured dies. If no beneficiary survives, proceeds generally go to the insured's estate.", "m": "Contingent = contingency plan: used only if plan A is gone."}, {"id": "hg193", "t": "Other Insurance Concepts", "q": "Paying a health premium monthly instead of annually generally", "o": ["Costs more in total per year", "Lengthens the grace period to 31 days", "Eliminates the grace period", "Lowers the total yearly cost"], "e": "More frequent premium modes generally cost more over a year because of added billing and lost interest to the insurer. In Illinois the grace period is 7 days for weekly, 10 days for monthly, and 31 days for other modes (215 ILCS 5/357.4), so monthly doesn't lengthen it.", "m": "Pay more often, pay a little more. Grace: 7-10-31.", "c": ["hg_grace"]}, {"id": "hg194", "t": "Other Insurance Concepts", "q": "A health policy's premium mode refers to", "o": ["How often premiums are paid (monthly, annually)", "Whether the policy is individual or group coverage", "The insurer's method of setting claim reserves", "The order in which multiple plans pay a claim"], "e": "Premium mode is the payment frequency: annual, semiannual, quarterly, monthly (and weekly for some policies). The order in which plans pay is coordination of benefits.", "m": "MODE = how Many times a year you pay.", "c": ["hg_grace"]}, {"id": "hg195", "t": "Other Insurance Concepts", "q": "A nonoccupational health or disability policy generally", "o": ["Excludes work injuries covered by workers comp", "Covers only injuries that occur while on the job", "Pays benefits only when workers comp has denied a claim", "Covers both on-the-job and off-the-job losses fully"], "e": "Nonoccupational coverage applies to injuries and sickness off the job; work-related losses are left to workers' compensation. Occupational coverage covers both on and off the job.", "m": "NON-occupational = NOT the job (workers comp handles the job).", "c": ["hg_wc"]}, {"id": "hg196", "t": "Other Insurance Concepts", "q": "In Illinois, temporary total disability (TTD) workers' compensation payments are generally", "o": ["Two-thirds of the average weekly wage, within limits", "50% of the employee's gross wages, with no weekly maximum", "100% of wages for the first 14 days off work", "80% of wages after a 90-day elimination period"], "e": "820 ILCS 305/8(b): TTD compensation is 66 2/3% of the employee's average weekly wage, subject to statutory minimums and maximums.", "m": "Workers comp = two-thirds (66 2/3%).", "c": ["hg_wc"]}, {"id": "hg197", "t": "Other Insurance Concepts", "q": "Under the Illinois Workers' Compensation Act, weekly TTD benefits are not paid for the first 3 working days unless the incapacity lasts", "o": ["14 days or more from the accident", "30 days or more from the accident", "7 days or more from the claim date", "90 days or more from the claim date"], "e": "820 ILCS 305/8(b): no compensation for the first 3 working days, but if the incapacity lasts 14 calendar days or more, compensation is paid from the day after the accident.", "m": "3 days unpaid, paid back at 14: '3 then 14'.", "c": ["hg_wc"]}, {"id": "hg198", "t": "Other Insurance Concepts", "q": "Workers' compensation in Illinois pays for medical care for a covered work injury", "o": ["With the employer paying all necessary treatment", "Only after the employee's health plan pays first", "Only if the employee proves the employer was negligent", "Only for injuries that cause a permanent disability"], "e": "820 ILCS 305/8(a): the employer must provide and pay for all necessary first aid, medical and surgical services, and hospital care reasonably required to cure or relieve the effects of the injury. Workers' comp is no-fault, so negligence doesn't have to be proven.", "m": "Work injury = the employer's bill, no fault needed.", "c": ["hg_wc"]}, {"id": "hg199", "t": "Other Insurance Concepts", "q": "An employee's group plan that covers non-occupational disabilities pays benefits for a work injury that workers' comp should have paid. Under Illinois law, the employer", "o": ["Gets a credit for those payments against compensation owed", "Must pay the full compensation again with no credit allowed", "May deny the workers' comp claim permanently as a result", "Must refund the group plan's payments to the employee"], "e": "820 ILCS 305/8(j): if an employee receives payments from a group plan for non-occupational disabilities that should have been paid as compensation, the employer gets credit for those payments against the compensation due.", "m": "No double dipping: the employer gets credit.", "c": ["hg_wc"]}, {"id": "hg200", "t": "Other Insurance Concepts", "q": "HSA contributions made by an eligible individual (not through an employer) are", "o": ["Deductible, even if the person doesn't itemize", "Deductible only by people who itemize deductions", "Taxable income, but withdrawals are tax-free", "Not allowed unless the employer also contributes"], "e": "IRS Pub. 969: contributions you make to your HSA (other than employer contributions) are deductible whether or not you itemize. Employer contributions are excluded from income.", "m": "HSA = triple tax break: in deductible, growth untaxed, out tax-free for medical.", "c": ["hg_accounts", "hg_tax"]}, {"id": "hg201", "t": "Other Insurance Concepts", "q": "Distributions from an HSA used for qualified medical expenses are", "o": ["Tax-free", "Taxable as ordinary income", "Taxed at capital gains rates", "Taxed, then refunded at year-end"], "e": "IRS Pub. 969: HSA distributions used to pay qualified medical expenses aren't taxed.", "m": "Medical out = tax-free out.", "c": ["hg_accounts", "hg_tax"]}, {"id": "hg202", "t": "Other Insurance Concepts", "q": "After an HSA owner turns 65, a withdrawal for a nonmedical purpose is", "o": ["Taxable income, but not subject to the 20% additional tax", "Tax-free, as long as the account was open for at least 5 years", "Subject to income tax plus the 20% additional tax", "Subject only to a 10% additional tax, with no income tax"], "e": "IRS Form 8889 instructions: nonmedical distributions are included in income, and the 20% additional tax doesn't apply after the account owner dies, becomes disabled, or turns 65.", "m": "Before 65: tax + 20%. After 65: just tax (like an IRA).", "c": ["hg_accounts", "hg_tax"]}, {"id": "hg203", "t": "Other Insurance Concepts", "q": "When an employer pays part of a group disability premium (pretax) and the employee pays the rest with after-tax dollars, disability benefits are", "o": ["Taxable only for the employer-paid share", "Fully taxable because an employer paid any premium", "Fully tax-free because the employee paid any premium", "Taxable only if benefits continue more than 2 years"], "e": "IRS: if the employer paid the premiums, benefits are taxable; if you paid with after-tax dollars, they're tax-free; if both paid, only the part due to the employer's payments is taxable.", "m": "Who paid the premium decides who pays the tax, split by share.", "c": ["hg_tax"]}, {"id": "hg204", "t": "Other Insurance Concepts", "q": "Under managed care, utilization review that happens BEFORE a planned hospital admission is", "o": ["Prospective review", "Retrospective review", "Concurrent review", "Subrogation review"], "e": "Utilization review is timed: prospective (before care, like precertification), concurrent (during a stay), and retrospective (after care is given).", "m": "PRO = before (prologue); CON = concurrent (during); RETRO = looking back.", "c": ["hg_review"]}, {"id": "hg205", "t": "Other Insurance Concepts", "q": "Utilization review that checks a hospital stay while the patient is still admitted is", "o": ["Concurrent review", "Prospective review", "Retrospective review", "Second surgical opinion"], "e": "Concurrent review monitors care during the stay (for example, length of stay). Prospective review happens before admission; retrospective review after discharge.", "m": "CONcurrent = CONtinuing stay.", "c": ["hg_review"]}, {"id": "hg206", "t": "Other Insurance Concepts", "q": "A health insurer that pays a claim caused by a negligent driver may recover from the driver under subrogation. This mainly ensures the insured", "o": ["Cannot collect twice for the same medical bills", "Keeps the insurer's payment and the full recovery", "Must sue the driver personally before filing", "Loses coverage once the insurer recovers"], "e": "Subrogation transfers the insured's right to recover from a liable third party to the insurer, up to what the insurer paid, which prevents a double recovery.", "m": "Subrogation = insurer SUBstitutes for you against the at-fault party."}, {"id": "hg207", "t": "Other Insurance Concepts", "q": "Which cost containment technique moves care from a hospital to a lower-cost setting?", "o": ["Outpatient (ambulatory) surgery", "Coordination of benefits", "A higher lifetime maximum benefit", "Waiver of premium"], "e": "Encouraging outpatient or ambulatory surgery is a cost containment technique; other examples include preadmission testing, second surgical opinions, and utilization review.", "m": "Out the hospital door = lower cost.", "c": ["hg_review"]}, {"id": "hg208", "t": "Other Insurance Concepts", "q": "The owner of an individual health policy who has NOT named an irrevocable beneficiary may", "o": ["Change the beneficiary without the beneficiary's consent", "Rewrite the policy's mandatory provisions by endorsement", "Cancel the insurer's right to require proof of loss", "Require the insurer to renew a cancelable policy"], "e": "Unless the beneficiary designation is irrevocable, the owner may change the beneficiary without the beneficiary's consent (the uniform change-of-beneficiary provision). The owner can't rewrite statutory provisions.", "m": "Revocable = owner can revise."}, {"id": "hg209", "t": "Other Insurance Concepts", "q": "A disability policy that uses 'own occupation' for an initial period and then 'any occupation for which the insured is reasonably suited' uses a", "o": ["Split (dual) definition of total disability", "Presumptive definition of total disability only", "Residual definition of partial disability", "Recurrent definition of total disability"], "e": "Many disability policies use a split definition: own occupation for an initial period, then any occupation the insured is reasonably suited for by education, training, or experience.", "m": "Split = two definitions back to back: own, then any.", "c": ["hg_disab"]}, {"id": "hg210", "t": "Other Insurance Concepts", "q": "Compared with 'own occupation,' a total disability definition based on any occupation for which the insured is reasonably suited by education, training, or experience is", "o": ["Stricter, so benefits are harder to qualify for", "More liberal, so benefits are easier to qualify for", "Identical, because both measure lost income only", "Used only for partial disability, not total disability"], "e": "An 'any occupation' definition asks whether the insured can do other suitable work, so it's harder to meet than 'own occupation,' which asks only about the insured's own job.", "m": "OWN = only your job (easy); ANY = any job (hard).", "c": ["hg_disab"]}, {"id": "hg211", "t": "Types of Policies", "q": "Under Illinois law (215 ILCS 5/351A-7), an individual long-term care policyholder may return the policy for a full premium refund within", "o": ["30 days of delivery", "10 days of delivery", "20 days of delivery", "60 days of delivery"], "e": "215 ILCS 5/351A-7: individual LTC applicants may return the policy within 30 days of delivery and have the premium refunded; direct-response solicitations must give the same right.", "m": "LTC and Medigap: the 30-day look in Illinois.", "c": ["hg_freelook"]}, {"id": "hg212", "t": "Types of Policies", "q": "Illinois requires Medicare supplement policies to give the insured the right to return the policy for a refund within", "o": ["30 days of delivery", "10 days of delivery", "45 days of delivery", "60 days of delivery"], "e": "215 ILCS 5/363(4): Medicare supplement policies must prominently state that the holder may return the policy within 30 days of delivery and have the premium refunded.", "m": "Seniors' products (Medigap, LTC) get 30 days.", "c": ["hg_freelook"]}, {"id": "hg213", "t": "Types of Policies", "q": "Under Illinois law, a Medicare supplement policy may not deny a claim for a preexisting condition for losses incurred more than", "o": ["6 months after the coverage effective date", "12 months after the coverage effective date", "24 months after the coverage effective date", "3 months after the coverage effective date"], "e": "215 ILCS 5/363(5): a Medicare supplement policy can't deny claims for losses incurred more than 6 months after the effective date due to a preexisting condition, and can't define a preexisting condition more restrictively than one treated or advised within 6 months before coverage.", "m": "Medigap: 6 back, 6 forward.", "c": ["hg_medicare"]}, {"id": "hg214", "t": "Types of Policies", "q": "Illinois gives Medicare supplement policyholders age 65 to 75 an annual open enrollment period that", "o": ["Lasts 45 days starting on their birthday", "Lasts 30 days starting on each January 1", "Lasts 6 months starting at age 65 only", "Lasts 60 days after each rate increase"], "e": "215 ILCS 5/363(8): an Illinois resident age 65 to 75 with a Medigap policy gets an annual 45-day open enrollment period starting on their birthday, without health questions or pricing based on health.", "m": "Illinois birthday gift: 45 days of Medigap open enrollment.", "c": ["hg_medenroll"]}, {"id": "hg215", "t": "Types of Policies", "q": "During the Illinois birthday open enrollment period for Medigap, the policyholder may buy", "o": ["Same or lesser benefits from the issuer or an affiliate", "Any plan from any insurer, including plans with richer benefits", "Only a Medicare Advantage plan from the same insurer", "A second Medigap policy to add to the existing one"], "e": "215 ILCS 5/363(8): the policyholder may buy any Medigap policy from the same issuer or an affiliate with benefits equal to or lesser than the prior coverage.", "m": "Birthday swap: same company family, same or less coverage.", "c": ["hg_medenroll"]}, {"id": "hg216", "t": "Types of Policies", "q": "Illinois requires a Medigap issuer to accept an applicant under 65 who has Medicare because of disability if the person applies within", "o": ["6 months of first enrolling in Part B", "31 days of first enrolling in Part A", "12 months of the onset of the disability", "24 months of first receiving SSDI"], "e": "215 ILCS 5/363(6): an issuer may not deny coverage to an applicant under 65 eligible for Medicare by disability who applies within 6 months of first enrolling in Part B, and must offer each plan type it sells to people 65 and older.", "m": "Same 6-month Part B window as at 65, under 65 too in Illinois.", "c": ["hg_medenroll"]}, {"id": "hg217", "t": "Types of Policies", "q": "Under Illinois group health continuation (215 ILCS 5/367e), an employee who loses group coverage can continue it for up to", "o": ["12 months", "18 months", "36 months", "6 months"], "e": "215 ILCS 5/367e: Illinois continuation lasts up to 12 months, ending earlier if premiums aren't paid, the person becomes eligible for other group coverage or Medicare, or the group policy ends. Federal COBRA is 18 or 36 months.", "m": "Illinois continuation = 1 year (12); COBRA = 18 for the job, 36 for the family.", "c": ["hg_cobra"]}, {"id": "hg218", "t": "Types of Policies", "q": "To qualify for Illinois group health continuation under 367e, the employee must have been continuously insured under the group policy for", "o": ["The 3 months before termination", "The 12 months before termination", "At least 1 year of employment", "The 30 days before termination"], "e": "215 ILCS 5/367e: continuation is available to an employee insured continuously under the group policy for the 3 months before termination of employment or membership.", "m": "3 months in to get 12 months more.", "c": ["hg_cobra"]}, {"id": "hg219", "t": "Types of Policies", "q": "Under 367e, an employee who wants Illinois continuation must request it in writing within 30 days after notice, but never more than", "o": ["60 days after the termination", "90 days after the termination", "31 days after the termination", "120 days after the termination"], "e": "215 ILCS 5/367e: the employer gives notice within 10 days; the employee elects in writing within 30 days of receiving notice, but in no event more than 60 days after termination.", "m": "Illinois continuation clock: 10 (notice) - 30 (elect) - 60 (outer limit).", "c": ["hg_cobra"]}, {"id": "hg220", "t": "Types of Policies", "q": "Under Illinois group health continuation (367e), the premium an employee may be charged is", "o": ["No more than the group rate", "Up to 102% of the group rate", "Up to 150% of the group rate", "The individual-market rate"], "e": "215 ILCS 5/367e: the employee pays the group rate monthly in advance; it can't exceed the group rate for that coverage. Federal COBRA may charge up to 102% (150% in the disability extension).", "m": "Illinois = group rate flat; COBRA = 102%.", "c": ["hg_cobra"]}, {"id": "hg221", "t": "Types of Policies", "q": "Under Illinois group health continuation (367e), continuation coverage need NOT include", "o": ["Dental, vision, and prescription drug benefits", "Hospital, surgical, and major medical benefits", "Major medical benefits alone", "Coverage for eligible dependents"], "e": "215 ILCS 5/367e: continuation need not include dental, vision care, prescription drug, disability income, or specified disease benefits, but it must include the hospital, surgical, and major medical coverage.", "m": "Illinois continuation keeps the core medical, can drop the extras (teeth, eyes, pills).", "c": ["hg_cobra"]}, {"id": "hg222", "t": "Types of Policies", "q": "For 2026, the IRS minimum annual deductible for an HSA-qualified high deductible health plan with self-only coverage is", "o": ["$1,700", "$1,000", "$3,400", "$8,500"], "e": "IRS Pub. 15-B (2026): a qualifying HDHP must have a deductible of at least $1,700 (self-only) or $3,400 (family), and out-of-pocket costs no more than $8,500 or $17,000.", "m": "HDHP 2026: $1,700 single, doubled to $3,400 family.", "c": ["hg_accounts"]}, {"id": "hg223", "t": "Types of Policies", "q": "An HSA-eligible person age 55 or older may make an additional catch-up contribution of", "o": ["$1,000 per year", "$500 per year", "$2,000 per year", "$7,500 per year"], "e": "IRS Pub. 969 / 15-B: the HSA catch-up contribution for people 55 or older is $1,000.", "m": "HSA catch-up: 55 gets $1,000.", "c": ["hg_accounts"]}, {"id": "hg224", "t": "Types of Policies", "q": "Contributions to a person's HSA must stop once the person", "o": ["Enrolls in Medicare (A or B)", "Reaches age 59 1/2 and retires", "Changes to a new employer's plan", "Turns 55 and claims the catch-up"], "e": "IRS Pub. 15-B: no HSA contributions can be made for a person after they enroll in Medicare Part A or Part B; the account can still be used.", "m": "Medicare in, HSA contributions out.", "c": ["hg_medicare", "hg_accounts"]}, {"id": "hg225", "t": "Types of Policies", "q": "A Qualified Small Employer HRA (QSEHRA) may be offered only by an employer that", "o": ["Has under 50 full-time staff and offers no group health plan", "Has 20 or more employees and a self-funded group health plan", "Offers a high deductible health plan to every employee", "Is a nonprofit organization with fewer than 100 employees"], "e": "IRS Pub. 15-B: a QSEHRA is available to employers that aren't applicable large employers (fewer than 50 full-time employees, including equivalents) and don't offer a group health plan; 2026 limits are $6,450 self-only and $13,100 family.", "m": "QSEHRA: Small (under 50) and no group plan.", "c": ["hg_accounts"]}, {"id": "hg226", "t": "Types of Policies", "q": "Salary-reduction contributions to a health FSA for plan years beginning in 2026 are capped at", "o": ["$3,400", "$2,500", "$5,000", "$7,500"], "e": "IRS Pub. 15-B (2026): the health FSA salary-reduction limit is $3,400. ($7,500 is the 2026 dependent care assistance limit.)", "m": "Health FSA 2026: $3,400 (same number as the family HDHP deductible).", "c": ["hg_accounts"]}, {"id": "hg227", "t": "Types of Policies", "q": "Standardized Medigap policies are", "o": ["Guaranteed renewable if premiums are paid", "Cancelable by the insurer at any anniversary", "Noncancelable, with premiums fixed for life", "Renewable only until age 75"], "e": "Medicare.gov: Medigap policies are guaranteed renewable: the insurer can't cancel as long as premiums are paid, though premiums may rise.", "m": "Medigap stays as long as you pay.", "c": ["hg_medicare", "hg_renew"]}], "sheet": [{"id": "hg_grace", "title": "Health grace periods vs life", "rows": [["Weekly premium: 7 days", "Illinois uniform provision (215 ILCS 5/357.4)."], ["Monthly premium: 10 days", "Illinois uniform provision (215 ILCS 5/357.4)."], ["All other modes (quarterly, semiannual, annual): 31 days", "Illinois uniform provision (215 ILCS 5/357.4)."], ["Life policy (Illinois): 30 days or one month", "Different statute; life insurance (215 ILCS 5/224)."]], "src": "215 ILCS 5/357.4 (health); 215 ILCS 5/224 (life)", "rel": ["hg50", "hg51", "hg193", "hg194"]}, {"id": "hg_reinstate", "title": "Reinstatement numbers", "rows": [["Automatic reinstatement: 45 days if the insurer doesn't act on the application", "Protects the insured from insurer delay."], ["Sickness covered only if it begins more than 10 days after reinstatement", "Prevents adverse selection; accidents are covered immediately."]], "src": "215 ILCS 5/357.5", "rel": ["hg52", "hg53"]}, {"id": "hg_claims", "title": "Claim provision clocks: 20 / 15 / 90 / 60", "rows": [["Notice of claim: within 20 days of loss", "Insured tells insurer a claim exists."], ["Claim forms: insurer sends within 15 days", "If late, any written proof is accepted."], ["Proof of loss: within 90 days; no later than 1 year unless legally incapacitated", "Insured documents the loss."], ["Legal action: not before 60 days after proof of loss, and not after 3 years (215 ILCS 5/357.12)", "Gives the insurer time to pay."]], "src": "215 ILCS 5/357.6, 357.7, 357.8, 357.12", "rel": ["hg54", "hg55", "hg56", "hg57", "hg60"]}, {"id": "hg_waits", "title": "Elimination vs probationary vs waiver-of-premium waits", "rows": [["Elimination period", "Days of disability before benefits start - applies to EACH claim (a time deductible)."], ["Probationary period", "ONE-TIME period after policy issue during which SICKNESS is not covered."], ["Waiver of premium waiting period", "Total disability must last the stated waiting period before premiums are waived."], ["Recurrent disability window", "A recurrence within the stated window is treated as the same claim; no new elimination period."]], "src": "Policy concepts from the Pearson VUE outline", "rel": ["hg67", "hg68", "hg69", "hg115"]}, {"id": "hg_cobra", "title": "COBRA numbers", "rows": [["Applies to employers with 20+ employees", "Federal COBRA threshold."], ["18 months", "Termination (not gross misconduct) or reduced hours."], ["36 months", "Dependents: divorce, death of employee, employee's Medicare entitlement, loss of dependent status."], ["Premium up to 102% (150% during disability extension)", "2% administrative charge."], ["Illinois continuation (215 ILCS 5/367e): up to 12 months at the group rate", "Needs 3 months insured first; notice within 10 days, elect within 30 days (never more than 60 days after termination); may omit dental, vision, Rx."]], "src": "DOL COBRA page; 29 U.S.C. 1162; 215 ILCS 5/367e (Illinois continuation)", "rel": ["hg28", "hg29", "hg30", "hg31", "hg184", "hg217", "hg218", "hg219", "hg220", "hg221"]}, {"id": "hg_medicare", "title": "Medicare parts and timing", "rows": [["Part A", "Inpatient hospital, post-hospital SNF (after 3-day stay), hospice, some home health."], ["Part B", "Physicians, outpatient, DME; 80% after deductible."], ["Part C", "Medicare Advantage through private insurers."], ["Part D", "Prescription drugs through private plans."], ["SSDI: 5-month wait for cash benefits; Medicare after 24 months of SSDI", "Different clocks for different programs."], ["Medigap open enrollment: 6 months from first month 65+ and in Part B", "Guaranteed issue window."], ["Part A benefit period ends after 60 consecutive days out of hospital/SNF", "Then a new deductible applies."], ["Hospital days 1-60 / 61-90 / 60 lifetime reserve days", "Reserve days are used once in a lifetime; SNF is a separate 100-day limit (days 1-20 $0)."], ["Who pays first at 65+: employer with 20+ employees AND still working = group plan", "Under 20 employees, retiree coverage, or COBRA = Medicare pays first."], ["Medicare Advantage needs A AND B; Part D needs A OR B", "Hospice is paid by Original Medicare even for MA members."], ["Medicaid = payer of last resort", "Every other coverage pays before Medicaid."]], "src": "Medicare.gov (SNF, benefit period, reserve days, hospice, Medigap); CMS Medicare Secondary Payer; Medicaid.gov (payer of last resort); SSA Blue Book (5 months, 24 months, 80%)", "rel": ["hg22", "hg23", "hg24", "hg25", "hg94", "hg95", "hg96", "hg97", "hg98", "hg99", "hg100", "hg103", "hg105", "hg106", "hg107", "hg153", "hg161", "hg162", "hg163", "hg164", "hg165", "hg166", "hg167", "hg168", "hg169", "hg170", "hg176", "hg178", "hg179", "hg185", "hg213", "hg224", "hg227"]}, {"id": "hg_renew", "title": "Renewability provisions", "rows": [["Noncancelable", "Can't cancel AND premiums are fixed to a set age."], ["Guaranteed renewable", "Can't cancel; premiums may rise for the whole CLASS."], ["Conditionally/optionally renewable", "Insurer may decline to renew at the anniversary."], ["Cancelable", "Insurer may cancel any time with notice; prior losses still covered."]], "src": "Policy concepts from the Pearson VUE outline", "rel": ["hg83", "hg84", "hg85", "hg86", "hg87", "hg93", "hg227"]}, {"id": "hg_costshare", "title": "Deductible vs coinsurance vs copay", "rows": [["Deductible", "Dollar amount paid first, before the plan pays."], ["Coinsurance", "PERCENTAGE split after the deductible (e.g., 80/20)."], ["Copayment", "FLAT dollar amount per service."], ["Corridor deductible", "Between basic coverage and supplementary major medical."]], "src": "Policy concepts from the Pearson VUE outline", "rel": ["hg72", "hg73", "hg74", "hg75", "hg77"]}, {"id": "hg_accounts", "title": "HSA vs FSA vs HRA", "rows": [["HSA", "Individually owned, portable, requires an HDHP; nonmedical use before 65 = income tax + 20%."], ["FSA", "Employee salary reduction; use-it-or-lose-it (limited carryover/grace)."], ["HRA", "Employer-funded only; employer sets carryover rules."], ["Compare: early IRA/annuity withdrawal penalty is 10%, not 20%", "Different account types."], ["2026: HDHP minimum deductible $1,700 / $3,400; HSA $4,400 / $8,750 (+$1,000 at 55)", "HSA contributions stop at Medicare enrollment."], ["2026: health FSA $3,400; QSEHRA $6,450 / $13,100 (employers under 50, no group plan)", "IRS Pub. 15-B."]], "src": "IRS Pub. 969 / Form 8889 instructions (20%, 65); IRS Pub. 15-B (2026 limits); IRS Topic 557 (10%)", "rel": ["hg17", "hg18", "hg19", "hg20", "hg21", "hg200", "hg201", "hg202", "hg222", "hg223", "hg224", "hg225", "hg226"]}, {"id": "hg_disab", "title": "Disability definitions", "rows": [["Own occupation", "Cannot do the main duties of YOUR occupation (most liberal)."], ["Any occupation / Social Security", "Cannot do ANY gainful work (strictest)."], ["Residual", "Benefit proportional to INCOME lost after returning to work."], ["Partial", "Can't do SOME duties; a reduced benefit for a limited time."], ["Presumptive", "Loss of sight, speech, hearing, or two limbs = total disability automatically."]], "src": "Policy concepts; SSA Blue Book (Social Security definition)", "rel": ["hg104", "hg112", "hg113", "hg114", "hg116", "hg209", "hg210"]}, {"id": "hg_tax", "title": "Health tax treatment", "rows": [["Individual pays DI premium (after-tax)", "Not deductible; benefits tax-free."], ["Employer pays DI premium and deducts it", "Benefits taxable to the employee."], ["Both pay DI premium", "Only the employer-paid share of benefits is taxable."], ["HSA", "Own contributions deductible (even without itemizing); medical withdrawals tax-free; nonmedical after 65 = income tax only."]], "src": "IRS (disability insurance proceeds FAQ / Pub. 525); IRS Pub. 969 (HSA)", "rel": ["hg45", "hg125", "hg126", "hg127", "hg128", "hg129", "hg200", "hg201", "hg202", "hg203"]}, {"id": "hg_cob", "title": "Coordination of benefits", "rows": [["Plan covering the person as an EMPLOYEE is primary over the plan covering them as a dependent", "COB order."], ["Birthday rule for children", "Parent whose birthday (month/day) falls EARLIER in the year is primary; birth year doesn't matter."], ["ACA dependent coverage to age 26", "Separate rule about eligibility, not order of payment."], ["Divorced parents (no decree): custodial parent, then custodial parent's spouse, then other parent", "A court decree that assigns health expenses overrides this order; same birthday = plan in force longer."], ["Active employee before retired/laid-off; employee/dependent coverage before continuation (COBRA)", "Medicare is primary to retiree coverage."]], "src": "50 Ill. Adm. Code 2009.40 (COB order, birthday rule, divorced parents, active vs retired, continuation); HealthCare.gov (age 26); CMS Medicare Secondary Payer", "rel": ["hg117", "hg119", "hg120", "hg121", "hg167", "hg168", "hg180", "hg181", "hg182", "hg183", "hg184", "hg185", "hg186"]}, {"id": "hg_medenroll", "title": "Medicare and Medigap enrollment windows", "rows": [["Initial Enrollment Period: 7 months", "3 months before the 65th-birthday month, that month, 3 months after."], ["General Enrollment Period: January 1 - March 31", "For people who missed Part A/B sign-up; coverage starts the month after sign-up."], ["Open Enrollment: October 15 - December 7", "Change Medicare Advantage or Part D plans; effective January 1."], ["Special Enrollment Period: 8 months after employer coverage (current work) ends", "COBRA or retiree coverage ending does not count."], ["Medigap open enrollment: 6 months from first month 65+ AND in Part B", "Federal guaranteed-issue window; Illinois extends it to under-65 disabled (6 months from Part B)."], ["Illinois Medigap birthday window: 45 days, ages 65-75", "Same or lesser benefits from the same issuer or affiliate (215 ILCS 5/363(8))."], ["Penalties: Part B 10% per full 12 months; Part D 1% per month", "Part B penalty lasts as long as you have Part B."]], "src": "Medicare.gov (enrollment periods, late penalties); 215 ILCS 5/363(6),(8)", "rel": ["hg157", "hg158", "hg159", "hg160", "hg214", "hg215", "hg216"]}, {"id": "hg_ss", "title": "Social Security credits and disability numbers", "rows": [["Up to 4 credits a year; 40 credits for retirement", "About 10 years of work."], ["Disability recent-work test: age 31+ = 20 credits in the last 10 years", "Before age 24: 6 credits in the 3 years before disability."], ["5-month wait, then Medicare after 24 months of benefits", "No 5-month wait for ALS."], ["Disabled widow(er): ages 50 to 60", "Survivor benefit, not the worker's own SSDI."], ["Appeal within 60 days", "Reconsideration, hearing, Appeals Council, federal court."], ["SSI = need-based (income and resources), not work credits", "In most states SSI recipients also qualify for Medicaid."]], "src": "SSA (credits page, Blue Book, disability benefits, appeals)", "rel": ["hg171", "hg172", "hg173", "hg174", "hg175", "hg177"]}, {"id": "hg_newborn", "title": "Illinois dependent-child rules", "rows": [["Newborn covered from the moment of birth (356c)", "Includes congenital defects and premature-birth complications."], ["Newborn notice: within 31 days if a separate premium is needed", "Coverage still starts at birth; notice keeps it going past 31 days."], ["Disabled child past the limiting age (356b)", "Can't self-support due to disability and chiefly dependent on the policyholder."], ["Insurer may ask 2 months before the limiting age; proof due within 60 days", "Different from the 31-day newborn notice."], ["ACA: dependents may stay on a parent's plan to age 26", "Eligibility rule, not a COB rule."]], "src": "215 ILCS 5/356b, 356c; HealthCare.gov (age 26)", "rel": ["hg117", "hg118", "hg187", "hg188", "hg189", "hg190"]}, {"id": "hg_wc", "title": "Workers' comp (Illinois) vs non-occupational coverage", "rows": [["TTD = 66 2/3% of average weekly wage", "Within statutory minimums and maximums (820 ILCS 305/8(b))."], ["First 3 working days unpaid", "Paid back from the day after the accident if incapacity lasts 14 days or more."], ["Employer pays all necessary medical care", "No-fault system; negligence need not be proven."], ["Group non-occupational plan paid a work claim", "Employer gets credit against compensation (8(j))."], ["Non-occupational policy", "Covers off-the-job losses; work injuries are left to workers' comp."]], "src": "820 ILCS 305/8(a), 8(b), 8(j)", "rel": ["hg122", "hg123", "hg195", "hg196", "hg197", "hg198", "hg199"]}, {"id": "hg_review", "title": "Utilization review and cost containment", "rows": [["Prospective review", "BEFORE care (precertification of a planned admission)."], ["Concurrent review", "DURING a hospital stay."], ["Retrospective review", "AFTER care is given."], ["Outpatient (ambulatory) surgery", "Moves care to a lower-cost setting."]], "src": "Managed-care and cost-containment concepts from the Pearson VUE outline", "rel": ["hg130", "hg131", "hg132", "hg204", "hg205", "hg207"]}, {"id": "hg_freelook", "title": "Illinois return (free-look) and related windows", "rows": [["Long-term care: 30 days to return for a refund", "215 ILCS 5/351A-7."], ["Medicare supplement: 30 days to return for a refund", "215 ILCS 5/363(4)."], ["Medigap preexisting conditions: 6 months max", "Can't look back more than 6 months or exclude for more than 6 months (363(5))."], ["Compare: newborn notice 31 days; IL birthday Medigap window 45 days", "Different clocks for different rules."]], "src": "215 ILCS 5/351A-7 (LTC); 215 ILCS 5/363(4),(5) (Medicare supplement)", "rel": ["hg211", "hg212"]}]}, "ls": {"name": "Life - Illinois State", "exam": {"n": 36, "scored": 31, "min": 50}, "topics": [{"name": "Insurance Director", "w": 1.5}, {"name": "License and Registration", "w": 9.5}, {"name": "Continuing Education", "w": 2}, {"name": "Fiduciary Responsibilities", "w": 2}, {"name": "Commissions and Compensation", "w": 0.5}, {"name": "Disclosure", "w": 0.5}, {"name": "Marketing Practices", "w": 4}, {"name": "Unfair Claims Practices", "w": 2}, {"name": "Replacement", "w": 1.5}, {"name": "Life Solicitation", "w": 1.5}, {"name": "Policy Provisions", "w": 1}, {"name": "Illustrations", "w": 1.5}, {"name": "Accelerated Benefits", "w": 0.5}, {"name": "Viatical Settlements", "w": 0.5}, {"name": "Guaranty Association", "w": 0.5}, {"name": "Advertising and Sales", "w": 2}], "qs": [{"id": "ls0", "t": "Insurance Director", "q": "The chief insurance regulator in Illinois is the", "o": ["Director of Insurance", "Insurance Commissioner elected by voters", "Attorney General", "Secretary of State"], "e": "Illinois uses the title Director, heading the Department of Insurance; the Director enforces the Insurance Code and may adopt reasonable rules (215 ILCS 5/401).", "m": "Illinois has a DIRECTOR, not a Commissioner: think \"the Director directs the Department.\""}, {"id": "ls1", "t": "Insurance Director", "q": "Under the Illinois Insurance Code, the Director may examine", "o": ["Any producer license applicant or holder, and any business entity", "Licensed insurers, but not individual producers or business entities", "Nonresident producers, but not resident producers or applicants", "Producers who have had a consumer complaint filed with the Department"], "e": "215 ILCS 5/500-110(a) allows examination of applicants, producers, limited line and temporary producers, and business entities.", "m": "\"Anyone holding or seeking a license can be looked at\": applicants, producers and business entities are all fair game for an exam."}, {"id": "ls2", "t": "Insurance Director", "q": "A producer who is examined by the Director and receives a report alleging violations may request a hearing within", "o": ["14 calendar days after receiving the report", "30 days after the date of the examination", "20 days after the Director files the report", "10 working days after receiving the report"], "e": "Under 5/500-110(e), the request must be in writing with a statement of objections, within 14 calendar days.", "m": "Fortnight to fight: you get 14 days (two weeks) to object to an exam report in writing.", "c": ["ls_30days"]}, {"id": "ls3", "t": "Insurance Director", "q": "After a regulatory examination report on a producer is filed (and no hearing is held), the Director must issue a written order within", "o": ["90 days", "30 days", "14 days", "1 year"], "e": "5/500-110(e): within 90 days after the report is filed, or within 90 days after the hearing if one is held.", "m": "Exam report to order = 90 days: the same 90 days whether or not a hearing is held.", "c": ["ls_90days"]}, {"id": "ls4", "t": "Insurance Director", "q": "A person who violates a written order issued after a producer examination may be subject to a civil penalty of up to", "o": ["$20,000", "$1,000", "$5,000", "$100,000"], "e": "5/500-110(g) also allows suspension or revocation under 5/500-70.", "m": "Defy the exam ORDER = up to $20K. Picture a $20,000 ticket for ignoring a written order.", "c": ["ls_penalties"]}, {"id": "ls5", "t": "Insurance Director", "q": "During
