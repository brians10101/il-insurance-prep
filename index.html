dends must state that dividends", "o": ["Are based on the current dividend scale and are not guaranteed", "Are guaranteed", "Are taxable", "Will increase each year"], "e": "930.40(i)(1)(I)."}, {"id": "ls86", "t": "Life Solicitation", "q": "In Illinois, an annuity or life insurance recommendation to a consumer must be", "o": ["Suitable and in the consumer's best interest based on reasonable inquiry into the consumer's financial situation and objectives", "Based on the highest commission", "Approved by the Director", "Made only in writing by the insurer"], "e": "Illinois suitability rules (50 Ill. Adm. Code 3120 for annuities) require a reasonable basis and consumer profile information."}, {"id": "ls87", "t": "Policy Provisions", "q": "Illinois law requires individual life policies to include a free look period of", "o": ["10 days from delivery", "20 days from application", "30 days from delivery", "7 days from issue"], "e": "215 ILCS 5/224(1)(n); the insurer refunds any premium paid, including fees."}, {"id": "ls88", "t": "Policy Provisions", "q": "Illinois requires individual life policies to provide a grace period of", "o": ["30 days or one month", "10 days", "31 days only", "60 days"], "e": "5/224(1)(b); the insurer may charge interest of no more than 6% per year for days of grace used."}, {"id": "ls89", "t": "Policy Provisions", "q": "An Illinois life policy must become incontestable, except for nonpayment of premium, after being in force during the insured's lifetime for no more than", "o": ["2 years from its date", "1 year", "3 years", "5 years"], "e": "5/224(1)(c)."}, {"id": "ls90", "t": "Policy Provisions", "q": "An Illinois life policy that has lapsed, with nonforfeiture insurance in force and not surrendered, may be reinstated within", "o": ["3 years from default, with evidence of insurability and payment of arrears", "1 year", "5 years", "31 days only"], "e": "5/224(1)(i); interest on premiums may not exceed 6% per year."}, {"id": "ls91", "t": "Policy Provisions", "q": "An Illinois whole life policy must make policy loans available after it has been in force", "o": ["3 full years", "1 year", "5 years", "10 years"], "e": "5/224(1)(f); this does not apply to term insurance."}, {"id": "ls92", "t": "Policy Provisions", "q": "Illinois requires life insurers to settle death claims upon receipt of due proof of death, and no later than", "o": ["2 months after receipt of proof", "30 days after death", "6 months after proof", "1 year after death"], "e": "5/224(1)(j)."}, {"id": "ls93", "t": "Policy Provisions", "q": "If an Illinois life insurer does not pay death proceeds within 31 days of the latest of proof of death, sufficient information, or resolution of legal impediments, interest accrues from the date of death at", "o": ["10% annually", "6% annually", "The policy loan rate", "1% monthly"], "e": "5/224(1)(l)."}, {"id": "ls94", "t": "Policy Provisions", "q": "An Illinois participating life policy must begin to participate in surplus no later than the end of the", "o": ["Third policy year", "First policy year", "Fifth policy year", "Tenth policy year"], "e": "5/224(1)(e)."}, {"id": "ls95", "t": "Policy Provisions", "q": "Illinois life policies must include a table showing loan values and nonforfeiture options for at least the first", "o": ["20 policy years", "5 policy years", "10 policy years", "30 policy years"], "e": "5/224(1)(h)."}, {"id": "ls96", "t": "Policy Provisions", "q": "If age is misstated on an Illinois life application, the amount payable is", "o": ["What the premium would have purchased at the correct age", "The full face amount", "Zero", "The premiums paid"], "e": "5/224(1)(d)."}, {"id": "ls97", "t": "Illustrations", "q": "Under Illinois Regulation 1406, if an insurer designates a policy form to be marketed without an illustration,", "o": ["No illustration may be used for that form before the first policy anniversary", "An illustration must be given at delivery", "Only the producer may prepare one", "The policy cannot be sold"], "e": "50 Ill. Adm. Code 1406.40(b)."}, {"id": "ls98", "t": "Illustrations", "q": "Under Illinois Regulation 1406, if a policy form is marketed with an illustration,", "o": ["A basic illustration prepared under the rule is required", "The illustration may show any assumed interest rate", "No illustration is required", "Only non-guaranteed values may be shown"], "e": "1406.40(c); illustrations must show guaranteed and non-guaranteed elements and must not be misleading."}, {"id": "ls99", "t": "Illustrations", "q": "A life insurance illustration must clearly distinguish between", "o": ["Guaranteed and non-guaranteed elements", "Term and whole life", "Producer and insurer", "Group and individual policies"], "e": "Non-guaranteed elements (such as dividends or current interest) are not guaranteed and must be labeled."}, {"id": "ls100", "t": "Accelerated Benefits", "q": "Illinois permits accelerated death benefits that allow", "o": ["Payment of part of the death benefit to an insured with a qualifying condition, such as terminal illness, before death", "A loan from a third party", "Payment of all premiums by the insurer", "Double indemnity"], "e": "215 ILCS 5/4 and 50 Ill. Adm. Code 1407 govern accelerated benefits; the death benefit is reduced by the amount paid."}, {"id": "ls101", "t": "Viatical Settlements", "q": "Illinois regulates the sale of life policies by terminally or chronically ill insureds to third parties under the", "o": ["Viatical Settlements Act of 2009", "Insurance Producer Act", "Medicare Act", "Uniform Simultaneous Death Act"], "e": "215 ILCS 159; violating that Act is also a ground for producer discipline under 5/500-70(a)(16)."}, {"id": "ls102", "t": "Guaranty Association", "q": "The Illinois Life and Health Insurance Guaranty Association protects policyholders when", "o": ["A member insurer becomes impaired or insolvent", "A producer misappropriates premiums", "A policyowner cannot pay premiums", "An insurer denies a valid claim"], "e": "215 ILCS 5/531.01-531.19."}, {"id": "ls103", "t": "Guaranty Association", "q": "The Illinois Life and Health Insurance Guaranty Association's maximum liability for life insurance death benefits on any one life is", "o": ["$300,000", "$100,000", "$250,000", "$500,000"], "e": "5/531.03(3)(b)(i)(A)."}, {"id": "ls104", "t": "Guaranty Association", "q": "The Illinois Guaranty Association's maximum for net cash surrender and withdrawal values of life insurance is", "o": ["$100,000", "$300,000", "$250,000", "$50,000"], "e": "5/531.03(3)(b)(i)(A)."}, {"id": "ls105", "t": "Guaranty Association", "q": "The Illinois Guaranty Association's maximum for the present value of annuity benefits, including cash values, is", "o": ["$250,000", "$100,000", "$300,000", "$500,000"], "e": "5/531.03(3)(b)(i)(C)."}, {"id": "ls106", "t": "Guaranty Association", "q": "Which portion of a policy is generally NOT covered by the Illinois Life and Health Insurance Guaranty Association?", "o": ["The portion of a variable contract not guaranteed by the insurer, where the owner bears the risk", "Guaranteed death benefits of whole life", "Fixed annuity benefits", "Guaranteed cash values"], "e": "5/531.03(2)(b)(i) and (xv)."}, {"id": "ls107", "t": "Guaranty Association", "q": "With respect to one owner of multiple nongroup life policies, the Illinois Guaranty Association will not cover more than", "o": ["$5,000,000 in benefits", "$300,000", "$1,000,000", "$10,000,000"], "e": "5/531.03(3)."}, {"id": "ls108", "t": "Guaranty Association", "q": "The Illinois Guaranty Association limit for health benefit plans on any one individual is", "o": ["$500,000", "$300,000", "$100,000", "$250,000"], "e": "5/531.03(3)(b)(i)(B)(III)."}, {"id": "ls109", "t": "Guaranty Association", "q": "Excluding health benefit plans, the Illinois Guaranty Association's aggregate limit for all benefits on any one life is", "o": ["$300,000", "$250,000", "$500,000", "$1,000,000"], "e": "5/531.03(3)."}, {"id": "ls110", "t": "Advertising and Sales", "q": "Illinois advertising rules for life insurance and annuities require that advertisements", "o": ["Be truthful and not misleading in fact or by implication", "Be pre-approved by the Governor", "Promise guaranteed dividends", "Avoid naming the insurer"], "e": "50 Ill. Adm. Code 909 governs life and annuity advertising; the insurer is responsible for its ads."}, {"id": "ls111", "t": "Advertising and Sales", "q": "Under Illinois advertising rules, who is responsible for ensuring an insurer's advertisements comply?", "o": ["The insurer", "Only the producer", "The Director", "The advertising agency only"], "e": "Insurers must maintain a system of control over the content of advertisements, including those prepared by producers."}]}};
const LS='ilprep_v1';
let store=JSON.parse(localStorage.getItem(LS)||'{"missed":{},"history":[]}');
function save(){localStorage.setItem(LS,JSON.stringify(store))}
const $=s=>document.querySelector(s);const app=$('#app');
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function prep(q){const opts=shuffle(q.o.map((t,i)=>({t,c:i===0})));return {...q,opts,ans:opts.findIndex(o=>o.c),pick:null,flag:false}}
let timerId=null;
function home(){clearInterval(timerId);
 let h='<div class="card"><p>Original practice questions built from the Pearson VUE Illinois content outlines (effective 1/1/2026; same blueprint listed for 2027). Passing score on the real exam is 70.</p></div>';
 for(const k in DATA){const s=DATA[k];const m=Object.keys(store.missed[k]||{}).length;
  h+=`<div class="card"><div class="row"><h3 style="margin:0">${s.name}</h3><span class="mut">${s.qs.length} questions</span></div>
  <p class="mut">Real exam: ${s.exam.n} questions (${s.exam.scored} scored + ${s.exam.n-s.exam.scored} pretest), ${s.exam.min} minutes</p>
  <label class="mut">Practice topic: <select id="t_${k}"><option value="">All topics</option>${s.topics.map(t=>`<option>${esc(t.name)}</option>`).join('')}</select></label><br>
  <button onclick="startPractice('${k}')">Practice (instant feedback)</button><button onclick="startExam('${k}')">Timed exam</button>
  <button class="sec" onclick="startMissed('${k}')" ${m?'':'disabled'}>Review missed (${m})</button>
  ${m?`<button class="sec" onclick="clearMissed('${k}')">Clear missed</button>`:''}</div>`}
 const hist=store.history.slice(-8).reverse();
 if(hist.length)h+='<div class="card"><h3>Recent results</h3><table>'+hist.map(r=>`<tr><td>${new Date(r.t).toLocaleString()}</td><td>${DATA[r.s].name}</td><td>${r.mode}</td><td>${r.c}/${r.n} (${Math.round(100*r.c/r.n)}%)</td></tr>`).join('')+'</table></div>';
 app.innerHTML=h;window.scrollTo(0,0)}
function clearMissed(k){if(confirm('Clear missed list for this section?')){store.missed[k]={};save();home()}}
let S=null;
function startPractice(k){const t=$('#t_'+k).value;let qs=DATA[k].qs.filter(q=>!t||q.t===t);S={k,mode:'practice',qs:shuffle(qs).map(prep),i:0};renderQ()}
function startMissed(k){const ids=store.missed[k]||{};const qs=DATA[k].qs.filter(q=>ids[q.id]);S={k,mode:'missed review',qs:shuffle(qs).map(prep),i:0};renderQ()}
function startExam(k){const s=DATA[k];const n=s.exam.n;let pick=[];
 const tot=s.topics.reduce((a,t)=>a+t.w,0);let alloc=s.topics.map(t=>({t:t.name,n:Math.floor(n*t.w/tot),r:(n*t.w/tot)%1}));
 let left=n-alloc.reduce((a,x)=>a+x.n,0);alloc.sort((a,b)=>b.r-a.r).forEach(x=>{if(left>0){x.n++;left--}});
 for(const a of alloc)pick=pick.concat(shuffle(s.qs.filter(q=>q.t===a.t)).slice(0,a.n));
 if(pick.length<n)pick=pick.concat(shuffle(s.qs.filter(q=>!pick.includes(q))).slice(0,n-pick.length));
 S={k,mode:'exam',qs:shuffle(pick).map(prep),i:0,end:Date.now()+s.exam.min*60000};
 clearInterval(timerId);timerId=setInterval(tick,1000);renderQ()}
function tick(){const el=$('#timer');const ms=S.end-Date.now();if(ms<=0){clearInterval(timerId);alert('Time is up.');finish();return}
 if(el){const m=Math.floor(ms/60000),s=Math.floor(ms/1000)%60;el.textContent=m+':'+String(s).padStart(2,'0')}}
function renderQ(){if(!S.qs.length){app.innerHTML='<div class="card">No questions.</div>';return}
 const q=S.qs[S.i],ex=S.mode==='exam',done=!ex&&q.pick!==null;
 let h=`<div class="card"><div class="row"><span class="mut">${DATA[S.k].name} - ${S.mode} - Q ${S.i+1}/${S.qs.length}</span>${ex?'<span class="timer" id="timer"></span>':''}</div>
 <div class="bar"><i style="width:${100*(S.i+1)/S.qs.length}%"></i></div>
 <p style="margin-top:14px"><span class="tag">${esc(q.t)}</span></p><p><b>${esc(q.q)}</b></p>`;
 q.opts.forEach((o,j)=>{let c='opt';if(done){if(o.c)c+=' ok';else if(j===q.pick)c+=' bad'}else if(j===q.pick)c+=' sel';
  h+=`<button class="${c}" onclick="choose(${j})" ${done?'disabled':''}>${'ABCD'[j]}. ${esc(o.t)}</button>`});
 if(done)h+=`<div class="exp"><b>${q.pick===q.ans?'Correct.':'Incorrect.'}</b> Answer: ${'ABCD'[q.ans]}. ${esc(q.e)}</div>`;
 h+='<div class="row" style="margin-top:12px"><div>';
 h+=`<button class="sec" onclick="go(-1)" ${S.i?'':'disabled'}>Back</button>`;
 if(ex)h+=`<button class="sec" onclick="S.qs[S.i].flag=!S.qs[S.i].flag;renderQ()">${q.flag?'Unflag':'Flag'}</button>`;
 h+=`</div><div>${S.i<S.qs.length-1?`<button onclick="go(1)">Next</button>`:''}<button class="sec" onclick="if(${ex}?confirm('Submit exam?'):true)finish()">${ex?'Submit':'Finish'}</button></div></div>`;
 if(ex)h+='<div class="nav">'+S.qs.map((x,j)=>`<span class="${x.pick!==null?'a':''} ${x.flag?'f':''} ${j===S.i?'c':''}" onclick="S.i=${j};renderQ()">${j+1}</span>`).join('')+'</div>';
 app.innerHTML=h+'</div>';if(ex)tick()}
function choose(j){const q=S.qs[S.i];if(S.mode!=='exam'&&q.pick!==null)return;q.pick=j;
 if(S.mode!=='exam')record(q);renderQ()}
function record(q){store.missed[S.k]=store.missed[S.k]||{};if(q.pick===q.ans){if(S.mode==='missed review')delete store.missed[S.k][q.id]}else store.missed[S.k][q.id]=1;save()}
function go(d){S.i=Math.max(0,Math.min(S.qs.length-1,S.i+d));renderQ();window.scrollTo(0,0)}
function finish(){clearInterval(timerId);const ex=S.mode==='exam';const qs=ex?S.qs:S.qs.filter(q=>q.pick!==null);
 if(ex)qs.forEach(record);const c=qs.filter(q=>q.pick===q.ans).length,n=qs.length;
 if(n){store.history.push({t:Date.now(),s:S.k,mode:S.mode,c,n});store.history=store.history.slice(-50);save()}
 const by={};qs.forEach(q=>{by[q.t]=by[q.t]||[0,0];by[q.t][1]++;if(q.pick===q.ans)by[q.t][0]++});
 const pct=n?Math.round(100*c/n):0;
 let h=`<div class="card"><h2>${pct}% (${c}/${n})</h2>${ex?`<p><b style="color:${pct>=70?'var(--ok)':'var(--bad)'}">${pct>=70?'PASS':'BELOW PASSING'}</b> <span class="mut">(70% target)</span></p>`:''}
 <h3>Score by topic</h3><table><tr><th>Topic</th><th>Score</th><th></th></tr>`+
 Object.entries(by).map(([t,[a,b]])=>`<tr><td>${esc(t)}</td><td>${a}/${b}</td><td style="width:35%"><div class="bar"><i style="width:${100*a/b}%"></i></div></td></tr>`).join('')+'</table></div>';
 const wrong=qs.filter(q=>q.pick!==q.ans);
 if(ex&&wrong.length)h+='<div class="card"><h3>Review incorrect / unanswered</h3>'+wrong.map(q=>`<p><span class="tag">${esc(q.t)}</span><b>${esc(q.q)}</b><br>Your answer: ${q.pick===null?'(none)':esc(q.opts[q.pick].t)}<br>Correct: <b>${esc(q.opts[q.ans].t)}</b><br><span class="mut">${esc(q.e)}</span></p>`).join('')+'</div>';
 h+='<button onclick="home()">Home</button>';app.innerHTML=h;window.scrollTo(0,0)}
home();
</script></body></html>
