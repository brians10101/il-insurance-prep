 a regulatory examination, a producer must give the Director's examiners", "o": ["Convenient, free access to books and records at reasonable hours", "Access to records after the Director obtains a court order", "Copies of requested records by mail within 60 days", "CPA-audited financial statements in place of the original records"], "e": "5/500-110(b) requires convenient and free access to all books, records, and papers relating to the insurance business.", "m": "Examiners get \"free and convenient\" access: no charge and no runaround during reasonable hours."}, {"id": "ls6", "t": "License and Registration", "q": "To be issued a resident Illinois producer license, an individual must be at least", "o": ["18 years old", "21 years old", "16 years old", "19 years old"], "e": "5/500-30(a)(1).", "m": "18 to sell: you must be a legal adult to hold a producer license."}, {"id": "ls7", "t": "License and Registration", "q": "The minimum Illinois pre-licensing education requirement for the Life line of authority is", "o": ["20 hours, with 7.5 in a classroom or webinar setting", "24 hours, with 3 in a classroom or webinar setting", "12.5 hours, with 5 in a classroom or webinar setting", "20 hours, which may all be completed by self-study"], "e": "5/500-30(b) sets 20 hours each for Life and A&H, with 7.5 hours of each course classroom or webinar.", "m": "\"20 and 7.5\": 20 hours per line, 7.5 of them in a classroom or webinar.", "c": ["ls_hours"]}, {"id": "ls8", "t": "License and Registration", "q": "An Illinois resident producer license is issued for a term of", "o": ["2 years", "1 year", "3 years", "4 years"], "e": "5/500-35(a) issues a 2-year license, renewable as long as the fee is paid and CE is met.", "m": "License life = 2 years. Most Illinois license clocks (term, fees, renewal CE) run in 2-year cycles.", "c": ["ls_licensetime"]}, {"id": "ls9", "t": "License and Registration", "q": "The Illinois license fee for a resident individual producer is", "o": ["$215 every 2 years", "$380 every 2 years", "$150 every year", "$50 every year"], "e": "5/500-135(a)(1): $215 for residents and $380 for nonresidents, payable once every 2 years.", "m": "Resident fee $215 = \"2-1-5 for 2 years.\" Nonresidents pay more ($380).", "c": ["ls_fees"]}, {"id": "ls10", "t": "License and Registration", "q": "The Illinois license fee for a nonresident individual producer is", "o": ["$380 every 2 years", "$215 every 2 years", "$150 every 2 years", "$50 per year"], "e": "5/500-135(a)(1).", "m": "Nonresident $380 is the BIG fee: out-of-staters pay the most.", "c": ["ls_fees"]}, {"id": "ls11", "t": "License and Registration", "q": "The Illinois fee for a business entity producer license is", "o": ["$150 every 2 years", "$215 every 2 years", "$380 every 2 years", "$50 annually"], "e": "5/500-135(a)(3).", "m": "Business entity $150 = the \"firm fee,\" lower than an individual resident's $215.", "c": ["ls_fees"]}, {"id": "ls12", "t": "License and Registration", "q": "The statutory Illinois application fee for processing a request to take a producer licensing exam is", "o": ["$50", "$25", "$100", "$215"], "e": "5/500-135(a)(5) sets a $50 application fee (Pearson VUE's own exam fee is separate).", "m": "$50 is the small-ticket fee: exam application and temporary license are both $50.", "c": ["ls_fees"]}, {"id": "ls13", "t": "License and Registration", "q": "A business entity applying for an Illinois producer license must", "o": ["Designate a licensed producer responsible for compliance", "Employ at least 10 licensed producers at an Illinois office", "Post a $50,000 surety bond with the Director", "Be incorporated or organized under Illinois law"], "e": "5/500-30(c) requires the Uniform Business Entity Application, fees, and a designated responsible licensed producer.", "m": "Every business entity needs a \"designated driver\": one licensed producer responsible for compliance."}, {"id": "ls14", "t": "License and Registration", "q": "A nonresident producer will receive an Illinois nonresident license if, among other requirements, the producer", "o": ["Is in good standing at home, and the home state reciprocates", "Passes the Illinois state portion of the exam within 90 days of applying", "Agrees to move to Illinois and become a resident within one year", "Completes 20 hours of Illinois pre-licensing education before applying"], "e": "5/500-40(a): good standing at home, proper request and fees, application, and reciprocity.", "m": "Nonresident license = \"good at home + reciprocity\": clean home-state standing and a two-way street."}, {"id": "ls15", "t": "License and Registration", "q": "A resident Illinois producer who moves to another state must file a change of address and provide certification from the new resident state within", "o": ["30 days", "10 days", "60 days", "90 days"], "e": "5/500-40(c); no fee or license application is required.", "m": "Thirty-day club: moving out of state, change of address, hearing demand and felony report are all 30 days.", "c": ["ls_30days"]}, {"id": "ls16", "t": "License and Registration", "q": "An Illinois licensee must notify the Director of a change of address within", "o": ["30 days after the change", "10 days after the change", "60 days after the change", "The next license renewal date"], "e": "5/500-35(g).", "m": "Moved? Tell the Director within 30 days, the same 30 as the rest of the Thirty-day club.", "c": ["ls_30days"]}, {"id": "ls17", "t": "License and Registration", "q": "The Director may issue a temporary producer license for up to", "o": ["180 days, renewable once for another 180 days", "90 days, renewable once for another 90 days", "1 year, renewable once for another year", "180 days, with no renewal permitted"], "e": "5/500-60(a).", "m": "Temp license = 180 + 180: up to 180 days, renewable once, so 360 days at most.", "c": ["ls_licensetime"]}, {"id": "ls18", "t": "License and Registration", "q": "A temporary producer license may be issued to", "o": ["The surviving spouse or representative of a deceased or disabled producer", "An applicant who has passed the exam and is waiting for the license to issue", "An applicant who failed the exam and is waiting to retake it", "A new employee of an agency who is still completing pre-licensing study"], "e": "5/500-60 also covers a business entity's employee upon death or disability of the designee, and the designee of a producer entering active military service.", "m": "Temp licenses are \"bridge\" licenses: survivors or representatives keeping a dead or disabled producer's business alive."}, {"id": "ls19", "t": "License and Registration", "q": "The fee for issuance of an Illinois temporary producer license is", "o": ["$50", "$215", "$150", "No fee"], "e": "5/500-135(a)(2); the fee is paid on issuance but not on renewal of the temporary license.", "m": "Temp license fee = $50, the same small-ticket fee as the exam application.", "c": ["ls_fees"]}, {"id": "ls20", "t": "License and Registration", "q": "Which person is NOT required to hold an Illinois producer license?", "o": ["An insurer clerk who receives no commission", "A person who solicits life insurance for commissions", "A person who negotiates annuity sales for a salary plus bonus", "A telemarketer who sells health policies for commissions"], "e": "5/500-20 exempts officers and employees doing executive, administrative, managerial, or clerical work only indirectly related to sales, with no commission.", "m": "No commission, no license needed: clerical staff who don't sell or get paid per sale are exempt."}, {"id": "ls21", "t": "License and Registration", "q": "A salaried employee who advises his employer on its insurance needs, without selling or receiving commissions, is", "o": ["Exempt from licensing", "Required to hold a producer license", "Required to hold a temporary license", "Required to hold a limited lines license"], "e": "5/500-20(b)(7).", "m": "Advises his OWN employer, no commission = exempt. Salaried, in-house and not selling means no license."}, {"id": "ls22", "t": "License and Registration", "q": "An individual producer who lets a license lapse may have it reissued without retaking the exam if the producer acts within", "o": ["12 months after the due date, at double the renewal fee", "6 months after the due date, paying a $50 late fee", "3 years after the due date, paying the regular renewal fee", "30 days after the due date, with no additional penalty"], "e": "5/500-35(d).", "m": "Lapsed? \"12 months, pay double\": reissue without the exam within a year, at twice the renewal fee.", "c": ["ls_licensetime"]}, {"id": "ls23", "t": "License and Registration", "q": "A person whose Illinois producer license is revoked is ineligible to apply for any license for", "o": ["3 years", "1 year", "5 years", "Life"], "e": "5/500-70(g).", "m": "Revoked = 3-year time-out before applying for ANY license.", "c": ["ls_licensetime"]}, {"id": "ls24", "t": "License and Registration", "q": "Which is a ground for the Director to suspend or revoke a producer license?", "o": ["Forging a name on an application", "Selling for more than one insurer", "Living near the Illinois border", "Earning more than $100,000"], "e": "5/500-70(a)(10); other grounds include misrepresentation, misappropriation, felony conviction, and fraud.", "m": "Forgery is the textbook ground: faking a signature can cost you the license."}, {"id": "ls25", "t": "License and Registration", "q": "A producer who fails to comply with a court order imposing a child support obligation", "o": ["May have the license suspended or refused", "May keep the license if the producer's insurer consents", "Must pay a $500 fine, but the license is unaffected", "Is subject only to action by the court, not the Director"], "e": "5/500-70(a)(13).", "m": "Unpaid child support can freeze a license: the state can suspend or refuse it."}, {"id": "ls26", "t": "License and Registration", "q": "After notice of a license denial, suspension, or revocation, the applicant or licensee may demand a hearing in writing within", "o": ["30 days after the date of mailing", "10 days after the date of mailing", "14 days after receipt of the notice", "60 days after the date of mailing"], "e": "5/500-70(b); the hearing is held not fewer than 20 nor more than 30 days after notice of hearing is mailed.", "m": "Hearing demand = 30 days from mailing, another Thirty-day club member.", "c": ["ls_30days"]}, {"id": "ls27", "t": "License and Registration", "q": "In addition to or instead of license denial, suspension, or revocation, the Director may impose a civil penalty after hearing of up to", "o": ["$10,000 per cause, capped at $100,000", "$20,000 per cause, capped at $100,000", "$1,000 per cause, capped at $10,000", "$10,000 per cause, with no total cap"], "e": "5/500-70(d).", "m": "Civil penalty \"10K per cause, 100K cap\": ten-thousand per wrong, a hundred-thousand ceiling.", "c": ["ls_penalties"]}, {"id": "ls28", "t": "License and Registration", "q": "A licensed producer convicted of a felony must report the conviction to the Director within", "o": ["30 days after the judgment is entered", "10 days after the judgment is entered", "60 days after the judgment is entered", "The next license renewal date"], "e": "5/500-95 also requires a copy of the judgment and related orders.", "m": "Felony? Report within 30 days of judgment. Thirty-day club again.", "c": ["ls_30days"]}, {"id": "ls29", "t": "License and Registration", "q": "Using notes or other reference material improperly to complete an Illinois insurance licensing exam is", "o": ["A ground for license denial, suspension, or revocation", "Permitted on the state portion if the proctor approves", "A violation punishable only by retaking the exam", "A matter handled only by the testing vendor"], "e": "5/500-70(a)(11).", "m": "Cheating on the license exam can cost you the license itself."}, {"id": "ls30", "t": "License and Registration", "q": "Knowingly accepting insurance business from an unlicensed individual is", "o": ["A ground for disciplinary action against the producer", "Permitted if the unlicensed person receives no commission", "Permitted if the producer supervises the unlicensed person", "Permitted for life insurance but not for annuities"], "e": "5/500-70(a)(12).", "m": "Taking business from an unlicensed person makes YOU the violator."}, {"id": "ls31", "t": "License and Registration", "q": "Controlled business in Illinois means insurance on", "o": ["Insurance on the producer's own, spouse's, employer's, or own business's risks", "Policies the producer has sold to clients who are also close friends or neighbors", "Group plans sold to any employer for which the producer serves as broker", "Policies issued by the insurers that have appointed the producer as an agent"], "e": "5/500-125(b).", "m": "Controlled business = insuring \"me, my spouse, my boss, my business.\""}, {"id": "ls32", "t": "License and Registration", "q": "A license may not be granted or extended if the Director believes that during either of the 2 preceding calendar years the producer's controlled business premiums", "o": ["Exceeded the premiums on all of the licensee's other business", "Exceeded 10% of the licensee's total written premiums", "Exceeded $50,000 in each of the 2 calendar years", "Exceeded 25% of the licensee's total written premiums"], "e": "5/500-125(a): controlled business may not exceed all other business.", "m": "Controlled business can't outweigh everything else: it may not exceed all your other business."}, {"id": "ls33", "t": "Continuing Education", "q": "Before each Illinois license renewal, a resident producer must complete at least", "o": ["24 hours of CE, including 3 hours of ethics", "20 hours of CE, including 3 hours of ethics", "24 hours of CE, including 4 hours of ethics", "30 hours of CE, including 5 hours of ethics"], "e": "5/500-35(b)(1).", "m": "CE \"24/3\": 24 hours every renewal, 3 of them ethics.", "c": ["ls_hours"]}, {"id": "ls34", "t": "Continuing Education", "q": "The 3 hours of ethics required for Illinois CE must be completed through", "o": ["Classroom or webinar instruction", "Self-study with a proctored exam", "Professional association participation", "Any approved method, including self-study"], "e": "5/500-35(b)(1).", "m": "Ethics needs a live room: classroom or webinar only, no self-study.", "c": ["ls_hours"]}, {"id": "ls35", "t": "Continuing Education", "q": "Active participation in a professional insurance association may earn an Illinois producer up to", "o": ["4 hours of CE per biennial period, but not ethics credit", "3 hours of ethics credit per biennial period", "4 hours of CE per year, including ethics credit", "24 hours of CE, satisfying the full requirement"], "e": "5/500-35(b)(3): hour-for-hour, up to 4 hours, not usable for ethics.", "m": "Association credit maxes at 4 hours, and never counts for ethics.", "c": ["ls_hours"]}, {"id": "ls36", "t": "Continuing Education", "q": "If a producer fails to complete the required CE by the renewal date, the license", "o": ["Automatically terminates", "Is extended for 6 months", "Remains active with a fine", "Converts to a temporary license"], "e": "5/500-35(b)(2); courses should be completed early enough for the provider to report credit.", "m": "No CE, no license: miss the deadline and the license terminates automatically."}, {"id": "ls37", "t": "Continuing Education", "q": "A combination course is treated as classroom credit in Illinois when classroom, seminar, or webinar hours make up at least", "o": ["Two-thirds of total certified hours", "One-half of total certified hours", "Three-quarters of total certified hours", "One-third of total certified hours"], "e": "5/500-35(b)(1); otherwise it is self-study.", "m": "Two-thirds rule: a combo course counts as classroom only if 2/3 or more of its hours are live.", "c": ["ls_hours"]}, {"id": "ls38", "t": "Continuing Education", "q": "Self-study CE credit in Illinois generally requires", "o": ["Passing an exam that isn't self-evaluated, unless an interactive format validates completion", "Reading the material and signing an attestation of completion for the provider", "Attending a classroom review session after the self-study material is completed", "Passing a self-graded quiz and submitting the results to the Department directly"], "e": "5/500-35(b)(1).", "m": "Self-study needs a real test: not a self-graded one, unless an interactive format verifies completion."}, {"id": "ls39", "t": "Continuing Education", "q": "A producer who cannot comply with renewal procedures due to military service may", "o": ["Request a waiver of those procedures", "Transfer the license to a spouse until return", "Place the license on inactive status for 5 years", "Renew by retaking the exam on return"], "e": "5/500-35(e).", "m": "Military service? Ask for a waiver of renewal procedures."}, {"id": "ls40", "t": "Fiduciary Responsibilities", "q": "Under Illinois law, premiums a producer receives on behalf of an insurer are held", "o": ["In a fiduciary capacity; they may not be misused or withheld", "As the producer's earned income, once the policy is issued", "In escrow by the Director until the policy is delivered", "As a premium loan to the insured until the insurer is paid"], "e": "5/500-115(a).", "m": "Premiums are the insurer's money in your hands: you hold them as a FIDUCIARY."}, {"id": "ls41", "t": "Fiduciary Responsibilities", "q": "A producer who knowingly misappropriates fiduciary funds of $150 or less commits, for a first offense,", "o": ["A Class A misdemeanor", "A Class 3 felony", "A Class 4 felony", "A petty offense"], "e": "5/500-115(d): subsequent offenses are a Class 4 felony; amounts over $150 are a Class 3 felony.", "m": "$150 is the line: $150 or less, first offense = Class A misdemeanor.", "c": ["ls_penalties"]}, {"id": "ls42", "t": "Fiduciary Responsibilities", "q": "A producer who knowingly converts premiums in excess of $150 to personal use is guilty of", "o": ["A Class 3 felony", "A Class A misdemeanor", "A Class 4 felony", "A business offense"], "e": "5/500-115(d).", "m": "Over $150 = Class 3 felony. Cross the $150 line and it's a felony.", "c": ["ls_penalties"]}, {"id": "ls43", "t": "Fiduciary Responsibilities", "q": "If an insured pays the premium to the producer who requested the coverage, the insurer is", "o": ["Deemed to have received the premium", "Not obligated until it receives the funds", "Allowed to cancel the policy", "Required to bill the insured again"], "e": "5/500-115(b); the insurer is responsible to the insured for any return premium.", "m": "Pay the producer = pay the insurer: the insurer is deemed to have received it."}, {"id": "ls44", "t": "Fiduciary Responsibilities", "q": "An insurer delivering a policy through a producer authorizes the producer to collect premiums due at issuance or delivery and those that come due within", "o": ["90 days thereafter", "30 days thereafter", "60 days thereafter", "1 year thereafter"], "e": "5/500-115(a).", "m": "Producer can collect the premium at issue or delivery and those due within 90 days after.", "c": ["ls_90days"]}, {"id": "ls45", "t": "Commissions and Compensation", "q": "An insurer may pay a commission for selling insurance in Illinois only to a person who", "o": ["Was licensed at the time of the sale, solicitation, or negotiation", "Is licensed at the time the commission is actually paid", "Is appointed with the insurer at the time the policy is renewed", "Is licensed in any state, whether or not licensed in Illinois"], "e": "5/500-80(a)-(c); renewal commissions may be paid to someone licensed at the time of the sale.", "m": "Commissions only go to someone licensed AT THE TIME of the sale."}, {"id": "ls46", "t": "Commissions and Compensation", "q": "When a producer charges a fee in addition to commission, the producer must", "o": ["Give a written fee disclosure before delivery; keep it 7 years", "Obtain the Director's prior written approval for each fee it charges", "Limit the fee to 10% of the premium and disclose it at renewal", "Disclose the fee orally and keep a record for 3 years"], "e": "5/500-80(e)(1).", "m": "Fee on top of commission? Disclose in writing before delivery and keep it 7 years.", "c": ["ls_records"]}, {"id": "ls47", "t": "Commissions and Compensation", "q": "If a producer's combined fee or compensation exceeds 10% of the directly attributable premium, the disclosure must also", "o": ["Include the consumer's signed acknowledgment of the fee", "Be filed with the Director within 30 days", "Be notarized and kept by the producer for 3 years", "Be sent to the insurer for approval before delivery"], "e": "5/500-80(e)(2).", "m": "Over 10% of premium? Get the client's signed acknowledgment."}, {"id": "ls48", "t": "Commissions and Compensation", "q": "If a policy on which a producer charged a separate fee is cancelled within 90 days of inception, the producer must", "o": ["Refund a prorated share within 30 days of proof of cancellation", "Keep the fee if the disclosure was signed by the consumer", "Refund the full fee within 90 days, minus a cancellation fee", "Refund the fee only if the insurer refunds the premium"], "e": "5/500-80(e)(3); producers may never charge a cancellation fee.", "m": "\"90 to cancel, 30 to refund\": cancelled within 90 days means a prorated fee refund within 30 days.", "c": ["ls_30days", "ls_90days"]}, {"id": "ls49", "t": "Disclosure", "q": "Under Illinois law, an individual life or accident and health application must bear", "o": ["The name and signature of the licensee who solicited and wrote it", "The signature of an officer of the insurer that issues the policy", "The Director's approval stamp for the policy form being sold", "The signature of each beneficiary named in the application"], "e": "5/500-155.", "m": "The writer signs: the soliciting licensee's name and signature go on the application."}, {"id": "ls50", "t": "Marketing Practices", "q": "A producer offers to give a client part of the first-year commission if she buys a life policy. This is", "o": ["Rebating, which is prohibited", "Legal if disclosed in writing", "Twisting", "Sliding"], "e": "215 ILCS 5/151 prohibits rebates or other inducements not specified in the policy; applicants are also prohibited from accepting them.", "m": "Sharing commission to win a sale = REBATING (illegal)."}, {"id": "ls51", "t": "Marketing Practices", "q": "Under Illinois's rebating statute, who is prohibited from accepting a rebate?", "o": ["The applicant or insured", "The producer, but not the applicant", "The insurer, but not the applicant", "The producer's agency, but not the insured"], "e": "5/151(2) prohibits insured persons and applicants from receiving or accepting rebates.", "m": "Rebating is a two-way crime: the applicant can't accept one either."}, {"id": "ls52", "t": "Marketing Practices", "q": "Making false or misleading statements about the terms or benefits of a policy to induce a sale is", "o": ["Misrepresentation", "Defamation", "Rebating", "Unfair discrimination"], "e": "5/149 prohibits misrepresentation of policy terms, benefits, or dividends.", "m": "Misrepresentation = lying about the policy to make the sale."}, {"id": "ls53", "t": "Marketing Practices", "q": "Misrepresenting the terms of a policy to induce a policyowner to lapse or replace an existing policy is called", "o": ["Twisting", "Rebating", "Sliding", "Coercion"], "e": "Twisting is a form of misrepresentation prohibited under 5/149.", "m": "TWISTING twists the client OUT of a policy: misrepresenting to cause a replacement or lapse."}, {"id": "ls54", "t": "Marketing Practices", "q": "Making false or maliciously critical statements about another insurer's financial condition is", "o": ["Defamation", "Rebating", "Twisting", "Controlled business"], "e": "5/149 prohibits statements maliciously critical of or derogatory to the financial condition of an insurer.", "m": "Defamation dirties the competitor: bad-mouthing another insurer's finances."}, {"id": "ls55", "t": "Marketing Practices", "q": "Under 215 ILCS 5/236, a life insurer may NOT", "o": ["Treat people of the same class and life expectancy differently", "Charge different rates to applicants of different ages", "Place applicants into risk classes based on health", "Charge smokers higher premiums than nonsmokers"], "e": "Unfair discrimination means different treatment of people with the same risk.", "m": "Same risk, same treatment. Different treatment of equals is unfair discrimination."}, {"id": "ls56", "t": "Marketing Practices", "q": "Under Illinois law, a life insurer may not refuse to insure or charge a higher rate solely because the applicant", "o": ["Is blind or partially blind", "Has a history of heart disease", "Is over age 75", "Uses tobacco products"], "e": "5/236(c).", "m": "Blindness alone is never a reason to refuse or surcharge life coverage."}, {"id": "ls57", "t": "Marketing Practices", "q": "Under Illinois law, a life insurer may not refuse to insure an individual solely because the individual", "o": ["Is in the Armed Forces, National Guard, or Reserves", "Engages in hazardous hobbies such as skydiving", "Has been diagnosed with a serious illness", "Works in a hazardous civilian occupation"], "e": "5/236(d).", "m": "Serving the country isn't a reason to refuse life coverage: Armed Forces, Guard or Reserves."}, {"id": "ls58", "t": "Marketing Practices", "q": "Agreeing with other insurers to refuse to do business with a person is", "o": ["Boycott, coercion, or intimidation", "Rebating", "Defamation", "Twisting"], "e": "Section 424 lists unfair methods of competition, including boycotts.", "m": "Ganging up = boycott: insurers agreeing to shut someone out."}, {"id": "ls59", "t": "Unfair Claims Practices", "q": "Under Illinois rules, an insurer must acknowledge pertinent communications about a claim with \"reasonable promptness,\" defined as a maximum of", "o": ["15 working days", "30 calendar days", "5 working days", "45 days"], "e": "50 Ill. Adm. Code 919.40.", "m": "\"15 to answer\": acknowledge pertinent claim communications within 15 working days.", "c": ["ls_claims"]}, {"id": "ls60", "t": "Unfair Claims Practices", "q": "Failing to provide claim forms within how many working days of a request is an improper claims practice in Illinois?", "o": ["15", "10", "30", "45"], "e": "215 ILCS 5/154.6(o).", "m": "Claim forms = 15 working days, the same 15 as acknowledging claim communications.", "c": ["ls_claims"]}, {"id": "ls61", "t": "Unfair Claims Practices", "q": "Once an Illinois insurer affirms liability on a claim whose amount is determined and not in dispute, it must offer payment within", "o": ["30 days", "60 days", "15 days", "90 days"], "e": "50 Ill. Adm. Code 919.50(a).", "m": "Liability clear and amount agreed? Offer payment within 30 days.", "c": ["ls_claims"]}, {"id": "ls62", "t": "Unfair Claims Practices", "q": "When an Illinois insurer denies a first-party claim, its written explanation must be accompanied by", "o": ["A Notice of Availability of the Department of Insurance", "A copy of the insurer's most recent annual statement", "A refund of the premiums paid for the policy period", "The name and license number of the producer of record"], "e": "919.50(a)(1).", "m": "Every denial comes with a lifeline: a Notice of Availability of the Department of Insurance."}, {"id": "ls63", "t": "Unfair Claims Practices", "q": "Under Illinois rules, \"prompt investigation\" requires a bona fide effort to communicate with insureds and claimants within", "o": ["21 working days after notification of loss", "15 working days after notification of loss", "30 days after notification of loss", "21 working days after proof of loss"], "e": "50 Ill. Adm. Code 919.40.", "m": "\"21 to investigate\": make bona fide contact within 21 working days of notice of loss.", "c": ["ls_claims"]}, {"id": "ls64", "t": "Unfair Claims Practices", "q": "Which is an improper claims practice under 215 ILCS 5/154.6?", "o": ["Refusing to pay claims without a reasonable investigation", "Requiring a certified copy of the death certificate", "Paying an undisputed claim within 30 days", "Explaining in writing the basis for a claim denial"], "e": "Others include misrepresenting policy provisions and compelling insureds to sue by lowball offers.", "m": "No investigation, no denial: refusing without a reasonable investigation is improper."}, {"id": "ls65", "t": "Unfair Claims Practices", "q": "An insurer that compels policyholders to sue by offering substantially less than amounts ultimately recovered is engaging in", "o": ["An improper claims practice", "Subrogation", "Rebating", "Coercion"], "e": "5/154.6(e).", "m": "Lowball until they sue = improper claims practice."}, {"id": "ls66", "t": "Unfair Claims Practices", "q": "Under Illinois rules, an insurer may deny a claim based on a phone conversation only if", "o": ["The call is documented in the claim file", "The producer confirms the call in writing", "The insured is notified 30 days in advance", "The Director approves the denial in advance"], "e": "919.50(b).", "m": "Phone denial only counts if it's written down in the claim file."}, {"id": "ls67", "t": "Replacement", "q": "Under Illinois Regulation 917, which transaction is considered a replacement?", "o": ["A new policy while the old one converts to reduced paid-up", "A first policy for an applicant with no existing coverage", "A rider added at the same insurer with no benefit reduction", "A face increase on an existing policy at the same insurer"], "e": "50 Ill. Adm. Code 917.30 includes lapse, surrender, use of nonforfeiture values, reduction of benefits, reissue with less cash value, and certain borrowing.", "m": "Old policy shrinks (reduced paid-up) while a new one is bought = REPLACEMENT.", "c": ["ls_replacement"]}, {"id": "ls68", "t": "Replacement", "q": "Under Illinois replacement rules, borrowing against an existing policy is considered replacement when total borrowing exceeds", "o": ["25% of the policy's loan value", "10% of the policy's face amount", "50% of the policy's cash value", "25% of the policy's face amount"], "e": "917.30(e).", "m": "Borrowing more than a quarter (25%) of the loan value counts as replacement.", "c": ["ls_replacement"]}, {"id": "ls69", "t": "Replacement", "q": "Which transaction is EXEMPT from Illinois replacement regulation 917?", "o": ["Group life insurance", "Individual whole life replacing individual term that has 10 years left", "An individual annuity replacing a whole life policy", "Individual universal life replacing individual whole life"], "e": "917.50 exempts credit life, group life and group annuities, certain pension plan policies, and other listed transactions.", "m": "Group is exempt: Regulation 917 targets individual replacements, not group life.", "c": ["ls_replacement"]}, {"id": "ls70", "t": "Replacement", "q": "Illinois Regulation 917 does not apply when the existing coverage is non-convertible, nonrenewable term life that will expire in", "o": ["5 years or less", "10 years or less", "1 year or less", "20 years or less"], "e": "917.50(e).", "m": "Expiring term (5 years or less, nonconvertible, nonrenewable) isn't worth protecting, so it's exempt.", "c": ["ls_replacement"]}, {"id": "ls71", "t": "Replacement", "q": "Illinois replacement rules do not apply when the total cash surrender value of existing policies is less than $500 and their combined face amount is less than", "o": ["$5,000", "$10,000", "$25,000", "$1,000"], "e": "917.50(g).", "m": "Tiny policies are exempt: under $500 cash value and under $5,000 face.", "c": ["ls_replacement"]}, {"id": "ls72", "t": "Replacement", "q": "In a replacement, the producer must present the Notice Regarding Replacement to the applicant", "o": ["No later than when the application is taken", "Within 3 working days after the policy is issued", "At the time the replacement policy is delivered", "Within 20 days after the application is taken"], "e": "917.60(b)(1); the producer signs the notice and lists the policies being replaced.", "m": "Replacement notice goes out when the application is taken, no later."}, {"id": "ls73", "t": "Replacement", "q": "With each life or annuity application, the producer must submit to the replacing insurer", "o": ["Signed statements by applicant and producer on whether it replaces coverage", "A copy of the applicant's existing policy and its most recent annual statement", "A signed statement by the existing insurer that it consents to the replacement", "The applicant's written waiver of the 20-day refund right for the new policy"], "e": "917.60(a).", "m": "Every application asks \"Is this a replacement?\", signed by both applicant and producer."}, {"id": "ls74", "t": "Replacement", "q": "The replacing insurer must send the Notice Regarding Proposed Replacement to the existing insurer within", "o": ["3 working days after receipt of the application", "10 days after receipt of the application", "20 days after the policy is delivered", "3 working days after the policy is issued"], "e": "917.70(c).", "m": "Insurer-to-insurer heads-up = 3 working days. (Not a consumer refund window!)", "c": ["ls_lookperiods", "ls_replacement"]}, {"id": "ls75", "t": "Replacement", "q": "The replacing insurer must keep copies of replacement notices at its home office for at least", "o": ["3 years", "1 year", "5 years", "7 years"], "e": "917.70(d).", "m": "Replacing insurer keeps replacement notices 3 years.", "c": ["ls_replacement", "ls_records"]}, {"id": "ls76", "t": "Replacement", "q": "Under 215 ILCS 5/224(2), in a replacement the replacing insurer must either delay issuing its policy for at least 20 days after sending a policy summary to the existing insurer, or", "o": ["Give a 20-day unconditional right to a full refund after delivery", "Give a 10-day free look that begins on the date of application", "Obtain the Director's approval before the policy is issued", "Give a 30-day right to return the policy after it is issued"], "e": "Under option 2 the replacing insurer also sends a policy summary to the existing insurer within 3 working days after issue.", "m": "Replacement choice: delay issue 20 days, OR give a 20-day refund right. Either way it's 20.", "c": ["ls_lookperiods", "ls_replacement"]}, {"id": "ls77", "t": "Replacement", "q": "In Illinois, a replacement life policy that uses the refund option must give the policyowner the right to an unconditional refund of all premiums for", "o": ["20 days from delivery", "10 days from delivery", "30 days from delivery", "20 days from application"], "e": "215 ILCS 5/224(2).", "m": "Replacement refund = 20 days, double the normal 10-day free look.", "c": ["ls_lookperiods", "ls_replacement"]}, {"id": "ls78", "t": "Replacement", "q": "In a replacement, the replacing insurer must furnish the applicant with", "o": ["A Buyer's Guide", "A copy of the producer's license", "The existing insurer's annual report", "A Medicare supplement outline"], "e": "917.70(c) references 50 Ill. Adm. Code 930.50.", "m": "Replacement means a Buyer's Guide for the applicant.", "c": ["ls_disclosure"]}, {"id": "ls79", "t": "Life Solicitation", "q": "Under Illinois Regulation 930, an insurer must give an applicant a Buyer's Guide (other than for direct response products)", "o": ["Before accepting the initial premium or premium deposit", "With delivery of the policy, at the latest", "Within 30 days after the policy is issued", "At the first policy anniversary, upon request"], "e": "50 Ill. Adm. Code 930.50(a).", "m": "Buyer's Guide comes BEFORE the money: before accepting the first premium.", "c": ["ls_disclosure"]}, {"id": "ls80", "t": "Life Solicitation", "q": "Under Illinois Regulation 930, a Policy Summary must be delivered", "o": ["With or before delivery of the policy", "Before the application is taken", "Within 30 days after the policy is issued", "At the first policy anniversary"], "e": "930.50(a); a Buyer's Guide and Policy Summary must also be provided before application upon request.", "m": "Policy Summary rides with the policy: with or before delivery.", "c": ["ls_disclosure"]}, {"id": "ls81", "t": "Life Solicitation", "q": "The Policy Summary required by Illinois Regulation 930 must carry the title", "o": ["Statement of Policy Cost and Benefit Information", "Notice Regarding Replacement of Life Insurance", "Outline of Coverage and Benefit Summary", "Illustration of Guaranteed and Current Values"], "e": "930.40(i)(1)(A).", "m": "The Policy Summary's formal title is literally \"Statement of Policy Cost and Benefit Information.\""}, {"id": "ls82", "t": "Life Solicitation", "q": "Life insurance cost indexes in the Policy Summary are shown for", "o": ["10 and 20 years", "5 and 10 years", "1 and 5 years", "20 and 30 years"], "e": "930.40(i)(1)(G): Surrender Cost and Net Payment Cost indexes for 10 and 20 years.", "m": "Cost indexes look 10 and 20 years out."}, {"id": "ls83", "t": "Life Solicitation", "q": "The Life Insurance Net Payment Cost Index is useful for comparing policies when", "o": ["Death benefit cost matters and the policy won't be surrendered", "The owner expects to surrender the policy for its cash value", "The owner is comparing a fixed annuity with a variable annuity", "The policies compared are group term plans with no cash value"], "e": "It is calculated like the Surrender Cost Index but with cash value set to zero (930.40(g)(2)).", "m": "Net Payment index = \"I'm keeping it\": cash value treated as zero because you won't surrender."}, {"id": "ls84", "t": "Life Solicitation", "q": "Illinois cost index calculations use an interest rate of", "o": ["5% compounded annually", "3% simple interest", "6% compounded monthly", "10% compounded annually"], "e": "930.40 uses 5% interest.", "m": "Cost indexes use 5% interest."}, {"id": "ls85", "t": "Life Solicitation", "q": "A Policy Summary that shows dividends must state that dividends", "o": ["Are based on the current scale and are not guaranteed", "Are guaranteed for the first 10 policy years", "Are taxable when they are credited to the policy", "Will increase each year the policy remains in force"], "e": "930.40(i)(1)(I).", "m": "Dividends are a forecast, not a promise: current scale, not guaranteed."}, {"id": "ls86", "t": "Life Solicitation", "q": "In Illinois, an annuity or life insurance recommendation to a consumer must be", "o": ["Suitable and in the consumer's best interest, based on reasonable inquiry", "Based on the product the producer's insurer currently pays most to sell", "Approved in writing by the Director before the sale is completed", "Documented by the insurer, without any inquiry into the consumer's finances"], "e": "Illinois suitability rules (50 Ill. Adm. Code 3120 for annuities) require a reasonable basis and consumer profile information.", "m": "Recommendation must fit the client: suitable and in the client's best interest."}, {"id": "ls87", "t": "Policy Provisions", "q": "Illinois law requires individual life policies to include a free look period of", "o": ["10 days from delivery", "20 days from application", "30 days from delivery", "7 days from issue"], "e": "215 ILCS 5/224(1)(n); the insurer refunds any premium paid, including fees.", "m": "Free look = 10 days from DELIVERY. (Replacements stretch it to 20.)", "c": ["ls_lookperiods"]}, {"id": "ls88", "t": "Policy Provisions", "q": "Illinois requires individual life policies to provide a grace period of", "o": ["30 days or one month", "31 days or one month", "10 days", "60 days"], "e": "5/224(1)(b); the insurer may charge interest of no more than 6% per year for days of grace used.", "m": "Life grace = 30 days or one month. (Health uses 7/10/31.)", "c": ["ls_policyclock"]}, {"id": "ls89", "t": "Policy Provisions", "q": "An Illinois life policy must become incontestable, except for nonpayment of premium, after being in force during the insured's lifetime for no more than", "o": ["2 years from its date", "1 year from its date", "3 years from its date", "2 years from delivery"], "e": "5/224(1)(c).", "m": "Incontestable after 2 years. Two years to contest, then it's settled.", "c": ["ls_policyclock"]}, {"id": "ls90", "t": "Policy Provisions", "q": "An Illinois life policy that has lapsed, with nonforfeiture insurance in force and not surrendered, may be reinstated within", "o": ["3 years from default, with proof of insurability and arrears", "5 years from default, with proof of insurability and arrears", "31 days from default, with no proof of insurability", "1 year from default, with arrears but no proof of insurability"], "e": "5/224(1)(i); interest on premiums may not exceed 6% per year.", "m": "Reinstate within 3 years with proof of insurability plus back premiums.", "c": ["ls_policyclock"]}, {"id": "ls91", "t": "Policy Provisions", "q": "An Illinois whole life policy must make policy loans available after it has been in force", "o": ["3 full years", "1 full year", "2 full years", "5 full years"], "e": "5/224(1)(f); this does not apply to term insurance.", "m": "Loans available after 3 full years: \"3 to borrow.\"", "c": ["ls_policyclock"]}, {"id": "ls92", "t": "Policy Provisions", "q": "Illinois requires life insurers to settle death claims upon receipt of due proof of death, and no later than", "o": ["2 months after receipt of proof", "31 days after receipt of proof", "60 days after the date of death", "6 months after receipt of proof"], "e": "5/224(1)(j).", "m": "Death claims paid within 2 months of proof.", "c": ["ls_deathclaim", "ls_claims"]}, {"id": "ls93", "t": "Policy Provisions", "q": "If an Illinois life insurer does not pay death proceeds within 31 days of the latest of proof of death, sufficient information, or resolution of legal impediments, interest accrues from the date of death at", "o": ["10% annually", "6% annually", "The policy loan rate", "1% monthly"], "e": "5/224(1)(l).", "m": "Miss the 31-day payment window and interest runs at 10% a year.", "c": ["ls_deathclaim"]}, {"id": "ls94", "t": "Policy Provisions", "q": "An Illinois participating life policy must begin to participate in surplus no later than the end of the", "o": ["Third policy year", "First policy year", "Fifth policy year", "Tenth policy year"], "e": "5/224(1)(e).", "m": "Participating policies share surplus by the end of year 3.", "c": ["ls_policyclock"]}, {"id": "ls95", "t": "Policy Provisions", "q": "Illinois life policies must include a table showing loan values and nonforfeiture options for at least the first", "o": ["20 policy years", "5 policy years", "10 policy years", "30 policy years"], "e": "5/224(1)(h).", "m": "Values table covers the first 20 policy years."}, {"id": "ls96", "t": "Policy Provisions", "q": "If age is misstated on an Illinois life application, the amount payable is", "o": ["What the premium would have bought at the correct age", "The full face amount, since the policy is incontestable", "The premiums paid, plus interest at 6% per year", "The face amount reduced by the misstated years' premiums"], "e": "5/224(1)(d).", "m": "Lied about age? You get what your premium would have bought at the true age."}, {"id": "ls97", "t": "Illustrations", "q": "Under Illinois Regulation 1406, if an insurer designates a policy form to be marketed without an illustration,", "o": ["No illustration may be used before the first policy anniversary", "An illustration must be given at delivery but not at the time of sale", "Only the producer, not the insurer, may prepare an illustration", "The form may be sold only to applicants who decline an illustration"], "e": "50 Ill. Adm. Code 1406.40(b).", "m": "\"No illustration\" form = none before the first anniversary."}, {"id": "ls98", "t": "Illustrations", "q": "Under Illinois Regulation 1406, if a policy form is marketed with an illustration,", "o": ["A basic illustration prepared under the rule is required", "The illustration may use any interest rate the producer chooses", "An illustration is optional at the producer's discretion", "The illustration may show non-guaranteed values without guaranteed ones"], "e": "1406.40(c); illustrations must show guaranteed and non-guaranteed elements and must not be misleading.", "m": "Using illustrations? Then a proper basic illustration is required."}, {"id": "ls99", "t": "Illustrations", "q": "A life insurance illustration must clearly distinguish between", "o": ["Guaranteed and non-guaranteed elements", "Term and permanent coverage", "Producer and insurer statements", "Individual and group coverage"], "e": "Non-guaranteed elements (such as dividends or current interest) are not guaranteed and must be labeled.", "m": "Illustrations split promises from projections: guaranteed vs non-guaranteed."}, {"id": "ls100", "t": "Accelerated Benefits", "q": "Illinois permits accelerated death benefits that allow", "o": ["Early payment of part of the death benefit for a qualifying illness", "A third-party loan secured by the policy's death benefit", "The insurer paying all premiums after a terminal diagnosis", "Payment of an extra amount equal to the face for accidental death"], "e": "215 ILCS 5/4 and 50 Ill. Adm. Code 1407 govern accelerated benefits; the death benefit is reduced by the amount paid.", "m": "Accelerated benefit = \"living benefit\": part of the death benefit paid early for a qualifying illness."}, {"id": "ls101", "t": "Viatical Settlements", "q": "Illinois regulates the sale of life policies by terminally or chronically ill insureds to third parties under the", "o": ["Viatical Settlements Act of 2009", "Insurance Producer Licensing Act", "Life Insurance Illustrations Act", "Uniform Simultaneous Death Act"], "e": "215 ILCS 159; violating that Act is also a ground for producer discipline under 5/500-70(a)(16).", "m": "Selling your policy because you're ill = viatical settlement, under the 2009 Viatical Settlements Act."}, {"id": "ls102", "t": "Guaranty Association", "q": "The Illinois Life and Health Insurance Guaranty Association protects policyholders when", "o": ["A member insurer becomes impaired or insolvent", "A producer misappropriates premiums collected", "A policyowner is unable to pay premiums", "An insurer wrongfully denies a valid claim"], "e": "215 ILCS 5/531.01-531.19.", "m": "Guaranty Association = safety net when an insurer fails.", "c": ["ls_guaranty"]}, {"id": "ls103", "t": "Guaranty Association", "q": "The Illinois Life and Health Insurance Guaranty Association's maximum liability for life insurance death benefits on any one life is", "o": ["$300,000", "$100,000", "$250,000", "$500,000"], "e": "5/531.03(3)(b)(i)(A).", "m": "Guaranty \"300 death, 100 cash\": $300,000 death benefit, $100,000 cash value.", "c": ["ls_guaranty"]}, {"id": "ls104", "t": "Guaranty Association", "q": "The Illinois Guaranty Association's maximum for net cash surrender and withdrawal values of life insurance is", "o": ["$100,000", "$300,000", "$250,000", "$50,000"], "e": "5/531.03(3)(b)(i)(A).", "m": "Cash value cap is the smaller one: $100,000.", "c": ["ls_guaranty"]}, {"id": "ls105", "t": "Guaranty Association", "q": "The Illinois Guaranty Association's maximum for the present value of annuity benefits, including cash values, is", "o": ["$250,000", "$100,000", "$300,000", "$500,000"], "e": "5/531.03(3)(b)(i)(C).", "m": "Annuities sit in the middle: $250,000.", "c": ["ls_guaranty"]}, {"id": "ls106", "t": "Guaranty Association", "q": "Which portion of a policy is generally NOT covered by the Illinois Life and Health Insurance Guaranty Association?", "o": ["The non-guaranteed part of a variable contract, where the owner bears the risk", "The guaranteed death benefit of a whole life policy, up to the statutory limit", "The present value of fixed annuity benefits, up to the statutory limit", "The guaranteed cash surrender value of a life policy, up to the statutory limit"], "e": "5/531.03(2)(b)(i) and (xv).", "m": "You took the investment risk? The guaranty fund won't cover the non-guaranteed variable part.", "c": ["ls_guaranty"]}, {"id": "ls107", "t": "Guaranty Association", "q": "With respect to one owner of multiple nongroup life policies, the Illinois Guaranty Association will not cover more than", "o": ["$5,000,000 in benefits", "$300,000 in benefits", "$1,000,000 in benefits", "$500,000 in benefits"], "e": "5/531.03(3).", "m": "One owner, many policies: $5 million total cap.", "c": ["ls_guaranty"]}, {"id": "ls108", "t": "Guaranty Association", "q": "The Illinois Guaranty Association limit for health benefit plans on any one individual is", "o": ["$500,000", "$300,000", "$100,000", "$250,000"], "e": "5/531.03(3)(b)(i)(B)(III).", "m": "Health plans get the biggest single cap: $500,000.", "c": ["ls_guaranty"]}, {"id": "ls109", "t": "Guaranty Association", "q": "Excluding health benefit plans, the Illinois Guaranty Association's aggregate limit for all benefits on any one life is", "o": ["$300,000", "$250,000", "$500,000", "$1,000,000"], "e": "5/531.03(3).", "m": "Aggregate per life (non-health) = $300,000, the same number as the death benefit cap.", "c": ["ls_guaranty"]}, {"id": "ls110", "t": "Advertising and Sales", "q": "Illinois advertising rules for life insurance and annuities require that advertisements", "o": ["Be truthful and not misleading in fact or by implication", "Be approved in advance by the Director before they are used", "State that dividends are guaranteed when the policy is participating", "Omit the insurer's name if a producer is the one who placed the ad"], "e": "50 Ill. Adm. Code 909 governs life and annuity advertising; the insurer is responsible for its ads.", "m": "Ads must be truthful, with no misleading implications either."}, {"id": "ls111", "t": "Advertising and Sales", "q": "Under Illinois advertising rules, who is responsible for ensuring an insurer's advertisements comply?", "o": ["The insurer", "The producer who placed it", "The Director of Insurance", "The advertising agency"], "e": "Insurers must maintain a system of control over the content of advertisements, including those prepared by producers.", "m": "Insurer owns its ads, even ones a producer drafted."}], "sheet": [{"id": "ls_lookperiods", "title": "IL life look-back windows: 10 vs 20 days vs 3 working days", "rows": [["Free look on a new individual life policy: 10 days from delivery", "Owner's right to return any new policy for a full refund; starts at delivery (215 ILCS 5/224(1)(n))."], ["Replacement refund right: 20 days from delivery", "Only when the policy REPLACES existing coverage; extra protection against bad replacements (224(2))."], ["Replacing insurer may instead delay issue 20 days after sending a policy summary to the existing insurer", "Alternative to the 20-day refund; gives the old insurer time to conserve the policy (224(2))."], ["Notice of proposed replacement to the existing insurer: 3 working days after receiving the application", "Insurer-to-insurer notice, not a consumer refund window (Reg. 917.70(c))."]], "src": "224; Reg. 917", "rel": ["ls74", "ls76", "ls77", "ls87"]}, {"id": "ls_policyclock", "title": "IL life policy clocks: 30 days, 2 years, 3 years", "rows": [["Grace period: 30 days or one month", "Missed premium AFTER the first; policy stays in force; interest max 6%/yr (224(1)(b))."], ["Incontestable: no later than 2 years from the policy date", "Limits the insurer's right to void for application misstatements (224(1)(c))."], ["Reinstatement: within 3 years of default", "Owner's right to restore a lapsed policy with evidence of insurability and arrears (224(1)(i))."], ["Policy loans: available after 3 full years in force", "Owner's right to borrow cash value; not required for term (224(1)(f))."], ["Dividends: participation must begin by the end of the 3rd policy year", "Participating policies only (224(1)(e))."]], "src": "224", "rel": ["ls88", "ls89", "ls90", "ls91", "ls94"]}, {"id": "ls_deathclaim", "title": "IL death-claim timing: 2 months vs 31 days vs 10%", "rows": [["Settle death claims no later than 2 months after due proof of death", "Outer deadline for settlement (224(1)(j))."], ["Interest at 10% per year from date of death if not paid within 31 days of the latest of proof / sufficient info / legal impediments resolved", "Penalty interest that protects the beneficiary from slow payment (224(1)(l))."]], "src": "224", "rel": ["ls92", "ls93"]}, {"id": "ls_30days", "title": "IL '30-day' rules: different triggers", "rows": [["Change of address: notify the Director within 30 days", "Triggered by moving (500-35(g))."], ["Moving your residence to another state: file change and new-state certification within 30 days", "Resident who leaves Illinois or nonresident who moves (500-40(c))."], ["Felony conviction: report within 30 days after judgment is entered", "Triggered by conviction while licensed (500-95)."], ["Demand a hearing on license denial/suspension/revocation: within 30 days after mailing of the notice", "Licensee's due-process right (500-70(b))."], ["Regulatory examination report: request a hearing within 14 calendar days", "Different trigger: a producer EXAM report, and a shorter window (500-110(e))."], ["Refund prorated fee within 30 days of cancellation proof (policy cancelled within 90 days)", "Consumer protection on separate producer fees (500-80(e)(3))."]], "src": "500-35, 500-40, 500-95, 500-70, 500-110, 500-80", "rel": ["ls2", "ls15", "ls16", "ls26", "ls28", "ls48"]}, {"id": "ls_licensetime", "title": "IL license time limits: 180 days, 12 months, 3 years, 2 years", "rows": [["Temporary license: up to 180 days, renewable once for 180 more", "For a deceased/disabled producer's survivor or business, or a producer entering military service (500-60)."], ["Lapsed license: reissue without exam within 12 months, paying double the unpaid renewal fee", "Producer who failed to renew (500-35(d))."], ["Revoked or denied: ineligible to apply for 3 years", "Disciplinary consequence (500-70(g))."], ["Regular producer license term: 2 years", "Normal renewal cycle (500-35(a))."]], "src": "500-60, 500-35, 500-70", "rel": ["ls8", "ls17", "ls22", "ls23"]}, {"id": "ls_hours", "title": "IL education hours: 20 / 7.5 vs 24 / 3 vs 4", "rows": [["Pre-licensing: 20 hours per line, 7.5 of them classroom or webinar", "BEFORE the exam (500-30(b))."], ["Continuing education: 24 hours per 2-year renewal, 3 of them classroom/webinar ethics", "AFTER licensing, every renewal (500-35(b)(1))."], ["Professional association credit: up to 4 hours per biennial period, never ethics", "Part of CE, not a substitute for ethics (500-35(b)(3))."], ["Combination course counts as classroom only if classroom/webinar hours are at least two-thirds", "Otherwise it is self-study (500-35(b)(1))."]], "src": "500-30, 500-35", "rel": ["ls7", "ls33", "ls34", "ls35", "ls37"]}, {"id": "ls_fees", "title": "IL producer fees", "rows": [["Resident individual license: $215 every 2 years", "500-135(a)(1)"], ["Nonresident individual license: $380 every 2 years", "500-135(a)(1)"], ["Business entity license: $150 every 2 years", "500-135(a)(3)"], ["Temporary license: $50 (paid on issue, not on renewal)", "500-135(a)(2); 500-60(c)"], ["Exam application processing: $50", "500-135(a)(5)"]], "src": "500-135", "rel": ["ls9", "ls10", "ls11", "ls12", "ls19"]}, {"id": "ls_claims", "title": "IL claim-handling deadlines: 15 / 15 / 21 / 30", "rows": [["Acknowledge pertinent claim communications: within 15 working days", "'Reasonable promptness' (Reg. 919.40)."], ["Provide claim forms: within 15 working days of a request", "Improper claims practice if late (215 ILCS 5/154.6(o))."], ["Bona fide effort to contact insureds/claimants: within 21 working days after notification of loss", "'Prompt investigation' (Reg. 919.40)."], ["Offer payment: within 30 days after affirming liability on an undisputed amount", "Payment deadline (Reg. 919.50(a))."], ["Life death claims: settle no later than 2 months after due proof", "Separate life-policy rule (224(1)(j))."]], "src": "154.6; Reg. 919", "rel": ["ls59", "ls60", "ls61", "ls63", "ls92"]}, {"id": "ls_penalties", "title": "IL money thresholds: $150, $10,000/$100,000, $20,000", "rows": [["Misappropriating $150 or less: Class A misdemeanor (first offense), Class 4 felony (later offenses)", "Fiduciary theft, small amount (500-115(d))."], ["Misappropriating more than $150: Class 3 felony", "Fiduciary theft, larger amount (500-115(d))."], ["Civil penalty for license violations: up to $10,000 per cause, $100,000 total", "After hearing under 500-70(d)."], ["Violating a Director's written order after a producer exam: civil penalty up to $20,000", "Different statute and trigger (500-110(g))."]], "src": "500-115, 500-70, 500-110", "rel": ["ls4", "ls27", "ls41", "ls42"]}, {"id": "ls_90days", "title": "IL '90-day' rules", "rows": [["Producer may collect premiums due at issue/delivery and those due within 90 days after", "Insurer's implied authority to the producer (500-115(a))."], ["Separate producer fee: prorated refund if the policy is cancelled within 90 days of inception", "Consumer refund trigger (500-80(e)(3))."], ["Director's written order after an exam report: within 90 days", "Regulator deadline (500-110(e))."]], "src": "500-115, 500-80, 500-110", "rel": ["ls3", "ls44", "ls48"]}, {"id": "ls_guaranty", "title": "IL Life & Health Guaranty Association limits", "rows": [["Life death benefits: $300,000 per life", "531.03(3)(b)(i)(A)"], ["Life cash surrender/withdrawal values: $100,000", "531.03(3)(b)(i)(A)"], ["Annuity present value: $250,000", "531.03(3)(b)(i)(C)"], ["Health benefit plans: $500,000; disability income and LTC: $300,000 each; other health: $100,000", "531.03(3)(b)(i)(B)"], ["Aggregate per life: $300,000 (except health benefit plans: $500,000); one owner of multiple nongroup life policies: $5,000,000", "531.03(3)"]], "src": "531.03", "rel": ["ls102", "ls103", "ls104", "ls105", "ls106", "ls107", "ls108", "ls109"]}, {"id": "ls_replacement", "title": "IL replacement (Reg. 917) numbers", "rows": [["Borrowing counts as replacement const LS='ilprep_v1';
let store=JSON.parse(localStorage.getItem(LS)||'{"missed":{},"history":[]}');
function save(){localStorage.setItem(LS,JSON.stringify(store))}
const $=s=>document.querySelector(s);const app=$('#app');
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function prep(q){const opts=shuffle(q.o.map((t,i)=>({t,c:i===0})));return {...q,opts,ans:opts.findIndex(o=>o.c),pick:null,flag:false}}
let timerId=null;
function home(){clearInterval(timerId);
 let h='<div class="card"><p>Original practice questions built from the Pearson VUE Illinois content outlines (effective 1/1/2026; same blueprint listed for 2027). Passing score on the real exam is 70.</p></div>';
 for(const k in DATA){const s=DATA[k];const m=Object.keys(store.missed[k]||{}).length;
  h+=`<div class="card"><div class="row"><h3 style="margin:0">${s.name}</h3><span class="mut">${s.qs.length} questions</span></div>
  <p class="mut">Real exam: ${s.exam.n} questions (${s.exam.scored} scored + ${s.exam.n-s.exam.scored} pretest), ${s.exam.min} minutes</p>
  <label class="mut">Practice topic: <select id="t_${k}"><option value="">All topics</option>${s.topics.map(t=>`<option>${esc(t.name)}</option>`).join('')}</select></label><br>
  <button onclick="startPractice('${k}')">Practice (instant feedback)</button><button onclick="startExam('${k}')">Timed exam</button><button onclick="topicSetup('${k}')">Topic test</button>
  ${k==='hg'?`<button class="weak" onclick="topicSetup('hg',['Other Insurance Concepts','Social Insurance'])">🎯 Focus on my weak areas</button>`:''}
  <button class="sec" onclick="startMissed('${k}')" ${m?'':'disabled'}>Review missed (${m})</button>
  ${m?`<button class="sec" onclick="clearMissed('${k}')">Clear missed</button>`:''}<button class="sec" onclick="sheet('${k}')">Confusable numbers</button></div>`}
 const hist=store.history.slice(-8).reverse();
 if(hist.length)h+='<div class="card"><h3>Recent results</h3><table>'+hist.map(r=>`<tr><td>${new Date(r.t).toLocaleString()}</td><td>${DATA[r.s].name}</td><td>${r.mode}</td><td>${r.c}/${r.n} (${Math.round(100*r.c/r.n)}%)</td></tr>`).join('')+'</table></div>';
 app.innerHTML=h;window.scrollTo(0,0)}
function clearMissed(k){if(confirm('Clear missed list for this section?')){store.missed[k]={};save();home()}}
let S=null;
function startPractice(k){const t=$('#t_'+k).value;let qs=DATA[k].qs.filter(q=>!t||q.t===t);S={k,mode:'practice',qs:shuffle(qs).map(prep),i:0};renderQ()}
function startMissed(k){const ids=store.missed[k]||{};const qs=DATA[k].qs.filter(q=>ids[q.id]);S={k,mode:'missed review',qs:shuffle(qs).map(prep),i:0};renderQ()}
function startExam(k){const s=DATA[k];const n=s.exam.n;let pick=[];
 const tot=s.topics.reduce((a,t)=>a+t.w,0);let alloc=s.topics.map(t=>({t:t.name,n:Math.floor(n*t.w/tot),r:(n*t.w/tot)%1}));
 let left=n-alloc.reduce((a,x)=>a+x.n,0);alloc.sort((a,b)=>b.r-a.r).forEach(x=>{if(left>0){x.n++;left--}});
 for(const a of alloc)pick=pick.concat(shuffle(s.qs.filter(q=>q.t===a.t)).slice(0,a.n));
 if(pick.length<n)pick=pick.concat(shuffle(s.qs.filter(q=>!pick.includes(q))).slice(0,n-pick.length));
 S={k,mode:'exam',qs:shuffle(pick).map(prep),i:0,end:Date.now()+s.exam.min*60000};
 clearInterval(timerId);timerId=setInterval(tick,1000);renderQ()}
function tick(){const el=$('#timer');const ms=S.end-Date.now();if(S.cfg)S.cfg.left=el?el.textContent:null;if(ms<=0){clearInterval(timerId);alert('Time is up.');finish();return}
 if(el){const m=Math.floor(ms/60000),s=Math.floor(ms/1000)%60;el.textContent=m+':'+String(s).padStart(2,'0')}}
function renderQ(){if(!S.qs.length){app.innerHTML='<div class="card">No questions.</div>';return}
 const q=S.qs[S.i],ex=isTest(),done=!ex&&q.pick!==null;
 let h=`<div class="card"><div class="row"><span class="mut">${DATA[S.k].name} - ${S.mode} - Q ${S.i+1}/${S.qs.length}</span>${S.end?'<span class="timer" id="timer"></span>':''}</div>
 <div class="bar"><i style="width:${100*(S.i+1)/S.qs.length}%"></i></div>
 <p style="margin-top:14px"><span class="tag">${esc(q.t)}</span></p><p><b>${esc(q.q)}</b></p>`;
 q.opts.forEach((o,j)=>{let c='opt';if(done){if(o.c)c+=' ok';else if(j===q.pick)c+=' bad'}else if(j===q.pick)c+=' sel';
  h+=`<button class="${c}" onclick="choose(${j})" ${done?'disabled':''}>${'ABCD'[j]}. ${esc(o.t)}</button>`});
 if(done)h+=`<div class="exp"><b>${q.pick===q.ans?'Correct.':'Incorrect.'}</b> Answer: ${'ABCD'[q.ans]}. ${esc(q.e)}</div>`+(q.pick!==q.ans?mhHTML(q)+cfHTML(S.k,q):(S.mode==='practice'?mhHTML(q,1):''));
 h+='<div class="row" style="margin-top:12px"><div>';
 h+=`<button class="sec" onclick="go(-1)" ${S.i?'':'disabled'}>Back</button>`;
 if(ex)h+=`<button class="sec" onclick="S.qs[S.i].flag=!S.qs[S.i].flag;renderQ()">${q.flag?'Unflag':'Flag'}</button>`;
 h+=`</div><div>${S.i<S.qs.length-1?`<button onclick="go(1)">Next</button>`:''}<button class="sec" onclick="if(${ex}?confirm('Submit exam?'):true)finish()">${ex?'Submit':'Finish'}</button></div></div>`;
 if(ex)h+='<div class="nav">'+S.qs.map((x,j)=>`<span class="${x.pick!==null?'a':''} ${x.flag?'f':''} ${j===S.i?'c':''}" onclick="S.i=${j};renderQ()">${j+1}</span>`).join('')+'</div>';
 app.innerHTML=h+'</div>';if(S.end)tick()}
function isTest(){return S.mode==='exam'||S.mode==='topic test'}
function choose(j){const q=S.qs[S.i];if(!isTest()&&q.pick!==null)return;q.pick=j;
 if(!isTest())record(q);renderQ()}
function record(q){store.missed[S.k]=store.missed[S.k]||{};if(q.pick===q.ans){if(S.mode==='missed review')delete store.missed[S.k][q.id]}else store.missed[S.k][q.id]=1;save()}
function go(d){S.i=Math.max(0,Math.min(S.qs.length-1,S.i+d));renderQ();window.scrollTo(0,0)}
function finish(){clearInterval(timerId);const ex=isTest(),tt=S.mode==='topic test';const qs=ex?S.qs:S.qs.filter(q=>q.pick!==null);
 if(ex)qs.forEach(record);const c=qs.filter(q=>q.pick===q.ans).length,n=qs.length;
 if(n){store.history.push({t:Date.now(),s:S.k,mode:S.mode,c,n});store.history=store.history.slice(-50);save()}
 const by={};if(tt)S.cfg.topics.forEach(t=>by[t]=[0,0]);qs.forEach(q=>{by[q.t]=by[q.t]||[0,0];by[q.t][1]++;if(q.pick===q.ans)by[q.t][0]++});
 const pct=n?Math.round(100*c/n):0;
 let h=`<div class="card"><h2>${pct}% (${c}/${n})</h2>${ex?`<p><b style="color:${pct>=70?'var(--ok)':'var(--bad)'}">${pct>=70?(tt?'AT OR ABOVE 70%':'PASS'):'BELOW PASSING'}</b> <span class="mut">(70% target)${tt?' - topic test: '+n+' questions'+(S.cfg.timed?', timed':'')+(S.cfg.left!=null?', finished with '+S.cfg.left+' left':''):''}</span></p>`:''}
 <h3>Score by topic</h3><table><tr><th>Topic</th><th>Score</th><th></th></tr>`+
 Object.entries(by).map(([t,[a,b]])=>`<tr><td>${esc(t)}</td><td class="${b&&a/b<.7?'low':''}">${a}/${b}${b?' ('+Math.round(100*a/b)+'%)':''}</td><td style="width:35%"><div class="bar"><i style="width:${100*a/b}%"></i></div></td></tr>`).join('')+'</table></div>';
 const wrong=qs.filter(q=>q.pick!==q.ans);
 if(ex&&wrong.length)h+='<div class="card"><h3>Review incorrect / unanswered</h3>'+wrong.map(q=>`<p><span class="tag">${esc(q.t)}</span><b>${esc(q.q)}</b><br>Your answer: ${q.pick===null?'(none)':esc(q.opts[q.pick].t)}<br>Correct: <b>${esc(q.opts[q.ans].t)}</b><br><span class="mut">${esc(q.e)}</span></p>`+mhHTML(q)+cfHTML(S.k,q)).join('')+'</div>';
 if(tt&&!wrong.length&&n)h+='<div class="card"><b>No misses.</b> Try a larger count or turn on the timer.</div>';
 h+='<button onclick="home()">Home</button>'+(tt?`<button class="sec" id="tt_again" onclick="topicSetup('${S.k}',S.cfg.topics,S.cfg.count,S.cfg.timed)">New topic test (same settings)</button>`:'');app.innerHTML=h;window.scrollTo(0,0)}
function grp(k,gid){return DATA[k].sheet.find(g=>g.id===gid)}
function mhHTML(q,small){return q.m?`<div class="mh${small?' sm':''}"><b>💡 Memory hack:</b> ${esc(q.m)}</div>`:''}
function cfHTML(k,q){if(!q.c)return'';return '<div class="cf"><b>⚠️ Don\'t confuse with:</b>'+q.c.map(gid=>{const g=grp(k,gid);
 return `<h4>${esc(g.title)}</h4><table>${g.rows.map(r=>`<tr><td><b>${esc(r[0])}</b></td><td class="mut">${esc(r[1])}</td></tr>`).join('')}</table>
 <div class="mut">Related: ${g.rel.filter(i=>i!==q.id).map(i=>esc(i)).join(', ')||'-'} <button class="sec" onclick="drill('${k}','${gid}')">Drill these ${g.rel.length}</button></div>`}).join('')+'</div>'}
function drill(k,gid){clearInterval(timerId);const g=grp(k,gid);const qs=DATA[k].qs.filter(q=>g.rel.includes(q.id));S={k,mode:'confusables drill',qs:shuffle(qs).map(prep),i:0};renderQ()}
function sheet(k){clearInterval(timerId);const s=DATA[k];let h=`<div class="card"><h2>Confusable numbers - ${s.name}</h2><p class="mut">Look-alike facts side by side, each checked against the source shown.</p></div>`;
 h+=s.sheet.map(g=>`<div class="card cf"><h4>${esc(g.title)}</h4><table>${g.rows.map(r=>`<tr><td><b>${esc(r[0])}</b></td><td class="mut">${esc(r[1])}</td></tr>`).join('')}</table><div class="mut">Source: ${esc(g.src)} - questions: ${g.rel.join(', ')}</div><button onclick="drill('${k}','${g.id}')">Drill these ${g.rel.length}</button></div>`).join('');
 app.innerHTML=h+'<button onclick="home()">Home</button>';window.scrollTo(0,0)}

// ---- Topic test ----
const MPQ=1.36; // minutes per question on the real exam (~75 min / 55 questions)
function topicSetup(k,pre,count,timed){clearInterval(timerId);const s=DATA[k];pre=pre||[];count=count||20;if(timed===undefined)timed=true;
 let h=`<div class="card tt"><h2>Topic test</h2><p class="mut">Pick a section and one or more topics. Answers are revealed at the end, scored by topic, with memory hacks and "Don't confuse with" panels on every miss.</p>
 <label>Section: <select id="tt_sec" onchange="topicSetup(this.value)">${Object.keys(DATA).map(x=>`<option value="${x}" ${x===k?'selected':''}>${esc(DATA[x].name)}</option>`).join('')}</select></label>
 <fieldset><legend>Topics</legend>${s.topics.map(t=>{const c=s.qs.filter(q=>q.t===t.name).length;return `<label><input type="checkbox" name="tt_t" value="${esc(t.name)}" ${pre.includes(t.name)?'checked':''} onchange="ttInfo()"> ${esc(t.name)} <span class="mut">(${c})</span></label>`}).join('')}
 <button class="sec" onclick="document.querySelectorAll('[name=tt_t]').forEach(x=>x.checked=true);ttInfo()">All</button><button class="sec" onclick="document.querySelectorAll('[name=tt_t]').forEach(x=>x.checked=false);ttInfo()">None</button></fieldset>
 <fieldset><legend>Questions</legend>${['10','20','30','all'].map(v=>`<label style="display:inline-block;margin-right:14px"><input type="radio" name="tt_n" value="${v}" ${String(count)===v?'checked':''} onchange="ttInfo()"> ${v==='all'?'All':v}</label>`).join('')}</fieldset>
 <label><input type="checkbox" id="tt_timer" ${timed?'checked':''} onchange="ttInfo()"> Timer at real-exam pace (~${MPQ} min per question)</label>
 <p class="mut" id="tt_info"></p><button id="tt_start" onclick="startTopic('${k}')">Start topic test</button><button class="sec" onclick="home()">Cancel</button></div>`;
 app.innerHTML=h;ttInfo();window.scrollTo(0,0)}
function ttSel(){return [...document.querySelectorAll('[name=tt_t]:checked')].map(x=>x.value)}
function ttN(pool){const v=(document.querySelector('[name=tt_n]:checked')||{}).value||'20';return v==='all'?pool:Math.min(+v,pool)}
function ttInfo(){const k=$('#tt_sec').value,t=ttSel();const pool=DATA[k].qs.filter(q=>t.includes(q.t)).length,n=ttN(pool);
 $('#tt_start').disabled=!n;
 $('#tt_info').textContent=!t.length?'Select at least one topic.':`${n} of ${pool} available questions`+($('#tt_timer').checked?`, ${Math.ceil(n*MPQ)} minutes`:', untimed')+'.'}
function startTopic(k){const topics=ttSel();if(!topics.length)return;const s=DATA[k];
 const lists=topics.map(t=>shuffle(s.qs.filter(q=>q.t===t)));const pool=lists.reduce((a,l)=>a+l.length,0);const n=ttN(pool);
 const pick=[];for(let r=0;pick.length<n;r++)for(const l of lists)if(r<l.length&&pick.length<n)pick.push(l[r]); // round-robin keeps every chosen topic represented
 const timed=$('#tt_timer').checked,cv=(document.querySelector('[name=tt_n]:checked')||{}).value||'20';
 S={k,mode:'topic test',qs:shuffle(pick).map(prep),i:0,cfg:{topics,count:cv,timed,left:null}};
 if(timed)S.end=Date.now()+Math.ceil(n*MPQ)*60000;
 clearInterval(timerId);if(timed)timerId=setInterval(tick,1000);renderQ()}
home();
</script></body></html>
